/* ---- Comentarios: el mismo bloque sirve para el feed y para la escucha ----
   Hilos de un nivel, como Facebook (2026-11-27): una respuesta lleva parent_id = comentario raíz.
   Responder a una respuesta la deja en el mismo hilo con la @mención de su autor.
   Los hilos van plegados ("Ver N respuestas"); se abren al pulsar, al responder o desde un aviso.
   Si el raíz se borra, sus respuestas se quedan bajo "Comentario eliminado". */
const cmOpen = new Set();   // hilos abiertos (id del comentario raíz)
let cmReplyTo = null;       // hilo con la caja de respuesta abierta (id del raíz)
let cmReplyRid = null;      // respuesta concreta a la que se contesta (reply_to): su autor recibe aviso, con @ o sin ella
const cmByDate = (a, b) => String(a.created_at || '').localeCompare(String(b.created_at || ''));
function cmGroups(kind, pid) {
  const c = CM[kind], all = cmList(kind).filter(x => x[c.key] === pid);
  const tops = all.filter(x => !x.parent_id), topIds = new Set(tops.map(x => x.id)), reps = {};
  all.filter(x => x.parent_id).forEach(x => (reps[x.parent_id] = reps[x.parent_id] || []).push(x));
  Object.values(reps).forEach(l => l.sort(cmByDate));
  const groups = tops.map(x => ({ id: x.id, top: x, replies: reps[x.id] || [], created_at: x.created_at }));
  Object.keys(reps).filter(id => !topIds.has(id)).forEach(id => groups.push({ id, top: null, replies: reps[id], created_at: reps[id][0].created_at }));
  return groups.sort(cmByDate);
}
const cmRepliesLabel = n => n === 1 ? '1 respuesta' : `${n} respuestas`;
function commentRow(kind, x, root = null, canReply = true) {
  const c = CM[kind], mine = x.author_id === S.user.id, t = isTeacher(), pid = x[c.key];
  const reported = S.reports.some(r => r.target_type === c.type && r.target_id === x.id && r.reporter_id === S.user.id);
  const rootId = root || x.id, size = root ? 26 : 32;
  return `<div class="cmt${root ? ' reply' : ''}" data-cmt-id="${x.id}">${whoLink(x.author_id, avatarHtml(x.author_id, size))}<div class="cmt-main">
    <div class="cmt-bubble"><div class="cmt-head">${whoLink(x.author_id, `<b>${esc(whoName(x.author_id))}</b>`)}${teacherTag(x.author_id)}<span class="sub">${timeAgo(x.created_at)}</span></div>
    ${x.body ? `<div class="cmt-body">${richText(x.body)}</div>` : ''}</div>${phOf(c.type, x, 'cm')}${mediaLinkCard(x.body)}
    <div class="cmt-foot">${rxBar(c.type, x.id)}
      ${canReply ? `<button class="linkbtn mute" data-action="comment-reply" data-kind="${kind}" data-pid="${pid}" data-root="${rootId}"${root ? ` data-rid="${x.id}"` : ''}${root && !mine ? ` data-to="${x.author_id}"` : ''}>Responder</button>` : ''}
      ${(mine || t) ? `<button class="linkbtn mute" data-action="comment-delete" data-kind="${kind}" data-id="${x.id}">Eliminar</button>` : ''}
      ${(!mine && !t) ? (reported ? '<span class="sub">Denunciado</span>' : `<button class="linkbtn mute" data-action="report" data-type="${c.type}" data-id="${x.id}">Denunciar</button>`) : ''}
    </div></div></div>`;
}
function cmThreadHtml(kind, pid, g) {
  const n = g.replies.length, replying = cmReplyTo === g.id && !!g.top, open = cmOpen.has(g.id) || replying;
  const btn = (act, label) => `<button class="linkbtn cm-tbtn" data-action="${act}" data-kind="${kind}" data-pid="${pid}" data-root="${g.id}">${label}</button>`;
  let h = '';
  // Plegado: la primera respuesta se ve como adelanto y debajo "Ver N respuestas más" (Yuri, 2026-11-27)
  if (n && !open) h += commentRow(kind, g.replies[0], g.id, !!g.top) + (n > 1 ? btn('cm-thread', `${ic('chat')}Ver ${n - 1 === 1 ? '1 respuesta más' : `${n - 1} respuestas más`}`) : '');
  if (open) h += g.replies.map(r => commentRow(kind, r, g.id, !!g.top)).join('') + (n > 1 && !replying ? btn('cm-thread', 'Ocultar respuestas') : '');
  if (replying) {
    const key = `cmr-${kind}-${g.id}`, to = g.top.author_id === S.user.id ? 'tu comentario' : whoName(g.top.author_id);
    h += `${phStrip(key)}<div class="cm-new cm-reply"><textarea id="cmReply-${kind}-${pid}-${g.id}" maxlength="1000" rows="1" placeholder="Responde a ${esc(to)}…"></textarea>
      ${phPicker(key, 1)}<button class="btn sm" data-action="comment-send" data-kind="${kind}" data-pid="${pid}" data-root="${g.id}">Responder</button>
      <button class="linkbtn mute" data-action="cm-reply-cancel" data-kind="${kind}" data-pid="${pid}" data-root="${g.id}">Cancelar</button></div>`;
  }
  return h ? `<div class="cm-thread" data-thread="${g.id}">${h}</div>` : '';
}
function commentsInner(kind, pid) {
  const groups = cmGroups(kind, pid);
  const gone = g => `<div class="cmt gone" data-cmt-id="${g.id}"><span class="av-gone" aria-hidden="true"></span><div class="cmt-main"><div class="cmt-bubble">Comentario eliminado</div></div></div>`;
  return `${groups.length ? groups.map(g => (g.top ? commentRow(kind, g.top) : gone(g)) + cmThreadHtml(kind, pid, g)).join('') : '<div class="sub" style="margin:6px 0 10px">Aún no hay comentarios.</div>'}
    ${phStrip(`cm-${kind}-${pid}`)}
    <div class="cm-new"><textarea id="cmInput-${kind}-${pid}" maxlength="1000" rows="2" placeholder="Escribe un comentario… (@ para mencionar)"></textarea>
    ${phPicker(`cm-${kind}-${pid}`, 1)}<button class="btn sm" data-action="comment-send" data-kind="${kind}" data-pid="${pid}">Comentar</button></div>`;
}
const commentsBlock = (kind, pid) => `<div class="cm" data-cm="${kind}:${pid}">${commentsInner(kind, pid)}</div>`;
function updateComments(kind, pid) {
  $$(`[data-cm="${kind}:${pid}"]`).forEach(n => {
    // conserva lo que estabas escribiendo (comentario nuevo y respuesta) y el cursor
    const keep = [...n.querySelectorAll('textarea')].map(t => ({ id: t.id, v: t.value, mm: t._mentions, f: document.activeElement === t, s: t.selectionStart }));
    n.innerHTML = commentsInner(kind, pid);
    keep.forEach(k => {
      const t = k.id && n.querySelector('#' + CSS.escape(k.id)); if (!t) return;
      if (k.v) { t.value = k.v; t._mentions = k.mm; }
      if (k.f) { t.focus(); try { t.setSelectionRange(k.s, k.s); } catch (_) {} }
    });
  });
  if (kind === 'feed') updateCmPeek(pid);
}
// Desde un aviso de respuesta: abre el hilo de la última respuesta de esa persona a un comentario mío y la resalta
function cmFocusReply(kind, pid, actor) {
  const c = CM[kind], L = cmList(kind).filter(x => x[c.key] === pid);
  const mine = new Set(L.filter(x => x.author_id === S.user.id && !x.parent_id).map(x => x.id));
  const r = L.filter(x => mine.has(x.parent_id) && (!actor || x.author_id === actor)).sort(cmByDate).pop();
  if (!r) return;
  cmOpen.add(r.parent_id); updateComments(kind, pid);
  requestAnimationFrame(() => {
    const el = $(`#modalRoot [data-cmt-id="${r.id}"]`) || $(`[data-cmt-id="${r.id}"]`);
    if (el) { el.scrollIntoView({ block: 'center' }); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1600); }
  });
}
// Vista previa de comentarios en la tarjeta del Inicio: los 2 más relevantes a la vista
// (más reacciones; a igualdad, los del profesor y luego los más nuevos) y una caja de "Escribe un comentario…".
// Todo es pulsable y abre la publicación entera (sin botón de "mostrar comentarios").
const CM_PEEK = 2;
function cmPeekPick(pid) {
  const nrx = id => S.reactions.filter(r => r.target_type === 'feed_comment' && r.target_id === id).length;
  return S.fcomments.filter(c => c.post_id === pid && !c.parent_id) // solo comentarios raíz; sus respuestas se cuentan aparte
    .map(c => ({ c, n: nrx(c.id), t: isTeacherId(c.author_id) ? 1 : 0 }))
    .sort((a, b) => b.n - a.n || b.t - a.t || String(b.c.created_at || '').localeCompare(String(a.c.created_at || '')))
    .slice(0, CM_PEEK);
}
function cmPeekRx(id) {
  const rows = S.reactions.filter(r => r.target_type === 'feed_comment' && r.target_id === id);
  if (!rows.length) return '';
  const top = REACTIONS.map(r => ({ e: r.e, n: rows.filter(x => x.emoji === r.k).length })).filter(r => r.n).sort((a, b) => b.n - a.n).slice(0, 3);
  return `<span class="peek-rx">${top.map(r => r.e).join('')}${rows.length > 1 ? ` <b>${rows.length}</b>` : ''}</span>`;
}
function cmPeekInner(pid) {
  const total = S.fcomments.filter(c => c.post_id === pid).length;
  const pick = cmPeekPick(pid);
  return `${total > pick.length ? `<button class="peek-more linkbtn" data-action="fpost-peek" data-id="${pid}">Ver los ${total} comentarios</button>` : ''}
    ${pick.map(({ c }) => `<div class="peek-cmt" data-action="fpost-peek" data-id="${pid}" data-cmt="${c.id}">
      ${whoLink(c.author_id, avatarHtml(c.author_id, 28))}
      <div class="peek-bubble"><div class="cmt-head">${whoLink(c.author_id, `<b>${esc(whoName(c.author_id))}</b>`)}${teacherTag(c.author_id)}<span class="sub">${timeAgo(c.created_at)}</span></div>
        ${c.body ? `<div class="peek-body">${richText(c.body)}</div>` : ''}${phOf('feed_comment', c, 'peek')}${cmPeekRx(c.id)}</div></div>
      ${(n => n ? `<div class="peek-rep" data-action="fpost-peek" data-id="${pid}" data-cmt="${c.id}" data-thread="1">${ic('chat')}${cmRepliesLabel(n)}</div>` : '')(S.fcomments.filter(x => x.parent_id === c.id).length)}`).join('')}
    <div class="peek-new" data-action="fpost-peek" data-id="${pid}" data-focus="1">${avatarHtml(S.user.id, 28)}
      <span class="peek-input">${total ? 'Escribe un comentario…' : 'Sé el primero en comentar…'}</span></div>`;
}
const updateCmPeek = pid => $$(`[data-cmpeek="${pid}"]`).forEach(n => { n.innerHTML = cmPeekInner(pid); });

/* ---- Enlaces ---- */
// Spotify y YouTube salen como en Escucha analítica: portada, título, tipo y duración.
// La tarjeta se pinta al momento con lo que haya en caché y linkPreviewFill() la completa en segundo plano.
const linkPreviewDone = new Set(), linkPreviewBusy = new Set();
function mediaCard(url, sv) {
  const meta = metaCache[url] || {}, dur = durCache[url] || {};
  const kind = guessKind(url) || 'song';
  const it = { kind, thumb_url: meta.thumb || (ytId(url) ? `https://i.ytimg.com/vi/${ytId(url)}/mqdefault.jpg` : null),
    duration_sec: dur.duration_sec, track_count: dur.track_count, duration_partial: dur.partial };
  const svc = sv === 'sp' ? 'Spotify' : 'YouTube';
  return `<a class="linkcard media ${sv}" href="${esc(safeUrl(url))}" target="_blank" rel="noopener noreferrer"${linkPreviewDone.has(url) ? '' : ` data-lp="${esc(url)}"`}>
    ${coverHtml(it, 64)}
    <span class="lt"><span class="lk">${esc(meta.title || (sv === 'sp' ? 'Escuchar en Spotify' : 'Ver en YouTube'))}</span>
      <span class="tsub">${kindIcon(kind)}${durHtml(it)}<span class="lsvc ${sv}">${svc}</span></span></span>${ic('ext', 'i go')}</a>`;
}
async function linkPreviewFill() {
  for (const el of $$('.linkcard[data-lp]')) {
    const url = el.getAttribute('data-lp');
    if (linkPreviewBusy.has(url) || linkPreviewDone.has(url)) continue;
    linkPreviewBusy.add(url);
    (async () => {
      await Promise.all([fetchMeta(url), fetchDuration(url)]); // las dos se guardan en caché por enlace
      linkPreviewBusy.delete(url); linkPreviewDone.add(url);
      $$('.linkcard[data-lp]').filter(n => n.getAttribute('data-lp') === url).forEach(n => { n.outerHTML = linkCard(url); });
    })();
  }
}
let linkPreviewQueued = false;
new MutationObserver(() => { if (!linkPreviewQueued) { linkPreviewQueued = true; requestAnimationFrame(() => { linkPreviewQueued = false; linkPreviewFill(); }); } })
  .observe(document.body, { childList: true, subtree: true });
// Tarjeta solo para enlaces de Spotify/YouTube (avisos y comentarios: otros enlaces se quedan en el texto)
const mediaLinkCard = text => { const u = firstLink(text); return u && linkService(u) ? linkCard(u) : ''; };
function linkCard(url) {
  let host = url; try { host = new URL(url).hostname.replace(/^www\./, ''); } catch { }
  const sp = /spotify\.com$/.test(host), yt = /(^|\.)youtu(\.be|be\.com)$/.test(host);
  if (sp || yt) return mediaCard(url, sp ? 'sp' : 'yt');
  const label = sp ? 'Escuchar en Spotify' : yt ? 'Ver en YouTube' : host;
  return `<a class="linkcard" href="${esc(safeUrl(url))}" target="_blank" rel="noopener noreferrer">
    <span class="lart ${sp ? 'sp' : yt ? 'yt' : ''}">${ic(sp ? 'note' : yt ? 'play' : 'link')}</span>
    <span class="lt"><span class="lk">${esc(label)}</span><span class="lu">${esc(url)}</span></span>${ic('ext', 'i go')}</a>`;
}

function dropTargetLocal(type, id) { // limpia en memoria lo que la base de datos borra en cascada
  let ids = [id];
  if (type === 'feed_post') { const cs = S.fcomments.filter(c => c.post_id === id).map(c => c.id); S.fcomments = S.fcomments.filter(c => c.post_id !== id); S.fposts = S.fposts.filter(x => x.id !== id); ids = ids.concat(cs); S.reactions = S.reactions.filter(r => !(r.target_type === 'feed_comment' && cs.includes(r.target_id))); S.reports = S.reports.filter(r => !(r.target_type === 'feed_comment' && cs.includes(r.target_id))); }
  if (type === 'feed_comment') S.fcomments = S.fcomments.filter(x => x.id !== id);
  if (type === 'listening_comment') S.lcomments = S.lcomments.filter(x => x.id !== id);
  if (type === 'dm_message') S.dms = S.dms.filter(x => x.id !== id);
  if (type === 'story') { S.stories = S.stories.filter(x => x.id !== id); S.storyViews = S.storyViews.filter(v => v.story_id !== id); S.storyRx = S.storyRx.filter(v => v.story_id !== id); }
  S.reactions = S.reactions.filter(r => !(r.target_type === type && r.target_id === id));
  S.reports = S.reports.filter(r => !(r.target_type === type && r.target_id === id));
}

/* ===================== TIEMPO REAL (Supabase Realtime) =====================
   La base de datos avisa al momento de cada cambio, respetando las mismas reglas RLS:
   nadie recibe en directo lo que no podría ver. Los borrados solo traen la clave. */
const RT_TABLES = ['dm_reactions', 'listening_answer_reactions', 'feed_posts', 'feed_comments', 'listening_comments', 'reactions', 'board_posts', 'board_recipients',
  'board_reads', 'listening_items', 'listening_assignments', 'profiles', 'moderation_reports', 'dm_messages', 'notifications', 'homework_tasks', 'classmates', 'goals_items', 'goals_done',
  'listening_folders', 'listening_genres', 'listening_item_genres', 'stories', 'story_views', 'story_reactions'];
const RT_LIST = { listening_folders: 'folders', listening_genres: 'genres', listening_item_genres: 'itemGenres', board_posts: 'posts', board_recipients: 'recipients', board_reads: 'reads', listening_items: 'items', listening_assignments: 'assigns', moderation_reports: 'reports', homework_tasks: 'homework', goals_items: 'goalItems', goals_done: 'goalDone' };
const rowKey = (table, r) => table === 'reactions' ? [r.target_type, r.target_id, r.user_id, r.emoji].join('|')
  : (table === 'board_reads' || table === 'board_recipients') ? r.post_id + '|' + r.student_id
  : table === 'listening_item_genres' ? r.item_id + '|' + r.genre_id
  : (table === 'story_views' || table === 'story_reactions') ? r.story_id + '|' + r.user_id : r.id;
function addUnique(list, row, table) { // añade sin duplicar (lo local y lo que llega en directo pueden cruzarse)
  const k = rowKey(table, row);
  if (list.some(x => rowKey(table, x) === k)) return false;
  list.push(row); return true;
}
function rtApply(list, table, ev, row, old) { // inserta/actualiza/borra en una lista y la devuelve
  if (ev === 'DELETE') { const k = rowKey(table, old); return list.filter(x => rowKey(table, x) !== k); }
  const k = rowKey(table, row), i = list.findIndex(x => rowKey(table, x) === k);
  if (i >= 0) list[i] = { ...list[i], ...row }; else list.push(row);
  return list;
}
let rtChannel = null, rtWasLive = false, hiddenAt = 0;
function rtStart() {
  rtStop();
  rtChannel = sb.channel('app-changes');
  RT_TABLES.forEach(t => rtChannel.on('postgres_changes', { event: '*', schema: 'public', table: t },
    p => rtHandle(t, p).catch(e => console.warn('Tiempo real:', e))));
  rtChannel.subscribe(status => {
    // Si se corta (móvil en reposo, wifi…) y vuelve, recargamos por si nos perdimos algo
    if (status === 'SUBSCRIBED') { if (rtWasLive) rtResync(); rtWasLive = true; }
  });
}
function rtStop() { if (rtChannel) { sb.removeChannel(rtChannel); rtChannel = null; } rtWasLive = false; }
async function rtResync() { if (S.preview) return; if (S.profile && S.profile.approved && await loadData(true)) softRender(); }
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  if (hiddenAt && Date.now() - hiddenAt > 60000) rtResync(); // vuelves a la pestaña tras más de 1 minuto
  hiddenAt = 0;
});

/* Repintar sin molestar: si estás escribiendo o tienes una ventana abierta, solo se actualizan
   los contadores del menú; el resto se repinta al cerrar la ventana. */
let uiStale = false;
function uiBusy() {
  if ($('#modalRoot').firstChild) return true;
  const a = document.activeElement;
  if (a && /^(TEXTAREA|INPUT|SELECT)$/.test(a.tagName) && a.closest('#app')) return true;
  return $$('#app textarea').some(x => x.value.trim()) || $$('#feedForm input[type=text]').some(x => x.value.trim()) || phPending() || vdPending();
}
function refreshChrome() {
  const secs = sections();
  const tr = $('.top-r'); if (tr) tr.outerHTML = topRight(secs); // campanita, Mensajes, menú de la cuenta (con sus contadores)
  const nav = $('.sidebar .nav'); if (nav) nav.outerHTML = navHtml(secs);
  const tb = $('.tabbar'); if (tb) tb.outerHTML = tabbar(secs);
  notifsRefresh(); // el desplegable de la campanita, si está abierto
}
function softRender() {
  if (!S.profile || !$('.shell')) return;
  if (uiBusy()) { uiStale = true; refreshChrome(); return; }
  uiStale = false;
  const y = window.scrollY; render(); window.scrollTo(0, y);
}

async function rtHandle(t, p) {
  if (!S.profile || !S.user || S.preview) return; // en la vista de alumno no se toca nada; al salir se recarga todo
  const ev = p.eventType, row = p.new || {}, old = p.old || {}, me = S.user.id, teacher = isTeacher();
  // Alguien que aún no está en el directorio (alumno recién aprobado…): lo recargamos para su nombre y foto
  if (ev !== 'DELETE' && row.author_id && !S.dir[row.author_id]) await loadDirectory();
  // Lo mismo con quien reacciona (su primera reacción le hace visible)
  if (ev !== 'DELETE' && t === 'reactions' && row.user_id && !S.dir[row.user_id]) await loadDirectory();

  if (t === 'classmates') { // solicitudes y compañeros: cambian también a quién puedo ver
    const had = S.mates.some(m => m.id === (row.id || old.id));
    if (ev === 'DELETE' && !had) return;
    S.mates = rtApply(S.mates, t, ev, row, old);
    await loadDirectory();
    return softRender();
  }

  if (t === 'feed_posts') {
    if (ev === 'INSERT') {
      if (S.fposts.some(x => x.id === row.id) || S.feedQueue.some(x => x.id === row.id)) return;
      if (row.author_id !== me && S.section === 'feed') { S.feedQueue.push(row); return updateNewPill(); }
      S.fposts.unshift(row); return softRender();
    }
    if (ev === 'DELETE') {
      S.feedQueue = S.feedQueue.filter(x => x.id !== old.id); updateNewPill();
      if (!S.fposts.some(x => x.id === old.id)) return;
      dropTargetLocal('feed_post', old.id);
      const el = $(`[data-fpost="${old.id}"]`); if (el) el.remove();
      if (S.section !== 'feed') softRender();
      return;
    }
    if (ev === 'UPDATE') { // alguien ha editado su publicación: se cambia en su sitio
      const q = S.feedQueue.find(x => x.id === row.id); if (q) Object.assign(q, row);
      const p = S.fposts.find(x => x.id === row.id); if (!p) return;
      Object.assign(p, row);
      const el = $(`[data-fpost="${row.id}"]`); if (el) el.outerHTML = feedCard(p);
      return;
    }
    return;
  }
  if (t === 'stories') {
    S.stories = rtApply(S.stories, t, ev, row, old);
    if (ev === 'DELETE') { S.storyViews = S.storyViews.filter(v => v.story_id !== old.id); S.storyRx = S.storyRx.filter(r => r.story_id !== old.id); if (SV && SV.cur && SV.cur.id === old.id) svShow(); }
    if (!SV) updateStoriesBar();
    if (S.section === 'mod' && ev === 'DELETE') softRender();
    return;
  }
  if (t === 'story_views' || t === 'story_reactions') { // solo llegan las mías y las de mis stories
    if (ev !== 'DELETE' && row.user_id && !S.dir[row.user_id]) await loadDirectory();
    const L = t === 'story_views' ? 'storyViews' : 'storyRx';
    S[L] = rtApply(S[L], t, ev, row, old);
    if (SV && SV.cur && SV.cur.author_id === me) { const open = SV.lb.querySelector('.sv-viewers:not([hidden])'); svFoot(); if (open) svViewers(); }
    return;
  }
  if (t === 'feed_comments' || t === 'listening_comments') {
    const kind = t === 'feed_comments' ? 'feed' : 'listening', c = CM[kind];
    if (ev === 'INSERT') { if (addUnique(cmList(kind), row, t)) updateComments(kind, row[c.key]); return; }
    if (ev === 'DELETE') {
      const x = cmList(kind).find(y => y.id === old.id); if (!x) return;
      dropTargetLocal(c.type, old.id); updateComments(kind, x[c.key]); return;
    }
    if (ev === 'UPDATE') { // p. ej. un comentario que se pasa a un hilo desde la base de datos
      const x = cmList(kind).find(y => y.id === row.id); if (!x) return;
      Object.assign(x, row); updateComments(kind, x[c.key]); return;
    }
    return;
  }
  if (t === 'reactions') {
    if (ev === 'INSERT') { if (addUnique(S.reactions, row, t)) updateRx(row.target_type, row.target_id); return; }
    if (ev === 'DELETE') {
      const k = rowKey(t, old), x = S.reactions.find(r => rowKey(t, r) === k); if (!x) return;
      S.reactions = S.reactions.filter(r => r !== x); updateRx(x.target_type, x.target_id); return;
    }
    return;
  }
  if (t === 'listening_answer_reactions') { // reacciones del profe a las respuestas: una por respuesta
    const k = r => r.assignment_id + '|' + r.question + '|' + r.user_id, src = ev === 'DELETE' ? old : row, key = k(src);
    S.ansRx = S.ansRx.filter(r => k(r) !== key);
    if (ev !== 'DELETE') S.ansRx.push(row);
    return updateAnsRx(src.assignment_id, src.question);
  }
  if (t === 'dm_reactions') { // una por persona y mensaje
    const k = r => r.message_id + ':' + r.user_id, key = k(ev === 'DELETE' ? old : row);
    S.dmRx = S.dmRx.filter(r => k(r) !== key);
    if (ev !== 'DELETE') S.dmRx.push(row);
    return updateThread();
  }
  if (t === 'dm_messages') {
    if (ev === 'DELETE') {
      if (!S.dms.some(m => m.id === old.id)) return;
      S.dms = S.dms.filter(m => m.id !== old.id); updateThread(); updateDmList(); refreshChrome(); return;
    }
    if (ev === 'UPDATE') { // "visto"
      const m = S.dms.find(x => x.id === row.id); if (!m) return;
      Object.assign(m, row); updateThread(); updateDmList(); refreshChrome(); return;
    }
    if (!addUnique(S.dms, row, t)) return;
    const from = dmPartner(row);
    if (!S.dir[from]) await loadDirectory();
    const viewing = S.section === 'messages' && S.dmWith === from && !document.hidden;
    if (viewing) { updateThread(); if (row.recipient_id === me) await markDmRead(from); }
    if (S.section === 'messages' && !uiBusy()) { softRender(); scrollThread(); } else { refreshChrome(); updateDmList(); }
    return;
  }
  if (t === 'notifications') {
    if (ev === 'DELETE') S.notifs = S.notifs.filter(n => n.id !== old.id);
    else {
      const isNew = !S.notifs.some(n => n.id === row.id);
      S.notifs = rtApply(S.notifs, t, ev, row, old);
      const inOpenChat = row.kind === 'dm' && S.section === 'messages' && S.dmWith === row.actor_id && !document.hidden;
      if (ev === 'INSERT' && isNew && inOpenChat) await markNotifsRead([row.id]); // ya lo estás leyendo
      // Aviso discreto de lo nuevo (salvo un mensaje de la conversación que ya tienes abierta)
      if (ev === 'INSERT' && isNew && !inOpenChat) {
        if (row.actor_id && !S.dir[row.actor_id]) await loadDirectory();
        toast(notifText(row).replace(/<[^>]+>/g, ''));
      }
    }
    return refreshChrome();
  }
  if (t === 'profiles') {
    if (row.id === me || old.id === me) {
      if (ev === 'DELETE') return;
      const permsChanged = row.family_dm_ok !== undefined && row.family_dm_ok !== S.profile.family_dm_ok;
      S.profile = { ...S.profile, ...row };
      if (!S.profile.approved) { rtStop(); return route(); } // le han retirado el acceso
      if (permsChanged) await refreshDmContacts(); // el profe ha cambiado su permiso de mensajes
    }
    if (teacher) {
      const { avatar_src, avatar_crop, avatar_lg, ...lite } = row; // las copias grandes de la foto no hacen falta en la lista
      if (ev === 'DELETE') S.students = S.students.filter(s => s.id !== old.id);
      else if (row.role === 'student') S.students = rtApply(S.students, t, ev, lite, old);
    }
    await loadDirectory(); // nombres, apodos y fotos
    return softRender();
  }
  if (!teacher) { // casos del alumno en los que el aviso en directo no trae todo lo necesario
    if (t === 'board_recipients') { // te han incluido en (o quitado de) un aviso dirigido
      if (ev === 'INSERT' && row.student_id === me) {
        const { data } = await sb.from('board_posts').select('*').eq('id', row.post_id).maybeSingle();
        if (data) S.posts = rtApply(S.posts, 'board_posts', 'INSERT', data);
      } else if (ev === 'DELETE' && old.student_id === me) {
        const { data } = await sb.from('board_posts').select('id').eq('id', old.post_id).maybeSingle();
        if (!data) S.posts = S.posts.filter(x => x.id !== old.post_id);
      } else return;
      return softRender();
    }
    if (t === 'listening_assignments') { // la escucha llega sin su elemento: lo pedimos
      if (ev === 'DELETE') { S.assigns = S.assigns.filter(a => a.id !== old.id); return softRender(); }
      if (row.student_id !== me) return;
      const ex = S.assigns.find(a => a.id === row.id);
      if (ex) { Object.assign(ex, row); updateAnsRead(row.id); }
      else {
        const { data } = await sb.from('listening_assignments').select('*, item:listening_items(*)').eq('id', row.id).maybeSingle();
        if (data && data.item) { S.assigns.push(data); try { await loadLibrary(); } catch { } } // su carpeta y sus géneros
      }
      return softRender();
    }
    if (t === 'listening_items') {
      if (ev === 'UPDATE') S.assigns.forEach(a => { if (a.item_id === row.id) a.item = { ...a.item, ...row }; });
      if (ev === 'DELETE') S.assigns = S.assigns.filter(a => a.item_id !== old.id);
      return softRender();
    }
    if (t === 'board_posts' && ev === 'DELETE') { S.posts = S.posts.filter(x => x.id !== old.id); return softRender(); }
  }
  if (t === 'moderation_reports' && teacher && ev === 'INSERT' && row.target_type === 'dm_message' && !S.dms.some(m => m.id === row.target_id)) {
    // denuncia de un mensaje privado: ahora el profesor puede leer ESE mensaje (y solo ese)
    const { data } = await sb.from('dm_messages').select('*').eq('id', row.target_id).maybeSingle();
    if (data) addUnique(S.dms, data, 'dm_messages');
  }
  const key = RT_LIST[t]; if (!key) return;
  S[key] = rtApply(S[key], t, ev, row, old);
  if (t === 'listening_assignments' && ev === 'UPDATE') updateAnsRead(row.id);
  softRender();
  if (t === 'goals_done' && ev === 'INSERT' && !teacher) goalsCelebrate(); // ¡logro nuevo!
}

function toast(msg, type = '') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  $('#toast').appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

/* ---- Botón "Atrás" (lateral del ratón, móvil o navegador) ----
   Cada sección y cada ventana abierta es una entrada del historial: "Atrás" cierra la ventana
   o vuelve a la sección anterior, sin salir de la app. */
// histSkip: "atrás" internos pendientes (al cerrar una ventana). Mientras haya alguno, lo nuevo espera.
let histSkip = 0, histModalPending = false, histRestoring = false;
const histState = () => ({ app: 1, s: S.section, dm: S.section === 'messages' ? (S.dmWith || null) : null,
  hw: S.section === 'homework' && S.hwOpen ? S.hwSel : null, // hw: alumno abierto en Deberes (móvil)
  stu: S.section === 'students' && S.stuPage ? S.stuPage : null }); // stu: ficha completa de un alumno abierta en Alumnos
function histSync() { // la llama render(): si cambió la sección, añade una entrada
  if (histRestoring || !S.profile || histSkip) return; // con un "atrás" pendiente, se sincroniza al terminar
  const st = history.state || {}, want = histState();
  if (st.modal) return;
  if (!st.app) { history.replaceState(want, ''); return; }
  if (st.s === want.s && (st.dm || null) === want.dm && (st.hw || null) === want.hw && (st.stu || null) === want.stu) return;
  history.pushState(want, '');
}
// Al recargar (F5) el navegador conserva history.state: se vuelve a la sección (y al chat) donde estaba.
// Solo la primera vez: si luego se cierra sesión y entra otra persona, empieza en el Inicio.
// Las ventanas abiertas no se recuperan, así que se limpia su marca (si no, histSync no apuntaría nada).
let histBooted = false;
function histRestoreOnLoad() {
  if (histBooted) return;
  histBooted = true;
  const st = history.state || {};
  if (!st.app) return;
  if (st.s) { S.section = st.s; S.dmWith = st.s === 'messages' ? (st.dm || null) : null; S.hwOpen = !!st.hw; if (st.hw) S.hwSel = st.hw; S.stuPage = st.stu || null; }
  if (st.modal || st.lb || st.pop) history.replaceState({ app: 1, s: st.s, dm: st.dm || null, hw: st.hw || null, stu: st.stu || null }, '');
}
window.addEventListener('popstate', async e => {
  if (histSkip) { // es el "atrás" que hicimos nosotros al cerrar una ventana
    if (--histSkip === 0) {
      histSync(); // la sección a la que se fue mientras tanto
      if (histModalPending && $('#modalRoot').firstChild) history.pushState({ ...histState(), modal: 1 }, '');
      histModalPending = false;
    }
    return;
  }
  if (popHist) { dmRxClose(false, true); emojiClose(false, true); rxWhoClose(true); watchClose(true); notifsClose(true); popHist = false; return; } // burbuja de reacciones, menú o selector
  if (lbClose(true)) return; // primero se cierra la foto ampliada
  if ($('#modalRoot').firstChild) { await closeModal(true); return; }
  const st = e.state || {};
  if (!S.profile || !st.app) return;
  histRestoring = true;
  S.section = st.s || 'feed'; S.dmWith = st.dm || null;
  S.hwOpen = !!st.hw; if (st.hw) S.hwSel = st.hw;
  S.stuPage = st.stu || null; if (st.stu) S.stuSel = st.stu;
  render(); window.scrollTo(0, 0);
  histRestoring = false;
});

/* ---------------- Visor de la foto de perfil (pantalla completa) ----------------
   Se abre al pulsar la foto en un perfil. Enseña al momento la foto normal y la cambia
   por la grande (get_avatar_large) en cuanto llega. Va por encima de la ventana abierta:
   "Atrás", Esc, la X o un toque en cualquier sitio lo cierran sin cerrar la ventana. */
const lgCache = {}; // id -> { small, lg }: si cambia la foto normal, se vuelve a pedir
function zoomableAvatar(id, size) {
  return safeAvatar((S.dir[id] || {}).avatar)
    ? `<button type="button" class="av-zoom" data-action="avatar-zoom" data-id="${id}" title="Ver foto" aria-label="Ver la foto en grande">${avatarHtml(id, size)}</button>`
    : avatarHtml(id, size);
}
async function avatarZoom(id) {
  const small = (S.dir[id] || {}).avatar;
  if (!safeAvatar(small) || $('#lightbox')) return;
  const el = document.createElement('div');
  el.id = 'lightbox'; el.className = 'lightbox'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true');
  el.innerHTML = `<button class="x" aria-label="Cerrar">×</button><img src="${esc(small)}" alt="Foto de ${esc(whoName(id))}"><div class="lb-name">${esc(whoName(id))}</div>`;
  el.addEventListener('click', e => { e.stopPropagation(); lbClose(); });
  document.body.appendChild(el);
  history.pushState({ ...(history.state || {}), modal: 1, lb: 1 }, '');
  const c = lgCache[id];
  let lg = c && c.small === small ? c.lg : null;
  if (!lg) {
    const { data } = await sb.rpc('get_avatar_large', { p_id: id });
    lg = typeof data === 'string' && (safeAvatarLg(data) || safeAvatar(data)) ? data : small;
    lgCache[id] = { small, lg };
  }
  const img = el.querySelector('img'); if (img && el.isConnected && lg !== small) img.src = lg;
}
function lbClose(fromHistory = false) {
  const el = $('#lightbox'); if (!el) return false;
  el.remove(); if (el._onClose) el._onClose(); // el visor de stories para el vídeo
  if (!fromHistory && history.state && history.state.lb) { histSkip++; history.back(); }
  return true;
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#lightbox')) { e.stopImmediatePropagation(); lbClose(); } }, true);

/* ================================ FOTOS ================================
   Posts del Inicio, avisos y mensajes privados: hasta 10 fotos; comentarios: 1 (Yuri, 2026-11-24).
   · Se reducen aquí antes de subirlas: 1600 px por el lado largo (~250 KB) y una miniatura de 800 px
     para la rejilla. Al redibujarlas en un canvas pierden los datos ocultos de la cámara (GPS incluido).
   · Van al almacén PRIVADO "media" de Supabase: <tipo>/<autor>/<id de la fila>/<clave>.jpg (+ _t.jpg).
     La base de datos solo deja verlas a quien puede ver la fila (media_visible, en schema.sql).
   · La fila guarda photos = [{k, w, h}]. Su id se crea aquí (phUuid) para subir las fotos ANTES de
     insertarla: nadie ve nunca una publicación a medias.
   · Se descargan con la sesión (sin enlaces públicos que se puedan reenviar) y solo cuando están
     cerca de la pantalla. Se guardan en memoria mientras la app esté abierta, nunca en el navegador.
   · Borrar lo tuyo borra sus archivos; lo demás lo limpia cada noche la Edge Function media-cleanup. */
const PH_BUCKET = 'media';
const PH_MAX = { feed: 10, board: 10, dm: 10, fcomment: 1, lcomment: 1 };
const PH_BIG = 1600, PH_THUMB = 800;
const PH_KIND_OF = { feed_post: 'feed', board_post: 'board', feed_comment: 'fcomment', listening_comment: 'lcomment', dm_message: 'dm' };
const PH_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/></svg>';
function phUuid() {
  if (crypto.randomUUID) return crypto.randomUUID();
  const b = crypto.getRandomValues(new Uint8Array(16)); b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
  const h = [...b].map(x => x.toString(16).padStart(2, '0')).join('');
  return `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}`;
}
const phList = r => Array.isArray(r && r.photos) ? r.photos : [];
const phBase = (kind, owner, rowId) => `${kind}/${owner}/${rowId}/`;
const phPaths = (kind, owner, rowId, photos) => photos.flatMap(p => [phBase(kind, owner, rowId) + p.k + '.jpg', phBase(kind, owner, rowId) + p.k + '_t.jpg']);
const phSame = (a, b) => a.length === b.length && a.every((x, i) => x.k === b[i].k);

// ---- Reducir antes de subir ----
const phBlob = (c, q) => new Promise(res => c.toBlob(b => res(b), 'image/jpeg', q));
async function phEncode(img, max, qs, limit) {
  const w0 = img.naturalWidth, h0 = img.naturalHeight, k = Math.min(1, max / Math.max(w0, h0));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w0 * k)); c.height = Math.max(1, Math.round(h0 * k));
  const cx = c.getContext('2d'); cx.fillStyle = '#ffffff'; cx.fillRect(0, 0, c.width, c.height); // PNG con transparencia: fondo blanco
  cx.imageSmoothingQuality = 'high'; cx.drawImage(img, 0, 0, c.width, c.height);
  let b = null;
  for (const q of qs) { b = await phBlob(c, q); if (b && b.size <= limit) break; }
  return { blob: b, w: c.width, h: c.height };
}
async function phPrepare(file) {
  if (!file || (file.type && !/^image\//.test(file.type))) return null;
  const url = URL.createObjectURL(file);
  const img = await loadImg(url); // el navegador ya la gira según la cámara (EXIF)
  URL.revokeObjectURL(url);
  if (!img || !img.naturalWidth) return null;
  const big = await phEncode(img, PH_BIG, [0.82, 0.72, 0.6], 700000);
  const th = await phEncode(img, PH_THUMB, [0.75, 0.6], 200000);
  if (!big.blob || !th.blob) return null;
  return { k: phUuid(), w: big.w, h: big.h, big: big.blob, thumb: th.blob, url: URL.createObjectURL(th.blob) };
}

// ---- Borradores: las fotos elegidas en cada formulario, antes de publicar ----
// Claves: feed-new, feed-edit, board, cm-<feed|listening>-<id>, dm-<persona>
const PH_DRAFT = {}, PH_BUSY = {}; // PH_BUSY: cuántas se están preparando todavía
const phDraft = key => PH_DRAFT[key] || (PH_DRAFT[key] = []);
const phBusy = key => PH_BUSY[key] || 0;
const phPending = () => Object.keys(PH_DRAFT).some(k => k !== 'feed-edit' && k !== 'board' && PH_DRAFT[k].length) || Object.values(PH_BUSY).some(n => n > 0);
function phDraftSet(key, photos, kind, owner, rowId) { // editar: empieza con las que ya tiene
  phClear(key);
  PH_DRAFT[key] = photos.map(p => ({ k: p.k, w: p.w, h: p.h, existing: true, path: phBase(kind, owner, rowId) + p.k + '_t.jpg' }));
}
function phClear(key) {
  (PH_DRAFT[key] || []).forEach(x => { if (!x.existing && x.url) URL.revokeObjectURL(x.url); });
  delete PH_DRAFT[key]; delete PH_BUSY[key];
  phStripRefresh(key);
}
function phPicker(key, max, label = '') {
  const what = max > 1 ? 'Añadir fotos' : 'Añadir una foto';
  return `<button type="button" class="btn ph-add${label ? '' : ' icon'}" data-action="ph-add" data-ph="${esc(key)}" data-max="${max}" title="${what}" aria-label="${what}">${PH_ICON}${label ? `<span>${esc(label)}</span>` : ''}</button>`;
}
function phStripInner(key) {
  return (PH_DRAFT[key] || []).map(x => `<div class="ph-chip"><img ${x.url ? `src="${esc(x.url)}"` : `data-ph-src="${esc(x.path)}"`} alt="">
      <button type="button" class="ph-x" data-action="ph-del" data-ph="${esc(key)}" data-k="${esc(x.k)}" aria-label="Quitar esta foto" title="Quitar">×</button></div>`).join('')
    + Array.from({ length: phBusy(key) }, () => '<div class="ph-chip busy" role="status" aria-label="Preparando la foto…"></div>').join('');
}
const phStrip = key => `<div class="ph-strip" data-ph-strip="${esc(key)}">${phStripInner(key)}</div>`;
const phStripRefresh = key => $$('[data-ph-strip]').filter(n => n.dataset.phStrip === key).forEach(n => { n.innerHTML = phStripInner(key); });

let phInput = null;
function phChoose(key, max) {
  if (!phInput) { // un solo selector de archivos para toda la app
    phInput = document.createElement('input');
    phInput.type = 'file'; phInput.accept = 'image/*'; phInput.hidden = true; phInput.id = 'phFile';
    phInput.addEventListener('change', () => { const fs = [...phInput.files]; phInput.value = ''; if (fs.length) phAddFiles(phInput.dataset.key, +phInput.dataset.max || 1, fs); });
    document.body.appendChild(phInput);
  }
  phInput.dataset.key = key; phInput.dataset.max = max; phInput.multiple = max > 1;
  phInput.click();
}
async function phAddFiles(key, max, files) {
  if (max === 1 && phDraft(key).length) phClear(key); // en los comentarios, elegir otra cambia la que había
  const d = phDraft(key);
  const room = max - d.length - phBusy(key);
  if (room <= 0) return toast(`Como mucho ${max} fotos`, 'bad');
  if (files.length > room) toast(`Solo caben ${room} foto${room === 1 ? '' : 's'} más: se añaden las primeras`, 'bad');
  const take = files.slice(0, room);
  PH_BUSY[key] = phBusy(key) + take.length; phStripRefresh(key);
  let bad = 0;
  for (const f of take) { // de una en una: las fotos del móvil son grandes
    const x = await phPrepare(f).catch(() => null);
    PH_BUSY[key] = Math.max(0, phBusy(key) - 1);
    if (!x) bad++;
    else if (PH_DRAFT[key] === d) d.push(x); // si mientras tanto se publicó o se cerró, no se añade
    else URL.revokeObjectURL(x.url);
    phStripRefresh(key);
  }
  if (bad) toast(bad === 1 ? 'No se pudo leer una de las fotos. Prueba con JPG o PNG' : `No se pudieron leer ${bad} fotos. Prueba con JPG o PNG`, 'bad');

// ---- Subir y borrar ----
// Sube las fotos nuevas del borrador. Devuelve { photos (todas, en orden), paths (las subidas) } o null si falla.
async function phUpload(key, kind, rowId, btn) {

        sb.storage.from(PH_BUCKET).upload(base + n, blob, { contentType: 'image/jpeg', cacheControl: '31536000', upsert: false })

// ---- Mostrar ----

// Visor a pantalla completa: flechas, deslizar el dedo, teclado; Atrás/Esc/× lo cierran
function phOpen(el) {
  const g = el.closest('[data-ph-base]'); if (!g || $('#lightbox')) return;
  const base = g.dataset.phBase, keys = g.dataset.phKeys.split(',').filter(Boolean), many = keys.length > 1;
  let i = Math.max(0, Math.min(keys.length - 1, +el.dataset.i || 0));

  lb.innerHTML = `<button class="x" data-lb="close" aria-label="Cerrar">×</button>${many ? `<div class="lb-count" aria-live="polite"></div>

/* ========================= VÍDEOS: STORIES Y POSTS =========================
   Stories (arriba del Inicio, caducan SIEMPRE a las 24 h) y posts del Inicio con un vídeo
   que caduca a 1, 3 o 7 días (lo elige quien publica; al caducar queda el texto). Yuri, 2026-11-25.
   · Antes de subirlo se pasa aquí a MP4 de 720p (~20 MB por minuto, audio AAC 128 kbps) con
     Mediabunny (WebCodecs, de jsDelivr, solo se carga al elegir un vídeo). Lo de más de 60 s se recorta.
     Sin WebCodecs, un MP4 que ya sea pequeño se sube tal cual.
   · Archivos: el vídeo en el almacén PRIVADO "video" (<tipo>/<autor>/<id>/<clave>.mp4) y su portada en
     el de fotos, "media" (<clave>_t.jpg). tipo: story | fvideo. La fila guarda video = {k, w, h, d}.
   · Se ven con un enlace firmado que caduca en 1 hora (permite empezar a verlo sin descargarlo entero).
     Al empezar, video_play apunta lo que pesa para el fusible del mes (video_quota, en schema.sql).
   · Lo caducado lo borra la base de datos cada hora (media_expire) y sus archivos media-cleanup.
   · Pruebas: window.__VID_STUB sustituye a la compresión (tests/test-videos.js). */
const VD_BUCKET = 'video', VD_MAX_SEC = 60, VD_SHORT = 720, VD_VBR = 2200000, VD_ABR = 128000, VD_LIMIT = 36700160;
const VD_DAYS = [1, 3, 7];
const VD_LIB = 'https://cdn.jsdelivr.net/npm/mediabunny@1.66.4/dist/bundles/mediabunny.min.mjs';
const VD_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="6" width="13" height="12" rx="2"/><path d="M15.5 10.5l6-3.5v10l-6-3.5z"/></svg>';
const vdBase = (kind, owner, rowId, v) => `${kind}/${owner}/${rowId}/${v.k}`;
const vdErr = m => Object.assign(new Error(m), { vd: true });
const durShort = s => { s = Math.max(0, Math.round(+s || 0)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
function vdLeft(iso) { // "5 h", "3 días"…
  const ms = new Date(iso) - Date.now(), h = ms / 3600000;
  if (h < 1) return `${Math.max(1, Math.round(ms / 60000))} min`;
  if (h < 36) return `${Math.round(h)} h`;
  const d = Math.round(h / 24); return `${d} día${d === 1 ? '' : 's'}`;
}

// ---- Preparar (comprimir) ----
let vdLib = null;
const vdLoadLib = () => vdLib || (vdLib = import(VD_LIB).catch(e => { vdLib = null; throw e; }));
// Tamaño, duración y portada (un fotograma en JPEG de 480 px por el lado corto) de un vídeo que el navegador sabe abrir
function vdMeta(blob) {
  return new Promise((res, rej) => {
    const v = document.createElement('video'), url = URL.createObjectURL(blob); let done = false;
    const end = (err, val) => { if (done) return; done = true; URL.revokeObjectURL(url); err ? rej(err) : res(val); };
    v.muted = true; v.playsInline = true; v.preload = 'auto';
    v.onerror = () => end(new Error('vdMeta'));
    setTimeout(() => end(new Error('vdMeta: tiempo')), 30000);
    // Ir a un momento y esperar a que ese fotograma esté pintado de verdad (si no, sale negro)
    const seek = t => new Promise(r => {
      const on = () => {
        v.removeEventListener('seeked', on);
        if (v.requestVideoFrameCallback) { let ok = false; v.requestVideoFrameCallback(() => { ok = true; r(); }); setTimeout(() => { if (!ok) r(); }, 500); }
        else setTimeout(r, 150);
      };
      v.addEventListener('seeked', on); v.currentTime = t;
    });
    let started = false;
    v.onloadeddata = async () => {
      if (started) return; started = true;
      try {
        const w = v.videoWidth, h = v.videoHeight, d = isFinite(v.duration) ? v.duration : 1, k = Math.min(1, 480 / Math.max(1, Math.min(w, h)));
        if (!w || !h) throw new Error('vdMeta: tamaño');
        const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w * k)); c.height = Math.max(1, Math.round(h * k));
        const cx = c.getContext('2d', { willReadFrequently: true });
        const light = () => { // brillo medio de una muestra de píxeles (0-255)
          const px = cx.getImageData(0, 0, c.width, c.height).data; let s = 0, n = 0;
          for (let i = 0; i < px.length; i += 4 * 37) { s += px[i] * 0.3 + px[i + 1] * 0.59 + px[i + 2] * 0.11; n++; }
          return n ? s / n : 0;
        };
        // Primero a los 0,5 s; si está casi negro (fundido, tapa…), al 25 % y al 50 %, y se queda la más clara
        let best = null, bestL = -1;
        for (const t of [Math.min(0.5, d / 3), d * 0.25, d * 0.5]) {
          await seek(t);
          cx.drawImage(v, 0, 0, c.width, c.height);
          const L = light();
          if (L > bestL) { bestL = L; best = await phBlob(c, 0.75); }
          if (L > 24) break;
        }
        if (!best) throw new Error('vdMeta: portada');
        end(null, { w, h, d: v.duration, thumb: best });
      } catch (e) { end(e); }
    };
    v.src = url;
  });
}
async function vdPrepare(file, onProg) {
  if (window.__VID_STUB) return window.__VID_STUB(file, onProg);
  if (!file || (file.type && !/^video\//.test(file.type))) throw vdErr('Ese archivo no es un vídeo');
  let out = null, trimmed = false;
  if (typeof VideoEncoder !== 'undefined' && typeof VideoDecoder !== 'undefined') {
    try {
      const MB = await vdLoadLib();
      const input = new MB.Input({ source: new MB.BlobSource(file), formats: MB.ALL_FORMATS });
      const vt = await input.getPrimaryVideoTrack();
      if (!vt) throw vdErr('No se encuentra la imagen del vídeo');
      const dur = await input.computeDuration();
      trimmed = dur > VD_MAX_SEC + 0.5;
      const sw = vt.displayWidth, sh = vt.displayHeight, k = Math.min(1, VD_SHORT / Math.min(sw, sh));
      const W = Math.max(2, Math.round(sw * k / 2) * 2), H = Math.max(2, Math.round(sh * k / 2) * 2);
      let fps = 0; try { fps = (await vt.computePacketStats(60)).averagePacketRate; } catch (e) { }
      const aac = await MB.canEncodeAudio('aac', { bitrate: VD_ABR }).catch(() => false);
      const output = new MB.Output({ format: new MB.Mp4OutputFormat({ fastStart: 'in-memory' }), target: new MB.BufferTarget() });
      const conv = await MB.Conversion.init({
        input, output, showWarnings: false,
        video: { width: W, height: H, fit: 'fill', codec: 'avc', bitrate: VD_VBR, forceTranscode: true, ...(fps > 31 ? { frameRate: 30 } : {}) },
        audio: aac ? { codec: 'aac', bitrate: VD_ABR } : { codec: 'aac' }, // sin codificador AAC, se copia el sonido si ya lo es
        trim: { start: 0, end: Math.min(dur, VD_MAX_SEC) }
      });
      if (!conv.isValid) throw new Error('conversión no válida');
      const noSound = conv.discardedTracks.some(t => t.track.isAudioTrack() && t.reason !== 'discarded_by_user');
      conv.onProgress = p => onProg && onProg(Math.max(0, Math.min(1, p)));
      await conv.execute();
      out = new Blob([output.target.buffer], { type: 'video/mp4' });
      if (noSound) toast('Este navegador no ha podido conservar el sonido del vídeo', 'bad');
    } catch (e) { if (e && e.vd) throw e; console.warn('Vídeo:', e); out = null; }
  }
  if (!out) { // sin WebCodecs (o falló): un MP4 que ya sea pequeño se sube tal cual
    if (file.type === 'video/mp4' && file.size <= VD_LIMIT) out = file;
    else throw vdErr('Tu navegador no puede preparar este vídeo. Prueba con Chrome o Safari actualizados');
  }
  if (out.size > VD_LIMIT) throw vdErr('El vídeo pesa demasiado incluso comprimido');
  const m = await vdMeta(out).catch(() => null);
  if (!m) throw vdErr('No se pudo leer el vídeo');
  if (out === file && m.d > VD_MAX_SEC + 0.5) throw vdErr('El vídeo dura más de 60 segundos. Recórtalo en el móvil y vuelve a probar');
  const d = Math.round(Math.max(0.3, Math.min(isFinite(m.d) ? m.d : VD_MAX_SEC, 61)) * 100) / 100;
  return { k: phUuid(), w: m.w, h: m.h, d, blob: out, thumb: m.thumb, url: URL.createObjectURL(m.thumb), trimmed };
}

// ---- Borradores: el vídeo elegido (claves: feed-new y story) ----
const VD_DRAFT = {}, VD_BUSY = {};
const vdPending = () => Object.keys(VD_DRAFT).length > 0 || Object.keys(VD_BUSY).length > 0;
const vdHas = key => !!(VD_DRAFT[key] || VD_BUSY[key]);

      <span class="vd-dur">${durShort(x.d)}</span><button type="button" class="ph-x" data-action="vd-del" data-vd="story" aria-label="Quitar el vídeo" title="Quitar">×</button></div>`;

let vdInput = null;
function vdChoose(key) {

// Un solo botón para fotos y vídeos (cuadro de publicar del Inicio, como en Facebook): reparte lo elegido.
// Un post lleva hasta PH_MAX.feed fotos o un vídeo, no las dos cosas.
let mdInput = null;

  if (!mdInput) {
    mdInput = document.createElement('input');
    mdInput.type = 'file'; mdInput.accept = 'image/*,video/*'; mdInput.multiple = true; mdInput.hidden = true; mdInput.id = 'mdFile';
    mdInput.addEventListener('change', () => { const fs = [...mdInput.files]; mdInput.value = ''; if (fs.length) mdAddFiles(mdInput.dataset.key, fs); });

  const vids = files.filter(f => /^video\//.test(f.type) || /\.(mp4|mov|m4v|webm|3gp|mkv)$/i.test(f.name)), imgs = files.filter(f => !vids.includes(f));

async function vdAddFile(key, file) {
  if (key === 'feed-new' && (phDraft('feed-new').length || phBusy('feed-new'))) return toast('Un post lleva fotos o un vídeo, no las dos cosas. Quita las fotos para añadir el vídeo', 'bad');
  vdClear(key);

// ---- Subir y borrar ----
async function vdUpload(kind, rowId, x, btn) {
  const base = `${kind}/${S.user.id}/${rowId}/${x.k}`, done = [], label = btn ? btn.textContent : '';
  try {
    const q = await sb.rpc('video_quota');
    if (q && !q.error && q.data && q.data.paused) throw vdErr('Este mes ya se ha gastado el presupuesto de vídeo del plan gratis. Se podrán subir otra vez el día 1');
    if (btn) btn.textContent = 'Subiendo vídeo…';
    const a = await sb.storage.from(PH_BUCKET).upload(base + '_t.jpg', x.thumb, { contentType: 'image/jpeg', cacheControl: '31536000', upsert: false });
    if (a.error) throw a.error; done.push([PH_BUCKET, base + '_t.jpg']);
    const b = await sb.storage.from(VD_BUCKET).upload(base + '.mp4', x.blob, { contentType: 'video/mp4', cacheControl: '31536000', upsert: false });
    if (b.error) throw b.error; done.push([VD_BUCKET, base + '.mp4']);
    return { video: { k: x.k, w: x.w, h: x.h, d: x.d }, done };

async function vquotaFill() {
  const el = $('[data-vquota]'); if (!el) return;
  const { data, error } = await sb.rpc('video_quota');
  if (!$('[data-vquota]')) return;
  if (error || !data) { el.innerHTML = '<span class="sub">No se ha podido consultar.</span>'; return; }
  const mb = b => (b / 1048576).toFixed(b < 10485760 ? 1 : 0).replace('.', ',') + ' MB', pct = Math.min(100, Math.round(data.used / data.limit * 100));
  el.innerHTML = `<div class="vq-bar"><i style="width:${pct}%" class="${pct >= 100 ? 'bad' : pct >= 70 ? 'warn' : ''}"></i></div>
    <p class="sub" style="margin:8px 0 0">${mb(data.used)} de ${(data.limit / 1073741824).toFixed(0)} GB este mes (${pct} %)${data.paused ? ' · <b>subidas de vídeo en pausa hasta el día 1</b>' : ''}. Es una estimación: cada persona que ve un vídeo cuenta lo que pesa. El plan gratis da unos 5 GB de descargas al mes; el resto queda para fotos y datos.</p>`;

function openModal(html, onClose) {
  if (!$('#modalRoot').firstChild && S.profile) { // para que "Atrás" la cierre
    if (histSkip) histModalPending = true; else history.pushState({ ...histState(), modal: 1 }, '');
  }

  document.body.classList.add('noscroll');
  modalOnClose = onClose || null;
}
async function closeModal(fromHistory = false) {
  const wasOpen = !!$('#modalRoot').firstChild;
  if (modalOnClose) { const f = modalOnClose; modalOnClose = null; await f(); }
  $('#modalRoot').innerHTML = '';
  document.body.classList.remove('noscroll');
  itemReturn = null; // cerrar del todo olvida el "volver a la ficha"
  phClear('feed-edit'); phClear('board'); vdClear('story'); // fotos o vídeo elegidos en un editor que se cierra sin guardar
  // Cerrada con la ✕, Esc o al pulsar fuera: quitamos su entrada del historial
  if (wasOpen && !fromHistory && history.state && history.state.modal) { histSkip++; history.back(); }
  if (wasOpen && S.section === 'students' && S.stuPage) render(); // ficha del alumno debajo: refleja lo cambiado en la ventana

}

async function route() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { S.user = null; S.profile = null; return viewAuth(); }
  S.user = session.user;
  const { data: prof, error } = await sb.from('profiles').select('*').eq('id', S.user.id).maybeSingle();
  if (error) return viewFatal('No se pudo leer tu perfil: ' + errEs(error));
  if (!prof) return viewFatal('No existe tu perfil. ¿Se ejecutó el SQL de supabase.sql antes de crear la cuenta?');
  S.profile = prof;
  if (!prof.approved) return prof.archived_at ? viewArchived() : viewPending();
  $('#app').innerHTML = '<div class="loading">Cargando…</div>';
  const ok = await loadData();
  if (ok) {
    histRestoreOnLoad();
    render(); rtStart(); backfillThumbs(); avatarLgBackfill();
    setTimeout(goalsCelebrate, 700); // logros nuevos que aún no ha visto
    setTimeout(rankCelebrate, 900); // rango nuevo (si hay un logro, espera a que se cierre)
    const fromNotif = new URLSearchParams(location.search).has('n');
    pushInit().catch(e => console.warn('Push:', e)).finally(() => installCheck(fromNotif).catch(e => console.warn('Instalar:', e)));
    if (fromNotif) { // llegamos desde un aviso del móvil
      const url = location.href;
      history.replaceState(history.state, '', location.pathname); // limpia ?n= de la barra
      openNotifFromUrl(url);
    }
  }
}

// quiet = true: resincronización en segundo plano (si falla, no muestra la pantalla de error)
async function loadData(quiet = false) {
  try {
    const me = S.user.id;
    const common = [
      sb.from('feed_posts').select('*').order('created_at', { ascending: false }).limit(100),
      sb.from('feed_comments').select('*'),
      sb.from('listening_comments').select('*'),
      sb.from('reactions').select('*'),
      sb.rpc('get_directory')
    ];
    // Mensajes privados, bloqueos propios, contactos y notificaciones (iguales para profe y alumno)
    const extra = await Promise.all([
      sb.from('dm_messages').select('*').order('created_at', { ascending: true }).limit(1000),
      sb.from('user_blocks').select('*'),
      sb.rpc('get_dm_contacts'),
      sb.from('notifications').select('*').order('created_at', { ascending: false }).limit(60),
      sb.from('classmates').select('*'),
      sb.from('dm_reactions').select('*')
    ]);
    const exErr = extra.map(x => x.error).find(Boolean);
    if (exErr) throw exErr;
    S.dms = extra[0].data || []; S.blocks = extra[1].data || []; S.notifs = extra[3].data || []; S.mates = extra[4].data || []; S.dmRx = extra[5].data || [];
    S.dmContacts = (extra[2].data || []).map(x => typeof x === 'string' ? x : x.get_dm_contacts || x.id);
    S.dmCan = {}; S.dmContacts.forEach(id => { S.dmCan[id] = true; });
    if (S.profile.role === 'teacher') {
      const [i, a, p, bp, br, bd, rp, hw, pp, pr, fp, fc, lc, rx, dr] = await Promise.all([
        sb.from('listening_items').select('*').order('created_at', { ascending: false }),
        sb.from('listening_assignments').select('*'),
        // sin avatar_src (la copia grande de la foto): no hace falta y pesa. Al añadir campos al perfil, añádelos aquí.
        sb.from('profiles').select('id, display_name, nickname, avatar, email, role, approved, archived_at, created_at, birth_date, family_dm_ok, app_installed_at').eq('role', 'student').order('display_name'),
        sb.from('board_posts').select('*'),
        sb.from('board_recipients').select('*'),
        sb.from('board_reads').select('*'),
        sb.from('moderation_reports').select('*'),
        sb.from('homework_tasks').select('*').order('created_at', { ascending: false }).limit(2000),
        sb.from('payments_plans').select('*'),
        sb.from('payments_records').select('*').order('period', { ascending: false }).limit(3000),
        ...common
      ]);
      const err = [i, a, p, bp, br, bd, rp, hw, pp, pr, fp, fc, lc, rx, dr].map(x => x.error).find(Boolean);
      if (err) throw err;
      S.items = i.data; S.assigns = a.data; S.students = p.data;
      S.posts = bp.data; S.recipients = br.data; S.reads = bd.data; S.reports = rp.data;
      S.homework = hw.data || []; S.payPlans = pp.data || []; S.payRecords = pr.data || [];
      S.fposts = fp.data; S.fcomments = fc.data; S.lcomments = lc.data; S.reactions = rx.data;
      S.dir = {}; (dr.data || []).forEach(d => { S.dir[d.id] = d; });
      // Quién tiene las notificaciones activadas (ficha del alumno). Si falla, la ficha no dice nada.
      try { const ps = await sb.rpc('get_push_status');
        if (ps.error) throw ps.error;
        S.pushOn = {}; (ps.data || []).forEach(x => { S.pushOn[x.user_id] = x.devices; });
      } catch (e) { S.pushOn = null; }
    } else {
      const [a, bp, bd, rp, hw, fp, fc, lc, rx, dr] = await Promise.all([
        sb.from('listening_assignments').select('*, item:listening_items(*)').eq('student_id', me),
        sb.from('board_posts').select('*'),
        sb.from('board_reads').select('*').eq('student_id', me),
        sb.from('moderation_reports').select('*').eq('reporter_id', me),
        sb.from('homework_tasks').select('*').eq('student_id', me).order('created_at', { ascending: false }).limit(500),
        ...common
      ]);
      const err = [a, bp, bd, rp, hw, fp, fc, lc, rx, dr].map(x => x.error).find(Boolean);
      if (err) throw err;
      S.assigns = (a.data || []).filter(x => x.item);
      S.posts = bp.data; S.reads = bd.data; S.reports = rp.data; S.homework = hw.data || [];
      S.fposts = fp.data; S.fcomments = fc.data; S.lcomments = lc.data; S.reactions = rx.data;
      S.dir = {}; (dr.data || []).forEach(d => { S.dir[d.id] = d; });
    }
    // La Agenda no debe tumbar la app si su parte de la base de datos aún no existe o falla
    try { await loadStories(); } catch (e) { console.warn('Stories:', e.message || e); S.stories = []; S.storyViews = []; S.storyRx = []; }

/* Móvil: la fila de cápsulas se desliza de lado. Para que se note que hay más (Yuri, 2026-11-28):
   el borde se difumina, bien ancho, por donde hay más (.more-l / .more-r en .foryou; Yuri no quiere flechas) y,
   la primera vez que sale en cada carga, un pequeño empujón de ida y vuelta (sin él si el sistema pide menos movimiento). */
let fyNudged = false;
const fyMobile = () => matchMedia('(max-width:760px)').matches;
function fyEdges(row) {
  const fy = row.closest('.foryou'); if (!fy) return;
  if (row.dataset.loop) { fy.classList.add('more-l', 'more-r'); return; } // en bucle siempre hay más a los dos lados
  const max = row.scrollWidth - row.clientWidth;
  fy.classList.toggle('more-l', row.scrollLeft > 4);
  fy.classList.toggle('more-r', max > 4 && row.scrollLeft < max - 4);
}
/* Bucle infinito (Yuri, 2026-11-28): en el móvil, si la fila no cabe, se añaden dos copias de las cápsulas
   detrás (`.fy-clone`, ocultas para lectores de pantalla y sin tabulador; los clics funcionan igual por
   data-action) y se empieza en la copia del medio. Al pasar de media copia hacia un lado, se salta una
   copia entera hacia el otro: se ve igual y nunca se llega al final. */
function fyLoop(row) {
  if (row.dataset.loop || !fyMobile() || row.scrollWidth - row.clientWidth <= 4) return;
  const orig = [...row.children];
  for (let k = 0; k < 2; k++) orig.forEach(c => { const x = c.cloneNode(true); x.classList.add('fy-clone'); x.setAttribute('aria-hidden', 'true'); x.tabIndex = -1; row.appendChild(x); });
  row.dataset.loop = '1';

const fyLoopW = row => { const n = row.querySelectorAll('.fy-chip:not(.fy-clone)').length, c = row.children; return c[n] ? c[n].offsetLeft - c[0].offsetLeft : 0; };
function fyLoopFix(row) {
  const w = fyLoopW(row); if (!w) return;
  if (row.scrollLeft < w * 0.5) row.scrollLeft += w;
  else if (row.scrollLeft > w * 1.5) row.scrollLeft -= w;
}
function fyUnloop(row) { row.querySelectorAll('.fy-clone').forEach(x => x.parentNode.removeChild(x)); delete row.dataset.loop; row.scrollLeft = 0; }
function fyInit() {
  $$('.foryou .fy-chips').forEach(row => {
    if (!row.offsetParent) return;
    fyLoop(row); fyEdges(row);
    if (fyNudged || !row.closest('.foryou').classList.contains('more-r')) return;
    fyNudged = true;
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    // con una animación CSS de las cápsulas (no con scroll: un scroll suave a medias podía dejar la fila movida)
    setTimeout(() => { row.classList.add('nudge'); setTimeout(() => row.classList.remove('nudge'), 1300); }, 600);
  });
}
document.addEventListener('scroll', e => {
  const row = e.target; if (!row.classList || !row.classList.contains('fy-chips')) return;
  if (row.dataset.loop) fyLoopFix(row); else fyEdges(row);
}, true);
addEventListener('resize', () => $$('.foryou .fy-chips').forEach(row => { if (row.dataset.loop && !fyMobile()) fyUnloop(row); fyInit(); }));

// Primer enlace de un texto (con o sin https://), normalizado; null si no hay o no es válido
function firstLink(text) {
  const m = String(text).match(/https?:\/\/[^\s<]+|\b(?:www\.|open\.spotify\.com\/|spotify\.link\/|youtu\.be\/|(?:m\.|music\.)?youtube\.com\/)[^\s<]*/i);
  if (!m) return null;
  let u = m[0].replace(/[.,;:!?)\]]+$/, '');
  if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
  try { return u.length <= 500 ? new URL(u).href : null; } catch { return null; }
}

// Alumno: un aviso cuenta como leído cuando ha estado en pantalla.
// La etiqueta "Nuevo" se mantiene mientras siga en Avisos (postSeenNow) y se quita al volver.
let postSeenObs = null;
const postSeenNow = new Set();
function watchPostReads() {
  if (postSeenObs) { postSeenObs.disconnect(); postSeenObs = null; }
  if (S.section !== 'board') postSeenNow.clear();
  if (S.section !== 'board' || isTeacher() || !('IntersectionObserver' in window)) return;
  const cards = $$('.card.post.isnew[data-post]');
  if (!cards.length) return;
  // Cuenta como leído si se ve el 60 % del aviso o, si es más alto que la pantalla
  // (avisos largos en el móvil), si ocupa al menos la mitad de la pantalla.
  postSeenObs = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      const vh = (e.rootBounds && e.rootBounds.height) || window.innerHeight;
      const need = Math.min(e.boundingClientRect.height * 0.6, vh * 0.5);
      if (e.intersectionRect.height < need) return;
      postSeenObs.unobserve(e.target);
      postSeenNow.add(e.target.dataset.post);
      markRead(e.target.dataset.post).then(refreshChrome);
    });
  }, { threshold: Array.from({ length: 21 }, (_, i) => i / 20) });
  cards.forEach(c => postSeenObs.observe(c));
}

/* ---- Foto de perfil: encuadre (arrastrar para mover, deslizador o rueda para ampliar) ---- */
/* Se guardan dos cosas: la foto final de 160×160 (la que ve el grupo, columna avatar) y, solo para
   ti y el profesor, una copia reducida de la original (avatar_src) con la posición del encuadre
   (avatar_crop), para poder reencuadrar sin volver a subirla. */
let crop = null; // { img, src, zoom, cx, cy } · cx/cy = punto de la imagen que queda en el centro del círculo
const CROP_VIEW = 260; // tamaño en pantalla del recuadro de encuadre
const SRC_MAX = 640;   // lado máximo de la copia de la original
const loadImg = src => new Promise(res => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; });
async function processAvatar(file) {
  if (!file || !/^image\//.test(file.type)) return toast('Elige una imagen', 'bad');
  const url = URL.createObjectURL(file);
  const raw = await loadImg(url);
  URL.revokeObjectURL(url);
  if (!raw || !raw.naturalWidth) return toast('No se pudo leer esa imagen. Prueba con JPG o PNG', 'bad');
  // copia reducida de la original (se guarda para poder reencuadrar más tarde)
  const k = Math.min(1, SRC_MAX / Math.max(raw.naturalWidth, raw.naturalHeight));
  const c = document.createElement('canvas');
  c.width = Math.round(raw.naturalWidth * k); c.height = Math.round(raw.naturalHeight * k);
  const cx = c.getContext('2d'); cx.fillStyle = '#0b1530'; cx.fillRect(0, 0, c.width, c.height);
  cx.imageSmoothingQuality = 'high'; cx.drawImage(raw, 0, 0, c.width, c.height);
  let src = c.toDataURL('image/jpeg', 0.82);
  if (src.length > 115000) src = c.toDataURL('image/jpeg', 0.62);
  if (src.length > 120000) src = null; // demasiado pesada: se podrá encuadrar ahora, pero no reencuadrar luego
  openCrop(src ? await loadImg(src) : raw, src, null);
}
async function editAvatar() {
  const p = S.profile;
  const img = p.avatar_src ? await loadImg(p.avatar_src) : null;
  if (!img) return toast('No hay foto original guardada. Vuelve a elegirla', 'bad');
  openCrop(img, p.avatar_src, p.avatar_crop);
}
function openCrop(img, src, saved) {
  const w = img.naturalWidth, h = img.naturalHeight;
  crop = { img, src, zoom: 1, cx: w / 2, cy: h / 2 };
  if (saved && typeof saved === 'object') {
    crop.zoom = Math.min(4, Math.max(1, +saved.zoom || 1));
    crop.cx = (+saved.x || 0.5) * w; crop.cy = (+saved.y || 0.5) * h;
    cropClamp();
  }
  openModal(`
    <div class="modal-head"><h2>Encuadra tu foto</h2><button class="x" data-action="close" aria-label="Cerrar">×</button></div>
    <div class="crop">
      <div class="crop-stage" id="cropStage"><canvas id="cropCanvas" width="${CROP_VIEW * 2}" height="${CROP_VIEW * 2}"></canvas></div>
      <label class="crop-zoom">${ic('zoom-out')}<input type="range" id="cropZoom" min="1" max="4" step="0.01" value="${crop.zoom}" aria-label="Ampliar">${ic('zoom-in')}</label>
      <p class="sub center" style="margin:0">Arrastra la foto para moverla y usa el deslizador para ampliarla. Lo que quede dentro del círculo es lo que verá el grupo.</p>
      <div class="actions" style="justify-content:center"><button class="btn primary" data-action="avatar-save">Guardar foto</button><button class="btn ghost" data-action="close">Cancelar</button></div>
    </div>`, async () => { crop = null; });
  $('.modal').classList.add('narrow');
  cropBind();
  cropDraw();
}
// Escala base: la imagen cubre justo el círculo (lado corto = recuadro). zoom multiplica esa escala.
const cropScale = (view) => (view / Math.min(crop.img.naturalWidth, crop.img.naturalHeight)) * crop.zoom;
function cropClamp() { // que nunca quede hueco vacío dentro del recuadro
  const half = (CROP_VIEW / 2) / cropScale(CROP_VIEW);
  const w = crop.img.naturalWidth, h = crop.img.naturalHeight;
  crop.cx = Math.min(Math.max(crop.cx, half), w - half);
  crop.cy = Math.min(Math.max(crop.cy, half), h - half);
}
// Pinta el encuadre st = { img, zoom, cx, cy } en un lienzo cuadrado de lado view
function paintCropped(ctx, view, bg, st) {
  const s = (view / Math.min(st.img.naturalWidth, st.img.naturalHeight)) * st.zoom;
  ctx.fillStyle = bg; ctx.fillRect(0, 0, view, view);
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(st.img, view / 2 - st.cx * s, view / 2 - st.cy * s, st.img.naturalWidth * s, st.img.naturalHeight * s);
}
function cropPaint(ctx, view, bg) { paintCropped(ctx, view, bg, crop); }
// JPEG cuadrado del encuadre: baja la calidad hasta que quepa en max caracteres (null si no cabe)
function cropJpeg(st, N, max, qs = [0.85, 0.72, 0.6, 0.5]) {
  const c = document.createElement('canvas'); c.width = c.height = N;
  paintCropped(c.getContext('2d'), N, '#0b1530', st);
  for (const q of qs) { const d = c.toDataURL('image/jpeg', q); if (d.length <= max) return d; }
  return null;
}
const AVATAR_LG = 640; // lado de la foto en grande (avatar_lg), la que se ve al ampliar en un perfil
/* Fotos subidas antes de existir avatar_lg: se generan a partir de la original y su encuadre.
   Cada cual la suya y el profesor las de todos (él puede leer avatar_src). Una vez por sesión. */
let avatarLgDone = false;
async function avatarLgBackfill() {
  if (avatarLgDone) return; avatarLgDone = true;
  try {
    let q = sb.from('profiles').select('id, avatar, avatar_src, avatar_crop').is('avatar_lg', null);
    if (!isTeacher()) q = q.eq('id', S.user.id);
    const { data, error } = await q; if (error) return;
    for (const p of data || []) {
      if (!safeAvatar(p.avatar) || !p.avatar_src || !p.avatar_crop) continue;
      const img = await loadImg(p.avatar_src); if (!img || !img.naturalWidth) continue;
      const w = img.naturalWidth, h = img.naturalHeight, c = p.avatar_crop;
      const st = { img, zoom: Math.min(4, Math.max(1, +c.zoom || 1)), cx: (+c.x || 0.5) * w, cy: (+c.y || 0.5) * h };
      const lg = cropJpeg(st, AVATAR_LG, 150000); if (!lg) continue;
      await sb.from('profiles').update({ avatar_lg: lg }).eq('id', p.id).is('avatar_lg', null);
    }
  } catch (e) { console.warn('Foto grande:', e); }
}
function cropDraw() {
  const c = $('#cropCanvas'); if (!c || !crop) return;
  const ctx = c.getContext('2d');
  ctx.setTransform(2, 0, 0, 2, 0, 0); // canvas a doble resolución para que se vea nítido
  cropPaint(ctx, CROP_VIEW, '#000');
}
function cropBind() {
  const st = $('#cropStage'), zr = $('#cropZoom');
  let drag = null;
  const ratio = () => CROP_VIEW / st.getBoundingClientRect().width; // por si el recuadro se encoge en móvil
  st.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY }; st.setPointerCapture(e.pointerId); });
  st.addEventListener('pointermove', e => {
    if (!drag || !crop) return;
    const s = cropScale(CROP_VIEW), r = ratio();
    crop.cx -= (e.clientX - drag.x) * r / s; crop.cy -= (e.clientY - drag.y) * r / s;
    drag = { x: e.clientX, y: e.clientY };
    cropClamp(); cropDraw();
  });
  const end = () => { drag = null; };
  st.addEventListener('pointerup', end); st.addEventListener('pointercancel', end);
  zr.addEventListener('input', () => { if (!crop) return; crop.zoom = +zr.value; cropClamp(); cropDraw(); });
  st.addEventListener('wheel', e => {
    if (!crop) return; e.preventDefault();
    crop.zoom = Math.min(4, Math.max(1, crop.zoom * (e.deltaY < 0 ? 1.08 : 1 / 1.08)));
    zr.value = crop.zoom; cropClamp(); cropDraw();
  }, { passive: false });
}
async function cropSave() {
  if (!crop) return;
  const data = cropJpeg(crop, 160, 40000, [0.85, 0.6]);
  if (!data) return toast('La imagen es demasiado pesada', 'bad');
  const w = crop.img.naturalWidth, h = crop.img.naturalHeight;
  const fields = { avatar: data, avatar_lg: cropJpeg(crop, AVATAR_LG, 150000), avatar_src: crop.src || null,
    avatar_crop: crop.src ? { x: +(crop.cx / w).toFixed(4), y: +(crop.cy / h).toFixed(4), zoom: +crop.zoom.toFixed(3) } : null };
  await closeModal();
  await saveProfileFields(fields, 'Foto actualizada');
}

/* ============================== ALUMNO ============================== */
/* ---- Portadas: Spotify (oEmbed público, sin claves) y YouTube (miniatura por id de vídeo) ---- */
const THUMB_OK = /^https:\/\/(i\.scdn\.co|image-cdn-[a-z0-9-]+\.spotifycdn\.com|mosaic\.scdn\.co|i\.ytimg\.com)\//;
const safeThumb = u => typeof u === 'string' && u.length <= 300 && THUMB_OK.test(u) ? u : null;
function ytId(url) {
  const m = String(url).match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/))([A-Za-z0-9_-]{11})/);
  return m ? m[1] : null;
}
const linkService = url => /spotify\.com/i.test(url) ? 'sp' : /youtu\.?be/i.test(url) ? 'yt' : '';
// Título y portada de un enlace de Spotify o YouTube (oEmbed público, sin claves). { title, thumb, artist } o nulos.
// artist solo en YouTube (nombre del canal, sin "VEVO", " - Topic", "Official"…); el de Spotify lo da media-info.
const metaCache = {};
async function fetchMeta(url) {
  if (typeof window.__META_STUB === 'function') return window.__META_STUB(url); // pruebas: respuesta simulada
  if (CFG.NO_EXTERNAL) return { title: null, thumb: null, artist: null }; // pruebas: sin llamadas a internet
  if (metaCache[url]) return metaCache[url];
  const yt = /youtu\.?be/i.test(url), sp = /open\.spotify\.com\//i.test(url);
  if (!yt && !sp) return { title: null, thumb: null, artist: null };
  const api = sp ? 'https://open.spotify.com/oembed?url=' + encodeURIComponent(url.split('?')[0])
    : 'https://www.youtube.com/oembed?format=json&url=' + encodeURIComponent(url);
  let title = null, thumb = null, artist = null;
  try {
    const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 5000);
    const r = await fetch(api, { signal: ctl.signal });
    clearTimeout(tm);
    if (r.ok) { const j = await r.json(); title = (j.title || '').trim().slice(0, 200) || null; thumb = safeThumb(j.thumbnail_url); if (yt) artist = ytArtist(j.author_name); }
  } catch { /* sin conexión o enlace privado */ }
  if (!thumb && ytId(url)) thumb = `https://i.ytimg.com/vi/${ytId(url)}/mqdefault.jpg`;
  return (metaCache[url] = { title, thumb, artist });
}
const fetchThumb = async url => (await fetchMeta(url)).thumb;
const ytArtist = n => String(n || '').replace(/\s*-\s*Topic$/i, '').replace(/VEVO$/i, '').replace(/\s+(official|oficial)(\s+(channel|youtube|music))?$/i, '').trim().slice(0, 200) || null;
// Artista de un enlace: YouTube → canal (oEmbed); Spotify → media-info ("" = playlist de muchos artistas). null = no se sabe.
async function fetchArtist(url) {
  const sv = linkService(url);
  if (sv === 'yt') return (await fetchMeta(url)).artist ?? null;
  if (sv === 'sp') return (await fetchDuration(url)).artist ?? null;
  return null;
}
// Tipo según la dirección: Spotify /album/ /track/ /playlist/ · YouTube con "list=" → playlist; otro vídeo → canción
function guessKind(url) {
  if (/spotify\.com\/(intl-[a-z]+\/)?album\//i.test(url)) return 'album';
  if (/spotify\.com\/(intl-[a-z]+\/)?track\//i.test(url)) return 'song';
  if (/spotify\.com\/(intl-[a-z]+\/)?playlist\//i.test(url) || /youtu.*[?&]list=/i.test(url)) return 'playlist';
  if (ytId(url)) return 'song';
  return null;
}
// Profesor: rellena en segundo plano las portadas que falten (elementos creados antes de esta función)
const durTried = new Set();
async function backfillThumbs() {
  if (!isTeacher() || CFG.NO_EXTERNAL) return;
  for (const it of S.items.filter(i => !i.thumb_url).slice(0, 30)) {
    const th = await fetchThumb(it.url);
    if (!th) continue;
    const { error } = await sb.from('listening_items').update({ thumb_url: th }).eq('id', it.id);
    if (!error) { it.thumb_url = th; S.assigns.forEach(a => { if (a.item && a.item.id === it.id) a.item.thumb_url = th; }); }
  }
  // Duraciones que falten (una vez por sesión: si un enlace no la da, no se insiste)
  for (const it of S.items.filter(i => !i.duration_sec && !durTried.has(i.id)).slice(0, 30)) {
    durTried.add(it.id);
    await new Promise(ok => setTimeout(ok, 600)); // de una en una y sin prisa: Spotify corta si le pides muchas seguidas
    const d = await fetchDuration(it.url);
    if (!d.duration_sec) continue;
    const row = { duration_sec: d.duration_sec, track_count: d.track_count, duration_partial: d.partial };
    const { error } = await sb.from('listening_items').update(row).eq('id', it.id);
    if (!error) { Object.assign(it, row); S.assigns.forEach(a => { if (a.item && a.item.id === it.id) Object.assign(a.item, row); }); }
  }
  // Artistas que falten (null = sin buscar; "" = ya se buscó y no hay uno solo). Una vez por sesión.
  for (const it of S.items.filter(i => i.artist == null && !artistTried.has(i.id)).slice(0, 40)) {
    artistTried.add(it.id);

// Duración: canción "3:33"; álbum/playlist "12 temas · 42 min" o "1 h 12 min". "+" = solo se sumaron los primeros 100 temas
function fmtSecs(sec, exact) {

  if (exact) { const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = String(sec % 60).padStart(2, '0');
    return h ? `${h}:${String(m).padStart(2, '0')}:${s}` : `${m}:${s}`; }

function parseDur(v) {

  if (/^\d+(:\d{1,2}){1,2}$/.test(v)) return v.split(':').reduce((s, p) => s * 60 + Number(p), 0) || NaN;

   "🎬 Para ver" en la lista y en su ventana, y al alumno le sale este aviso cada vez que abre el enlace (▶ de la lista o
   "Ver vídeo" de la ventana). Va por encima de la ventana abierta; Atrás, Esc, "Ahora no" o tocar fuera lo cierran.

const watchTag = (it, big = false) => !it ? '' :

/* "Escuchar del tirón" (listening_items.play_through, 2026-11-27): álbumes conceptuales en los que un tema enlaza con el

   dos marcas, salen los dos avisos uno detrás de otro (Yuri): primero el del vídeo con "Siguiente →" y luego el del
   álbum, cuyo "Entendido" abre el enlace. Una sola entrada en el historial: Atrás cierra los dos. */
const watchSteps = it => !it ? ['video'] : [...(it.watch_video ? ['video'] : []), ...(it.play_through ? ['album'] : [])];
function watchBody(it, href, step, last) {
  const li = (e, t) => `<li><span>${e}</span><span>${t}</span></li>`;
  const dur = it && it.duration_sec ? fmtSecs(Number(it.duration_sec)) + (it.duration_partial ? '+' : '') : '';

  const items = vid ? [

    li('🎧', 'Ponte los <b>auriculares</b>.'),

    li('⏱️', `Busca un rato para escucharlo <b>entero y sin pausas</b>${dur ? ` (dura ${esc(dur)})` : ''}, en orden y sin aleatorio.`),

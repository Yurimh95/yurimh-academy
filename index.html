  // Pulsación larga (táctil). Va con eventos touch y no pointer: el navegador
  // corta los pointer (pointercancel) en cuanto cree que vas a desplazar o a
  // seleccionar, y eso era lo que impedía abrir el selector en el móvil.
  document.addEventListener('touchstart', e => {
    const t = e.target.closest ? e.target : e.target.parentElement;
    const main = t && t.closest('.rxb.main');

    rxLong = false;
    const p = e.touches[0];

      rxLong = true; rxShow(main);

    }, 400) };

  const cancel = () => { if (rxPress) clearTimeout(rxPress.t); rxPress = null; };

  // el emoji que queda debajo se resalta (.hot) y al soltar se aplica.
  const under = p => {
    const el = p && document.elementFromPoint(p.clientX, p.clientY);
    const b = el && el.closest && el.closest('.rx-pick .rxb');
    return b && rxOpenEl && rxOpenEl.contains(b) ? b : null;
  };
  const hot = b => { if (rxOpenEl) rxOpenEl.querySelectorAll('.rxb.hot').forEach(x => { if (x !== b) x.classList.remove('hot'); }); if (b && !b.classList.contains('hot')) { b.classList.add('hot'); if (navigator.vibrate) try { navigator.vibrate(5); } catch (_) {} } };
  document.addEventListener('touchmove', e => {
    const p = e.touches[0];
    if (rxLong && rxOpenEl) { if (e.cancelable) e.preventDefault(); hot(under(p)); return; }
    if (rxPress && p && Math.hypot(p.clientX - rxPress.x, p.clientY - rxPress.y) > 12) cancel();
  }, { passive: false });
  document.addEventListener('touchend', e => {
    cancel();
    if (!rxLong) return;
    // Al soltar tras mantener: ni clic ("me gusta") ni selección de texto;
    // se aplica el emoji que haya bajo el dedo (si hay) y la burbuja se cierra.
    if (e.cancelable) e.preventDefault();
    const b = under(e.changedTouches[0]);
    rxLong = false; rxLongEnd = Date.now(); rxHide();
    if (b) actions['rx-toggle'](b);
  }, { passive: false });

  document.addEventListener('click', e => {
    if (Date.now() - rxLongEnd < 700 && e.target.closest && e.target.closest('.rxb.main')) { rxLongEnd = 0; e.stopPropagation(); e.preventDefault(); }
  }, true);

  addEventListener('scroll', () => { if (!rxOpenEl) rxScrollY = scrollY; else if (Math.abs(scrollY - rxScrollY) > 30) rxHide(); }, true);
  addEventListener('keydown', e => { if (e.key === 'Escape' && rxOpenEl) rxHide(); });
}
rxHoverInit();

/* ---- Enlaces ---- */
// Spotify y YouTube salen como en Escucha analítica: portada, título, tipo y duración.
// La tarjeta se pinta al momento con lo que haya en caché y linkPreviewFill() la completa en segundo plano.
const linkPreviewDone = new Set(), linkPreviewBusy = new Set();
function mediaCard(url, sv) {
  const meta = metaCache[url] || {}, dur = durCache[url] || {};
  const kind = guessKind(url) || 'song';
  const it = { kind, thumb_url: meta.thumb || (ytId(url) ? `https://i.ytimg.com/vi/${ytId(url)}/mqdefault.jpg` : null),
    duration_sec: dur.duration_sec, track_count: dur.track_count, duration_partial: dur.partial };
  const svc = sv === 'sp' ? 'Spotify' : 'YouTube';
  return `<a class="linkcard media ${sv}" href="${esc(safeUrl(url))}" target="_blank" rel="noopener noreferrer"${linkPreviewDone.has(url) ? '' : ` data-lp="${esc(url)}"`}>
    ${coverHtml(it, 64)}
    <span class="lt"><span class="lk">${esc(meta.title || (sv === 'sp' ? 'Escuchar en Spotify' : 'Ver en YouTube'))}</span>
      <span class="tsub">${kindIcon(kind)}${durHtml(it)}<span class="lsvc ${sv}">${svc}</span></span></span>${ic('ext', 'i go')}</a>`;
}
async function linkPreviewFill() {
  for (const el of $$('.linkcard[data-lp]')) {
    const url = el.getAttribute('data-lp');
    if (linkPreviewBusy.has(url) || linkPreviewDone.has(url)) continue;
    linkPreviewBusy.add(url);
    (async () => {
      await Promise.all([fetchMeta(url), fetchDuration(url)]); // las dos se guardan en caché por enlace
      linkPreviewBusy.delete(url); linkPreviewDone.add(url);
      $$('.linkcard[data-lp]').filter(n => n.getAttribute('data-lp') === url).forEach(n => { n.outerHTML = linkCard(url); });
    })();
  }
}
let linkPreviewQueued = false;
new MutationObserver(() => { if (!linkPreviewQueued) { linkPreviewQueued = true; requestAnimationFrame(() => { linkPreviewQueued = false; linkPreviewFill(); }); } })
  .observe(document.body, { childList: true, subtree: true });
// Tarjeta solo para enlaces de Spotify/YouTube (avisos y comentarios: otros enlaces se quedan en el texto)
const mediaLinkCard = text => { const u = firstLink(text); return u && linkService(u) ? linkCard(u) : ''; };
function linkCard(url) {
  let host = url; try { host = new URL(url).hostname.replace(/^www\./, ''); } catch { }
  const sp = /spotify\.com$/.test(host), yt = /(^|\.)youtu(\.be|be\.com)$/.test(host);
  if (sp || yt) return mediaCard(url, sp ? 'sp' : 'yt');
  const label = sp ? 'Escuchar en Spotify' : yt ? 'Ver en YouTube' : host;
  return `<a class="linkcard" href="${esc(safeUrl(url))}" target="_blank" rel="noopener noreferrer">
    <span class="lart ${sp ? 'sp' : yt ? 'yt' : ''}">${ic(sp ? 'note' : yt ? 'play' : 'link')}</span>
    <span class="lt"><span class="lk">${esc(label)}</span><span class="lu">${esc(url)}</span></span>${ic('ext', 'i go')}</a>`;
}

function dropTargetLocal(type, id) { // limpia en memoria lo que la base de datos borra en cascada
  let ids = [id];
  if (type === 'feed_post') { const cs = S.fcomments.filter(c => c.post_id === id).map(c => c.id); S.fcomments = S.fcomments.filter(c => c.post_id !== id); S.fposts = S.fposts.filter(x => x.id !== id); ids = ids.concat(cs); S.reactions = S.reactions.filter(r => !(r.target_type === 'feed_comment' && cs.includes(r.target_id))); S.reports = S.reports.filter(r => !(r.target_type === 'feed_comment' && cs.includes(r.target_id))); }
  if (type === 'feed_comment') S.fcomments = S.fcomments.filter(x => x.id !== id);
  if (type === 'listening_comment') S.lcomments = S.lcomments.filter(x => x.id !== id);

/* ===================== TIEMPO REAL (Supabase Realtime) =====================
   La base de datos avisa al momento de cada cambio, respetando las mismas reglas RLS:
   nadie recibe en directo lo que no podría ver. Los borrados solo traen la clave. */
const RT_TABLES = ['dm_reactions', 'listening_answer_reactions', 'feed_posts', 'feed_comments', 'listening_comments', 'reactions', 'board_posts', 'board_recipients',
  'board_reads', 'listening_items', 'listening_assignments', 'profiles', 'moderation_reports', 'dm_messages', 'notifications', 'homework_tasks', 'classmates', 'goals_items', 'goals_done',
  'listening_folders', 'listening_genres', 'listening_item_genres'];
const RT_LIST = { listening_folders: 'folders', listening_genres: 'genres', listening_item_genres: 'itemGenres', board_posts: 'posts', board_recipients: 'recipients', board_reads: 'reads', listening_items: 'items', listening_assignments: 'assigns', moderation_reports: 'reports', homework_tasks: 'homework', goals_items: 'goalItems', goals_done: 'goalDone' };
const rowKey = (table, r) => table === 'reactions' ? [r.target_type, r.target_id, r.user_id, r.emoji].join('|')
  : (table === 'board_reads' || table === 'board_recipients') ? r.post_id + '|' + r.student_id
  : table === 'listening_item_genres' ? r.item_id + '|' + r.genre_id : r.id;
function addUnique(list, row, table) { // añade sin duplicar (lo local y lo que llega en directo pueden cruzarse)
  const k = rowKey(table, row);
  if (list.some(x => rowKey(table, x) === k)) return false;
  list.push(row); return true;
}
function rtApply(list, table, ev, row, old) { // inserta/actualiza/borra en una lista y la devuelve
  if (ev === 'DELETE') { const k = rowKey(table, old); return list.filter(x => rowKey(table, x) !== k); }
  const k = rowKey(table, row), i = list.findIndex(x => rowKey(table, x) === k);
  if (i >= 0) list[i] = { ...list[i], ...row }; else list.push(row);
  return list;
}
let rtChannel = null, rtWasLive = false, hiddenAt = 0;
function rtStart() {
  rtStop();
  rtChannel = sb.channel('app-changes');
  RT_TABLES.forEach(t => rtChannel.on('postgres_changes', { event: '*', schema: 'public', table: t },
    p => rtHandle(t, p).catch(e => console.warn('Tiempo real:', e))));
  rtChannel.subscribe(status => {
    // Si se corta (móvil en reposo, wifi…) y vuelve, recargamos por si nos perdimos algo
    if (status === 'SUBSCRIBED') { if (rtWasLive) rtResync(); rtWasLive = true; }
  });
}
function rtStop() { if (rtChannel) { sb.removeChannel(rtChannel); rtChannel = null; } rtWasLive = false; }
async function rtResync() { if (S.preview) return; if (S.profile && S.profile.approved && await loadData(true)) softRender(); }
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  if (hiddenAt && Date.now() - hiddenAt > 60000) rtResync(); // vuelves a la pestaña tras más de 1 minuto
  hiddenAt = 0;
});

/* Repintar sin molestar: si estás escribiendo o tienes una ventana abierta, solo se actualizan
   los contadores del menú; el resto se repinta al cerrar la ventana. */
let uiStale = false;
function uiBusy() {
  if ($('#modalRoot').firstChild) return true;
  const a = document.activeElement;
  if (a && /^(TEXTAREA|INPUT|SELECT)$/.test(a.tagName) && a.closest('#app')) return true;
  return $$('#app textarea').some(x => x.value.trim()) || $$('#feedForm input[type=text]').some(x => x.value.trim());
}
function refreshChrome() {
  const secs = sections();
  $$('.bell').forEach(b => { b.outerHTML = bellHtml(); });
  if (!installBtnHtml()) $$('.installbtn').forEach(b => b.remove());
  const nav = $('.sidebar .nav'); if (nav) nav.outerHTML = navHtml(secs);
  const tb = $('.tabbar'); if (tb) tb.outerHTML = tabbar(secs);
}
function softRender() {
  if (!S.profile || !$('.shell')) return;
  if (uiBusy()) { uiStale = true; refreshChrome(); return; }
  uiStale = false;
  const y = window.scrollY; render(); window.scrollTo(0, y);
}

async function rtHandle(t, p) {
  if (!S.profile || !S.user || S.preview) return; // en la vista de alumno no se toca nada; al salir se recarga todo
  const ev = p.eventType, row = p.new || {}, old = p.old || {}, me = S.user.id, teacher = isTeacher();
  // Alguien que aún no está en el directorio (alumno recién aprobado…): lo recargamos para su nombre y foto
  if (ev !== 'DELETE' && row.author_id && !S.dir[row.author_id]) await loadDirectory();
  // Lo mismo con quien reacciona (su primera reacción le hace visible)
  if (ev !== 'DELETE' && t === 'reactions' && row.user_id && !S.dir[row.user_id]) await loadDirectory();

  if (t === 'classmates') { // solicitudes y compañeros: cambian también a quién puedo ver
    const had = S.mates.some(m => m.id === (row.id || old.id));
    if (ev === 'DELETE' && !had) return;
    S.mates = rtApply(S.mates, t, ev, row, old);
    await loadDirectory();
    return softRender();
  }

  if (t === 'feed_posts') {
    if (ev === 'INSERT') {
      if (S.fposts.some(x => x.id === row.id) || S.feedQueue.some(x => x.id === row.id)) return;
      if (row.author_id !== me && S.section === 'feed') { S.feedQueue.push(row); return updateNewPill(); }
      S.fposts.unshift(row); return softRender();
    }
    if (ev === 'DELETE') {
      S.feedQueue = S.feedQueue.filter(x => x.id !== old.id); updateNewPill();
      if (!S.fposts.some(x => x.id === old.id)) return;
      dropTargetLocal('feed_post', old.id);
      const el = $(`[data-fpost="${old.id}"]`); if (el) el.remove();
      if (S.section !== 'feed') softRender();
      return;
    }
    if (ev === 'UPDATE') { // alguien ha editado su publicación: se cambia en su sitio
      const q = S.feedQueue.find(x => x.id === row.id); if (q) Object.assign(q, row);
      const p = S.fposts.find(x => x.id === row.id); if (!p) return;
      Object.assign(p, row);
      const el = $(`[data-fpost="${row.id}"]`); if (el) el.outerHTML = feedCard(p);
      return;
    }
    return;
  }
  if (t === 'feed_comments' || t === 'listening_comments') {
    const kind = t === 'feed_comments' ? 'feed' : 'listening', c = CM[kind];
    if (ev === 'INSERT') { if (addUnique(cmList(kind), row, t)) updateComments(kind, row[c.key]); return; }
    if (ev === 'DELETE') {
      const x = cmList(kind).find(y => y.id === old.id); if (!x) return;
      dropTargetLocal(c.type, old.id); updateComments(kind, x[c.key]); return;
    }
    return;
  }
  if (t === 'reactions') {
    if (ev === 'INSERT') { if (addUnique(S.reactions, row, t)) updateRx(row.target_type, row.target_id); return; }
    if (ev === 'DELETE') {
      const k = rowKey(t, old), x = S.reactions.find(r => rowKey(t, r) === k); if (!x) return;
      S.reactions = S.reactions.filter(r => r !== x); updateRx(x.target_type, x.target_id); return;
    }
    return;
  }
  if (t === 'listening_answer_reactions') { // reacciones del profe a las respuestas: una por respuesta
    const k = r => r.assignment_id + '|' + r.question + '|' + r.user_id, src = ev === 'DELETE' ? old : row, key = k(src);
    S.ansRx = S.ansRx.filter(r => k(r) !== key);
    if (ev !== 'DELETE') S.ansRx.push(row);
    return updateAnsRx(src.assignment_id, src.question);
  }
  if (t === 'dm_reactions') { // una por persona y mensaje
    const k = r => r.message_id + ':' + r.user_id, key = k(ev === 'DELETE' ? old : row);
    S.dmRx = S.dmRx.filter(r => k(r) !== key);
    if (ev !== 'DELETE') S.dmRx.push(row);
    return updateThread();
  }
  if (t === 'dm_messages') {
    if (ev === 'DELETE') {
      if (!S.dms.some(m => m.id === old.id)) return;
      S.dms = S.dms.filter(m => m.id !== old.id); updateThread(); refreshChrome(); return;
    }
    if (ev === 'UPDATE') { // "visto"
      const m = S.dms.find(x => x.id === row.id); if (!m) return;
      Object.assign(m, row); updateThread(); refreshChrome(); return;
    }
    if (!addUnique(S.dms, row, t)) return;
    const from = dmPartner(row);
    if (!S.dir[from]) await loadDirectory();
    const viewing = S.section === 'messages' && S.dmWith === from && !document.hidden;
    if (viewing) { updateThread(); if (row.recipient_id === me) await markDmRead(from); }
    if (S.section === 'messages' && !uiBusy()) { softRender(); scrollThread(); } else { refreshChrome(); updateDmList(); }
    return;
  }
  if (t === 'notifications') {
    if (ev === 'DELETE') S.notifs = S.notifs.filter(n => n.id !== old.id);
    else {
      const isNew = !S.notifs.some(n => n.id === row.id);
      S.notifs = rtApply(S.notifs, t, ev, row, old);
      const inOpenChat = row.kind === 'dm' && S.section === 'messages' && S.dmWith === row.actor_id && !document.hidden;
      if (ev === 'INSERT' && isNew && inOpenChat) await markNotifsRead([row.id]); // ya lo estás leyendo
      // Aviso discreto de lo nuevo (salvo un mensaje de la conversación que ya tienes abierta)
      if (ev === 'INSERT' && isNew && !inOpenChat) {
        if (row.actor_id && !S.dir[row.actor_id]) await loadDirectory();
        toast(notifText(row).replace(/<[^>]+>/g, ''));
      }
    }
    return refreshChrome();
  }
  if (t === 'profiles') {
    if (row.id === me || old.id === me) {
      if (ev === 'DELETE') return;
      const permsChanged = row.family_dm_ok !== undefined && row.family_dm_ok !== S.profile.family_dm_ok;
      S.profile = { ...S.profile, ...row };
      if (!S.profile.approved) { rtStop(); return route(); } // le han retirado el acceso
      if (permsChanged) await refreshDmContacts(); // el profe ha cambiado su permiso de mensajes
    }
    if (teacher) {
      const { avatar_src, avatar_crop, avatar_lg, ...lite } = row; // las copias grandes de la foto no hacen falta en la lista
      if (ev === 'DELETE') S.students = S.students.filter(s => s.id !== old.id);
      else if (row.role === 'student') S.students = rtApply(S.students, t, ev, lite, old);
    }
    await loadDirectory(); // nombres, apodos y fotos
    return softRender();
  }
  if (!teacher) { // casos del alumno en los que el aviso en directo no trae todo lo necesario
    if (t === 'board_recipients') { // te han incluido en (o quitado de) un aviso dirigido
      if (ev === 'INSERT' && row.student_id === me) {
        const { data } = await sb.from('board_posts').select('*').eq('id', row.post_id).maybeSingle();
        if (data) S.posts = rtApply(S.posts, 'board_posts', 'INSERT', data);
      } else if (ev === 'DELETE' && old.student_id === me) {
        const { data } = await sb.from('board_posts').select('id').eq('id', old.post_id).maybeSingle();
        if (!data) S.posts = S.posts.filter(x => x.id !== old.post_id);
      } else return;
      return softRender();
    }
    if (t === 'listening_assignments') { // la escucha llega sin su elemento: lo pedimos
      if (ev === 'DELETE') { S.assigns = S.assigns.filter(a => a.id !== old.id); return softRender(); }
      if (row.student_id !== me) return;
      const ex = S.assigns.find(a => a.id === row.id);
      if (ex) { Object.assign(ex, row); updateAnsRead(row.id); }
      else {
        const { data } = await sb.from('listening_assignments').select('*, item:listening_items(*)').eq('id', row.id).maybeSingle();
        if (data && data.item) { S.assigns.push(data); try { await loadLibrary(); } catch { } } // su carpeta y sus géneros
      }
      return softRender();
    }
    if (t === 'listening_items') {
      if (ev === 'UPDATE') S.assigns.forEach(a => { if (a.item_id === row.id) a.item = { ...a.item, ...row }; });
      if (ev === 'DELETE') S.assigns = S.assigns.filter(a => a.item_id !== old.id);
      return softRender();
    }
    if (t === 'board_posts' && ev === 'DELETE') { S.posts = S.posts.filter(x => x.id !== old.id); return softRender(); }
  }
  if (t === 'moderation_reports' && teacher && ev === 'INSERT' && row.target_type === 'dm_message' && !S.dms.some(m => m.id === row.target_id)) {
    // denuncia de un mensaje privado: ahora el profesor puede leer ESE mensaje (y solo ese)
    const { data } = await sb.from('dm_messages').select('*').eq('id', row.target_id).maybeSingle();
    if (data) addUnique(S.dms, data, 'dm_messages');
  }
  const key = RT_LIST[t]; if (!key) return;
  S[key] = rtApply(S[key], t, ev, row, old);
  if (t === 'listening_assignments' && ev === 'UPDATE') updateAnsRead(row.id);
  softRender();
  if (t === 'goals_done' && ev === 'INSERT' && !teacher) goalsCelebrate(); // ¡logro nuevo!
}

/* ---- Botón "Atrás" (lateral del ratón, móvil o navegador) ----
   Cada sección y cada ventana abierta es una entrada del historial: "Atrás" cierra la ventana
   o vuelve a la sección anterior, sin salir de la app. */
// histSkip: "atrás" internos pendientes (al cerrar una ventana). Mientras haya alguno, lo nuevo espera.
let histSkip = 0, histModalPending = false, histRestoring = false;
const histState = () => ({ app: 1, s: S.section, dm: S.section === 'messages' ? (S.dmWith || null) : null });
function histSync() { // la llama render(): si cambió la sección, añade una entrada
  if (histRestoring || !S.profile || histSkip) return; // con un "atrás" pendiente, se sincroniza al terminar
  const st = history.state || {}, want = histState();
  if (st.modal) return;
  if (!st.app) { history.replaceState(want, ''); return; }
  if (st.s === want.s && (st.dm || null) === want.dm) return;
  history.pushState(want, '');
}
window.addEventListener('popstate', async e => {
  if (histSkip) { // es el "atrás" que hicimos nosotros al cerrar una ventana
    if (--histSkip === 0) {
      histSync(); // la sección a la que se fue mientras tanto
      if (histModalPending && $('#modalRoot').firstChild) history.pushState({ ...histState(), modal: 1 }, '');
      histModalPending = false;
    }
    return;
  }
  if (popHist) { dmRxClose(false, true); emojiClose(false, true); popHist = false; return; } // burbuja de reacciones, menú o selector
  if (lbClose(true)) return; // primero se cierra la foto ampliada
  if ($('#modalRoot').firstChild) { await closeModal(true); return; }
  const st = e.state || {};
  if (!S.profile || !st.app) return;
  histRestoring = true;
  S.section = st.s || 'feed'; S.dmWith = st.dm || null;
  render(); window.scrollTo(0, 0);
  histRestoring = false;
});

/* ---------------- Visor de la foto de perfil (pantalla completa) ----------------
   Se abre al pulsar la foto en un perfil. Enseña al momento la foto normal y la cambia
   por la grande (get_avatar_large) en cuanto llega. Va por encima de la ventana abierta:
   "Atrás", Esc, la X o un toque en cualquier sitio lo cierran sin cerrar la ventana. */
const lgCache = {}; // id -> { small, lg }: si cambia la foto normal, se vuelve a pedir
function zoomableAvatar(id, size) {
  return safeAvatar((S.dir[id] || {}).avatar)
    ? `<button type="button" class="av-zoom" data-action="avatar-zoom" data-id="${id}" title="Ver foto" aria-label="Ver la foto en grande">${avatarHtml(id, size)}</button>`
    : avatarHtml(id, size);
}
async function avatarZoom(id) {
  const small = (S.dir[id] || {}).avatar;
  if (!safeAvatar(small) || $('#lightbox')) return;
  const el = document.createElement('div');
  el.id = 'lightbox'; el.className = 'lightbox'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true');
  el.innerHTML = `<button class="x" aria-label="Cerrar">×</button><img src="${esc(small)}" alt="Foto de ${esc(whoName(id))}"><div class="lb-name">${esc(whoName(id))}</div>`;
  el.addEventListener('click', e => { e.stopPropagation(); lbClose(); });
  document.body.appendChild(el);
  history.pushState({ ...(history.state || {}), modal: 1, lb: 1 }, '');
  const c = lgCache[id];
  let lg = c && c.small === small ? c.lg : null;
  if (!lg) {
    const { data } = await sb.rpc('get_avatar_large', { p_id: id });
    lg = typeof data === 'string' && (safeAvatarLg(data) || safeAvatar(data)) ? data : small;
    lgCache[id] = { small, lg };
  }
  const img = el.querySelector('img'); if (img && el.isConnected && lg !== small) img.src = lg;
}
function lbClose(fromHistory = false) {
  const el = $('#lightbox'); if (!el) return false;
  el.remove();
  if (!fromHistory && history.state && history.state.lb) { histSkip++; history.back(); }
  return true;
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#lightbox')) { e.stopImmediatePropagation(); lbClose(); } }, true);

/* ------------------------------ Modal ------------------------------- */
function openModal(html, onClose) {
  if (!$('#modalRoot').firstChild && S.profile) { // para que "Atrás" la cierre
    if (histSkip) histModalPending = true; else history.pushState({ ...histState(), modal: 1 }, '');
  }
  $('#modalRoot').innerHTML = `<div class="backdrop" data-action="backdrop"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  document.body.classList.add('noscroll');
  modalOnClose = onClose || null;
}
async function closeModal(fromHistory = false) {
  const wasOpen = !!$('#modalRoot').firstChild;
  if (modalOnClose) { const f = modalOnClose; modalOnClose = null; await f(); }
  $('#modalRoot').innerHTML = '';
  document.body.classList.remove('noscroll');
  itemReturn = null; // cerrar del todo olvida el "volver a la ficha"
  // Cerrada con la ✕, Esc o al pulsar fuera: quitamos su entrada del historial
  if (wasOpen && !fromHistory && history.state && history.state.modal) { histSkip++; history.back(); }
  if (uiStale) softRender(); // aplica lo que llegó en directo mientras la ventana estaba abierta
  if (S.goalPending) setTimeout(goalsCelebrate, 300); // celebración que esperaba a que se cerrara la ventana

async function route() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { S.user = null; S.profile = null; return viewAuth(); }
  S.user = session.user;
  const { data: prof, error } = await sb.from('profiles').select('*').eq('id', S.user.id).maybeSingle();
  if (error) return viewFatal('No se pudo leer tu perfil: ' + errEs(error));
  if (!prof) return viewFatal('No existe tu perfil. ¿Se ejecutó el SQL de supabase.sql antes de crear la cuenta?');
  S.profile = prof;
  if (!prof.approved) return prof.archived_at ? viewArchived() : viewPending();
  $('#app').innerHTML = '<div class="loading">Cargando…</div>';
  const ok = await loadData();
  if (ok) {
    render(); rtStart(); backfillThumbs(); avatarLgBackfill();
    setTimeout(goalsCelebrate, 700); // logros nuevos que aún no ha visto
    const fromNotif = new URLSearchParams(location.search).has('n');
    pushInit().catch(e => console.warn('Push:', e)).finally(() => installCheck(fromNotif).catch(e => console.warn('Instalar:', e)));
    if (fromNotif) { // llegamos desde un aviso del móvil
      const url = location.href;
      history.replaceState(history.state, '', location.pathname); // limpia ?n= de la barra
      openNotifFromUrl(url);
    }
  }
}

// quiet = true: resincronización en segundo plano (si falla, no muestra la pantalla de error)
async function loadData(quiet = false) {
  try {
    const me = S.user.id;
    const common = [
      sb.from('feed_posts').select('*').order('created_at', { ascending: false }).limit(100),
      sb.from('feed_comments').select('*'),
      sb.from('listening_comments').select('*'),
      sb.from('reactions').select('*'),
      sb.rpc('get_directory')
    ];
    // Mensajes privados, bloqueos propios, contactos y notificaciones (iguales para profe y alumno)
    const extra = await Promise.all([
      sb.from('dm_messages').select('*').order('created_at', { ascending: true }).limit(1000),
      sb.from('user_blocks').select('*'),
      sb.rpc('get_dm_contacts'),
      sb.from('notifications').select('*').order('created_at', { ascending: false }).limit(60),
      sb.from('classmates').select('*'),
      sb.from('dm_reactions').select('*')
    ]);
    const exErr = extra.map(x => x.error).find(Boolean);
    if (exErr) throw exErr;
    S.dms = extra[0].data || []; S.blocks = extra[1].data || []; S.notifs = extra[3].data || []; S.mates = extra[4].data || []; S.dmRx = extra[5].data || [];
    S.dmContacts = (extra[2].data || []).map(x => typeof x === 'string' ? x : x.get_dm_contacts || x.id);
    S.dmCan = {}; S.dmContacts.forEach(id => { S.dmCan[id] = true; });
    if (S.profile.role === 'teacher') {
      const [i, a, p, bp, br, bd, rp, hw, pp, pr, fp, fc, lc, rx, dr] = await Promise.all([
        sb.from('listening_items').select('*').order('created_at', { ascending: false }),
        sb.from('listening_assignments').select('*'),
        // sin avatar_src (la copia grande de la foto): no hace falta y pesa. Al añadir campos al perfil, añádelos aquí.
        sb.from('profiles').select('id, display_name, nickname, avatar, email, role, approved, archived_at, created_at, birth_date, family_dm_ok, app_installed_at').eq('role', 'student').order('display_name'),
        sb.from('board_posts').select('*'),
        sb.from('board_recipients').select('*'),
        sb.from('board_reads').select('*'),
        sb.from('moderation_reports').select('*'),
        sb.from('homework_tasks').select('*').order('created_at', { ascending: false }).limit(2000),
        sb.from('payments_plans').select('*'),
        sb.from('payments_records').select('*').order('period', { ascending: false }).limit(3000),
        ...common
      ]);
      const err = [i, a, p, bp, br, bd, rp, hw, pp, pr, fp, fc, lc, rx, dr].map(x => x.error).find(Boolean);
      if (err) throw err;
      S.items = i.data; S.assigns = a.data; S.students = p.data;
      S.posts = bp.data; S.recipients = br.data; S.reads = bd.data; S.reports = rp.data;
      S.homework = hw.data || []; S.payPlans = pp.data || []; S.payRecords = pr.data || [];
      S.fposts = fp.data; S.fcomments = fc.data; S.lcomments = lc.data; S.reactions = rx.data;
      S.dir = {}; (dr.data || []).forEach(d => { S.dir[d.id] = d; });
    } else {
      const [a, bp, bd, rp, hw, fp, fc, lc, rx, dr] = await Promise.all([
        sb.from('listening_assignments').select('*, item:listening_items(*)').eq('student_id', me),
        sb.from('board_posts').select('*'),
        sb.from('board_reads').select('*').eq('student_id', me),
        sb.from('moderation_reports').select('*').eq('reporter_id', me),
        sb.from('homework_tasks').select('*').eq('student_id', me).order('created_at', { ascending: false }).limit(500),
        ...common
      ]);
      const err = [a, bp, bd, rp, hw, fp, fc, lc, rx, dr].map(x => x.error).find(Boolean);
      if (err) throw err;
      S.assigns = (a.data || []).filter(x => x.item);
      S.posts = bp.data; S.reads = bd.data; S.reports = rp.data; S.homework = hw.data || [];
      S.fposts = fp.data; S.fcomments = fc.data; S.lcomments = lc.data; S.reactions = rx.data;
      S.dir = {}; (dr.data || []).forEach(d => { S.dir[d.id] = d; });
    }
    // La Agenda no debe tumbar la app si su parte de la base de datos aún no existe o falla
    try { await loadLessons(); } catch (e) { console.warn('Agenda:', e.message || e); S.lessons = []; }
    try { const { data, error } = await sb.from('listening_answer_reactions').select('*'); if (error) throw error; S.ansRx = data || []; }
    catch (e) { console.warn('Reacciones a respuestas:', e.message || e); S.ansRx = []; }
    try { await loadLibrary(); } catch (e) { console.warn('Carpetas y géneros:', e.message || e); S.folders = []; S.genres = []; S.itemGenres = []; }
    try { await loadGoals(); } catch (e) { console.warn('Objetivos:', e.message || e); S.goalStages = []; S.goalItems = []; S.goalDone = []; }
    return true;
  } catch (e) {
    const m = String(e.message || e);
    if (quiet) { console.warn('Resincronización fallida:', m); return false; }
    viewFatal(/board_|feed_|reactions|moderation_|get_directory|listening_comments|dm_|notifications|user_blocks|classmates|homework_|payments_|lessons|relation|schema cache|function/i.test(m)
      ? 'Falta ejecutar la última versión de supabase.sql en el SQL Editor de Supabase. (' + m + ')'
      : 'Error cargando los datos: ' + m);
    return false;
  }
}

/* ---------- Navegación: menú lateral (escritorio) y barra inferior (móvil) ---------- */
const ic = (name, cls = 'i') => `<svg class="${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
function sections() {
  const t = isTeacher();
  const pending = t ? S.students.filter(isPending).length : 0;
  const unread = t ? 0 : unreadCount();
  const reps = t ? S.reports.filter(r => !r.resolved).length : 0;
  // Cada módulo nuevo (Pagos, Deberes semanales, Chat…) se añade aquí como una sección más.

// Primer enlace de un texto (con o sin https://), normalizado; null si no hay o no es válido
function firstLink(text) {
  const m = String(text).match(/https?:\/\/[^\s<]+|\b(?:www\.|open\.spotify\.com\/|spotify\.link\/|youtu\.be\/|(?:m\.|music\.)?youtube\.com\/)[^\s<]*/i);
  if (!m) return null;
  let u = m[0].replace(/[.,;:!?)\]]+$/, '');
  if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
  try { return u.length <= 500 ? new URL(u).href : null; } catch { return null; }
}

// Alumno: un aviso cuenta como leído cuando ha estado en pantalla.
// La etiqueta "Nuevo" se mantiene mientras siga en Avisos (postSeenNow) y se quita al volver.
let postSeenObs = null;
const postSeenNow = new Set();
function watchPostReads() {
  if (postSeenObs) { postSeenObs.disconnect(); postSeenObs = null; }
  if (S.section !== 'board') postSeenNow.clear();
  if (S.section !== 'board' || isTeacher() || !('IntersectionObserver' in window)) return;
  const cards = $$('.card.post.isnew[data-post]');
  if (!cards.length) return;
  // Cuenta como leído si se ve el 60 % del aviso o, si es más alto que la pantalla
  // (avisos largos en el móvil), si ocupa al menos la mitad de la pantalla.
  postSeenObs = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      const vh = (e.rootBounds && e.rootBounds.height) || window.innerHeight;
      const need = Math.min(e.boundingClientRect.height * 0.6, vh * 0.5);
      if (e.intersectionRect.height < need) return;
      postSeenObs.unobserve(e.target);
      postSeenNow.add(e.target.dataset.post);
      markRead(e.target.dataset.post).then(refreshChrome);
    });
  }, { threshold: Array.from({ length: 21 }, (_, i) => i / 20) });
  cards.forEach(c => postSeenObs.observe(c));
}

/* ---- Foto de perfil: encuadre (arrastrar para mover, deslizador o rueda para ampliar) ---- */
/* Se guardan dos cosas: la foto final de 160×160 (la que ve el grupo, columna avatar) y, solo para
   ti y el profesor, una copia reducida de la original (avatar_src) con la posición del encuadre
   (avatar_crop), para poder reencuadrar sin volver a subirla. */
let crop = null; // { img, src, zoom, cx, cy } · cx/cy = punto de la imagen que queda en el centro del círculo
const CROP_VIEW = 260; // tamaño en pantalla del recuadro de encuadre
const SRC_MAX = 640;   // lado máximo de la copia de la original
const loadImg = src => new Promise(res => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; });
async function processAvatar(file) {
  if (!file || !/^image\//.test(file.type)) return toast('Elige una imagen', 'bad');
  const url = URL.createObjectURL(file);
  const raw = await loadImg(url);
  URL.revokeObjectURL(url);
  if (!raw || !raw.naturalWidth) return toast('No se pudo leer esa imagen. Prueba con JPG o PNG', 'bad');
  // copia reducida de la original (se guarda para poder reencuadrar más tarde)
  const k = Math.min(1, SRC_MAX / Math.max(raw.naturalWidth, raw.naturalHeight));
  const c = document.createElement('canvas');
  c.width = Math.round(raw.naturalWidth * k); c.height = Math.round(raw.naturalHeight * k);
  const cx = c.getContext('2d'); cx.fillStyle = '#0b1530'; cx.fillRect(0, 0, c.width, c.height);
  cx.imageSmoothingQuality = 'high'; cx.drawImage(raw, 0, 0, c.width, c.height);
  let src = c.toDataURL('image/jpeg', 0.82);
  if (src.length > 115000) src = c.toDataURL('image/jpeg', 0.62);
  if (src.length > 120000) src = null; // demasiado pesada: se podrá encuadrar ahora, pero no reencuadrar luego
  openCrop(src ? await loadImg(src) : raw, src, null);
}
async function editAvatar() {
  const p = S.profile;
  const img = p.avatar_src ? await loadImg(p.avatar_src) : null;
  if (!img) return toast('No hay foto original guardada. Vuelve a elegirla', 'bad');
  openCrop(img, p.avatar_src, p.avatar_crop);
}
function openCrop(img, src, saved) {
  const w = img.naturalWidth, h = img.naturalHeight;
  crop = { img, src, zoom: 1, cx: w / 2, cy: h / 2 };
  if (saved && typeof saved === 'object') {
    crop.zoom = Math.min(4, Math.max(1, +saved.zoom || 1));
    crop.cx = (+saved.x || 0.5) * w; crop.cy = (+saved.y || 0.5) * h;
    cropClamp();
  }
  openModal(`
    <div class="modal-head"><h2>Encuadra tu foto</h2><button class="x" data-action="close" aria-label="Cerrar">×</button></div>
    <div class="crop">
      <div class="crop-stage" id="cropStage"><canvas id="cropCanvas" width="${CROP_VIEW * 2}" height="${CROP_VIEW * 2}"></canvas></div>
      <label class="crop-zoom">${ic('zoom-out')}<input type="range" id="cropZoom" min="1" max="4" step="0.01" value="${crop.zoom}" aria-label="Ampliar">${ic('zoom-in')}</label>
      <p class="sub center" style="margin:0">Arrastra la foto para moverla y usa el deslizador para ampliarla. Lo que quede dentro del círculo es lo que verá el grupo.</p>
      <div class="actions" style="justify-content:center"><button class="btn primary" data-action="avatar-save">Guardar foto</button><button class="btn ghost" data-action="close">Cancelar</button></div>
    </div>`, async () => { crop = null; });
  $('.modal').classList.add('narrow');
  cropBind();
  cropDraw();
}
// Escala base: la imagen cubre justo el círculo (lado corto = recuadro). zoom multiplica esa escala.
const cropScale = (view) => (view / Math.min(crop.img.naturalWidth, crop.img.naturalHeight)) * crop.zoom;
function cropClamp() { // que nunca quede hueco vacío dentro del recuadro
  const half = (CROP_VIEW / 2) / cropScale(CROP_VIEW);
  const w = crop.img.naturalWidth, h = crop.img.naturalHeight;
  crop.cx = Math.min(Math.max(crop.cx, half), w - half);
  crop.cy = Math.min(Math.max(crop.cy, half), h - half);
}
// Pinta el encuadre st = { img, zoom, cx, cy } en un lienzo cuadrado de lado view
function paintCropped(ctx, view, bg, st) {
  const s = (view / Math.min(st.img.naturalWidth, st.img.naturalHeight)) * st.zoom;
  ctx.fillStyle = bg; ctx.fillRect(0, 0, view, view);
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(st.img, view / 2 - st.cx * s, view / 2 - st.cy * s, st.img.naturalWidth * s, st.img.naturalHeight * s);
}
function cropPaint(ctx, view, bg) { paintCropped(ctx, view, bg, crop); }
// JPEG cuadrado del encuadre: baja la calidad hasta que quepa en max caracteres (null si no cabe)
function cropJpeg(st, N, max, qs = [0.85, 0.72, 0.6, 0.5]) {
  const c = document.createElement('canvas'); c.width = c.height = N;
  paintCropped(c.getContext('2d'), N, '#0b1530', st);
  for (const q of qs) { const d = c.toDataURL('image/jpeg', q); if (d.length <= max) return d; }
  return null;
}
const AVATAR_LG = 640; // lado de la foto en grande (avatar_lg), la que se ve al ampliar en un perfil
/* Fotos subidas antes de existir avatar_lg: se generan a partir de la original y su encuadre.
   Cada cual la suya y el profesor las de todos (él puede leer avatar_src). Una vez por sesión. */
let avatarLgDone = false;
async function avatarLgBackfill() {
  if (avatarLgDone) return; avatarLgDone = true;
  try {
    let q = sb.from('profiles').select('id, avatar, avatar_src, avatar_crop').is('avatar_lg', null);
    if (!isTeacher()) q = q.eq('id', S.user.id);
    const { data, error } = await q; if (error) return;
    for (const p of data || []) {
      if (!safeAvatar(p.avatar) || !p.avatar_src || !p.avatar_crop) continue;
      const img = await loadImg(p.avatar_src); if (!img || !img.naturalWidth) continue;
      const w = img.naturalWidth, h = img.naturalHeight, c = p.avatar_crop;
      const st = { img, zoom: Math.min(4, Math.max(1, +c.zoom || 1)), cx: (+c.x || 0.5) * w, cy: (+c.y || 0.5) * h };
      const lg = cropJpeg(st, AVATAR_LG, 150000); if (!lg) continue;
      await sb.from('profiles').update({ avatar_lg: lg }).eq('id', p.id).is('avatar_lg', null);
    }
  } catch (e) { console.warn('Foto grande:', e); }
}
function cropDraw() {
  const c = $('#cropCanvas'); if (!c || !crop) return;
  const ctx = c.getContext('2d');
  ctx.setTransform(2, 0, 0, 2, 0, 0); // canvas a doble resolución para que se vea nítido
  cropPaint(ctx, CROP_VIEW, '#000');
}
function cropBind() {
  const st = $('#cropStage'), zr = $('#cropZoom');
  let drag = null;
  const ratio = () => CROP_VIEW / st.getBoundingClientRect().width; // por si el recuadro se encoge en móvil
  st.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY }; st.setPointerCapture(e.pointerId); });
  st.addEventListener('pointermove', e => {
    if (!drag || !crop) return;
    const s = cropScale(CROP_VIEW), r = ratio();
    crop.cx -= (e.clientX - drag.x) * r / s; crop.cy -= (e.clientY - drag.y) * r / s;
    drag = { x: e.clientX, y: e.clientY };
    cropClamp(); cropDraw();
  });
  const end = () => { drag = null; };
  st.addEventListener('pointerup', end); st.addEventListener('pointercancel', end);
  zr.addEventListener('input', () => { if (!crop) return; crop.zoom = +zr.value; cropClamp(); cropDraw(); });
  st.addEventListener('wheel', e => {
    if (!crop) return; e.preventDefault();
    crop.zoom = Math.min(4, Math.max(1, crop.zoom * (e.deltaY < 0 ? 1.08 : 1 / 1.08)));
    zr.value = crop.zoom; cropClamp(); cropDraw();
  }, { passive: false });
}
async function cropSave() {
  if (!crop) return;
  const data = cropJpeg(crop, 160, 40000, [0.85, 0.6]);
  if (!data) return toast('La imagen es demasiado pesada', 'bad');
  const w = crop.img.naturalWidth, h = crop.img.naturalHeight;
  const fields = { avatar: data, avatar_lg: cropJpeg(crop, AVATAR_LG, 150000), avatar_src: crop.src || null,
    avatar_crop: crop.src ? { x: +(crop.cx / w).toFixed(4), y: +(crop.cy / h).toFixed(4), zoom: +crop.zoom.toFixed(3) } : null };
  await closeModal();
  await saveProfileFields(fields, 'Foto actualizada');
}

/* ============================== ALUMNO ============================== */
/* ---- Portadas: Spotify (oEmbed público, sin claves) y YouTube (miniatura por id de vídeo) ---- */
const THUMB_OK = /^https:\/\/(i\.scdn\.co|image-cdn-[a-z0-9-]+\.spotifycdn\.com|mosaic\.scdn\.co|i\.ytimg\.com)\//;
const safeThumb = u => typeof u === 'string' && u.length <= 300 && THUMB_OK.test(u) ? u : null;
function ytId(url) {
  const m = String(url).match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/))([A-Za-z0-9_-]{11})/);
  return m ? m[1] : null;
}
const linkService = url => /spotify\.com/i.test(url) ? 'sp' : /youtu\.?be/i.test(url) ? 'yt' : '';
// Título y portada de un enlace de Spotify o YouTube (oEmbed público, sin claves). { title, thumb, artist } o nulos.
// artist solo en YouTube (nombre del canal, sin "VEVO", " - Topic", "Official"…); el de Spotify lo da media-info.
const metaCache = {};
async function fetchMeta(url) {
  if (typeof window.__META_STUB === 'function') return window.__META_STUB(url); // pruebas: respuesta simulada
  if (CFG.NO_EXTERNAL) return { title: null, thumb: null, artist: null }; // pruebas: sin llamadas a internet
  if (metaCache[url]) return metaCache[url];
  const yt = /youtu\.?be/i.test(url), sp = /open\.spotify\.com\//i.test(url);
  if (!yt && !sp) return { title: null, thumb: null, artist: null };
  const api = sp ? 'https://open.spotify.com/oembed?url=' + encodeURIComponent(url.split('?')[0])
    : 'https://www.youtube.com/oembed?format=json&url=' + encodeURIComponent(url);
  let title = null, thumb = null, artist = null;
  try {
    const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 5000);
    const r = await fetch(api, { signal: ctl.signal });
    clearTimeout(tm);
    if (r.ok) { const j = await r.json(); title = (j.title || '').trim().slice(0, 200) || null; thumb = safeThumb(j.thumbnail_url); if (yt) artist = ytArtist(j.author_name); }
  } catch { /* sin conexión o enlace privado */ }
  if (!thumb && ytId(url)) thumb = `https://i.ytimg.com/vi/${ytId(url)}/mqdefault.jpg`;
  return (metaCache[url] = { title, thumb, artist });
}
const fetchThumb = async url => (await fetchMeta(url)).thumb;
const ytArtist = n => String(n || '').replace(/\s*-\s*Topic$/i, '').replace(/VEVO$/i, '').replace(/\s+(official|oficial)(\s+(channel|youtube|music))?$/i, '').trim().slice(0, 200) || null;
// Artista de un enlace: YouTube → canal (oEmbed); Spotify → media-info ("" = playlist de muchos artistas). null = no se sabe.
async function fetchArtist(url) {
  const sv = linkService(url);
  if (sv === 'yt') return (await fetchMeta(url)).artist ?? null;
  if (sv === 'sp') return (await fetchDuration(url)).artist ?? null;
  return null;
}
// Tipo según la dirección: Spotify /album/ /track/ /playlist/ · YouTube con "list=" → playlist; otro vídeo → canción
function guessKind(url) {
  if (/spotify\.com\/(intl-[a-z]+\/)?album\//i.test(url)) return 'album';
  if (/spotify\.com\/(intl-[a-z]+\/)?track\//i.test(url)) return 'song';
  if (/spotify\.com\/(intl-[a-z]+\/)?playlist\//i.test(url) || /youtu.*[?&]list=/i.test(url)) return 'playlist';
  if (ytId(url)) return 'song';
  return null;
}
// Profesor: rellena en segundo plano las portadas que falten (elementos creados antes de esta función)
const durTried = new Set();
async function backfillThumbs() {
  if (!isTeacher() || CFG.NO_EXTERNAL) return;
  for (const it of S.items.filter(i => !i.thumb_url).slice(0, 30)) {
    const th = await fetchThumb(it.url);
    if (!th) continue;
    const { error } = await sb.from('listening_items').update({ thumb_url: th }).eq('id', it.id);
    if (!error) { it.thumb_url = th; S.assigns.forEach(a => { if (a.item && a.item.id === it.id) a.item.thumb_url = th; }); }
  }
  // Duraciones que falten (una vez por sesión: si un enlace no la da, no se insiste)
  for (const it of S.items.filter(i => !i.duration_sec && !durTried.has(i.id)).slice(0, 30)) {
    durTried.add(it.id);
    await new Promise(ok => setTimeout(ok, 600)); // de una en una y sin prisa: Spotify corta si le pides muchas seguidas
    const d = await fetchDuration(it.url);
    if (!d.duration_sec) continue;
    const row = { duration_sec: d.duration_sec, track_count: d.track_count, duration_partial: d.partial };
    const { error } = await sb.from('listening_items').update(row).eq('id', it.id);
    if (!error) { Object.assign(it, row); S.assigns.forEach(a => { if (a.item && a.item.id === it.id) Object.assign(a.item, row); }); }
  }
  // Artistas que falten (null = sin buscar; "" = ya se buscó y no hay uno solo). Una vez por sesión.
  for (const it of S.items.filter(i => i.artist == null && !artistTried.has(i.id)).slice(0, 40)) {
    artistTried.add(it.id);
    if (linkService(it.url) === 'sp') await new Promise(ok => setTimeout(ok, 600));
    const artist = await fetchArtist(it.url);
    if (artist == null) continue;
    const { error } = await sb.from('listening_items').update({ artist }).eq('id', it.id);
    if (!error) { it.artist = artist; S.assigns.forEach(a => { if (a.item && a.item.id === it.id) a.item.artist = artist; }); }
  }
  if (S.section === 'listening') softRender();
}
const artistTried = new Set();

function coverHtml(it, size = 48) {

// Duración: canción "3:33"; álbum/playlist "12 temas · 42 min" o "1 h 12 min". "+" = solo se sumaron los primeros 100 temas
function fmtSecs(sec, exact) {
  sec = Math.round(sec);
  if (exact) { const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = String(sec % 60).padStart(2, '0');
    return h ? `${h}:${String(m).padStart(2, '0')}:${s}` : `${m}:${s}`; }
  const mins = Math.max(1, Math.round(sec / 60)), h = Math.floor(mins / 60), m = mins % 60;
  return h ? (m ? `${h} h ${m} min` : `${h} h`) : `${mins} min`;
}
function durText(it) {
  const sec = Number(it.duration_sec) || 0, n = Number(it.track_count) || 0;
  if (!sec && !n) return '';
  const part = !!it.duration_partial;
  const d = sec ? fmtSecs(sec, it.kind === 'song' && !n) + (part ? '+' : '') : '';
  const t = n && it.kind !== 'song' ? `${n}${part && n === 100 ? '+' : ''} tema${n === 1 ? '' : 's'}` : '';
  return [t, d].filter(Boolean).join(' · ');
}
const durHtml = it => { const t = durText(it); return t ? `<span class="tdur">${esc(t)}</span>` : ''; };
// "3:33", "1:12:05", "42", "42 min", "1 h 12 min" → segundos. Vacío → null. No válido → NaN
function parseDur(v) {
  v = String(v || '').trim().toLowerCase();
  if (!v) return null;
  if (/^\d+(:\d{1,2}){1,2}$/.test(v)) return v.split(':').reduce((s, p) => s * 60 + Number(p), 0) || NaN;
  if (/^\d+$/.test(v)) return Number(v) * 60 || NaN;
  const m = v.match(/^(?:(\d+)\s*h)?\s*(?:(\d+)\s*(?:m|min|mins|minutos?)?)?$/);
  return m && (m[1] || m[2]) ? ((Number(m[1]) || 0) * 3600 + (Number(m[2]) || 0) * 60) || NaN : NaN;
}
// Duración con la Edge Function "media-info" (Spotify/YouTube no la dan al navegador). { duration_sec, track_count, partial }
const durCache = {};
async function fetchDuration(url) {
  const none = { duration_sec: null, track_count: null, partial: false, artist: null };
  if (typeof window.__DUR_STUB === 'function') return window.__DUR_STUB(url); // pruebas
  if (CFG.NO_EXTERNAL || !linkService(url)) return none;
  if (durCache[url]) return durCache[url];
  try {
    const { data, error } = await sb.functions.invoke('media-info', { body: { url } });
    if (error || !data) return none;
    const ok = x => Number.isInteger(x) && x > 0 ? x : null;
    return (durCache[url] = { duration_sec: ok(data.duration_sec), track_count: ok(data.track_count), partial: !!data.partial,
      artist: typeof data.artist === 'string' ? data.artist.trim().slice(0, 200) : null });
  } catch { return none; }
}

function buildCanvas(d) {
  const W = 1080, P = 56, maxW = W - 2 * P;
  const F = 'system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
  const c = document.createElement('canvas');
  const ctx = c.getContext('2d');
  const blocks = [
    { t: (KIND[d.kind] || d.kind).toUpperCase(), f: `600 20px ${F}`, col: '#a78bfa', lh: 28, gap: 0 },
    { t: d.title, f: `700 40px ${F}`, col: '#eceff6', lh: 50, gap: 6 },
    { t: `Alumno: ${d.name}`, f: `400 22px ${F}`, col: '#8990a3', lh: 30, gap: 10 },
    { t: d.url, f: `400 19px ${F}`, col: '#8990a3', lh: 26, gap: 2 }
  ];
  QUESTIONS.forEach((q, i) => {
    blocks.push({ t: `${i + 1}. ${q.q}`, f: `600 24px ${F}`, col: '#62d8ee', lh: 32, gap: 32 });
    blocks.push({ t: (d.answers[q.k] || '').trim() || '—', f: `400 24px ${F}`, col: '#d5d9e2', lh: 34, gap: 8 });
  });
  const wrap = (text, font) => {
    ctx.font = font;
    const out = [];
    text.split('\n').forEach(par => {
      if (!par.trim()) { out.push(''); return; }
      let line = '';
      par.split(/\s+/).forEach(w => {
        while (ctx.measureText(w).width > maxW) { // palabra más ancha que la línea (p. ej. una URL)
          let i = w.length;
          while (i > 1 && ctx.measureText(w.slice(0, i)).width > maxW) i--;
          if (line) { out.push(line); line = ''; }
          out.push(w.slice(0, i)); w = w.slice(i);
        }
        const test = line ? line + ' ' + w : w;
        if (ctx.measureText(test).width > maxW && line) { out.push(line); line = w; } else line = test;
      });
      out.push(line);
    });
    return out;
  };
  let y = P + 6;
  blocks.forEach(b => { b.lines = wrap(b.t, b.f); y += b.gap + b.lines.length * b.lh; });
  const H = y + P + 30;
  c.width = W; c.height = H;
  ctx.fillStyle = '#0b0d12'; ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.shadowColor = 'rgba(98,216,238,.55)'; ctx.shadowBlur = 14;
  ctx.fillStyle = '#62d8ee'; ctx.fillRect(P, 28, 90, 3);
  ctx.restore();
  ctx.textBaseline = 'top';
  y = P + 6;
  blocks.forEach(b => {
    y += b.gap; ctx.font = b.f; ctx.fillStyle = b.col;
    b.lines.forEach(l => { ctx.fillText(l, P, y); y += b.lh; });
  });
  ctx.font = `400 16px ${F}`; ctx.fillStyle = '#4b5366';
  ctx.fillText(APP_NAME, P, H - P + 6);
  return c;
}
const canvasBlob = c => new Promise(res => c.toBlob(res, 'image/png'));
function canShareFiles() {
  try { return !!(navigator.canShare && navigator.canShare({ files: [new File([''], 'a.png', { type: 'image/png' })] })); }
  catch { return false; }
}

/* ============================= PROFESOR ============================= */
/* ---- Biblioteca de Escucha analítica: carpetas (colecciones), géneros y artista ----
   S.folders: listening_folders (una carpeta por escucha, o ninguna). S.genres: listening_genres en dos niveles
   (género → subgénero, lista cerrada que solo cambia el profesor). S.itemGenres: listening_item_genres (varios por escucha).
   Filtrar por un género incluye sus subgéneros. Los alumnos ven las carpetas y géneros de sus escuchas. */
const NO_FOLDER = '__none'; // "Sin carpeta" en los filtros
const folderSort = (a, b) => (a.position - b.position) || a.name.localeCompare(b.name, 'es');
const genreSort = (a, b) => (a.position - b.position) || a.name.localeCompare(b.name, 'es');
const foldersSorted = () => S.folders.slice().sort(folderSort);
const folderName = id => (S.folders.find(f => f.id === id) || {}).name || '';
function genreTree() { // [{ g, subs: [...] }] en orden
  return S.genres.filter(g => !g.parent_id).sort(genreSort)
    .map(g => ({ g, subs: S.genres.filter(x => x.parent_id === g.id).sort(genreSort) }));
}
function genresOf(itemId) { // en el orden de la lista: géneros antes que sus subgéneros
  const mine = new Set(S.itemGenres.filter(x => x.item_id === itemId).map(x => x.genre_id));
  const out = [];
  genreTree().forEach(({ g, subs }) => { if (mine.has(g.id)) out.push(g); subs.forEach(s => { if (mine.has(s.id)) out.push(s); }); });
  return out;
}
function itemHasGenre(itemId, gid) {

}
// Lo que se busca: título, artista, carpeta y géneros (sin tildes)
const itemHay = it => amNorm([it.title, it.artist, folderName(it.folder_id), ...genresOf(it.id).map(g => g.name)].join(' · '));
const genreChips = itemId => genresOf(itemId).map(g => `<span class="gchip">${esc(g.name)}</span>`).join('');

const genreOptions = sel => genreTree().map(({ g, subs }) => `<option value="${g.id}" ${sel === g.id ? 'selected' : ''}>${esc(g.name)}</option>`
  + subs.map(s => `<option value="${s.id}" ${sel === s.id ? 'selected' : ''}>   ${esc(s.name)}</option>`).join('')).join('');
const folderOptions = (sel, none = 'Sin carpeta') => foldersSorted().map(f => `<option value="${f.id}" ${sel === f.id ? 'selected' : ''}>${esc(f.name)}</option>`).join('')

/* Catálogo del profesor: buscador + filtros (carpeta, género, tipo, alumno y su estado), agrupado por carpetas.
   S.cat guarda los filtros; al escribir o cambiar un filtro solo se repinta la lista (#catList), no el buscador. */
const CAT_STATUS_STUDENT = { '': 'Todas las suyas', pend: 'Pendientes', done: 'Escuchadas', over: 'Vencidas', none: 'Aún no la tiene' };
const CAT_STATUS_ALL = { '': 'Cualquier estado', unassigned: 'Sin asignar a nadie' };
function catState() { return S.cat || (S.cat = { q: '', folder: '', genre: '', kind: '', student: '', status: '' }); }
const catAssign = (itemId, sid) => S.assigns.find(a => a.item_id === itemId && a.student_id === sid);
function catFiltered() {
  const c = catState(), q = amNorm(c.q.trim());
  return S.items.filter(it => {
    if (q && !itemHay(it).includes(q)) return false;
    if (c.folder && (c.folder === NO_FOLDER ? !!folderName(it.folder_id) : it.folder_id !== c.folder)) return false;
    if (c.genre && !itemHasGenre(it.id, c.genre)) return false;
    if (c.kind && it.kind !== c.kind) return false;
    if (c.student) {
      const a = catAssign(it.id, c.student);
      if (c.status === 'none') return !a;
      if (!a) return false;
      if (c.status === 'pend') return !a.listened;
      if (c.status === 'done') return a.listened;
      if (c.status === 'over') return isOverdue(a);
      return true;
    }
    if (c.status === 'unassigned') return !S.assigns.some(a => a.item_id === it.id);
    return true;
  });
}
const catActive = () => { const c = catState(); return !!(c.q.trim() || c.folder || c.genre || c.kind || c.student || c.status); };
function catFiltersHtml() {
  const c = catState(), studs = S.students.filter(s => s.approved);
  const statuses = c.student ? CAT_STATUS_STUDENT : CAT_STATUS_ALL;
  const sel = (k, v, cur) => `<option value="${k}" ${cur === k ? 'selected' : ''}>${esc(v)}</option>`;
  return `<div class="catbar" id="catFilters">
    <input type="search" id="catQ" data-no-emoji autocomplete="off" placeholder="Buscar por título, artista, género o carpeta…" aria-label="Buscar en el catálogo" value="${esc(c.q)}">
    <select data-cat="folder" aria-label="Carpeta"><option value="">Todas las carpetas</option>${folderOptions(c.folder)}</select>
    <select data-cat="genre" aria-label="Género"><option value="">Todos los géneros</option>${genreOptions(c.genre)}</select>
    <select data-cat="kind" aria-label="Tipo"><option value="">Todos los tipos</option>${Object.entries(KIND).map(([k, v]) => sel(k, v, c.kind)).join('')}</select>
    <select data-cat="student" aria-label="Alumno"><option value="">Todos los alumnos</option>${studs.map(s => sel(s.id, s.display_name, c.student)).join('')}</select>
    <select data-cat="status" aria-label="Estado">${Object.entries(statuses).map(([k, v]) => sel(k, v, c.status)).join('')}</select>
    ${catActive() ? `<button type="button" class="linkbtn" data-action="cat-clear">Quitar filtros</button>` : ''}
  </div>`;
}
function catRow(it, i) {
  const sid = catState().student;
  const as = S.assigns.filter(a => a.item_id === it.id);
  let ans, due;
  if (sid) { // estado de ESE alumno
    const a = catAssign(it.id, sid), d = a && dueInfo(a);
    ans = a ? `<span class="chip ${a.listened ? 'ok' : isOverdue(a) ? 'bad' : ''}">${a.listened ? '✔ Escuchada' : isOverdue(a) ? 'Vencida' : '○ Pendiente'}</span>`
      : `<button type="button" class="btn sm" data-action="cat-assign" data-id="${it.id}" title="Asignársela a ${esc(studentName(sid))}">+ Asignar</button>`;
    due = a ? (a.due_date ? `<span class="${d.cls}">${esc(fmtDate(a.due_date))}</span>` : `${answeredCount(a)}/6 respuestas`) : '<span class="sub">No la tiene</span>';
  } else {
    const li = as.filter(a => a.listened).length, ov = as.filter(isOverdue).length, n = as.filter(a => answeredCount(a) > 0).length;
    ans = `<span title="${as.length} asignado${as.length === 1 ? '' : 's'} · ${li} escuchado${li === 1 ? '' : 's'} · ${n} con respuestas">${ic('students')} ${as.length} · ${ic('check')} ${li}</span>`;
    due = ov ? `<span class="chip bad">${ov} vencido${ov > 1 ? 's' : ''}</span>` : n ? `<span class="chip acc">${n} con respuestas</span>` : '—';
  }
  return `<article class="track" data-action="open-item" data-id="${it.id}">
    <span class="tnum">${i + 1}</span>
    ${coverHtml(it)}
    <div class="tmain"><b>${esc(it.title)}</b><span class="tsub">${kindIcon(it.kind)}${durHtml(it)}${artistHtml(it)}${genreChips(it.id)}</span>${sid ? `<span class="tstat-m">${ans}</span>` : ''}</div>
    <span class="tans">${ans}</span>
    <span class="tdue">${due}</span>
    ${playBtn(it.url)}
  </article>`;
}
function catalogList() {
  if (!S.items.length) return `<div class="empty">El catálogo está vacío. Crea tu primer elemento.</div>`;
  const list = catFiltered(), c = catState(), act = catActive();
  if (!list.length) return `<div class="empty">No hay escuchas con esos filtros.</div>`;
  const groups = [...foldersSorted().map(f => ({ id: f.id, name: f.name, items: list.filter(it => it.folder_id === f.id) })),
    { id: NO_FOLDER, name: S.folders.length ? 'Sin carpeta' : 'Todas', items: list.filter(it => !folderName(it.folder_id)) }]
    .filter(g => g.items.length);

  const head = `<div class="track-head"><span>#</span><span></span><span>Título</span><span>${c.student ? esc(studentName(c.student)) : 'Alumnos'}</span><span>${c.student ? 'Fecha' : 'Estado'}</span><span></span></div>`;

      <div class="tracklist teacher">${head}${g.items.map((it, i) => catRow(it, i)).join('')}</div></details>`).join('');
}

function answersHtml(a) {
  return QUESTIONS.map((q, i) => {
    const v = ((a.answers || {})[q.k] || '').trim();
    return `<div class="qblock"><div class="q">${i + 1}. ${esc(q.q)}</div><div class="ans-line"><div class="ans ${v ? '' : 'none'}">${v ? esc(v) : 'Sin respuesta'}</div>${v
      ? `<button type="button" class="ans-rxbtn" data-arx-open="${a.id}" data-q="${q.k}" title="Reaccionar a esta respuesta" aria-label="Reaccionar a esta respuesta">${EMOJI_ICON}</button>` : ''}</div>
      <span class="ans-rx" data-ansrx="${a.id}|${q.k}">${ansRxInner(a.id, q.k)}</span></div>`;
  }).join('') + `<div class="ans-read" data-ansread="${a.id}">${ansReadInner(a)}</div>`;
}
/* ---- Escucha analítica: reacciones del profesor a cada respuesta y marca de "leído" ----
   S.ansRx = filas de listening_answer_reactions (una por respuesta, cualquier emoji; solo las pone el profesor).
   listening_assignments.teacher_read_at = el profesor ha leído las respuestas (se quita sola si el alumno las cambia).
   Solo lo ven ese alumno y el profesor. La burbuja de emojis es la misma de los mensajes privados (#dmRxBox). */
const ansRxOf = (aid, qk) => S.ansRx.filter(r => r.assignment_id === aid && r.question === qk);
function ansRxInner(aid, qk) {
  const rows = ansRxOf(aid, qk); if (!rows.length) return '';
  const names = rows.map(r => `${r.user_id === S.user.id ? 'Tú' : whoName(r.user_id)} ${r.emoji}`).join(' · ');
  const emojis = rows.map(r => esc(r.emoji)).join('');
  return isTeacher()
    ? `<button type="button" class="msg-rx" data-arx-open="${aid}" data-q="${qk}" title="${esc(names)} — pulsa para cambiarla o quitarla">${emojis}</button>`
    : `<span class="msg-rx static" title="${esc('Reacción de ' + names)}">${emojis}</span>`;
}
function ansReadInner(a) {
  const n = answeredCount(a);
  if (isTeacher()) {
    if (!n) return '';
    return a.teacher_read_at
      ? `<span class="chip ok">${SEEN_ICON} Leído ${esc(timeAgo(a.teacher_read_at))}</span><button type="button" class="linkbtn" data-action="ans-read" data-id="${a.id}" data-off="1">Desmarcar</button>`
      : `<button type="button" class="btn sm primary" data-action="ans-read" data-id="${a.id}">${SEEN_ICON} Marcar como leído</button><span class="sub">El alumno verá que has leído sus respuestas.</span>`;
  }
  if (!a.teacher_read_at) return '';
  const t = Object.values(S.dir).find(d => d.role === 'teacher');
  return `<div class="callout ok ans-seen">${SEEN_ICON} <b>${esc(t ? t.public_name : 'Tu profesor')} ha leído tus respuestas</b> · ${esc(timeAgo(a.teacher_read_at))}</div>`;
}
const ansReadChip = a => !answeredCount(a) ? '' : a.teacher_read_at ? `<span class="chip ok">${SEEN_ICON} Leído</span>` : '<span class="chip acc">Sin leer</span>';
function updateAnsRx(aid, qk) { $$(`[data-ansrx="${aid}|${qk}"]`).forEach(el => { el.innerHTML = ansRxInner(aid, qk); }); }
function updateAnsRead(aid) {
  const a = S.assigns.find(x => x.id === aid); if (!a) return;
  $$(`[data-ansread="${aid}"]`).forEach(el => { el.innerHTML = ansReadInner(a); });
  $$(`[data-readchip="${aid}"]`).forEach(el => { el.innerHTML = ansReadChip(a); });
}
function arxOpen(aid, qk, anchor) {
  dmRxClose(true); emojiClose(true);
  if (!isTeacher()) return;
  dmRxFor = 'arx|' + aid + '|' + qk;
  const mine = (ansRxOf(aid, qk).find(r => r.user_id === S.user.id) || {}).emoji;
  const box = document.createElement('div'); box.id = 'dmRxBox'; box.className = 'dmrx'; box.setAttribute('role', 'menu');
  box.innerHTML = REACTIONS.map(r => `<button type="button" role="menuitem" data-arx-pick="${esc(r.e)}" class="${mine === r.e ? 'mine' : ''}" aria-label="${esc(r.e)}">${r.e}</button>`).join('')
    + `<button type="button" class="more" data-arx-more title="Más emojis" aria-label="Más emojis">+</button>`;
  document.body.appendChild(box);
  const r = anchor.getBoundingClientRect(), w = box.offsetWidth, h = box.offsetHeight;
  box.style.left = Math.max(8, Math.min(r.left + r.width / 2 - w / 2, innerWidth - w - 8)) + 'px';
  box.style.top = (r.top - h - 8 >= 8 ? r.top - h - 8 : Math.min(r.bottom + 8, innerHeight - h - 8)) + 'px';
  popPush();
}
async function ansReact(aid, qk, emoji) {
  const mine = ansRxOf(aid, qk).find(r => r.user_id === S.user.id), prev = S.ansRx.slice();
  emojiRemember(emoji);
  if (mine && mine.emoji === emoji) { // la misma: se quita
    S.ansRx = S.ansRx.filter(r => r !== mine); updateAnsRx(aid, qk);
    const { error } = await sb.from('listening_answer_reactions').delete().eq('assignment_id', aid).eq('question', qk).eq('user_id', S.user.id);
    if (error) { S.ansRx = prev; updateAnsRx(aid, qk); toast(errEs(error), 'bad'); }
    return;
  }
  const row = { assignment_id: aid, question: qk, user_id: S.user.id, emoji, created_at: new Date().toISOString() };
  S.ansRx = [...S.ansRx.filter(r => r !== mine), row]; updateAnsRx(aid, qk);
  const { error } = await sb.from('listening_answer_reactions').upsert({ assignment_id: aid, question: qk, user_id: S.user.id, emoji }, { onConflict: 'assignment_id,question,user_id' });
  if (error) { S.ansRx = prev; updateAnsRx(aid, qk); toast(errEs(error), 'bad'); }
}

// Al pegar el enlace: elige el tipo y enseña (en gris) el título que se usará si dejas el campo vacío
let itemUrlTimer = null;
function itemUrlChanged(input) {
  const f = input.form, url = input.value.trim();
  const k = guessKind(url); if (k) f.kind.value = k;
  f.duration.value = ''; f.tracks.value = ''; // eran del enlace anterior: se vuelven a calcular al guardar
  clearTimeout(itemUrlTimer);
  itemUrlTimer = setTimeout(async () => {
    const full = /^https?:\/\//i.test(url) ? url : 'https://' + url;
    const { title } = url ? await fetchMeta(full) : { title: null };
    if (f.isConnected && input.value.trim() === url) f.title.placeholder = title ? `Se usará: ${title}` : 'Se rellenará solo';
  }, 450);
}

/* ========================= PERFILES COMPLETOS ========================= */
const INSTRUMENTS = { electric: 'Guitarra eléctrica', acoustic: 'Guitarra acústica', classical: 'Guitarra clásica', bass: 'Bajo', other: 'Otro instrumento' };
const LEVELS = { beginner: 'Iniciación', intermediate: 'Intermedio', advanced: 'Avanzado' };
function ageOf(iso) { // edad en años a partir de 'AAAA-MM-DD'
  if (!iso) return null;
  const [y, m, d] = iso.split('-').map(Number), t = new Date();
  return t.getFullYear() - y - ((t.getMonth() + 1 < m || (t.getMonth() + 1 === m && t.getDate() < d)) ? 1 : 0);
}
const isMinorProfile = p => { const a = ageOf(p.birth_date); return a === null || a < 18; }; // sin fecha = menor
// Nombre y foto pulsables: abren la ficha pública de esa persona
const whoLink = (id, inner) => `<span class="wholink" data-action="open-profile" data-id="${id}" role="button" tabindex="0">${inner}</span>`;

/* ============================ COMPAÑEROS ============================
   S.mates: mis filas de classmates (solicitudes enviadas, recibidas y compañeros).
   Un alumno solo es visible para los demás si ha participado (publicación, comentario o
   reacción), si sois compañeros, si hay una solicitud entre vosotros o si os habéis escrito
   (lo decide get_directory en la base de datos). */
const mateRow = id => S.mates.find(m => (m.requester_id === S.user.id && m.addressee_id === id) || (m.addressee_id === S.user.id && m.requester_id === id));
function mateState(id) {
  const m = mateRow(id);
  if (!m) return 'none';
  if (m.status === 'accepted') return 'mates';
  return m.requester_id === S.user.id ? 'sent' : 'received';
}
const myMates = () => S.mates.filter(m => m.status === 'accepted').map(m => m.requester_id === S.user.id ? m.addressee_id : m.requester_id);
const mateRequestsIn = () => S.mates.filter(m => m.status === 'pending' && m.addressee_id === S.user.id);
const mateRequestsOut = () => S.mates.filter(m => m.status === 'pending' && m.requester_id === S.user.id);
function mateButtons(id) {
  switch (mateState(id)) {
    case 'mates': return `<span class="chip acc">Compañeros</span><button class="btn sm ghost" data-action="mate-remove" data-id="${id}">Quitar</button>`;
    case 'sent': return `<span class="sub">Solicitud enviada</span><button class="btn sm ghost" data-action="mate-cancel" data-id="${id}">Cancelar</button>`;
    case 'received': return `<button class="btn sm primary" data-action="mate-accept" data-id="${id}">Aceptar como compañero</button><button class="btn sm ghost" data-action="mate-reject" data-id="${id}">Rechazar</button>`;
    default: return `<button class="btn sm" data-action="mate-add" data-id="${id}">+ Agregar como compañero</button>`;
  }
}
// Tras cualquier cambio: botones de la ficha abierta, directorio (puede cambiar a quién veo) y repintado
async function mateChanged(id) {
  await markNotifsRead(S.notifs.filter(n => n.kind === 'classmate_request' && n.actor_id === id && !n.read_at).map(n => n.id));
  await loadDirectory();
  const box = $(`[data-mate-box="${id}"]`); if (box) box.innerHTML = mateButtons(id);
  // En Perfil hay textos rellenos (bio…) que softRender toma por "escribiendo": repintamos igual si no hay ventana abierta
  if (!$('#modalRoot').firstChild && S.section === 'profile') { const y = window.scrollY; render(); window.scrollTo(0, y); }
  else softRender();
}
// Rechazar, cancelar o quitar: las tres borran la fila (la otra persona no recibe ningún aviso)
async function mateDelete(id, ask) {
  const m = mateRow(id); if (!m) return;
  if (ask && !confirm(ask)) return;
  const { error } = await sb.from('classmates').delete().eq('id', m.id);
  if (error) return toast('No se pudo hacer: ' + errEs(error), 'bad');
  S.mates = S.mates.filter(x => x.id !== m.id);
  await mateChanged(id);
}
function matesPanel() {
  const inc = mateRequestsIn(), out = mateRequestsOut();
  const mates = myMates().sort((a, b) => whoName(a).localeCompare(whoName(b)));
  const row = (id, btns) => `<div class="mrow">${whoLink(id, `${avatarHtml(id, 34)}<b>${esc(whoName(id))}</b>`)}${btns}</div>`;
  return `<div class="panel mates">
      <h2 class="h2" style="margin-top:0">Compañeros</h2>
      ${inc.length ? `<div class="mates-h">Solicitudes recibidas</div><div class="blist">${inc.map(m => row(m.requester_id,
        `<div class="mate-btns"><button class="btn sm primary" data-action="mate-accept" data-id="${m.requester_id}">Aceptar</button><button class="btn sm ghost" data-action="mate-reject" data-id="${m.requester_id}">Rechazar</button></div>`)).join('')}</div>` : ''}
      ${mates.length ? `${inc.length || out.length ? '<div class="mates-h">Tus compañeros</div>' : ''}<div class="blist">${mates.map(id => row(id, '')).join('')}</div>`
        : inc.length ? '' : '<p class="sub" style="margin:0">Aún no tienes compañeros. Cuando alguien publique, comente o reaccione, pulsa en su nombre o en su foto y agrégalo. Así no lo perderás de vista aunque el grupo crezca.</p>'}
      ${out.length ? `<div class="mates-h">Solicitudes enviadas</div><div class="blist">${out.map(m => row(m.addressee_id,
        `<div class="mate-btns"><button class="btn sm ghost" data-action="mate-cancel" data-id="${m.addressee_id}">Cancelar</button></div>`)).join('')}</div>` : ''}
    </div>`;
}

const dmPartner = m => m.sender_id === S.user.id ? m.recipient_id : m.sender_id;

function dmConversations() { // [{ id, last, unread }] ordenadas por el último mensaje

    const id = dmPartner(m), c = by[id] || (by[id] = { id, last: m, unread: 0 });
    if (m.created_at > c.last.created_at) c.last = m;
    if (m.recipient_id === S.user.id && !m.read_at) c.unread++;

/* ---- Reacciones a mensajes privados (como WhatsApp) ----

async function dmReact(mid, emoji) {
  const mine = S.dmRx.find(r => r.message_id === mid && r.user_id === S.user.id);
  const prev = S.dmRx.slice();
  emojiRemember(emoji);
  if (mine && mine.emoji === emoji) { // la misma: se quita
    S.dmRx = S.dmRx.filter(r => r !== mine); updateThread();
    const { error } = await sb.from('dm_reactions').delete().eq('message_id', mid).eq('user_id', S.user.id);
    if (error) { S.dmRx = prev; updateThread(); toast(errEs(error), 'bad'); }
    return;
  }
  const row = { message_id: mid, user_id: S.user.id, emoji, created_at: new Date().toISOString() };
  S.dmRx = [...S.dmRx.filter(r => r !== mine), row]; updateThread();
  const { error } = await sb.from('dm_reactions').upsert({ message_id: mid, user_id: S.user.id, emoji }, { onConflict: 'message_id,user_id' });
  if (error) { S.dmRx = prev; updateThread(); toast(errEs(error), 'bad'); }

document.addEventListener('click', e => {
  if (!e.target.closest) return;
  const ao = e.target.closest('[data-arx-open]'); // reacciones a respuestas de Escucha analítica
  if (ao) { e.stopPropagation(); e.preventDefault(); return dmRxFor === 'arx|' + ao.dataset.arxOpen + '|' + ao.dataset.q ? dmRxClose() : arxOpen(ao.dataset.arxOpen, ao.dataset.q, ao); }
  const ap = e.target.closest('[data-arx-pick]');
  if (ap && String(dmRxFor).startsWith('arx|')) { const [, aid, qk] = dmRxFor.split('|'); dmRxClose(); return ansReact(aid, qk, ap.dataset.arxPick); }
  const am = e.target.closest('[data-arx-more]');
  if (am && String(dmRxFor).startsWith('arx|')) {
    e.stopPropagation();
    const [, aid, qk] = dmRxFor.split('|'), anchor = $(`[data-arx-open="${aid}"][data-q="${qk}"]`) || am;
    dmRxClose(true);
    setTimeout(() => { ex = { btn: anchor, onPick: em => ansReact(aid, qk, em) }; emojiDraw(); }, 0);
    return;
  }
  const open = e.target.closest('[data-dmrx-open]');
  if (open) { e.stopPropagation(); return dmRxFor === open.dataset.dmrxOpen ? dmRxClose() : dmRxOpen(open.dataset.dmrxOpen, open.closest('.msg-line').querySelector('.msg')); }
  const mo = e.target.closest('[data-dmmenu-open]');
  if (mo) { e.stopPropagation(); return dmRxFor === mo.dataset.dmmenuOpen && $('#dmMenu') ? dmRxClose() : dmMenuOpen(mo.dataset.dmmenuOpen, mo); }
  if (e.target.closest('#dmMenu')) { setTimeout(() => dmRxClose(), 0); return; } // la acción (borrar/denunciar) va por data-action
  const pick = e.target.closest('[data-dmrx-pick]');
  if (pick && dmRxFor) { const id = dmRxFor; dmRxClose(); return dmReact(id, pick.dataset.dmrxPick); }
  const more = e.target.closest('[data-dmrx-more]');
  if (more && dmRxFor) { // selector completo: el mismo de los cuadros de texto, pero eligiendo reacción
    e.stopPropagation();
    const id = dmRxFor, anchor = $(`.msg[data-dmid="${id}"]`) || more;
    dmRxClose(true); // la entrada del historial sigue: ahora es del selector

    return;
  }

  if (chip) {
    const mid = chip.dataset.dmrxChip, mine = S.dmRx.find(r => r.message_id === mid && r.user_id === S.user.id);
    if (mine) return dmReact(mid, mine.emoji); // quitar la mía

}, true);
// Móvil: mantener pulsado el mensaje
let dmPress = null, dmLongEnd = 0;
document.addEventListener('touchstart', e => {
  const t = e.target.closest ? e.target : e.target.parentElement;
  if (dmRxFor && !(t && t.closest('#dmRxBox, #dmMenu'))) dmRxClose();
  const msg = t && t.closest('.msg[data-dmid]');
  if (!msg || e.touches.length > 1 || t.closest('a, button')) return;
  const p = e.touches[0];
  dmPress = { x: p.clientX, y: p.clientY, t: setTimeout(() => {
    dmPress = null; dmLongEnd = Date.now();
    msg.classList.add('held');
    if (navigator.vibrate) try { navigator.vibrate(15); } catch (_) {}
    dmRxOpen(msg.dataset.dmid, msg, true);
    if (dmRxFor) msg.classList.add('held');
  }, 450) };
}, { passive: true });
document.addEventListener('touchmove', e => {
  const p = e.touches[0];
  if (dmPress && p && Math.hypot(p.clientX - dmPress.x, p.clientY - dmPress.y) > 10) { clearTimeout(dmPress.t); dmPress = null; }
}, { passive: true });
document.addEventListener('touchend', e => {
  if (dmPress) { clearTimeout(dmPress.t); dmPress = null; }

}, { passive: false });

        ${n.actor_id && S.dir[n.actor_id] ? avatarHtml(n.actor_id, 38) : `<span class="ic">${ic(notifIcon(n.kind))}</span>`}
        <div class="t"><div>${notifText(n)}</div><span class="sub">${timeAgo(n.created_at)}</span></div>${n.read_at ? '' : '<i class="udot"></i>'}</div>`).join('')}</div>`
      : '<div class="empty small">No tienes notificaciones.</div>'}
    ${pushPromptHtml()}`);
  $('.modal').classList.add('narrow');
}
// En la campanita solo se invita a activarlas; el resto de opciones está en Ajustes
function pushPromptHtml() { return typeof pushSettingHtml === 'function' && S.push === 'off' ? pushSettingHtml() : ''; }
async function markNotifsRead(ids) {
  if (!ids.length) return;
  const now = new Date().toISOString();
  S.notifs.forEach(n => { if (ids.includes(n.id)) n.read_at = now; });
  await sb.from('notifications').update({ read_at: now }).in('id', ids);
}
// Abre la ficha de una escucha (profesor) o la escucha asignada (alumno)
function openMentionItem(id) {
  S.section = 'listening'; render();
  if (isTeacher()) { if (S.items.some(i => i.id === id)) itemModal(id); return; }
  const a = S.assigns.find(x => x.item_id === id); if (a) studentModal(a.id);
}
async function openNotif(n) {
  await markNotifsRead([n.id]);
  await closeModal();
  switch (n.kind) {
    case 'board_post': case 'mention_board': goPost(n.target_id); break;
    case 'mention_listening': case 'listening_feedback': openMentionItem(n.target_id); break;
    case 'assignment': S.section = 'listening'; render(); break;
    case 'dm': await openDm(n.actor_id); break;
    case 'comment': case 'reaction': case 'mention_feed': S.section = 'feed'; render(); if (S.fposts.some(p => p.id === n.target_id)) feedPostModal(n.target_id); break;
    case 'signup': case 'account_deleted': S.section = 'students'; render(); break;
    case 'goal': S.section = 'profile'; render(); { const gp = $('#goalsPanel'); if (gp) gp.scrollIntoView({ behavior: 'smooth', block: 'start' }); } break;
    case 'report': S.section = 'mod'; render(); break;
    case 'homework': case 'lesson': S.section = 'homework'; render(); break;
    case 'classmate_request': case 'classmate_accept': render(); await profileModal(n.actor_id); break;
    default: render();
  }
}

async function setFamilyDm(id, value) {
  const { data, error } = await sb.from('profiles').update({ family_dm_ok: value }).eq('id', id).select('id, family_dm_ok');
  if (error || !data.length) { toast('No se pudo guardar' + (error ? ': ' + errEs(error) : ''), 'bad'); return studentDetailModal(id); }
  S.students.find(s => s.id === id).family_dm_ok = data[0].family_dm_ok;
  toast(value ? 'Mensajes con compañeros activados' : 'Mensajes con compañeros desactivados', 'ok');
}

/* ================================ DEBERES ============================= *
   homework_tasks: una fila por alumno y tarea. Solo texto. El profesor las pone (a uno o a varios de golpe);
   el alumno ve solo las suyas y las marca como practicadas. La fecha límite es opcional. */
const MODULE_HOMEWORK = 'Deberes';
const hwPending = () => S.homework.filter(h => !h.done_at);
function hwDue(h) { // mismo criterio de colores que las escuchas
  if (!h.due_date) return null;
  const n = daysDiff(h.due_date);
  if (h.done_at) return { cls: '', text: 'Para el ' + fmtDate(h.due_date) };
  if (n < 0) return { cls: 'bad', text: `Vencido (${fmtDate(h.due_date)})` };
  if (n === 0) return { cls: 'warn', text: 'Para hoy' };
  if (n <= 2) return { cls: 'warn', text: `Para dentro de ${n} día${n > 1 ? 's' : ''} (${fmtDate(h.due_date)})` };
  return { cls: '', text: 'Para el ' + fmtDate(h.due_date) };
}
const hwSort = (a, b) => {
  if (!!a.done_at !== !!b.done_at) return a.done_at ? 1 : -1;
  if (a.done_at) return b.done_at.localeCompare(a.done_at);
  if (a.due_date && b.due_date) return a.due_date.localeCompare(b.due_date);
  if (a.due_date) return -1; if (b.due_date) return 1;
  return (a.created_at || '').localeCompare(b.created_at || '');
};
const hwOverdue = h => !h.done_at && h.due_date && daysDiff(h.due_date) < 0;
let hwReturn = null; // id del alumno cuya ficha estaba abierta al pulsar "+ Añadir" o "Editar" (para volver a ella)
const hwFromCard = el => { const m = el.closest('.modal'); return m && m.querySelector('[data-sdm-hw]') ? m.querySelector('[data-sdm-hw]').dataset.sdmHw : null; };
function hwAfterChange(studentId) { render(); if (studentId && $('[data-sdm-hw]')) studentDetailModal(studentId); }
function hwRow(h, teacher) {

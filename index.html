<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Yurimh Music Academy</title>
<link rel="icon" type="image/png" href="icon-round.png">
<!-- Instalable como app en el móvil (PWA) -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#050b1c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Yurimh">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>
/* Tema claro/oscuro: se aplica antes de pintar para que no haya parpadeo.
   La preferencia se guarda solo en este navegador (es una comodidad, no un dato de la app). */
(function () {
  var t = null;
  try { t = localStorage.getItem('ya-theme'); } catch (e) { }
  if (t !== 'light' && t !== 'dark') t = (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
})();
</script>
<style>
/* =====================================================================
   DISEÑO · Marca Yurimh: azul eléctrico + cian neón
   Dos temas (oscuro y claro) con los mismos nombres de variables.
   ===================================================================== */
:root, html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#050b1c; --bg2:#030714;
  --halo:radial-gradient(900px 520px at 12% -12%, rgba(47,134,255,.20), transparent 60%),
         radial-gradient(760px 520px at 108% 108%, rgba(20,80,224,.18), transparent 60%);
  --panel:#0b1530; --panel2:#0f1b3b; --field:#081128; --hover:#13234d;
  --line:rgba(98,150,255,.16); --line-strong:rgba(98,150,255,.34);
  --text:#dfe8fb; --strong:#f2f6ff; --muted:#93a7d1; --faint:#6a7ea8;
  --accent:#2f86ff; --accent-rgb:47,134,255; --accent-hi:#62b4ff; --on-accent:#fff;
  --neon:#3ff0ff; --neon-rgb:63,240,255;
  --violet:#8ea2ff; --violet-rgb:142,162,255;
  --ok:#3ddc97; --ok-rgb:61,220,151;
  --warn:#ffc94a; --warn-rgb:255,201,74;
  --bad:#ff5a7a; --bad-rgb:255,90,122;
  --shadow:0 1px 0 rgba(255,255,255,.035) inset, 0 10px 30px rgba(0,0,0,.32);
  --glow:0 0 18px rgba(47,134,255,.38), 0 0 2px rgba(63,240,255,.55);
  --glow-sm:0 0 10px rgba(47,134,255,.28);
  --overlay:rgba(2,5,14,.74);
}
html[data-theme="light"]{
  color-scheme:light;
  --bg:#f3f6fc; --bg2:#e7eef9;
  --halo:radial-gradient(900px 520px at 12% -12%, rgba(37,99,235,.10), transparent 60%);
  --panel:#ffffff; --panel2:#f4f7fd; --field:#f7f9fe; --hover:#eef3fd;
  --line:rgba(30,60,140,.11); --line-strong:rgba(30,60,140,.22);
  --text:#22304f; --strong:#0f1a33; --muted:#53648a; --faint:#8090ae;
  --accent:#2563eb; --accent-rgb:37,99,235; --accent-hi:#1d4ed8; --on-accent:#fff;
  --neon:#0ea5e9; --neon-rgb:14,165,233;
  --violet:#5b54d6; --violet-rgb:91,84,214;
  --ok:#0b8a52; --ok-rgb:11,138,82;
  --warn:#a86500; --warn-rgb:168,101,0;
  --bad:#c4243f; --bad-rgb:196,36,63;
  --shadow:0 1px 2px rgba(20,33,61,.06), 0 6px 20px rgba(20,33,61,.06);
  --glow:0 0 0 3px rgba(37,99,235,.13), 0 4px 14px rgba(37,99,235,.28);
  --glow-sm:0 2px 8px rgba(37,99,235,.18);
  --overlay:rgba(15,26,51,.42);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overflow-x:clip} /* nunca scroll lateral: en el móvil movería las ventanas fuera de la vista */
body{
  margin:0;color:var(--text);min-height:100vh;
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI Variable","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--halo),linear-gradient(180deg,var(--bg),var(--bg2));background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
}
body.noscroll{overflow:hidden}
h1,h2,h3{color:var(--strong);margin:0;line-height:1.25;letter-spacing:-.01em}
a{color:var(--accent-hi)}
::selection{background:rgba(var(--accent-rgb),.3)}
svg.i{width:20px;height:20px;flex:none}

/* ---------- Estructura estilo plataforma (2026-11-28) ----------
   Barra superior a lo ancho y fija (--toph), debajo menú lateral + contenido dentro de --wrap.
   El Inicio añade su columna derecha (.home > .rail) a partir de 1100 px. */
:root{--wrap:1440px;--toph:64px;--side:232px}
.top{position:relative;z-index:45;height:var(--toph)} /* sin fondo ni línea: todo junto, sobre el mismo degradado (Yuri); no se queda fija */
.top-in{max-width:var(--wrap);height:100%;margin:0 auto;padding:0 24px;display:flex;align-items:center;gap:12px}
.tbrand{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:11px;min-width:0;width:var(--side);color:var(--strong)}
.tbrand img{width:36px;height:36px;flex:none;border-radius:10px;object-fit:cover;box-shadow:var(--glow)} /* el brillo del logo se queda (Yuri) */
.tbrand:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:10px}
.tb-name{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.tb-name b{font-size:15px;letter-spacing:-.015em;white-space:nowrap}
.tb-name small{color:var(--faint);font-size:11.5px;font-weight:500}
.tb-name .l-short{display:none}
.top-r{display:flex;align-items:center;gap:4px;margin-left:auto}
.top-r .installbtn{margin-right:8px}
.iconbtn.tb{width:40px;height:40px;border-radius:50%;border-color:transparent;background:transparent;position:relative}
.iconbtn.tb:hover{background:var(--hover);border-color:transparent}
.iconbtn.tb.on{color:var(--accent-hi);background:rgba(var(--accent-rgb),.12)}
.iconbtn.tb .dotn.static{top:2px;right:0}
.me-wrap{position:relative;margin-left:6px}
.avbtn{font:inherit;cursor:pointer;display:flex;align-items:center;gap:10px;padding:3px 12px 3px 3px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--muted);position:relative;transition:background .15s,border-color .15s}
.avbtn:hover,.avbtn.open{border-color:var(--line-strong);background:var(--hover)}
.avbtn.on{border-color:rgba(var(--accent-rgb),.55)}
.av-meta{display:flex;flex-direction:column;text-align:left;line-height:1.2;min-width:0;max-width:150px}
.av-meta b{font-size:13.5px;color:var(--strong);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av-meta small{font-size:11.5px;color:var(--faint)}
.avbtn .chev{width:12px;height:12px;flex:none;transition:transform .15s}
.avbtn.open .chev{transform:rotate(180deg)}
.dotn.mini{position:absolute;top:1px;left:27px;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--panel)}
.memenu{position:absolute;right:0;top:calc(100% + 8px);z-index:46;width:264px;background:var(--panel);border:1px solid var(--line-strong);border-radius:14px;padding:6px;box-shadow:0 18px 50px rgba(0,0,0,.35);animation:rxIn .14s ease-out}
.mm-head{display:flex;align-items:center;gap:11px;padding:10px 10px 12px;margin-bottom:4px;border-bottom:1px solid var(--line)}
.mm-who{display:flex;flex-direction:column;min-width:0;line-height:1.3}
.mm-who b{color:var(--strong);font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mm-who small{color:var(--faint);font-size:12px}
.memenu [role=menuitem]{font:inherit;font-size:14px;cursor:pointer;width:100%;display:flex;align-items:center;gap:12px;padding:9px 10px;border:0;border-radius:9px;background:none;color:var(--text);text-align:left}
.memenu [role=menuitem]:hover,.memenu [role=menuitem]:focus-visible{background:var(--hover);color:var(--strong);outline:none}
.memenu [role=menuitem] svg{width:18px;height:18px;color:var(--muted)}
.memenu [role=menuitem] span{flex:1}
.memenu .mm-note{font-size:11.5px;color:var(--faint)}
.memenu hr{border:0;border-top:1px solid var(--line);margin:4px 2px}

.shell{display:grid;grid-template-columns:var(--side) minmax(0,1fr);gap:32px;max-width:var(--wrap);margin:0 auto;padding:0 24px}
.main{min-width:0;padding:24px 0 60px}
.sidebar{position:sticky;top:0;height:100vh;padding:20px 0;overflow-y:auto}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{
  font:inherit;font-weight:500;font-size:14.5px;cursor:pointer;color:var(--muted);background:none;border:0;
  display:flex;align-items:center;gap:13px;width:100%;text-align:left;padding:9px 12px;border-radius:10px;position:relative;
  transition:background .15s,color .15s;
}
.nav button .nav-l{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav button:hover{background:var(--hover);color:var(--strong)}
.nav button.on{color:var(--strong);background:rgba(var(--accent-rgb),.12);font-weight:600}
.nav button.on::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--neon);box-shadow:0 0 6px rgba(var(--neon-rgb),.6)}
.nav button.on svg{color:var(--accent-hi)}
.nbadge{margin-left:auto;font-size:11px;font-weight:700;color:var(--on-accent);background:var(--accent);border-radius:999px;padding:1px 8px;white-space:nowrap}
.nbadge.warn{background:var(--warn);color:#1a1200}
html[data-theme="light"] .nbadge.warn{color:#fff}
.phead{display:flex;align-items:center;min-height:36px;margin:0 0 18px}
.phead h1.sec{font-size:24px;letter-spacing:-.02em}
/* Vista de alumno (profesor): barra fija para salir */
.pvbtn{justify-content:center}
.pvbtn svg,.pvbar svg{width:17px;height:17px}
.pvbar{position:sticky;top:10px;z-index:30;display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 14px;padding:8px 8px 8px 14px;border-radius:12px;background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--neon);box-shadow:0 0 18px rgba(var(--neon-rgb),.18);color:var(--strong);font-size:14px}
.pvbar .t{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.pvbar .t svg{color:var(--neon);flex:none}
.pvbar .sub{font-size:12.5px}
@media (max-width:760px){.pvbar .sub{display:none}}
.iconbtn{font:inherit;cursor:pointer;width:38px;height:38px;flex:none;border-radius:11px;border:1px solid var(--line);background:var(--panel);color:var(--muted);display:inline-grid;place-items:center;transition:color .15s,border-color .15s,background .15s}
.iconbtn:hover{color:var(--strong);border-color:var(--line-strong);background:var(--hover)}
.iconbtn.sm{width:32px;height:32px;border-radius:9px;border-color:transparent;background:transparent}
.iconbtn.sm svg{width:18px;height:18px}

/* Botón "Instalar app": visible mientras no tenga la app del móvil. Neón, pero quieto (sin parpadeos) */
.installbtn{font:inherit;font-size:13.5px;font-weight:650;cursor:pointer;height:38px;padding:0 13px;border-radius:11px;display:inline-flex;align-items:center;gap:7px;color:var(--neon);background:rgba(var(--accent-rgb),.10);border:1.5px solid var(--neon);box-shadow:0 0 12px rgba(var(--neon-rgb),.35),inset 0 0 10px rgba(var(--neon-rgb),.10);white-space:nowrap;transition:filter .15s,background .15s}
.installbtn:hover{background:rgba(var(--accent-rgb),.2);filter:brightness(1.1)}
.installbtn svg{width:18px;height:18px}
html[data-theme="light"] .installbtn{color:var(--accent);border-color:var(--accent);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.12)}
.install-hero{display:flex;gap:16px;align-items:center;margin:4px 0 16px}
.install-hero img{width:72px;height:72px;border-radius:18px;flex:none;box-shadow:var(--glow)}
.perks{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:14.5px}
.perks li::before{content:"✓";color:var(--neon);font-weight:700;margin-right:8px}
html[data-theme="light"] .perks li::before{color:var(--accent)}
.isteps{margin:0;padding-left:22px;display:grid;gap:8px;font-size:14.5px}
.qrwrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.qr{width:150px;height:150px;flex:none;border-radius:12px;background:#fff;padding:8px;display:grid;place-items:center;color:#555;font-size:12px;text-align:center}
.qr svg{width:100%;height:100%}
/* Perfil compacto (2026-11-28, Yuri): un panel con foto, nombre y Sobre ti; el rango a la derecha */
.prof-cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
.prof-sec+.prof-sec{border-top:1px solid var(--line);margin-top:16px;padding-top:16px}
.prof-me .h2{margin:0 0 10px}
.prof-me .avrow{gap:14px;margin-bottom:12px}
.prof-avbtns{display:flex;flex-wrap:wrap;gap:8px}
.prof-hint{margin:6px 0 0;font-size:12.5px}
.prof-side{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (max-width:900px){.prof-cols{grid-template-columns:minmax(0,1fr)}}
.name-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:10px;align-items:end}
.name-row .f{margin:0}
@media (max-width:560px){.name-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.name-row .btn{grid-column:1/-1;justify-self:start}}
.about,.panel.mates{grid-column:1/-1}
/* "Sobre ti" a lo ancho en el ordenador: bio arriba, 3 campos cortos en fila y 2 largos debajo */
.about-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0 14px}
.about-grid .a-bio{grid-column:1/-1}.about-grid .a-3{grid-column:span 2}.about-grid .a-2{grid-column:span 3}
@media (max-width:760px){.about-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 10px}.about-grid .a-3,.about-grid .a-2{grid-column:1/-1}.about-grid .a-half{grid-column:auto}}
/* ---- Deberes ---- */
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:0 0 16px}
.hwgroups{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.hwgroup{min-width:0}
.hwgroup .dhead{flex-wrap:wrap}
.hwgroup .dhead h2{display:flex;align-items:center;gap:10px;margin:0}
.hwlist{display:flex;flex-direction:column;gap:8px}
.hw{display:flex;align-items:flex-start;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.dcard .hw{background:var(--panel2)}
.hwcheck{flex:none;width:28px;height:28px;margin-top:1px;border-radius:50%;border:2px solid var(--line-strong);background:transparent;color:transparent;cursor:pointer;display:grid;place-items:center;transition:all .15s}
.hwcheck svg{width:16px;height:16px}
.hwcheck:hover{border-color:var(--accent);color:rgba(var(--accent-rgb),.5)}
.hwcheck[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.hwbody{flex:1;min-width:0}
.hwtitle{font-weight:650;color:var(--strong);overflow-wrap:anywhere}
.hw.done .hwtitle{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(var(--ok-rgb),.6)}
.hwdet{color:var(--text);font-size:14px;margin-top:4px;white-space:pre-wrap;overflow-wrap:anywhere}
.hwmeta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.hwmeta:empty{display:none}
.hwtools{display:flex;gap:4px;flex:none}
.hwdone{margin-top:14px}
/* Deberes v2 (2026-11-28): casilla cuadrada, tarjetas del alumno y lista + detalle del profesor */
.hwcheck.sq{border-radius:8px;width:26px;height:26px}
.hwcheck.sq:not([aria-pressed="true"]){border-color:var(--muted)}
.hw.late{box-shadow:inset 3px 0 0 var(--bad)}
.hwmeta{gap:6px 14px;font-size:13px}
.hwdate{color:var(--muted);font-weight:500}
.hwdate.bad{color:var(--bad)}.hwdate.warn{color:var(--warn)}.hwdate.acc{color:var(--accent-hi)}.hwdate.ok{color:var(--ok)}
.hwgoal{color:var(--ok);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hwago{color:var(--faint)}
.hwprog{display:flex;align-items:center;gap:16px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 16px}
.hwp-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.hwp-t b{color:var(--strong);font-size:16px}
.hwp-bar{flex:0 0 34%;height:14px;border-radius:99px;background:var(--field);border:1.5px solid var(--line-strong);padding:2px;overflow:hidden}
.hwp-bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--neon));transition:width .4s}
.hwprog.full .hwp-bar i{background:var(--ok)}
.hwgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;align-items:start}
.hwcard{flex-direction:column;gap:8px;padding:14px}
.hwc-top{display:flex;gap:12px;align-items:flex-start}
.hwc-top .hwtitle{padding-top:2px}
.hwcard .hwdet{margin:0;font-size:13.5px;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.hwcard .hwmeta{margin:auto 0 0}
.hwcard.done{opacity:.75}
.hwhint{margin:16px 0 0;font-size:13px}
.hwmd{display:grid;grid-template-columns:260px minmax(0,1fr);gap:14px;align-items:start}
.hwside{padding:8px;position:sticky;top:12px;max-height:calc(100vh - 40px);overflow:auto}
.hwq{width:100%;margin:0 0 6px}
.hwstus{display:flex;flex-direction:column;gap:2px}
.hwstu{display:flex;align-items:center;gap:10px;width:100%;font:inherit;text-align:left;cursor:pointer;color:var(--text);background:none;border:0;border-radius:10px;padding:7px 8px}
.hwstu:hover{background:var(--hover)}
.hwstu.on{background:var(--hover);box-shadow:inset 3px 0 0 var(--accent)}
.hwstu .nm{flex:1;min-width:0;font-weight:600;color:var(--strong);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hwcnt{flex:none;font-size:12px;font-weight:700;padding:1px 9px;border-radius:99px;background:rgba(var(--accent-rgb),.16);color:var(--accent-hi)}
.hwcnt.bad{background:rgba(var(--bad-rgb),.16);color:var(--bad)}
.hwcnt.ok{background:rgba(var(--ok-rgb),.12);color:var(--ok);font-weight:600}
.hwcnt.none{background:none;color:var(--faint)}
.hwdetail{padding:16px;min-width:0}
.hwback{display:none;margin:0 0 10px}
.hwd-head{display:flex;align-items:center;gap:12px;margin:0 0 10px}
.hwd-t{flex:1;min-width:0}.hwd-t h2{margin:0;font-size:18px;color:var(--strong)}
.hwd-tools{display:flex;gap:6px;flex:none}
.hwrows{gap:0}
.hwrows .hw{background:none;border:0;border-top:1px solid var(--line);border-radius:0;padding:12px 4px}
.hwrows .hw.late{box-shadow:inset 3px 0 0 var(--bad);padding-left:12px}
.hwnone{margin:6px 0 0;padding:12px 0;border-top:1px solid var(--line)}
.hwnew{width:100%;justify-content:center;margin:0 0 8px}
@media (hover:hover){.hwrows .hwtools{opacity:0;transition:opacity .15s}.hwrows .hw:hover .hwtools,.hwrows .hw:focus-within .hwtools{opacity:1}}
@media (max-width:760px){
  .hwmd{grid-template-columns:minmax(0,1fr)}
  .hwside{position:static;max-height:none}
  .hwmd:not(.open) .hwdetail{display:none}
  .hwmd.open .hwside{display:none}
  .hwback{display:inline-block}
  .hwprog{flex-direction:column;align-items:stretch;gap:10px}
  .hwp-bar{flex:none;width:100%}
  .hwgrid{grid-template-columns:minmax(0,1fr)}
  .hwd-head{flex-wrap:wrap}
  .hwd-tools{width:100%}.hwd-tools .btn{flex:1;justify-content:center}
  .hwrows .hw{flex-wrap:wrap;row-gap:6px}
  .hwrows .hwtools{width:100%;justify-content:flex-end}
}
/* Objetivos */
.goals{grid-column:1/-1;margin-top:22px}
.gprog{display:flex;align-items:center;gap:10px}
.gbar{flex:1;height:12px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);overflow:hidden}
.gbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--neon));box-shadow:0 0 12px rgba(var(--neon-rgb),.45);transition:width .6s ease}
.gprog b{color:var(--strong);font-variant-numeric:tabular-nums}
.gcur{margin:6px 0 0}.gcur:empty{display:none}
.gstages{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.gstage{margin:0;border:1px solid var(--line);border-radius:14px;background:var(--panel2);overflow:hidden}
.gstage>summary{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;list-style:none;font-weight:650;color:var(--strong)}

.stu-pend{background:rgba(var(--warn-rgb),.07);border:1px solid rgba(var(--warn-rgb),.35);border-radius:12px;padding:8px 10px;margin:0 0 14px}
.stu-pend-h{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--warn);padding:2px 4px 6px}
.stu-prow{display:flex;align-items:center;gap:10px;padding:6px 4px;flex-wrap:wrap}.stu-prow+.stu-prow{border-top:1px solid var(--pline)}
.stu-pb{flex:1 1 160px;min-width:0;display:flex;flex-direction:column}.stu-pb b{color:var(--strong)}.stu-pb .sub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.stu-seg{display:inline-flex;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}

.stu-seg button .i{width:16px;height:16px}.stu-seg button.on{background:var(--panel2);color:var(--strong)}
.stu-md{display:grid;grid-template-columns:260px minmax(0,1fr);gap:14px;align-items:start}
.stu-side{background:var(--panel);border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:2px;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.stl{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;font:inherit;color:var(--text);padding:7px 8px;border-radius:9px;cursor:pointer}
.stl:hover{background:var(--hover)}.stl.on{background:rgba(var(--accent-rgb),.16)}
.stl-n{flex:1;min-width:0;font-weight:600;color:var(--strong);font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stl-n small,.stm-b small{display:block;font-size:12px;font-weight:400;color:var(--muted)}
.stu-dot{width:9px;height:9px;border-radius:50%;flex:none}.stu-dot.bad{background:var(--bad)}.stu-dot.warn{background:var(--warn)}
.stu-sum{background:var(--panel);border-radius:12px;padding:16px;min-width:0}
.sts-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:0 0 14px}
.sts-who{flex:1 1 220px;min-width:0}.sts-who h2{margin:0;font-size:19px;color:var(--strong);overflow-wrap:anywhere}
.sts-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}.sts-tags .chip{font-size:12px}
.sts-act{display:flex;gap:8px;flex-wrap:wrap}
.sts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.sts-box{display:flex;flex-direction:column;gap:3px;text-align:left;border:1px solid transparent;background:var(--panel2);border-radius:10px;padding:10px 12px;font:inherit;color:var(--text);cursor:pointer}
.sts-box:hover{border-color:rgba(var(--accent-rgb),.45)}
.sts-k{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.sts-v{display:flex;align-items:center;gap:7px;font-weight:700;font-size:15px;color:var(--strong)}.sts-s{font-size:12.5px;color:var(--muted)}
.sts-box.bad{background:rgba(var(--bad-rgb),.10)}.sts-box.bad .sts-v{color:var(--bad)}
.sts-box.warn{background:rgba(var(--warn-rgb),.10)}.sts-box.warn .sts-v{color:var(--warn)}
.sts-box.ok .sts-v{color:var(--ok)}.sts-box.mut .sts-v{color:var(--faint);font-weight:600}
.rk-medal.stu-med{display:inline-block;width:24px;flex:none;cursor:default;vertical-align:middle}.rk-medal.stu-med svg{width:100%;height:auto;display:block}
.stt-wrap{background:var(--panel);border-radius:12px;overflow:auto}
.stt{width:100%;border-collapse:collapse}
.stt th{text-align:left;padding:0;border-bottom:1px solid var(--line)}
.stt-h{border:0;background:none;font:inherit;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:10px 12px;cursor:pointer;white-space:nowrap}
.stt-h:hover,.stt-h.on{color:var(--strong)}
.stt td{padding:8px 12px;border-bottom:1px solid var(--pline);font-size:13.5px;white-space:nowrap}
.stt tr:last-child td{border-bottom:0}
.stt-r{cursor:pointer}.stt-r:hover td{background:var(--hover)}.stt-r.bad td:first-child{box-shadow:inset 3px 0 0 var(--bad)}.stt-r.warn td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
.stt-n{display:flex;align-items:center;gap:9px;font-weight:600;color:var(--strong)}
.stt-rk{display:inline-flex;align-items:center;gap:7px}
.stt .mut,.stt-p.mut{color:var(--faint)}
.stt-p{font-weight:600}.stt-p.bad,.stt-p.warn,.stt-p.ok{font-size:12.5px;padding:2px 9px;border-radius:99px}
.stt-p.bad{background:rgba(var(--bad-rgb),.14);color:var(--bad)}.stt-p.warn{background:rgba(var(--warn-rgb),.14);color:var(--warn)}.stt-p.ok{background:rgba(var(--ok-rgb),.12);color:var(--ok)}
.stm-list{display:flex;flex-direction:column;gap:6px}
.stm{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:var(--panel);border-radius:11px;padding:9px 10px;font:inherit;color:var(--text);cursor:pointer}
.stm.bad{box-shadow:inset 3px 0 0 var(--bad)}.stm.warn{box-shadow:inset 3px 0 0 var(--warn)}
.stm-b{flex:1;min-width:0}.stm-b b{display:block;color:var(--strong);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stm-ics{display:flex;gap:9px;flex:none}
.stm-i{display:inline-flex;align-items:center;gap:3px;font-size:12.5px;font-weight:700;color:var(--muted)}.stm-i .i{width:16px;height:16px}
.stm-i.bad{color:var(--bad)}.stm-i.warn{color:var(--warn)}.stm-i.ok{color:var(--ok)}
.stu-page{container-type:inline-size}
.sp-nav{margin:0 0 10px}
.sp-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--panel);border-radius:12px;padding:14px 16px;margin:0 0 14px}
.sp-head .sdm-head{flex:1 1 280px}.sp-head h2{margin:0;font-size:21px;color:var(--strong)}
.sp-cols{display:grid;gap:14px;grid-template-columns:minmax(0,1fr);align-items:start}
.sp-c1,.sp-c2,.sp-c3{display:flex;flex-direction:column;gap:14px;min-width:0}
.sp-card{background:var(--panel);border-radius:12px;padding:14px 16px;min-width:0;scroll-margin-top:12px}
.sp-card h3{margin:0 0 10px;font-size:15px;color:var(--strong)}
.sp-card>.dhead{margin:0 0 10px!important;flex-wrap:wrap}
.sp-card .agebox{background:none;border:0;padding:0;margin:0}
.sp-card .rename{margin:0 0 6px}.sp-card .rename input{min-width:0;flex:1}
.sp-lbl{font-size:12px;font-weight:600;color:var(--muted);margin:0 0 4px}
.sp-card .arow{margin:0 0 8px;background:var(--panel2)}.sp-card .arow:last-child{margin-bottom:0}
@container (min-width:740px){.sp-cols{grid-template-columns:300px minmax(0,1fr)}.sp-c1{grid-row:span 2}.sp-c3{grid-column:2}}
@container (min-width:1040px){.sp-cols{grid-template-columns:290px minmax(0,1fr) minmax(0,1.15fr)}.sp-c1{grid-row:auto}.sp-c3{grid-column:auto}}
@container (max-width:739px){.sp-c1{order:3}.sp-c2{order:1}.sp-c3{order:2}}
.modal.hwwide{max-width:980px}
.hwf-cols{display:grid;grid-template-columns:280px minmax(0,1fr);gap:22px;align-items:start}
.hwf-who{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px}
.hwf-whohead{display:flex;align-items:center;gap:8px;padding:2px 4px 8px}.hwf-whohead b{color:var(--strong)}.hwf-whohead .linkbtn{margin-left:auto}
.hwf-picks{display:flex;flex-direction:column;gap:2px;max-height:min(440px,55vh);overflow:auto}
.hwf-pick{display:flex;align-items:center;gap:10px;padding:6px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--text)}
.hwf-pick:hover{background:var(--hover)}
.hwf-pick:has(input:checked){background:rgba(var(--accent-rgb),.14);color:var(--strong)}
.hwf-pick input{margin:0;width:18px;height:18px;accent-color:var(--accent);flex:none}
.hwf-pick span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hwf-row{display:flex;gap:14px;flex-wrap:wrap}.hwf-date{flex:0 0 200px}.hwf-goal{flex:1 1 240px;min-width:0}
.hwf-goal select{width:100%}
.hwf-note{margin:-6px 0 12px;font-size:12.5px}
@media (max-width:760px){.hwf-cols{grid-template-columns:minmax(0,1fr);gap:14px}.hwf-picks{max-height:240px}.hwf-date{flex:1 1 100%}}
.celebrate{text-align:center;padding:8px 4px}
.celebrate h2{margin:6px 0 12px}
.trophy{font-size:64px;line-height:1;animation:trophy .9s cubic-bezier(.2,1.6,.4,1) both}
@keyframes trophy{from{transform:scale(.2) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
.gwins{list-style:none;padding:0;margin:0 0 14px;display:flex;flex-direction:column;gap:6px}
.gwins li{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:650;color:var(--strong)}
.gwins svg{width:18px;height:18px;color:var(--ok)}
.celebrate .gprog{max-width:320px;margin:0 auto}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden}
.confetti i{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;animation-name:confall;animation-timing-function:cubic-bezier(.3,.6,.6,1);animation-fill-mode:forwards}
.confetti .c0{background:var(--accent)}.confetti .c1{background:var(--neon)}.confetti .c2{background:var(--ok)}.confetti .c3{background:var(--warn)}.confetti .c4{background:var(--violet)}
@keyframes confall{to{top:105%;transform:translateX(40px) rotate(720deg)}}

.hwdone summary{cursor:pointer;color:var(--muted);font-weight:600;font-size:14px;margin-bottom:8px}
/* ---- Agenda ---- */
.lday{margin:0 0 16px}
.lday h3{font-size:14px;text-transform:capitalize;color:var(--muted);margin:0 0 8px}
.lrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:8px}
.lrow.click{cursor:pointer}.lrow.click:hover{border-color:var(--line-strong);background:var(--hover)}
.lrow.past{opacity:.6}
.ltime{display:flex;flex-direction:column;min-width:48px;font-variant-numeric:tabular-nums}
.ltime b{color:var(--strong)}.ltime span{color:var(--faint);font-size:12.5px}
.lrow .who{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.lrow .who strong{display:block;color:var(--strong)}.lrow .who .sub{display:block;font-size:12.5px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .ic.warn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:rgba(var(--warn-rgb),.15);color:var(--warn);font-weight:700}
.cal{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--panel);box-shadow:var(--shadow)}
.cal-in{min-width:760px}
.cal-head,.cal-body{display:grid;grid-template-columns:56px repeat(7,minmax(0,1fr))}
.cal-head{border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.cal-tz{font-size:10.5px;color:var(--faint);display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px}
.cal-dh{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0 8px;color:var(--muted)}
.cal-dh span{font-size:11px;font-weight:650;letter-spacing:.04em}
.cal-dh b{font-size:22px;font-weight:500;color:var(--strong);width:40px;height:40px;display:grid;place-items:center;border-radius:50%}
.cal-dh.today span{color:var(--accent-hi)}
.cal-dh.today b{background:var(--accent);color:var(--on-accent);box-shadow:var(--glow-sm)}
.cal-body{position:relative}
.cal-hours{position:relative}
.cal-hr{position:relative;border-top:1px solid transparent}
.cal-hr span{position:absolute;top:-8px;right:8px;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.cal-hr:first-child span{top:2px}
.cal-col{position:relative;border-left:1px solid var(--line);background-image:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px var(--hh))}
.cal-col.today{background-color:rgba(var(--accent-rgb),.04)}
.cev{position:absolute;overflow:hidden;border-radius:8px;padding:4px 7px;font-size:12px;line-height:1.3;color:var(--strong);background:rgba(var(--accent-rgb),.22);border-left:3px solid var(--accent);cursor:pointer;transition:filter .15s}
.cev:hover{filter:brightness(1.12)}
.cev b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:650;overflow-wrap:anywhere}
.cev span{display:block;color:var(--muted);font-size:11.5px}
.cev em{display:block;font-style:normal;font-size:11px;color:var(--accent-hi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cev.unk{background:rgba(var(--warn-rgb),.16);border-left-color:var(--warn);cursor:default}
.cev.unk em{color:var(--warn)}
.cev.past{opacity:.55}
.cal-now{position:absolute;left:0;right:0;height:2px;background:var(--bad);z-index:1}
.cal-dues{display:grid;grid-template-columns:56px repeat(7,minmax(0,1fr));border-bottom:1px solid var(--line)}
.cal-dues .cal-tz{padding:6px 0;align-items:center;text-align:center;line-height:1.15}
.cal-dd{border-left:1px solid var(--line);padding:4px 3px;display:flex;flex-direction:column;gap:3px;min-height:30px}
.cal-dd.today{background-color:rgba(var(--accent-rgb),.04)}
.cal-due{all:unset;box-sizing:border-box;cursor:pointer;font-size:11.5px;line-height:1.25;padding:3px 6px;border-radius:7px;background:rgba(var(--accent-rgb),.12);color:var(--strong);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.cal-due.ls{background:rgba(var(--violet-rgb),.16)}
.cal-due.bad{background:rgba(var(--bad-rgb),.16);color:var(--bad)}
.cal-due:hover,.cal-due:focus-visible{outline:1px solid var(--accent)}
.chip.goalchip{background:rgba(var(--ok-rgb),.14);color:var(--ok);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hwgoal-t{display:flex;flex-direction:column;gap:2px;margin:0 0 12px;padding:10px 14px;border-radius:12px;background:rgba(var(--ok-rgb),.12)}
.hwgoal-t b{color:var(--strong);font-size:16px}
.rank-card{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:6px 16px;margin:0 0 14px;padding:6px 16px 12px 6px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(110deg,rgba(var(--accent-rgb),.10),var(--panel) 55%)}
.rk-medal{display:block;width:150px;padding:0;border:0;background:none;cursor:pointer;line-height:0}
.rk-medal .emb{width:100%;height:auto;overflow:visible;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35))}
.rk-medal.lg{width:260px;margin:0 auto}
.rk-medal.xl{width:min(340px,80vw);margin:0 auto}
.rk-main{display:flex;flex-direction:column;gap:3px;min-width:0}
.rk-name{font-size:20px;color:var(--strong);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rk-pts{font-size:13.5px;color:var(--muted)}
.rk-bar{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden;margin:4px 0 2px}
.rk-bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--neon));box-shadow:0 0 10px rgba(var(--neon-rgb),.5)}
.rk-pips{display:inline-flex;gap:3px}
.rk-pips i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.rk-pips i.on{background:var(--neon);box-shadow:0 0 6px rgba(var(--neon-rgb),.7)}
.rk-streak{display:flex;flex-direction:column;gap:2px;align-items:flex-end;text-align:right;padding-left:14px;border-left:1px solid var(--line)}
.rk-streak b{color:var(--strong)}
.rk-streak:not(.on) b{color:var(--muted)}
.rk-mult{font-size:22px;font-weight:800;color:var(--warn);line-height:1.1}
.rk-streak:not(.on) .rk-mult{color:var(--muted)}
.rk-medal{position:relative}
.rk-medal .emb{position:relative;z-index:1}
/* Brillo de rango (2026-11-28, Yuri): cada medalla brilla en su contorno con el color de su metal; más intenso cuanto
   más alto el rango, y desde Platino late despacio (más rápido cuanto más alto). En cqw: escala con la medalla.
   Solo cuando la medalla se ve en grande (≥200 px: Perfil propio y celebración). */
.rk-medal{container-type:inline-size}
/* Solo en grande (Yuri, 2026-11-28): en pequeño, tipo icono, el brillo emborrona; a partir de 200 px de ancho sí */
@container (min-width:200px){
  .rk-medal .emb.t0{filter:drop-shadow(0 0 0.9cqw rgba(217,138,82,0.59)) drop-shadow(0 0 2.75cqw rgba(217,138,82,0.3))}
  .rk-medal .emb.t1{filter:drop-shadow(0 0 0.98cqw rgba(197,215,235,0.63)) drop-shadow(0 0 3.1cqw rgba(197,215,235,0.34))}
  .rk-medal .emb.t2{filter:drop-shadow(0 0 1.1cqw rgba(255,200,70,0.68)) drop-shadow(0 0 3.6cqw rgba(255,200,70,0.39))}
  .rk-medal .emb.t3{filter:drop-shadow(0 0 1.22cqw rgba(99,220,199,0.74)) drop-shadow(0 0 4.1cqw rgba(99,220,199,0.44))}
  .rk-medal .emb.t3:not(.pop){animation:rkg3 4.2s ease-in-out infinite alternate}
  .rk-medal .emb.t4{filter:drop-shadow(0 0 1.37cqw rgba(111,170,255,0.8)) drop-shadow(0 0 4.7cqw rgba(111,170,255,0.5))}
  .rk-medal .emb.t4:not(.pop){animation:rkg4 3.6s ease-in-out infinite alternate}
  .rk-medal .emb.t5{filter:drop-shadow(0 0 1.51cqw rgba(185,138,245,0.87)) drop-shadow(0 0 5.3cqw rgba(185,138,245,0.56)) drop-shadow(0 0 6.84cqw rgba(185,138,245,0.23))}
  .rk-medal .emb.t5:not(.pop){animation:rkg5 3.2s ease-in-out infinite alternate}
  .rk-medal .emb.t6{filter:drop-shadow(0 0 1.68cqw rgba(63,240,255,0.95)) drop-shadow(0 0 6cqw rgba(63,240,255,0.63)) drop-shadow(0 0 8.1cqw rgba(63,240,255,0.27))}
  .rk-medal .emb.t6:not(.pop){animation:rkg6 2.8s ease-in-out infinite alternate}
  .rk-medal .emb.t7{filter:drop-shadow(0 0 1.8cqw rgba(255,211,77,1)) drop-shadow(0 0 6.5cqw rgba(255,211,77,0.68)) drop-shadow(0 0 9cqw rgba(255,211,77,0.3))}
  .rk-medal .emb.t7:not(.pop){animation:rkg7 2.4s ease-in-out infinite alternate}
}

/* "Para ti" (alumno) y "Tu día" (profesor). Base: fila de chips encima de las publicaciones (pantallas medianas y móvil). */

.fy-chip{display:inline-flex;align-items:center;gap:10px;max-width:100%;min-width:0;flex:1 1 200px;font:inherit;text-align:left;cursor:pointer;color:var(--strong);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 16px 8px 8px;position:relative;transition:background .15s,border-color .15s}

.fy-chip.bad small{color:var(--bad)}

.fy-chip.new::after{content:"";position:absolute;top:50%;right:12px;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.18)}
.fy-chip.new{padding-right:30px}

/* PC ancho: el Inicio en dos columnas y la de la derecha se queda fija al bajar */

  .rail .fy-empty{display:flex;align-items:center;gap:8px;margin:0;padding:4px 10px 8px;font-size:13.5px;color:var(--muted)}
  .rail .fy-empty svg{color:var(--ok)}
  .rail .fy-chips{flex-direction:column;flex-wrap:nowrap;gap:0}
  .rail .fy-chip{flex:none;width:100%;border:0;border-radius:11px;background:none;padding:9px 10px;gap:12px;align-items:flex-start}

  .rail .fy-chip:hover{background:var(--hover)}

  .rail .fyc-ic{width:38px;height:38px;border-radius:11px}

  .rail .fy-chip.new::after{top:22px;margin-top:0}

  .fy-chips.nudge>.fy-chip{animation:fyNudge 1.2s ease-in-out}

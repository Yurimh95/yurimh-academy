.mention.off:hover{text-decoration:none}
.mbox{position:fixed;z-index:80;background:var(--panel);border:1px solid var(--line-strong);border-radius:12px;box-shadow:var(--shadow);padding:4px;max-height:280px;overflow-y:auto}
.mopt{display:flex;align-items:center;gap:10px;width:100%;font:inherit;color:var(--text);background:none;border:0;border-radius:9px;padding:6px 8px;text-align:left;cursor:pointer}
.mopt.on,.mopt:hover{background:rgba(var(--accent-rgb),.14)}
.mopt .t{min-width:0;display:flex;flex-direction:column}
.mopt b{font-weight:600;color:var(--strong);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mopt small{color:var(--muted);font-size:12px}
.mopt .ic{width:28px;height:28px;border-radius:8px;background:rgba(var(--accent-rgb),.12);color:var(--accent-hi);display:grid;place-items:center;flex:none}
.mopt .ic svg{width:16px;height:16px}
/* Emojis: botón dentro de cada cuadro de texto (lo pone emojiDecorate) y selector #emojiBox */
.emo-wrap{position:relative;display:block}
label.f>.emo-wrap{margin-top:6px}
.dm-compose>.emo-wrap,.cm-new>.emo-wrap{flex:1;min-width:0}
.emo-wrap>input,.emo-wrap>textarea{padding-right:42px}
.emo-wrap>textarea{display:block}
.emo-btn{position:absolute;right:6px;bottom:6px;width:30px;height:30px;padding:0;border:0;border-radius:8px;background:none;color:var(--faint);display:grid;place-items:center;cursor:pointer;transition:color .15s,background .15s}
.emo-wrap>input+.emo-btn{bottom:auto;top:50%;transform:translateY(-50%)}
.emo-btn:hover,.emo-btn.on{color:var(--accent-hi);background:rgba(var(--accent-rgb),.12)}
.emo-btn svg{width:20px;height:20px}
.ebox{-webkit-tap-highlight-color:transparent;position:fixed;z-index:85;width:min(336px,calc(100vw - 16px));background:var(--panel);border:1px solid var(--line-strong);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.ebox-tabs{display:flex;gap:2px;padding:4px;border-bottom:1px solid var(--line)}
.ebox-tabs button{flex:1;padding:6px 0;border:0;border-radius:8px;background:none;font-size:18px;line-height:1.2;cursor:pointer;opacity:.55;filter:grayscale(.6);transition:opacity .15s}
.ebox-tabs button:hover{opacity:.9}
.ebox-tabs button.on{opacity:1;filter:none;background:rgba(var(--accent-rgb),.14)}
.ebox-scroll{position:relative;height:250px;overflow-y:auto;overscroll-behavior:contain}
.ebox-sec:last-child{min-height:100%} /* así la última categoría también puede subir arriba del todo */
.ebox-h{position:sticky;top:0;z-index:1;background:var(--panel);font-size:12px;font-weight:600;color:var(--muted);padding:8px 12px 4px}
.ebox-grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:2px;padding:0 6px 6px}
.ebox-grid button{aspect-ratio:1;min-width:0;overflow:hidden;padding:0;border:0;border-radius:8px;background:none;font-size:22px;line-height:1;cursor:pointer;font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif}
.ebox-grid button:hover{background:rgba(var(--accent-rgb),.14)}
.ebox-empty{grid-column:1/-1;color:var(--muted);font-size:13px;padding:4px 6px 8px}
.cmt-foot{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:6px;padding-left:4px}
.cm-new{display:flex;gap:8px;align-items:flex-end;margin-top:10px}
.cm-new textarea{min-height:44px}
/* Vista previa de comentarios en las tarjetas del Inicio */
.cm-peek{display:flex;flex-direction:column;gap:8px;margin-top:-2px}
.peek-more{align-self:flex-start;font-size:13.5px;font-weight:600;color:var(--muted)}
.peek-more:hover{color:var(--accent-hi)}
.peek-cmt{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.peek-bubble{position:relative;background:var(--panel2);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:6px 12px 7px;min-width:0;max-width:100%;transition:border-color .15s,background .15s}
.peek-cmt:hover .peek-bubble{border-color:var(--line-strong);background:rgba(var(--accent-rgb),.06)}
.peek-bubble .cmt-head b{font-size:13px}
.peek-body{font-size:14px;overflow-wrap:anywhere;white-space:pre-wrap;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;line-clamp:3;overflow:hidden}
.peek-body .rt-list{margin:0;white-space:normal}
.peek-rx{position:absolute;right:-6px;bottom:-10px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:0 6px;font-size:12px;line-height:20px;color:var(--muted);box-shadow:var(--shadow)}
.peek-rx b{font-weight:600}
.peek-cmt:has(.peek-rx){margin-bottom:6px}
.peek-new{display:flex;gap:8px;align-items:center;cursor:text}
.peek-input{flex:1;background:var(--field);border:1px solid var(--line);border-radius:999px;padding:7px 14px;color:var(--faint);font-size:14px;transition:border-color .15s}
.peek-new:hover .peek-input{border-color:rgba(var(--accent-rgb),.5)}
.cmt.flash .cmt-bubble{animation:cmtFlash 1.6s ease}
/* Hilos de respuestas (un nivel): metidos bajo el comentario, con una línea guía a la izquierda */
.cm-thread{margin:0 0 4px 42px;padding-left:10px;border-left:2px solid var(--line)}
.cmt.reply{padding:6px 0}
.cmt.reply .cmt-bubble{padding:6px 11px}
.cm-tbtn{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted);padding:4px 0}
.cm-tbtn:hover{color:var(--accent-hi)}
.cm-tbtn .i{width:15px;height:15px}
.cm-reply{margin:4px 0 8px;flex-wrap:wrap}
.cm-reply textarea{flex:1 1 180px;min-height:38px}
.cmt.gone{align-items:center}
.cmt.gone .av-gone{width:32px;height:32px;border-radius:50%;flex:none;border:1px dashed var(--line-strong)}
.cmt.gone .cmt-bubble{background:transparent;border-style:dashed;color:var(--faint);font-style:italic;font-size:13.5px}
.peek-rep{display:flex;align-items:center;gap:6px;margin:-2px 0 2px 36px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.peek-rep:hover{color:var(--accent-hi)}
.peek-rep .i{width:14px;height:14px}
@media (max-width:560px){ .cm-thread{margin-left:20px;padding-left:8px} }
@keyframes cmtFlash{0%,40%{border-color:var(--accent);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.25)}100%{box-shadow:none}}
@media (prefers-reduced-motion:reduce){.cmt.flash .cmt-bubble{animation:none;border-color:var(--accent)}}
.avrow{display:flex;gap:18px;align-items:center;margin-bottom:12px}
.rowav{display:flex;gap:10px;align-items:center;min-width:0}
.sub.clip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:44ch}
.dcard.wide{grid-column:1/-1}
.dcard.mod{border-color:rgba(var(--warn-rgb),.45)}
.row.rep{align-items:flex-start}
@media (max-width:520px){ .sub.clip{max-width:26ch} .cm-new{flex-direction:column;align-items:stretch} }

/* ---------- Pestañas / filtros ---------- */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 18px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px;width:max-content;max-width:100%}
.tab{font:inherit;font-size:14px;font-weight:600;cursor:pointer;color:var(--muted);background:transparent;border:0;border-radius:999px;padding:6px 14px;transition:background .15s,color .15s}
.tab:hover{color:var(--strong)}
.tab.on{color:var(--on-accent);background:var(--accent);box-shadow:var(--glow-sm)}
.tab .n{opacity:.75;margin-left:6px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}

/* ---------- Tarjetas ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
  padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:10px;
  transition:border-color .15s;-webkit-tap-highlight-color:transparent;
}
/* Solo con ratón: en el móvil la tarjeta no se ilumina al tocarla. Sin
   transform, porque haría que el selector de reacciones se descoloque. */
@media (hover:hover){ .card:hover{border-color:var(--line-strong)} }
.card.done{opacity:.8}
.card h3{font-size:16.5px}
.card .brief{margin:0;color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card-top,.card-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.card-foot{margin-top:auto;padding-top:4px}
.badge{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--violet);background:rgba(var(--violet-rgb),.12);border-radius:6px;padding:2px 8px}
.chip{font-size:12.5px;font-weight:500;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 10px;white-space:nowrap}
.chip.ok{color:var(--ok);border-color:rgba(var(--ok-rgb),.38);background:rgba(var(--ok-rgb),.08)}
.chip.warn{color:var(--warn);border-color:rgba(var(--warn-rgb),.4);background:rgba(var(--warn-rgb),.08)}
.chip.bad{color:var(--bad);border-color:rgba(var(--bad-rgb),.4);background:rgba(var(--bad-rgb),.08)}
.chip.acc{color:var(--accent-hi);border-color:rgba(var(--accent-rgb),.38);background:rgba(var(--accent-rgb),.10)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.empty{text-align:center;color:var(--muted);padding:44px 16px;border:1.5px dashed var(--line-strong);border-radius:16px;background:color-mix(in srgb,var(--panel) 50%,transparent)}

/* ---------- Paneles genéricos ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.row strong{color:var(--strong)}
.row.click{cursor:pointer;transition:border-color .15s,background .15s}
.row.click:hover{border-color:var(--line-strong);background:var(--hover)}
.row .sub{color:var(--faint);font-size:13px}
.h2{font-size:16px;margin:22px 0 10px;display:flex;align-items:center;gap:8px}

/* ---------- Modal ---------- */
.backdrop{position:fixed;inset:0;background:var(--overlay);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:flex-start;justify-content:center;padding:28px 14px;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;z-index:50}
.modal{width:100%;max-width:760px;min-width:0;overflow-wrap:break-word;background:var(--panel);border:1px solid var(--line-strong);border-radius:18px;padding:22px;box-shadow:0 24px 70px rgba(0,0,0,.35),var(--glow-sm);animation:min .18s ease-out}
.modal.narrow{max-width:420px}
@media (max-width:560px){.backdrop{padding:12px 8px 24px}.modal{padding:16px;border-radius:16px}} /* en el móvil la ventana aprovecha el ancho y empieza arriba */
@keyframes min{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.modal-head h2{font-size:20px;margin-top:6px}
.x{font:inherit;font-size:20px;line-height:1;cursor:pointer;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:10px;width:36px;height:36px;flex:none}
.x:hover{color:var(--strong);border-color:var(--line-strong);background:var(--hover)}
.callout{border:1px solid rgba(var(--accent-rgb),.25);background:rgba(var(--accent-rgb),.07);border-radius:12px;padding:11px 14px;margin:10px 0;font-size:14px;white-space:pre-wrap}
.callout b{display:block;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-hi);margin-bottom:3px}
.qblock{margin:14px 0}
.qblock .q{font-weight:600;color:var(--strong);margin-bottom:6px;font-size:14.5px}
.ans{white-space:pre-wrap;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px}
.ans.none{color:var(--faint);font-style:italic}
.ans-line{display:flex;align-items:flex-start;gap:6px}
.ans-line .ans{flex:1;min-width:0}
.ans-rxbtn{flex:none;width:32px;height:32px;margin-top:4px;border-radius:50%;border:0;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center;opacity:.55;transition:opacity .15s,background .15s}
.ans-rxbtn svg{width:20px;height:20px}
.ans-rxbtn:hover,.ans-rxbtn:focus-visible{opacity:1;background:rgba(var(--accent-rgb),.12);color:var(--accent)}
.ans-rx{display:block}
.ans-rx .msg-rx{margin-top:-9px;margin-inline:12px}
.ans-rx .msg-rx.static{cursor:default}
.qblock+.ans-rx .msg-rx{margin-top:-2px}
.ans-read{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0 4px;padding-top:12px;border-top:1px solid var(--line)}
.ans-read:empty{display:none}
.ans-read .chip svg,.ans-read .btn svg,.ans-seen svg{width:17px;height:11px;vertical-align:-1px}
.callout.ans-seen{white-space:normal;border-color:rgba(var(--ok-rgb),.35);background:rgba(var(--ok-rgb),.08);color:var(--text)}
.callout.ans-seen b{display:inline;font-size:inherit;letter-spacing:0;text-transform:none;color:var(--ok);margin:0}
.savebar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:6px 0 4px}
.save-state{font-size:13px;color:var(--faint)}
.save-state.ok{color:var(--ok)}.save-state.bad{color:var(--bad)}
.exports{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.exports-title{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-top:18px}

/* ---------- Escucha analítica: lista tipo "tracklist" ---------- */
.tracklist{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:6px}
.track-head,.track{display:grid;grid-template-columns:32px 48px minmax(0,1fr) 130px 150px 40px;align-items:center;gap:14px;padding:8px 12px}
.track-head{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);border-bottom:1px solid var(--line);margin-bottom:4px}
.track{border-radius:11px;cursor:pointer;transition:background .15s}
.track:hover{background:var(--hover)}
.track.done .tmain b{color:var(--muted)}
.tnum{text-align:center;color:var(--faint);font-variant-numeric:tabular-nums;font-size:14px}
.tdone{color:var(--ok);display:inline-grid}.tdone svg{width:18px;height:18px}
.tmain{min-width:0}
.rv-item .tmain b{white-space:normal;overflow-wrap:anywhere} /* en la revisión, el título entero */
.tmain b{display:block;color:var(--strong);font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tsub{display:flex;align-items:center;gap:6px;color:var(--faint);font-size:13px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.kicon{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:5px;background:rgba(var(--accent-rgb),.14);color:var(--accent-hi);flex:none}
.kicon svg{width:12px;height:12px}
.durrow{display:grid;grid-template-columns:1fr 150px;gap:10px}
@media (max-width:480px){ .durrow{grid-template-columns:1fr} }
.tbrief{min-width:0;overflow:hidden;text-overflow:ellipsis}
.tdur{flex:none;font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted)}
/* Vídeo para ver: etiqueta y aviso al abrir el enlace */
.wtag{flex:none;display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;line-height:1.5;color:var(--accent-hi);background:rgba(var(--accent-rgb),.13);border:1px solid rgba(var(--accent-rgb),.35);border-radius:6px;padding:0 7px;white-space:nowrap}
a[data-watch]{cursor:pointer;-webkit-touch-callout:none}
.wtag.big{font-size:12.5px;border-radius:999px;padding:2px 10px}
.watchchk{display:flex;align-items:flex-start;margin:4px 0 12px}
.watchchk .sub{display:block;font-weight:400;margin-top:2px}
.watchbox{position:fixed;inset:0;z-index:90;background:var(--overlay);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px}
.watchbox .wb{width:100%;max-width:450px;max-height:100%;overflow-y:auto;background:var(--panel);border:1px solid var(--line-strong);border-radius:18px;padding:22px;box-shadow:0 24px 70px rgba(0,0,0,.35),var(--glow-sm);animation:min .18s ease-out}
.watchbox h3{margin:0;color:var(--strong);font-size:19px;letter-spacing:-.01em}
.watchbox .wb-title{margin:4px 0 0;color:var(--accent-hi);font-weight:600}
.watchbox p{margin:12px 0 0;color:var(--text);line-height:1.5}
.watchbox ul{margin:12px 0 18px;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.watchbox li{display:flex;gap:10px;align-items:flex-start;color:var(--text);line-height:1.45}
.watchbox li>span:first-child{flex:none;font-size:18px;line-height:1.25}
.watchbox .actions{justify-content:flex-end}
.tdur::after{content:'·';margin-left:6px;color:var(--faint)}
.tans{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;white-space:nowrap}
.tans svg{width:15px;height:15px;vertical-align:-3px}
.meter{flex:1;max-width:70px;height:6px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--neon))}
.meter-n{font-variant-numeric:tabular-nums;font-size:12.5px}
.tdue{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tdue.bad{color:var(--bad);font-weight:600}.tdue.warn{color:var(--warn);font-weight:600}.tdue.ok{color:var(--ok)}
.cover{position:relative;display:grid;place-items:center;border-radius:8px;overflow:hidden;flex:none;color:#fff;
  background:linear-gradient(135deg,#1d4ed8,#3ff0ff)}
.cover.k-album{background:linear-gradient(135deg,#7c3aed,#2f86ff)}
.cover.k-song{background:linear-gradient(135deg,#0ea5e9,#22d3ee)}
.cover.k-playlist{background:linear-gradient(135deg,#2563eb,#14b8a6)}
.cover svg{width:46%;height:46%;opacity:.9}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.playbtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--accent);text-decoration:none;justify-self:end;transition:transform .12s,filter .15s;box-shadow:var(--glow-sm)}
.playbtn svg{width:16px;height:16px;margin-left:2px}
.playbtn.sp{background:#1ed760;color:#0b2a16;box-shadow:0 0 12px rgba(30,215,96,.35)}
.playbtn.yt{background:#ff2a2a;box-shadow:0 0 12px rgba(255,42,42,.3)}
.playbtn:hover{transform:scale(1.08);filter:brightness(1.05)}
.mhead-cover{display:flex;gap:14px;align-items:center;min-width:0}
.mhead-cover .badge{display:inline-flex;align-items:center;gap:6px}
@media (max-width:900px){ .track-head,.track{grid-template-columns:24px 48px minmax(0,1fr) 110px 40px} .track-head span:nth-child(5),.track .tdue{display:none} }
@media (max-width:560px){
  .track-head{display:none}
  .track,.tracklist.teacher .track{grid-template-columns:48px minmax(0,1fr) 36px;gap:12px;padding:8px}
  .track .tnum,.track .tans{display:none}
}
/* Escucha analítica: buscador, filtros, carpetas y géneros */
.catbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px}
.catbar input[type=search]{flex:1 1 260px;min-width:0;font:inherit;font-size:14px;color:var(--text);background:var(--field);border:1px solid var(--line);border-radius:999px;padding:8px 14px}
.catbar input[type=search]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.18)}
.catbar select{width:auto;flex:0 1 auto;max-width:210px;font-size:13.5px;padding:7px 10px;margin:0}
.catcount{margin:0 0 8px 4px}
.fold{margin:0 0 12px}
.fold>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:6px 6px 8px;font-weight:700;color:var(--strong);user-select:none}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:'▸';color:var(--faint);transition:transform .15s;display:inline-block}
.fold[open]>summary::before{transform:rotate(90deg)}
.fold-name{display:inline-flex;align-items:center;gap:8px}
.fold-name svg{width:17px;height:17px;color:var(--accent-hi)}
.fold>summary .n{font-size:12.5px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 9px}
.tart{flex:none;color:var(--muted);font-size:12.5px;max-width:200px;overflow:hidden;text-overflow:ellipsis}
.tsub .tart:has(+ *)::after{content:'·';margin-left:6px;color:var(--faint)}
.gchip,.fchip{flex:none;font-size:11.5px;font-weight:600;color:var(--accent-hi);background:rgba(var(--accent-rgb),.10);border:1px solid rgba(var(--accent-rgb),.28);border-radius:999px;padding:0 8px;line-height:18px}
.fchip{display:inline-flex;align-items:center;gap:4px;color:var(--muted);background:var(--panel2);border-color:var(--line)}
.fchip svg{width:12px;height:12px}
.imeta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:6px}
.tstat-m{display:none;margin-top:4px}
.tstat-m .btn{padding:3px 10px}
@media (max-width:560px){ .tstat-m{display:block} .catbar select{flex:1 1 140px;max-width:none} }
.libedit{display:grid;gap:6px;margin:0 0 14px}
.librow{display:grid;grid-template-columns:minmax(0,1fr) 32px auto auto auto;gap:6px;align-items:center}
.librow.g{grid-template-columns:minmax(0,1fr) 32px auto}
.librow.child{padding-left:26px;position:relative}
.librow.child::before{content:'└';position:absolute;left:8px;color:var(--faint)}
.librow input{margin:0}
.librow>.sub{text-align:center}
.libadd{display:flex;gap:8px;flex-wrap:wrap}
.libadd input{flex:1 1 200px;margin:0}.libadd select{flex:0 1 200px;margin:0}
.gpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px 16px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;margin:6px 0 14px;max-height:min(320px,42vh);overflow:auto}
.gpick-grp{display:grid;gap:4px;align-content:start}
.gpick-grp .chk{font-size:13.5px}
.gpick-main{font-weight:700;color:var(--strong)}

/* ---------- Nombres y fotos pulsables, ficha pública ---------- */
.wholink{cursor:pointer;display:inline-flex;align-items:center;gap:8px;border-radius:999px}
.wholink:hover b{text-decoration:underline;text-underline-offset:3px}
.wholink:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pf-head{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;margin:-10px 0 14px}
.pf-head h2{font-size:21px}
.pf-bio{margin:2px 0 0;color:var(--text);white-space:pre-wrap;overflow-wrap:anywhere}
.pf-field{border-top:1px solid var(--line);padding:11px 2px}
.pf-label{display:block;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-bottom:2px}
.pf-text{white-space:pre-wrap;overflow-wrap:anywhere}
.agebox{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.agebox input[type=date]{max-width:200px}

/* ---------- Campanita y contadores ---------- */
.bell{position:relative}
.dotn.static{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:10.5px;font-weight:700;line-height:18px;font-style:normal;text-align:center;box-shadow:var(--glow-sm)}
.nlist{display:flex;flex-direction:column;gap:2px;margin:0 -8px}
.nrow{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:12px;cursor:pointer;transition:background .15s}
.nrow:hover{background:var(--hover)}
.nrow.unread{background:rgba(var(--accent-rgb),.07)}
.nrow .ic{width:38px;height:38px;border-radius:50%;background:rgba(var(--accent-rgb),.13);color:var(--accent-hi);display:grid;place-items:center;flex:none}
.nrow .ic svg{width:18px;height:18px}
.nrow .t{flex:1;min-width:0;font-size:14px}
.nrow b{color:var(--strong)}
.push-box{display:flex;flex-direction:column;gap:6px}
.modal .push-box{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
/* Desplegable de la campanita (como Facebook) */
.nbox{position:absolute;z-index:46;width:min(380px,calc(100vw - 16px));display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line-strong);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.35);animation:rxIn .14s ease-out;overflow:hidden}
.nb-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 8px;flex:none}
.nb-head h2{margin:0;font-size:19px;color:var(--strong)}
.nb-head .linkbtn{font-size:13px}
.nb-scroll{overflow-y:auto;overscroll-behavior:contain;padding:0 14px 12px;min-height:0}
.nbox .nlist{margin:0 -6px}
.nbox .empty{margin:6px 0 4px}
.nb-tabs{display:flex;gap:6px;padding:0 16px 8px;flex:none}
.nb-tab{font:inherit;font-size:14px;font-weight:600;cursor:pointer;padding:6px 13px;border-radius:999px;border:0;background:none;color:var(--text);transition:background .15s,color .15s}
.nb-tab:hover{background:var(--hover)}
.nb-tab.on{background:rgba(var(--accent-rgb),.15);color:var(--accent-hi)}
.nb-gt{margin:8px 2px 4px;font-size:15px;font-weight:700;color:var(--strong)}
.nb-group:first-child .nb-gt{margin-top:2px}
.nb-push{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 14px 8px;padding:10px 12px;border-radius:12px;background:rgba(var(--accent-rgb),.1);flex:none}
.nb-push>svg{width:20px;height:20px;color:var(--accent-hi);flex:none}
.nbp-t{flex:1;min-width:160px;display:flex;flex-direction:column;line-height:1.3}
.nbp-t b{font-size:14px;color:var(--strong)}
.nbp-t small{font-size:12.5px;color:var(--muted)}
.nbp-b{display:flex;align-items:center;gap:10px;margin-left:auto}
.push-box>b{color:var(--strong)}
.udot{width:9px;height:9px;border-radius:50%;background:var(--neon);box-shadow:0 0 8px var(--neon);flex:none}

/* ---------- Mensajes privados ---------- */
.dm{display:grid;grid-template-columns:300px minmax(0,1fr);gap:14px;height:calc(100vh - 110px);min-height:440px}
.dm-list,.dm-pane{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.dm-list{overflow-y:auto}
.dm-list-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 14px 10px;position:sticky;top:0;background:var(--panel);z-index:1}
.dm-list-head b{color:var(--strong)}
.dm-conv{display:flex;align-items:center;gap:11px;padding:10px 14px;cursor:pointer;transition:background .15s;position:relative}
.dm-conv:hover{background:var(--hover)}
.dm-conv.on{background:rgba(var(--accent-rgb),.12)}
.dm-conv .t{flex:1;min-width:0}
.dm-conv b{display:block;color:var(--strong);font-size:14.5px}
.dm-conv .sub{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dm-meta{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.dm-meta .dotn.static{position:static}
.dm-conv .t .seen{vertical-align:-1px;margin-right:4px}
.dm-empty{margin:auto;color:var(--faint);padding:20px;text-align:center}
.dm-thread-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.dm-thread-head b{color:var(--strong)}
.dm-back{display:none;width:34px;height:34px;font-size:18px}
.dm-thread{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:8px}
.msg-row{display:flex}
.msg-row.mine{justify-content:flex-end}
.msg{max-width:min(78%,520px);background:var(--panel2);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:8px 12px}
.msg-row.mine .msg{background:var(--accent);border-color:transparent;color:#fff;border-radius:16px 16px 4px 16px;box-shadow:var(--glow-sm)}
.msg-row.mine .msg a{color:#fff;text-decoration:underline}
.msg-row.mine .rt-list li::marker{color:inherit}
.msg-body{white-space:pre-wrap;overflow-wrap:anywhere}
.msg .linkcard{margin-top:8px;background:rgba(0,0,0,.12)}
.msg-row.mine .linkcard .lk,.msg-row.mine .linkcard .lu,.msg-row.mine .linkcard .go,.msg-row.mine .linkcard .tsub,.msg-row.mine .linkcard .tdur{color:#fff}
.msg .linkcard.media{margin:8px 0 0}
.msg .linkcard,.msg .linkcard *,.msg-row.mine .msg a.linkcard{text-decoration:none}
.msg-row.mine .linkcard .lsvc,.msg-row.mine .linkcard .kicon{color:#fff}
.msg-row.mine .linkcard .kicon{background:rgba(255,255,255,.18)}
.msg-foot{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:3px;font-size:11.5px;opacity:.75}
.msg-row.mine .msg-foot .linkbtn{color:#fff}
.msg-foot .linkbtn{font-size:11.5px}
.seen{display:inline-flex;color:var(--neon)}
.msg-row.mine .msg-foot .seen{color:#fff}
/* Reacciones a mensajes privados (estilo WhatsApp) */
.msg-wrap{position:relative;display:flex;flex-direction:column;align-items:flex-start;max-width:min(78%,520px)}
.msg-row.mine .msg-wrap{align-items:flex-end}
.msg-wrap .msg{max-width:100%}
.msg-line{display:flex;align-items:center;gap:6px;max-width:100%}
.msg-row.mine .msg-line{flex-direction:row-reverse}
.msg-rxbtn{flex:none;width:30px;height:30px;border-radius:50%;border:0;background:transparent;color:var(--muted);opacity:0;cursor:pointer;display:grid;place-items:center;transition:opacity .15s}
.msg-rxbtn svg{width:20px;height:20px}
.msg-row:hover .msg-rxbtn,.msg-rxbtn:focus-visible{opacity:.65}
.msg-rxbtn:hover{opacity:1;background:rgba(var(--accent-rgb),.12)}
@media (hover:none){.msg-rxbtn{display:none}.msg{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}}
.msg-rx{margin-top:-8px;margin-inline:10px;position:relative;z-index:1;display:inline-flex;align-items:center;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:1px 7px;font-size:14px;line-height:20px;cursor:pointer;color:var(--text)}
.msg-rx span{font-size:11.5px;color:var(--muted);margin-left:2px}
.msg.held{filter:brightness(.92)}
.dmrx{position:fixed;z-index:60;display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 6px;box-shadow:0 8px 24px rgba(0,0,0,.35);animation:rxIn .14s ease-out}
.dmrx button{border:0;background:transparent;font-size:24px;width:40px;height:40px;border-radius:50%;cursor:pointer;display:grid;place-items:center;transition:transform .12s}
.dmrx button:hover{transform:scale(1.2);background:rgba(var(--accent-rgb),.12)}
.dmrx button.mine{background:rgba(var(--accent-rgb),.22)}
.msg{position:relative}
.msg-more{position:absolute;top:3px;right:4px;width:26px;height:22px;border:0;border-radius:8px;background:var(--panel2);color:var(--muted);cursor:pointer;display:grid;place-items:center;opacity:0;transition:opacity .15s;box-shadow:-6px 0 8px var(--panel2)}
.msg-more svg{width:16px;height:16px}
.msg-row.mine .msg-more{background:var(--accent);color:#fff;box-shadow:-6px 0 8px var(--accent)}
.msg:hover .msg-more,.msg-more:focus-visible,.msg-more.on{opacity:1}
@media (hover:none){.msg-more{display:none}}
.dmmenu{position:fixed;z-index:60;min-width:170px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px;box-shadow:0 8px 24px rgba(0,0,0,.35);animation:rxIn .14s ease-out}
.dmmenu button,.dmmenu .off{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;color:var(--text);font:inherit;font-size:14px;text-align:left;padding:9px 12px;border-radius:8px;cursor:pointer}
.dmmenu button:hover{background:rgba(var(--accent-rgb),.12)}
.dmmenu .danger{color:var(--bad)}
.dmmenu .off{color:var(--muted);cursor:default}
.dmrx .more{font-size:20px;color:var(--muted);background:var(--panel2)}
.dm-compose{display:flex;gap:8px;align-items:flex-end;padding:12px;border-top:1px solid var(--line)}
.dm-compose textarea{min-height:44px;max-height:140px;resize:none}
.dm-cant{padding:14px;border-top:1px solid var(--line);color:var(--muted);font-size:14px;text-align:center}
@media (max-width:760px){
  .dm{display:block;height:auto;min-height:0}
  .dm-list{max-height:none}
  .dm.open .dm-list{display:none}
  .dm:not(.open) .dm-pane{display:none}
  .dm-pane{height:calc(100vh - 170px);min-height:380px}
  .dm-back{display:inline-grid}
}

/* ---------- Encuadre de la foto de perfil ---------- */
.crop{display:flex;flex-direction:column;align-items:center;gap:14px}
.crop-stage{position:relative;width:260px;height:260px;max-width:100%;border-radius:16px;overflow:hidden;background:var(--panel2);touch-action:none;cursor:grab;user-select:none}
.crop-stage:active{cursor:grabbing}
.crop-stage canvas{display:block;width:100%;height:100%}
.crop-stage::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:50%;box-shadow:0 0 0 999px rgba(0,0,0,.55);outline:2px solid rgba(255,255,255,.85);outline-offset:-2px}
.crop-zoom{display:flex;align-items:center;gap:10px;width:260px;max-width:100%;color:var(--muted)}
.crop-zoom svg{width:18px;height:18px;flex:none}

/* ---------- Asignaciones (profesor) ---------- */
.arow{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel2)}
.arow+.arow{margin-top:10px}
.arow-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.arow-who{display:flex;align-items:center;gap:10px;min-width:0}
.sdm-head{display:flex;align-items:center;gap:16px;min-width:0}
.av-zoom{padding:0;border:0;background:none;border-radius:50%;cursor:zoom-in;line-height:0;flex:none;transition:transform .15s,filter .15s}
.av-zoom:hover{filter:brightness(1.08);transform:scale(1.03)}
.av-zoom:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
/* Visor de foto: fondo oscuro en los dos temas (como cualquier visor de fotos) */
.lightbox{position:fixed;inset:0;z-index:88;background:rgba(2,6,16,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;cursor:zoom-out;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.lightbox img{width:min(88vw,76vh,640px);aspect-ratio:1;height:auto;object-fit:cover;border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.6);background:#0b1530}
.lightbox .lb-name{color:#fff;font-weight:700;font-size:16px;text-align:center}
.lightbox .x{position:absolute;top:14px;right:14px;color:#fff;border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.08)}
/* Galería de fotos de posts, avisos, comentarios y mensajes */
.lightbox.gal{cursor:default;padding:60px 12px 28px}
.lightbox.gal img{width:auto;height:auto;max-width:100%;max-height:calc(100vh - 100px);max-height:calc(100dvh - 100px);aspect-ratio:auto;object-fit:contain;border-radius:8px;background:none;box-shadow:0 24px 70px rgba(0,0,0,.5)}
.lightbox.gal img:not([src]){width:min(80vw,480px);aspect-ratio:4/3;background:rgba(255,255,255,.06)}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;font-size:30px;line-height:1;padding:0 0 4px;cursor:pointer;display:grid;place-items:center}
.lb-nav:hover{background:rgba(255,255,255,.2)}
.lb-nav.prev{left:14px}.lb-nav.next{right:14px}
.lb-count{position:absolute;top:22px;left:50%;transform:translateX(-50%);color:#fff;font-weight:700;font-size:14px}
@media (max-width:760px){.lb-nav{width:38px;height:38px;font-size:24px;background:rgba(2,6,16,.45)}.lb-nav.prev{left:6px}.lb-nav.next{right:6px}}
.ph-grid{display:grid;gap:3px;margin:10px 0 4px;border-radius:14px;overflow:hidden;background:var(--panel2);max-width:560px;width:100%}
.ph-grid.n1{grid-template:minmax(0,1fr)/minmax(0,1fr);max-height:560px}
.ph-grid.n2{grid-template:minmax(0,1fr)/repeat(2,minmax(0,1fr));aspect-ratio:2/1}
.ph-grid.n3{grid-template:repeat(2,minmax(0,1fr))/minmax(0,2fr) minmax(0,1fr);aspect-ratio:3/2}
.ph-grid.n3 .ph-cell:first-child{grid-row:1/3}
.ph-grid.n4{grid-template:repeat(2,minmax(0,1fr))/repeat(2,minmax(0,1fr));aspect-ratio:1}
.ph-cell{position:relative;display:block;width:100%;height:100%;min-height:0;padding:0;margin:0;border:0;border-radius:0;background:var(--field);cursor:zoom-in;overflow:hidden}
/* la foto no da tamaño a la celda: manda la rejilla (si no, una foto grande la estira) */
.ph-cell img{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .25s,filter .15s}
.ph-cell img[src]{opacity:1}
.ph-cell:hover img{filter:brightness(1.07)}
.ph-cell:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.ph-cell.err::after{content:'Foto no disponible';position:absolute;inset:0;display:grid;place-items:center;color:var(--faint);font-size:12px}
.ph-more{position:absolute;inset:0;display:grid;place-items:center;background:rgba(2,6,16,.55);color:#fff;font-size:28px;font-weight:800}
.ph-grid.cm{max-width:240px;margin:6px 0 2px;border-radius:12px}
.ph-grid.peek{max-width:150px;margin:6px 0 0;border-radius:10px}
.ph-grid.dm{width:min(280px,60vw);margin:0 0 6px;border-radius:10px}
.msg-row.mine .ph-grid.dm{background:rgba(255,255,255,.15)}
.ph-strip{display:flex;flex-wrap:wrap;gap:8px}
.ph-strip:empty{display:none}
.ph-chip{position:relative;width:72px;height:72px;flex:none;border-radius:10px;overflow:hidden;background:var(--field);border:1px solid var(--line)}
.ph-chip img{display:block;width:100%;height:100%;object-fit:cover}
.ph-x{position:absolute;top:3px;right:3px;width:24px;height:24px;padding:0;border:0;border-radius:50%;background:rgba(2,6,16,.72);color:#fff;font-size:16px;line-height:24px;cursor:pointer}
.ph-x:hover{background:var(--bad)}
.ph-chip.busy::after{content:'';position:absolute;inset:0;margin:auto;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:phSpin .8s linear infinite}
@keyframes phSpin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.ph-chip.busy::after{animation:none}}
.ph-add{display:inline-flex;align-items:center;gap:6px}
.ph-add svg{width:18px;height:18px;flex:none}
.ph-add.icon{width:44px;height:44px;padding:0;justify-content:center;flex:none}
.composer .ph-add{margin-right:auto}
.composer-main>.ph-strip{margin-top:-2px}
.f>.ph-strip{margin:8px 0}
.ph-row{margin-top:6px}
.cm>.ph-strip,.cm .ph-strip{margin-top:10px}
/* Vídeos: posts del Inicio y stories (2026-11-25) */
.composer .ph-add{margin-right:0}
.composer .actions [data-action=vd-add]{margin-right:auto}
[data-vd-draft]:empty{display:none}
.vd-chip{position:relative;display:flex;align-items:center;gap:10px;padding:6px 40px 6px 6px;border:1px solid var(--line);border-radius:12px;background:var(--field);min-height:60px}
.vd-chip img{width:48px;height:48px;object-fit:cover;border-radius:8px;flex:none}
.vd-chip .vd-dur{position:static;background:rgba(var(--accent-rgb),.18);color:var(--strong)}
.vd-chip .ph-x{top:50%;right:8px;transform:translateY(-50%)}
.vd-chip.busy{flex-direction:column;align-items:stretch;gap:6px;padding:10px 40px 10px 12px}
.vd-prog{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.vd-prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--neon));transition:width .2s}
.vd-ptext{font-size:13px;color:var(--muted)}
.vd-days{display:none;flex-direction:column;gap:4px;font-size:14px}
.composer.has-vd .vd-days{display:flex}
.vd-days select{width:auto;display:inline-block;margin-left:6px;padding:4px 8px;min-height:0}
.vd-days small,.vd-note{color:var(--muted);font-size:12.5px;line-height:1.4}
.vd{position:relative;margin:10px auto 4px;border-radius:14px;overflow:hidden;background:#000;max-width:100%}
.vd img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vd video{position:absolute;inset:0;width:100%;height:100%;background:#000;object-fit:contain}
.vd-play{position:absolute;inset:0;margin:auto;width:64px;height:64px;border-radius:50%;border:0;background:rgba(2,6,16,.6);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px rgba(255,255,255,.5),var(--glow)}
.vd-play svg{width:30px;height:30px;margin-left:4px}
.vd-play:hover{background:rgba(var(--accent-rgb),.85)}
.vd.loading::after{content:'';position:absolute;inset:0;margin:auto;width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;animation:phSpin .8s linear infinite}
.vd.loading .vd-play{display:none}
.vd-dur,.vd-exp{position:absolute;bottom:8px;padding:2px 8px;border-radius:99px;background:rgba(2,6,16,.7);color:#fff;font-size:12px;font-weight:600;line-height:18px}
.vd-dur{right:8px}
.vd-exp{left:8px}
.vd-gone{display:flex;align-items:center;gap:8px;margin:10px 0 4px;padding:10px 12px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:14px}
.vd-gone svg,.msg-story svg{width:18px;height:18px;flex:none}
.vd-story-box{display:flex;justify-content:center;margin-bottom:10px}
.vd-story-box:empty{display:none}
.vd-story-prev{position:relative;width:min(240px,60vw);aspect-ratio:9/16;border-radius:14px;overflow:hidden;background:#000}
.vd-story-prev video{width:100%;height:100%;object-fit:cover}
.vd-story-box .vd-chip{width:100%}
/* Fila de stories arriba del Inicio */
.stories{margin:0 0 14px;overflow:hidden}
.st-row{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 6px;scrollbar-width:none}
.st-row::-webkit-scrollbar{display:none}
.st-item{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;width:72px;flex:none;border:0;background:none;padding:0;color:var(--text);cursor:pointer;font:inherit}
.st-ring{display:flex;padding:3px;border-radius:50%;background:var(--line);border:0;cursor:pointer}
.st-ring .av{border:2px solid var(--bg);box-sizing:content-box}
.st-ring.new{background:conic-gradient(from 200deg,var(--neon),var(--accent),var(--violet),var(--neon));box-shadow:var(--glow)}
.st-ring.own{background:linear-gradient(135deg,var(--accent),var(--neon))}
.st-ring.add{background:transparent;padding:3px}
.st-plus{position:absolute;top:44px;right:4px;width:22px;height:22px;border-radius:50%;border:2px solid var(--bg);background:var(--accent);color:#fff;font-size:16px;font-weight:700;line-height:17px;padding:0;cursor:pointer}
.st-name{max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--muted)}
/* Visor de stories */
body.story-open .ebox{z-index:95}
.lightbox.story{cursor:default;padding:0;gap:0;background:rgba(2,6,16,.96)}
.sv-frame{position:relative;width:min(100vw,calc(100dvh * 9 / 16),460px);height:min(100dvh,820px);display:flex;flex-direction:column;background:#000;overflow:hidden}
@media (min-width:600px){.sv-frame{border-radius:16px;height:min(94dvh,820px);width:min(calc(94dvh * 9 / 16),460px)}}
.sv-bars{position:absolute;top:8px;left:8px;right:8px;z-index:3;display:flex;gap:4px}
.sv-bars i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.35);overflow:hidden}
.sv-bars i b{display:block;height:100%;width:0;background:#fff}
.sv-bars i.done b{width:100%}
.sv-head{position:absolute;top:18px;left:10px;right:6px;z-index:3;display:flex;align-items:center;gap:8px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.sv-who{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.sv-who b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sv-who span{font-size:12px;opacity:.8}
.sv-btn{width:36px;height:36px;border:0;border-radius:50%;background:transparent;color:#fff;font-size:20px;line-height:1;cursor:pointer;flex:none}
.sv-btn:hover{background:rgba(255,255,255,.15)}
.sv-stage{position:relative;flex:1;min-height:0}
.sv-stage video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
.sv-tap{position:absolute;top:70px;bottom:0;border:0;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent;z-index:1}
.sv-tap.prev{left:0;width:33%}
.sv-tap.next{right:0;width:67%}
.sv-big{position:absolute;inset:0;margin:auto;width:76px;height:76px;border-radius:50%;border:0;background:rgba(2,6,16,.6);color:#fff;z-index:2;cursor:pointer;display:flex;align-items:center;justify-content:center}
.sv-big[hidden],.sv-spin[hidden]{display:none}
.sv-big svg{width:36px;height:36px;margin-left:5px}
.sv-spin{position:absolute;inset:0;margin:auto;width:40px;height:40px;border-radius:50%;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;animation:phSpin .8s linear infinite;z-index:2;pointer-events:none}
.sv-foot{position:relative;z-index:3;padding:8px 10px calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;background:linear-gradient(transparent,rgba(0,0,0,.6))}
.sv-foot:empty{display:none}
.sv-quick{display:flex;justify-content:center;gap:4px}
.sv-quick button{width:40px;height:40px;border:0;border-radius:50%;background:rgba(255,255,255,.1);font-size:22px;line-height:1;cursor:pointer}
.sv-quick button:hover{background:rgba(255,255,255,.22)}
.sv-quick button.mine{background:rgba(var(--accent-rgb),.55);box-shadow:0 0 0 2px var(--neon)}
.sv-quick .more{color:#fff;font-size:20px}
.sv-reply{display:flex;gap:8px}
.sv-reply input{flex:1;min-width:0;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:99px;padding:9px 14px}
.sv-reply input::placeholder{color:rgba(255,255,255,.7)}
.sv-views{align-self:flex-start;border:0;border-radius:99px;background:rgba(255,255,255,.14);color:#fff;font:inherit;font-size:14px;padding:7px 14px;cursor:pointer}
.sv-viewers{max-height:40vh;overflow:auto;background:var(--panel);color:var(--text);border-radius:12px;padding:8px}
.sv-viewers[hidden]{display:none}
.sv-vrow{display:flex;align-items:center;gap:10px;padding:6px 4px}
.sv-vrow .sv-vname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sv-vrow b{font-size:18px}
.sv-menu{position:absolute;top:58px;right:10px;z-index:4}
.sv-float{position:absolute;left:50%;bottom:20px;font-size:56px;transform:translateX(-50%);animation:svFloat 1.2s ease-out forwards;pointer-events:none;z-index:4}
@keyframes svFloat{to{transform:translate(-50%,-220px) scale(1.4);opacity:0}}
@media (prefers-reduced-motion:reduce){.sv-float{animation:none;opacity:0}.sv-spin,.vd.loading::after{animation:none}}
/* Story: marco 9:16 con la foto o el vídeo y, encima, textos y dibujo (visor y editor) */
.sv-stage{container-type:size;display:flex;align-items:center;justify-content:center}
.st-media{position:relative;z-index:2;width:min(100cqw,calc(100cqh * 9 / 16));aspect-ratio:9/16;overflow:hidden;container-type:inline-size;background:#000;pointer-events:none}
.st-media video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.st-media video.fill{object-fit:cover}
.st-media video.framed{inset:auto;object-fit:fill;background:transparent}
.lightbox.sed .st-media{transition:background .3s}
.lightbox .st-media .st-photo{position:absolute;inset:0;width:100%;height:100%;max-width:none;max-height:none;aspect-ratio:auto;object-fit:cover;border-radius:0;box-shadow:none;background:none}
.st-media [hidden]{display:none}
.st-draw{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.st-texts{position:absolute;inset:0;pointer-events:none}
.st-t{position:absolute;transform:translate(-50%,-50%);width:max-content;max-width:88%;font-size:calc(var(--s) * 6.5cqw);font-weight:800;line-height:1.15;text-align:center;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--c);text-shadow:0 1px 3px rgba(0,0,0,.55);padding:.12em .4em;border-radius:.35em}
.st-t.bg{background:var(--c);color:var(--tc);text-shadow:none}
.st-t .mention{pointer-events:auto;cursor:pointer;color:inherit;background:none;text-decoration:underline;text-underline-offset:.12em}
/* Editor */
.lightbox.sed .st-media{pointer-events:auto;touch-action:none;cursor:move}
.lightbox.sed.drawing .st-media{cursor:crosshair}
.lightbox.sed .st-media .st-photo{inset:auto;max-width:none;max-height:none;object-fit:fill;user-select:none;-webkit-user-drag:none}
.lightbox.sed .st-texts{pointer-events:auto}
.lightbox.sed.drawing .st-texts{pointer-events:none}
.lightbox.sed .st-t{cursor:grab;touch-action:none;user-select:none}
.st-t.drag{opacity:.85;cursor:grabbing}
.sed-top{position:absolute;top:10px;left:8px;right:8px;z-index:5;display:flex;gap:8px;align-items:center}
.sed-top .sv-btn{background:rgba(0,0,0,.45)}
.sed-tool{min-width:42px;height:42px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;font:inherit;font-weight:800;font-size:17px;cursor:pointer}
.sed-tool.on{background:var(--accent);box-shadow:var(--glow)}
.sed-trash{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:56px;height:56px;border-radius:50%;background:rgba(0,0,0,.55);border:2px solid rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;font-size:26px;z-index:4;pointer-events:none;transition:transform .15s,background .15s}
.sed-trash.hot{background:var(--bad);transform:translateX(-50%) scale(1.2)}
.sed-trash[hidden]{display:none}
.sed-prog{position:absolute;left:10px;right:10px;top:62px;z-index:4}
.sed-prog:empty,.sed-prog .vd-story-prev,.sed-prog .vd-chip:not(.busy){display:none}
.sed-prog .vd-chip{background:rgba(0,0,0,.65);border-color:rgba(255,255,255,.25);color:#fff}
.sed-prog .vd-ptext{color:#fff}
.sed-bottom{position:relative;z-index:3;padding:10px 12px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;background:#000}
.sed-hint{margin:0;color:rgba(255,255,255,.7);font-size:12.5px;line-height:1.35;text-align:center}
.sed-colors{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.sed-c{width:28px;height:28px;padding:0;border-radius:50%;border:2px solid rgba(255,255,255,.75);cursor:pointer}
.sed-c.on{box-shadow:0 0 0 3px var(--neon)}
.sed-row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.sed-chip{border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.1);color:#fff;border-radius:99px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.sed-chip:disabled{opacity:.4;cursor:default}
.sed-size{display:flex;align-items:center;gap:6px;color:#fff;font-size:13px}
.sed-size input{width:110px;accent-color:var(--neon)}
.sed-textbox{position:absolute;inset:0;z-index:6;background:rgba(0,0,0,.62);display:flex;flex-direction:column;justify-content:center;gap:14px;padding:20px}
.sed-textbox[hidden]{display:none}
.sed-textbox textarea{background:transparent;border:0;outline:0;box-shadow:none;text-align:center;font-size:26px;font-weight:800;line-height:1.2;resize:none;border-radius:10px;padding:8px 10px;min-height:96px}
body.story-open .mbox{z-index:96}
/* Respuesta a una story en un mensaje privado */
.msg-story{display:flex;align-items:center;gap:8px;margin:0 0 6px;padding:4px 10px 4px 4px;border:1px solid var(--line);border-radius:10px;background:rgba(0,0,0,.12);color:inherit;font:inherit;font-size:12.5px;cursor:pointer;text-align:left}
.msg-story img{width:34px;height:56px;object-fit:cover;border-radius:6px;background:#000;flex:none}
.msg-story.off{cursor:default;opacity:.75;padding:6px 10px}
.msg-row.mine .msg-story{border-color:rgba(255,255,255,.35)}
/* Lo gastado en vídeo este mes (Ajustes del profesor) */
.vq-bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.vq-bar i{display:block;height:100%;background:var(--ok)}
.vq-bar i.warn{background:var(--warn)}
.vq-bar i.bad{background:var(--bad)}
.cm-new .ph-add.icon{width:40px;height:40px}
.dm-ph .ph-strip{padding:10px 12px 0}
.sdm-head h2{overflow-wrap:anywhere}
.sdm-item{flex:1 1 260px}
.sdm-open{cursor:pointer;border-radius:10px}
.sdm-open:hover b{color:var(--accent)}
.sdm-item .tmain{flex:1}
.sdm-item .playbtn{margin-left:4px}
.grid2{display:grid;grid-template-columns:170px 1fr;gap:10px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
details{margin-top:10px}
summary{cursor:pointer;color:var(--accent-hi);font-size:14px;font-weight:600;user-select:none}
.frow{display:grid;grid-template-columns:minmax(120px,1.1fr) 150px 1.4fr;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.frow:last-of-type{border-bottom:0}
@media (max-width:640px){ .grid2{grid-template-columns:1fr} .frow{grid-template-columns:1fr} }

/* ---------- Pantallas de acceso ---------- */
.auth{max-width:420px;margin:8vh auto 0;padding:0 16px}
.auth-brand{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:22px;text-align:center}
.auth-brand img{width:76px;height:76px;border-radius:20px;box-shadow:var(--glow)}
.auth-brand b{font-size:22px;color:var(--strong);letter-spacing:-.01em}
.auth-brand small{color:var(--faint);font-size:13.5px}
.auth .panel{padding:24px}
.auth h1{font-size:21px;margin-bottom:4px}
.auth p.lead{color:var(--muted);margin:0 0 18px;font-size:14px}
.auth form .btn{width:100%;padding:11px}
.msg{font-size:13.5px;border-radius:10px;padding:10px 12px;margin:0 0 12px;border:1px solid var(--line)}
.msg.bad{color:var(--bad);border-color:rgba(var(--bad-rgb),.4);background:rgba(var(--bad-rgb),.07)}
.msg.ok{color:var(--ok);border-color:rgba(var(--ok-rgb),.4);background:rgba(var(--ok-rgb),.07)}
.msg.info{color:var(--accent-hi);border-color:rgba(var(--accent-rgb),.35);background:rgba(var(--accent-rgb),.07)}
.linkbtn{font:inherit;font-size:13.5px;font-weight:600;color:var(--accent-hi);background:none;border:0;padding:0;cursor:pointer;text-decoration:none}
.linkbtn:hover{text-decoration:underline;text-underline-offset:3px}
.stack{display:flex;flex-direction:column;gap:10px}
.center{text-align:center}
code{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:13px}

/* ---------- Toast ---------- */
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
@media (max-width:760px){ #toast{bottom:84px} }
.toast{background:var(--panel);border:1px solid var(--line-strong);color:var(--strong);border-radius:12px;padding:10px 16px;font-size:14px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.3),var(--glow-sm);animation:tin .2s ease-out}
.toast.bad{border-color:rgba(var(--bad-rgb),.55)}
.toast.ok{border-color:rgba(var(--ok-rgb),.55)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.loading{color:var(--muted);text-align:center;padding:60px 0}
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }

/* ---------- Pulido estilo plataforma (2026-11-28, Yuri: "como los paneles de Evenant", con nuestra paleta) ----------
   Paneles planos: radio 12, sin sombra ni brillo, borde muy suave. Los posts van por zonas, como en Evenant:
   cabecera + contenido + reacciones arriba y, abajo, una franja algo más oscura con los comentarios. */
:root,html[data-theme="dark"]{--pline:rgba(98,150,255,.10);--pfoot:#08112a;--bubble:#122045}
html[data-theme="light"]{--pline:rgba(30,60,140,.10);--pfoot:#f6f8fd;--bubble:#eef2fa}
.panel,.card,.dcard,.fpost{border-radius:12px}
html[data-theme="dark"] :is(.panel,.card,.dcard,.fpost){box-shadow:none;border-color:var(--pline)}
html[data-theme="light"] :is(.panel,.card,.dcard,.fpost){box-shadow:0 1px 2px rgba(20,33,61,.05);border-color:var(--pline)}
.empty{border-radius:12px}
.main{padding-top:8px}

/* Caja de publicar: compacta (una línea) y crece al escribir */
.composer{padding:14px 16px;align-items:flex-start}
.composer-main{gap:10px}
.composer-main textarea{min-height:44px;height:44px;resize:none;border-radius:10px;padding-top:11px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;transition:height .15s}
.composer-main textarea:focus,.composer-main textarea:not(:placeholder-shown){height:104px;overflow:auto;white-space:pre-wrap}
.composer .actions .btn{padding:7px 12px;font-size:13.5px}
.composer .actions .btn svg{width:16px;height:16px}

/* Post */
.fpost{padding:18px 20px;gap:12px}
.fhead{gap:11px}
.fhead b{font-size:15px}
.fhead .sub{font-size:12.5px}
.fbody{font-size:15px;line-height:1.6}
.fpost>.factions{border-top:0;padding-top:0;gap:18px;margin-top:-2px}
.fpost>.factions .linkbtn{font-size:13px}
.fpost>.factions .linkbtn:not(.mute){color:var(--muted)}
.fpost>.factions .linkbtn:not(.mute):hover{color:var(--accent-hi)}
.fpost>.cm-peek{margin:2px -20px -18px;padding:14px 20px 16px;background:var(--pfoot);border-top:1px solid var(--pline);border-radius:0 0 12px 12px;gap:10px}
.peek-bubble{background:var(--bubble);border:1px solid transparent;border-radius:10px}
.peek-cmt:hover .peek-bubble{border-color:var(--pline);background:var(--bubble)}
.peek-input{border-radius:10px;background:var(--panel);border-color:var(--pline)}
.peek-rx{box-shadow:none;border-color:var(--pline)}
.rxb{border-color:var(--pline);background:var(--panel2)}
.rxb.mine{background:rgba(var(--accent-rgb),.13)}

/* Columna derecha: títulos como los de Evenant (normales, en negrita), no en mayúsculas */
@media (min-width:1100px){
  .rail .foryou,.rail .rail-card{box-shadow:none;border-color:var(--pline);border-radius:12px;padding:16px 8px 8px}
  .rail .fy-head{font-size:15px;font-weight:700;letter-spacing:0;text-transform:none;color:var(--strong);padding:0 10px 10px}
}
.fy-chip{border-color:var(--pline);border-radius:12px}

/* Cápsulas con su color de siempre (Yuri: que llamen la atención): cada aviso es una ficha tintada según su estado */
.fy-chip{background:rgba(var(--accent-rgb),.07);border-color:rgba(var(--accent-rgb),.22)}
.fy-chip:hover{background:rgba(var(--accent-rgb),.12)}
.fy-chip.bad{background:rgba(var(--bad-rgb),.10);border-color:rgba(var(--bad-rgb),.45)}
.fy-chip.bad:hover{background:rgba(var(--bad-rgb),.15)}
.fy-chip.warn{background:rgba(var(--warn-rgb),.10);border-color:rgba(var(--warn-rgb),.45)}
.fy-chip.warn:hover{background:rgba(var(--warn-rgb),.15)}
.fy-chip.new{background:rgba(var(--accent-rgb),.15);border-color:rgba(var(--accent-rgb),.65)}
.fy-chip.new:hover{background:rgba(var(--accent-rgb),.2)}
@media (min-width:1100px){
  .rail .fy-chips{gap:8px;padding:0 4px}
  .rail .fy-chip{border:1px solid rgba(var(--accent-rgb),.22);border-radius:10px;padding:10px 12px}
  .rail .fy-chip.bad{border-color:rgba(var(--bad-rgb),.45)}
  .rail .fy-chip.warn{border-color:rgba(var(--warn-rgb),.45)}
  .rail .fy-chip.new{border-color:rgba(var(--accent-rgb),.65)}
  .rail .fy-chip+.fy-chip::before{display:none}
  .rail .fy-chip:hover{background:rgba(var(--accent-rgb),.12)}
  .rail .fy-chip.bad:hover{background:rgba(var(--bad-rgb),.15)}
  .rail .fy-chip.warn:hover{background:rgba(var(--warn-rgb),.15)}
  .rail .fy-chip.new:hover{background:rgba(var(--accent-rgb),.2)}
  .rail .fy-chip.new::after{top:16px}
  .rail .fyc-ic{background:var(--panel)}
}

/* Pie del post como en Evenant: iconos de línea (me gusta y comentar), sin textos */
.rxb.main{border-color:transparent;background:transparent;color:var(--muted);padding:4px 8px;gap:6px;font-size:14px;font-weight:600}
.rxb.main:hover{background:var(--hover);border-color:transparent;color:var(--strong)}
.rxb.main .rxe{display:inline-flex}
.rxb.main svg.i{width:19px;height:19px}
.rxb.main:not(.mine) .rxe{filter:none;opacity:1}
.rxb.main.mine{background:transparent;border-color:transparent;color:var(--accent-hi)}
.rxb.main.mine:hover{background:rgba(var(--accent-rgb),.10)}
.rxb.main.mine svg.i{fill:rgba(var(--accent-rgb),.28)}
.cmt-foot .rxb.main{padding:2px 6px}
.cmt-foot .rxb.main svg.i{width:16px;height:16px}
.fbar{display:flex;align-items:center;flex-wrap:wrap;gap:4px 6px;margin:-2px 0 0 -8px}
.fbar>.rx,.fbar .rx-list{display:contents} /* me gusta, demás emojis y comentar en una fila; "Tú y Lu" a la derecha */
.fbar-cm{order:1}
.fbar .rx-who{order:2;margin-left:auto}
.fbar-cm{font:inherit;cursor:pointer;color:var(--muted);background:transparent;border:0;border-radius:999px;padding:4px 8px;display:inline-flex;align-items:center;height:30px;transition:background .15s,color .15s}
.fbar-cm:hover{background:var(--hover);color:var(--strong)}
.fbar-cm svg.i{width:19px;height:19px}
/* Herramientas arriba a la derecha del post: editar / denunciar y la cruz de eliminar */
.fpost>.fhead>div:not(.ftools){min-width:0;flex:1}
.ftools{display:flex;gap:2px;margin-left:auto;align-self:flex-start;margin-top:-4px;margin-right:-8px}
.ftool{font:inherit;cursor:pointer;color:var(--faint);background:transparent;border:0;border-radius:8px;width:32px;height:32px;display:grid;place-items:center;transition:background .15s,color .15s}
.ftool svg.i{width:17px;height:17px}
.ftool:hover{background:var(--hover);color:var(--strong)}
.ftool.del:hover{background:rgba(var(--bad-rgb),.12);color:var(--bad)}
.ftool.done{cursor:default;color:var(--bad);opacity:.7}
.ftool.done:hover{background:transparent}

/* Stories en la barra de arriba (PC; Yuri: así el Inicio empieza a la misma altura que las columnas de los lados).
   Empiezan justo encima de la columna central; en el móvil siguen encima de las publicaciones. */
.top-st{flex:1;min-width:0;margin-left:20px;display:flex;align-items:center;height:100%}
.top-st .stories{margin:0;overflow:hidden;min-width:0;height:100%;display:flex;align-items:center} /* centradas en la barra, sin cortar el aro */
.top-st .st-row{gap:10px;padding:6px 4px;align-items:center}
.top-st .st-item{width:auto}
.top-st .st-name{display:none}
.top-st .st-ring{padding:2px}
.top-st .st-plus{top:auto;bottom:-2px;right:-3px;width:18px;height:18px;font-size:13px;line-height:14px}
.top-st .st-ring.new{box-shadow:none}
@media (min-width:761px){ .home>.stories{display:none} .sidebar{padding-top:8px} } /* el menú empieza a la altura de los paneles */
/* Móvil: fila de stories más apretada arriba y abajo (Yuri, 2026-11-28) */
@media (max-width:760px){ .home>.stories{margin:-6px 0 6px} .home>.stories .st-row{padding:2px 2px 0} .home>.stories .st-item{gap:2px} }
@media (max-width:760px){ .top-st{display:none} }

/* Cuadro de publicar como el de Facebook: dentro del campo, a la derecha, multimedia (fotos o vídeo) y emojis.
   "Publicar" solo aparece cuando hay algo que publicar o estás escribiendo. */
.composer-main{position:relative}
.composer-main textarea,.composer-main .emo-wrap>textarea{padding-right:80px}
.composer .emo-btn{bottom:auto;top:7px;z-index:2}
.composer-main .emo-wrap::after{content:"";position:absolute;right:1px;top:1px;bottom:1px;width:84px;border-radius:0 10px 10px 0;background:linear-gradient(90deg,rgba(var(--bg-rgb,0,0,0),0),var(--field) 16px);pointer-events:none;z-index:1} /* tapa el texto que se cuela bajo los iconos */
.md-btn{position:absolute;right:40px;top:7px;width:30px;height:30px;padding:0;border:0;border-radius:8px;background:none;color:var(--faint);display:grid;place-items:center;cursor:pointer;transition:color .15s,background .15s;z-index:2}
.md-btn:hover{color:var(--accent-hi);background:rgba(var(--accent-rgb),.12)}
.md-btn svg{width:20px;height:20px}
/* Se recoge con un pequeño retraso: si se recogiera al momento, la página se movería bajo el ratón y el clic caería en otro sitio */
.composer-main>.actions{max-height:60px;transition:max-height .15s}
.composer:not(:focus-within):not(.has-vd):not(:has(textarea:not(:placeholder-shown))):not(:has(.ph-chip)) .composer-main>.actions{max-height:0;overflow:hidden;opacity:0;visibility:hidden;margin-top:-10px!important;transition:max-height 0s .35s,opacity 0s .35s,visibility 0s .35s,margin 0s .35s}
.composer-main textarea{transition:height .15s .35s}
.composer-main textarea:focus,.composer-main textarea:not(:placeholder-shown){transition:height .15s}

/* Paneles sin borde en el modo oscuro (Yuri, 2026-11-28). Se distinguen solo por su color de fondo.
   Los bordes de estado (aviso nuevo, sin leer, denuncias, vencidas) se mantienen. */
html[data-theme="dark"] :is(.panel,.card,.dcard,.fpost,.row,.payrow,.stat,.mrow,.modal,.foryou,.rail-card){border-color:transparent} /* solo en oscuro: en claro los paneles se perdían (Yuri) */
html[data-theme="dark"] .card.post.isnew{border-color:rgba(var(--accent-rgb),.45)}
html[data-theme="dark"] .mrow.unread{border-color:rgba(var(--accent-rgb),.35)}
html[data-theme="dark"] .stat.warn{border-color:rgba(var(--warn-rgb),.45)}
html[data-theme="dark"] .stat.bad{border-color:rgba(var(--bad-rgb),.45)}
html[data-theme="dark"] .stat.acc{border-color:rgba(var(--accent-rgb),.5)}
html[data-theme="dark"] .dcard.mod{border-color:rgba(var(--warn-rgb),.45)}
</style>

<script>
/* =====================================================================
   CONFIGURACIÓN — las claves de Supabase viven en el archivo config.js
   (al lado de este index.html). Así puedes actualizar index.html las
   veces que quieras sin volver a pegar tus claves.
   ===================================================================== */
const CFG = window.APP_CONFIG || {};
// Se queda solo con "https://xxxx.supabase.co": si pegaste la URL con /rest/v1/ o una barra final, no importa.
function cleanUrl(u) { try { return new URL(String(u || '').trim()).origin; } catch { return ''; } }
const SUPABASE_URL = cleanUrl(CFG.SUPABASE_URL);
const SUPABASE_KEY = String(CFG.SUPABASE_KEY || '').trim();

/* Nombre visible de la app (cabecera, pantallas de acceso, imagen PNG exportada). */
const APP_NAME = 'Yurimh Music Academy';
const APP_SHORT = 'Yurimh'; // donde no cabe el nombre completo: barra superior del móvil e icono instalado
/* Nombre del módulo actual (aparece en el menú superior). */
const MODULE_LISTENING = 'Escucha analítica';

/* ===================================================================== */
const QUESTIONS = [
  { k: 'highlights',       q: '¿Qué destacas del álbum/playlist/canción?' },
  { k: 'likes',         q: '¿Qué te gusta?' },
  { k: 'dislikes',       q: '¿Qué no te gusta?' },
  { k: 'learned',     q: '¿Qué has aprendido?' },
  { k: 'would_use', q: '¿Qué aprovecharías para alguno de tus grupos o tu música?' },
  { k: 'would_never_use',         q: '¿Qué jamás usarías en uno de tus grupos o música?' }
];
const KIND = { album: 'Álbum', song: 'Canción', playlist: 'Playlist' };

const configured = /^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(SUPABASE_URL) && SUPABASE_KEY.length > 20 && !SUPABASE_URL.includes('TU-PROYECTO') && !SUPABASE_KEY.includes('TU-CLAVE');
document.title = APP_NAME;
// sb pasa por previewGuard: en la «Vista de alumno» del profesor bloquea cualquier escritura (ver VISTA DE ALUMNO)
const sb = configured ? previewGuard(supabase.createClient(SUPABASE_URL, SUPABASE_KEY)) : null;

const S = {
  user: null, profile: null,
  items: [], assigns: [], students: [], folders: [], genres: [], itemGenres: [],
  posts: [], recipients: [], reads: [],
  fposts: [], fcomments: [], lcomments: [], reactions: [], reports: [], dir: {},
  stories: [], storyViews: [], storyRx: [],
  dms: [], dmRx: [], ansRx: [], blocks: [], dmContacts: [], dmCan: {}, dmWith: null, notifs: [], mates: [],
  homework: [], payPlans: [], payRecords: [], payMonth: null,
  goalStages: [], goalItems: [], goalDone: [], goalPending: false, streakAwards: [], rankPending: false,
  lessons: [], lessonNames: [], lessonSync: null, agendaWeek: null,
  hwTab: 'tasks', hwSel: null, hwOpen: false, // Deberes: pestaña del alumno; alumno elegido por el profesor (y si en el móvil está abierto)
  // Alumnos (profesor): vista del PC (lista + resumen o tabla; preferencia como el tema), alumno elegido, ficha abierta como pantalla y orden de la tabla
  stuView: (() => { try { return localStorage.getItem('ya-stuview') === 'table' ? 'table' : 'list'; } catch (e) { return 'list'; } })(),
  stuSel: null, stuPage: null, stuSort: { k: 'att', d: 1 },
  section: 'feed', filter: 'pend',
  feedQueue: [] // publicaciones nuevas de otros que llegan en directo y esperan al botón "↑ nuevas"
};
let recovering = location.hash.includes('type=recovery');
let modalOnClose = null;
let cur = null; // estado del modal de alumno abierto

/* ---------------------------- Utilidades ---------------------------- */
const $ = (s, r = document) => r.querySelector(s);

}

async function errEsAuth(e) {

  if (!limited) return errEs(e);

  try { const r = await sb.rpc('email_wait_seconds'); if (!r.error && typeof r.data === 'number') secs = r.data; } catch (_) {}

  if (secs === null) return errEs(e);

}

   Bloques: ```varias líneas``` (monoespaciado, para acordes o tablaturas), "# " / "## " / "### " títulos

/* Bloques: las líneas que empiezan por "- ", "* " o "• " se ven como viñetas, las que empiezan por "1. " o "1) ", numeradas,

   Trabaja sobre el HTML ya escapado (ninguna etiqueta generada contiene saltos de línea, así que partir por \n es seguro).

    if (!list) return;

    else {
      const start = list.tag === 'ol' && list.start !== 1 ? ` start="${list.start}"` : '';

/* ---- Selector de reacciones estilo Facebook ----
   Ordenador: pasar el ratón por el 👍🏼 (o por el selector) lo abre; salir lo cierra.
   Móvil: mantener pulsado el 👍🏼. Un toque normal da o quita el "me gusta". */
let rxOpenEl = null, rxShowT = 0, rxHideT = 0, rxPress = null, rxLong = false, rxLongEnd = 0, rxScrollY = 0;
function rxShow(main) {
  const bar = main.closest('.rx'), pk = bar && bar.querySelector('.rx-pick');
  if (!pk) return;
  if (rxOpenEl && rxOpenEl !== pk) rxOpenEl.hidden = true;
  pk.hidden = false; rxOpenEl = pk; rxScrollY = scrollY;
  // Si algún contenedor tiene transform/filter, "fixed" se mide desde él y no
  // desde la ventana: se coloca en 0,0, se mira dónde cae y se compensa.
  pk.style.animation = 'none'; pk.style.left = '0px'; pk.style.top = '0px';
  const o = pk.getBoundingClientRect();
  pk.style.animation = '';
  const r = main.getBoundingClientRect(), w = pk.offsetWidth, h = pk.offsetHeight;
  const left = Math.max(8, Math.min(r.left, innerWidth - w - 8));
  const top = r.top - h - 6 >= 8 ? r.top - h - 6 : r.bottom + 6;
  pk.style.left = (left - o.left) + 'px'; pk.style.top = (top - o.top) + 'px';

    if (!isMouse(e) || !e.target.closest) return;
    const main = e.target.closest('.rxb.main'), pk = e.target.closest('.rx-pick');
    if (main || (pk && pk === rxOpenEl)) clearTimeout(rxHideT);
    if (main && !(rxOpenEl && main.closest('.rx').contains(rxOpenEl))) {
      clearTimeout(rxShowT); rxShowT = setTimeout(() => rxShow(main), 450);
    }
  });
  document.addEventListener('pointerout', e => {
    if (!isMouse(e) || !e.target.closest) return;
    if (!e.target.closest('.rxb.main, .rx-pick')) return;
    const to = e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('.rxb.main, .rx-pick');
    if (to) return;
    clearTimeout(rxShowT); clearTimeout(rxHideT);
    rxHideT = setTimeout(rxHide, 350);

  // Pulsación larga (táctil). Va con eventos touch y no pointer: el navegador
  // corta los pointer (pointercancel) en cuanto cree que vas a desplazar o a
  // seleccionar, y eso era lo que impedía abrir el selector en el móvil.
  document.addEventListener('touchstart', e => {
    const t = e.target.closest ? e.target : e.target.parentElement;
    const main = t && t.closest('.rxb.main');

    if (!main || e.touches.length > 1) return;
    rxLong = false;
    const p = e.touches[0];
    rxPress = { x: p.clientX, y: p.clientY, t: setTimeout(() => {
      rxLong = true; rxShow(main);
      if (navigator.vibrate) try { navigator.vibrate(15); } catch (_) {}

  const cancel = () => { if (rxPress) clearTimeout(rxPress.t); rxPress = null; };

    const p = e.touches[0];
    if (rxLong && rxOpenEl) { if (e.cancelable) e.preventDefault(); hot(under(p)); return; }

  document.addEventListener('touchend', e => {
    cancel();
    if (!rxLong) return;
    // Al soltar tras mantener: ni clic ("me gusta") ni selección de texto;
    // se aplica el emoji que haya bajo el dedo (si hay) y la burbuja se cierra.
    if (e.cancelable) e.preventDefault();
    const b = under(e.changedTouches[0]);
    rxLong = false; rxLongEnd = Date.now(); rxHide();
    if (b) actions['rx-toggle'](b);
  }, { passive: false });
  document.addEventListener('touchcancel', () => { cancel(); if (rxLong) { rxLong = false; rxHide(); } });
  // Por si aun así llega el clic tras una pulsación larga
  document.addEventListener('click', e => {
    if (Date.now() - rxLongEnd < 700 && e.target.closest && e.target.closest('.rxb.main')) { rxLongEnd = 0; e.stopPropagation(); e.preventDefault(); }
  }, true);
  document.addEventListener('contextmenu', e => { if (e.target.closest && e.target.closest('.rxb.main, .rx-pick')) e.preventDefault(); });
  // Desplazar la página cierra el selector (con margen, por si el dedo tiembla)
  addEventListener('scroll', () => { if (!rxOpenEl) rxScrollY = scrollY; else if (Math.abs(scrollY - rxScrollY) > 30) rxHide(); }, true);
  addEventListener('keydown', e => { if (e.key === 'Escape' && rxOpenEl) rxHide(); });
}

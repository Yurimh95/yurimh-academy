<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Yurimh Music Academy</title>
<link rel="icon" type="image/png" href="icon-round.png">
<!-- Instalable como app en el móvil (PWA) -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#050b1c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Yurimh">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>
/* Tema claro/oscuro: se aplica antes de pintar para que no haya parpadeo.
   La preferencia se guarda solo en este navegador (es una comodidad, no un dato de la app). */
(function () {
  var t = null;
  try { t = localStorage.getItem('ya-theme'); } catch (e) { }
  if (t !== 'light' && t !== 'dark') t = (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
})();
</script>
<style>
/* =====================================================================
   DISEÑO · Marca Yurimh: azul eléctrico + cian neón
   Dos temas (oscuro y claro) con los mismos nombres de variables.
   ===================================================================== */
:root, html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#050b1c; --bg2:#030714;
  --halo:radial-gradient(900px 520px at 12% -12%, rgba(47,134,255,.20), transparent 60%),
         radial-gradient(760px 520px at 108% 108%, rgba(20,80,224,.18), transparent 60%);
  --panel:#0b1530; --panel2:#0f1b3b; --field:#081128; --hover:#13234d;
  --line:rgba(98,150,255,.16); --line-strong:rgba(98,150,255,.34);
  --text:#dfe8fb; --strong:#f2f6ff; --muted:#93a7d1; --faint:#6a7ea8;
  --accent:#2f86ff; --accent-rgb:47,134,255; --accent-hi:#62b4ff; --on-accent:#fff;
  --neon:#3ff0ff; --neon-rgb:63,240,255;
  --violet:#8ea2ff; --violet-rgb:142,162,255;
  --ok:#3ddc97; --ok-rgb:61,220,151;
  --warn:#ffc94a; --warn-rgb:255,201,74;
  --bad:#ff5a7a; --bad-rgb:255,90,122;
  --shadow:0 1px 0 rgba(255,255,255,.035) inset, 0 10px 30px rgba(0,0,0,.32);
  --glow:0 0 18px rgba(47,134,255,.38), 0 0 2px rgba(63,240,255,.55);
  --glow-sm:0 0 10px rgba(47,134,255,.28);
  --overlay:rgba(2,5,14,.74);
}
html[data-theme="light"]{
  color-scheme:light;
  --bg:#f3f6fc; --bg2:#e7eef9;
  --halo:radial-gradient(900px 520px at 12% -12%, rgba(37,99,235,.10), transparent 60%);
  --panel:#ffffff; --panel2:#f4f7fd; --field:#f7f9fe; --hover:#eef3fd;
  --line:rgba(30,60,140,.11); --line-strong:rgba(30,60,140,.22);
  --text:#22304f; --strong:#0f1a33; --muted:#53648a; --faint:#8090ae;
  --accent:#2563eb; --accent-rgb:37,99,235; --accent-hi:#1d4ed8; --on-accent:#fff;
  --neon:#0ea5e9; --neon-rgb:14,165,233;
  --violet:#5b54d6; --violet-rgb:91,84,214;
  --ok:#0b8a52; --ok-rgb:11,138,82;
  --warn:#a86500; --warn-rgb:168,101,0;
  --bad:#c4243f; --bad-rgb:196,36,63;
  --shadow:0 1px 2px rgba(20,33,61,.06), 0 6px 20px rgba(20,33,61,.06);
  --glow:0 0 0 3px rgba(37,99,235,.13), 0 4px 14px rgba(37,99,235,.28);
  --glow-sm:0 2px 8px rgba(37,99,235,.18);
  --overlay:rgba(15,26,51,.42);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;color:var(--text);min-height:100vh;
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI Variable","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--halo),linear-gradient(180deg,var(--bg),var(--bg2));background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
}
body.noscroll{overflow:hidden}
h1,h2,h3{color:var(--strong);margin:0;line-height:1.25;letter-spacing:-.01em}
a{color:var(--accent-hi)}
::selection{background:rgba(var(--accent-rgb),.3)}
svg.i{width:20px;height:20px;flex:none}

/* ---------- Estructura estilo app ---------- */
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px;max-width:1280px;margin:0 auto;padding:0 24px}
.main{min-width:0;padding:18px 0 60px}
.sidebar{position:sticky;top:0;height:100vh;padding:20px 0;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 20px;color:var(--strong)}
.brand img{width:38px;height:38px;flex:none;border-radius:12px;object-fit:cover;box-shadow:var(--glow)}
.brand b{display:block;font-size:15px;letter-spacing:-.02em;white-space:nowrap}
.brand small{display:block;color:var(--faint);font-size:12px;font-weight:500}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{
  font:inherit;font-weight:500;font-size:14.5px;cursor:pointer;color:var(--muted);background:none;border:0;
  display:flex;align-items:center;gap:13px;width:100%;text-align:left;padding:10px 12px;border-radius:11px;position:relative;
  transition:background .15s,color .15s;
}
.nav button:hover{background:var(--hover);color:var(--strong)}
.nav button.on{color:var(--strong);background:rgba(var(--accent-rgb),.13);font-weight:600}
.nav button.on::before{content:"";position:absolute;left:-1px;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--neon);box-shadow:0 0 10px var(--neon)}
.nav button.on svg{color:var(--accent-hi)}
.nbadge{margin-left:auto;font-size:11px;font-weight:700;color:var(--on-accent);background:var(--accent);border-radius:999px;padding:1px 8px;white-space:nowrap}
.nbadge.warn{background:var(--warn);color:#1a1200}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-top:16px}
.me{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--panel)}
.me .who{flex:1;min-width:0;font-size:14px;font-weight:600;color:var(--strong);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me .who small{display:block;color:var(--faint);font-weight:500;font-size:12px}
/* Vista de alumno (profesor): botón para entrar y barra fija para salir */
.pvbtn{justify-content:center}
.pvbtn svg,.pvbar svg{width:17px;height:17px}
.pvbar{position:sticky;top:8px;z-index:30;display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 14px;padding:8px 8px 8px 14px;border-radius:12px;background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--neon);box-shadow:0 0 18px rgba(var(--neon-rgb),.18);color:var(--strong);font-size:14px}
.pvbar .t{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.pvbar .t svg{color:var(--neon);flex:none}
.pvbar .sub{font-size:12.5px}
@media (max-width:760px){.pvbar .sub{display:none}}
.iconbtn{font:inherit;cursor:pointer;width:38px;height:38px;flex:none;border-radius:11px;border:1px solid var(--line);background:var(--panel);color:var(--muted);display:inline-grid;place-items:center;transition:color .15s,border-color .15s,background .15s}
.iconbtn:hover{color:var(--strong);border-color:var(--line-strong);background:var(--hover)}
.iconbtn.sm{width:32px;height:32px;border-radius:9px;border-color:transparent;background:transparent}
.iconbtn.sm svg{width:18px;height:18px}

/* Interruptor claro / oscuro */
.theme{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px}
.theme button{flex:1;font:inherit;cursor:pointer;border:0;background:transparent;color:var(--muted);padding:6px 10px;border-radius:999px;font-size:13px;font-weight:600;display:flex;gap:6px;align-items:center;justify-content:center;transition:background .15s,color .15s}
.theme button svg{width:15px;height:15px}
.theme button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);box-shadow:var(--glow-sm)}

/* Barra superior */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;margin:0 0 18px}
.top h1.sec{font-size:24px;letter-spacing:-.02em}
.top-r{display:flex;align-items:center;gap:8px;margin-left:auto}
/* Botón "Instalar app": visible mientras no tenga la app del móvil. Neón, pero quieto (sin parpadeos) */
.installbtn{font:inherit;font-size:13.5px;font-weight:650;cursor:pointer;height:38px;padding:0 13px;border-radius:11px;display:inline-flex;align-items:center;gap:7px;color:var(--neon);background:rgba(var(--accent-rgb),.10);border:1.5px solid var(--neon);box-shadow:0 0 12px rgba(var(--neon-rgb),.35),inset 0 0 10px rgba(var(--neon-rgb),.10);white-space:nowrap;transition:filter .15s,background .15s}
.installbtn:hover{background:rgba(var(--accent-rgb),.2);filter:brightness(1.1)}
.installbtn svg{width:18px;height:18px}
html[data-theme="light"] .installbtn{color:var(--accent);border-color:var(--accent);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.12)}
.install-hero{display:flex;gap:16px;align-items:center;margin:4px 0 16px}
.install-hero img{width:72px;height:72px;border-radius:18px;flex:none;box-shadow:var(--glow)}
.perks{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:14.5px}
.perks li::before{content:"✓";color:var(--neon);font-weight:700;margin-right:8px}
html[data-theme="light"] .perks li::before{color:var(--accent)}
.isteps{margin:0;padding-left:22px;display:grid;gap:8px;font-size:14.5px}
.qrwrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.qr{width:150px;height:150px;flex:none;border-radius:12px;background:#fff;padding:8px;display:grid;place-items:center;color:#555;font-size:12px;text-align:center}
.qr svg{width:100%;height:100%}
.two.prof-grid{grid-template-columns:repeat(2,minmax(0,1fr));align-items:stretch}
@media (max-width:760px){.two.prof-grid{grid-template-columns:1fr}}
.about,.panel.mates{grid-column:1/-1}
/* "Sobre ti" a lo ancho en el ordenador: bio arriba, 3 campos cortos en fila y 2 largos debajo */
.about-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0 14px}
.about-grid .a-bio{grid-column:1/-1}.about-grid .a-3{grid-column:span 2}.about-grid .a-2{grid-column:span 3}
@media (max-width:760px){.about-grid{grid-template-columns:1fr}.about-grid .a-3,.about-grid .a-2{grid-column:1/-1}}
/* ---- Deberes ---- */
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:0 0 16px}
.hwgroups{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.hwgroup{min-width:0}
.hwgroup .dhead{flex-wrap:wrap}
.hwgroup .dhead h2{display:flex;align-items:center;gap:10px;margin:0}
.hwlist{display:flex;flex-direction:column;gap:8px}
.hw{display:flex;align-items:flex-start;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.dcard .hw{background:var(--panel2)}
.hwcheck{flex:none;width:28px;height:28px;margin-top:1px;border-radius:50%;border:2px solid var(--line-strong);background:transparent;color:transparent;cursor:pointer;display:grid;place-items:center;transition:all .15s}
.hwcheck svg{width:16px;height:16px}
.hwcheck:hover{border-color:var(--accent);color:rgba(var(--accent-rgb),.5)}
.hwcheck[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.hwbody{flex:1;min-width:0}
.hwtitle{font-weight:650;color:var(--strong);overflow-wrap:anywhere}
.hw.done .hwtitle{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(var(--ok-rgb),.6)}
.hwdet{color:var(--text);font-size:14px;margin-top:4px;white-space:pre-wrap;overflow-wrap:anywhere}
.hwmeta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.hwmeta:empty{display:none}
.hwtools{display:flex;gap:4px;flex:none}
.hwdone{margin-top:14px}
/* Objetivos */
.goals{grid-column:1/-1}
.gprog{display:flex;align-items:center;gap:10px}
.gbar{flex:1;height:12px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);overflow:hidden}
.gbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--neon));box-shadow:0 0 12px rgba(var(--neon-rgb),.45);transition:width .6s ease}
.gprog b{color:var(--strong);font-variant-numeric:tabular-nums}
.gcur{margin:6px 0 0}.gcur:empty{display:none}
.gstages{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.gstage{margin:0;border:1px solid var(--line);border-radius:14px;background:var(--panel2);overflow:hidden}
.gstage>summary{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;list-style:none;font-weight:650;color:var(--strong)}
.gstage>summary::-webkit-details-marker{display:none}
.gstage>.hwlist{padding:0 10px 10px}
.gnum{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;background:rgba(var(--accent-rgb),.12);color:var(--accent);border:1px solid rgba(var(--accent-rgb),.3)}
.gnum svg{width:15px;height:15px}
.gstage.full .gnum{background:var(--ok);border-color:var(--ok);color:#fff}
.gst{flex:1;min-width:0}
.gcount{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.goal span.hwcheck{cursor:default}
.goal span.hwcheck:hover{border-color:var(--line-strong);color:transparent}
.goal span.hwcheck[aria-pressed="true"]:hover{border-color:var(--ok);color:#fff}
.goal.done .hwtitle{text-decoration:none;color:var(--strong)}
.gcat{margin-top:14px}
.gcat-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.gcat-head input{flex:1;font-weight:650}
.modal.wide{max-width:760px}
.celebrate{text-align:center;padding:8px 4px}
.celebrate h2{margin:6px 0 12px}
.trophy{font-size:64px;line-height:1;animation:trophy .9s cubic-bezier(.2,1.6,.4,1) both}
@keyframes trophy{from{transform:scale(.2) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
.gwins{list-style:none;padding:0;margin:0 0 14px;display:flex;flex-direction:column;gap:6px}
.gwins li{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:650;color:var(--strong)}
.gwins svg{width:18px;height:18px;color:var(--ok)}
.celebrate .gprog{max-width:320px;margin:0 auto}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden}
.confetti i{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;animation-name:confall;animation-timing-function:cubic-bezier(.3,.6,.6,1);animation-fill-mode:forwards}
.confetti .c0{background:var(--accent)}.confetti .c1{background:var(--neon)}.confetti .c2{background:var(--ok)}.confetti .c3{background:var(--warn)}.confetti .c4{background:var(--violet)}
@keyframes confall{to{top:105%;transform:translateX(40px) rotate(720deg)}}

.hwdone summary{cursor:pointer;color:var(--muted);font-weight:600;font-size:14px;margin-bottom:8px}
/* ---- Agenda ---- */
.lday{margin:0 0 16px}
.lday h3{font-size:14px;text-transform:capitalize;color:var(--muted);margin:0 0 8px}
.lrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:8px}
.lrow.click{cursor:pointer}.lrow.click:hover{border-color:var(--line-strong);background:var(--hover)}
.lrow.past{opacity:.6}
.ltime{display:flex;flex-direction:column;min-width:48px;font-variant-numeric:tabular-nums}
.ltime b{color:var(--strong)}.ltime span{color:var(--faint);font-size:12.5px}
.lrow .who{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.lrow .who strong{display:block;color:var(--strong)}.lrow .who .sub{display:block;font-size:12.5px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .ic.warn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:rgba(var(--warn-rgb),.15);color:var(--warn);font-weight:700}
.cal{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--panel);box-shadow:var(--shadow)}
.cal-in{min-width:760px}
.cal-head,.cal-body{display:grid;grid-template-columns:56px repeat(7,minmax(0,1fr))}
.cal-head{border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.cal-tz{font-size:10.5px;color:var(--faint);display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px}
.cal-dh{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0 8px;color:var(--muted)}
.cal-dh span{font-size:11px;font-weight:650;letter-spacing:.04em}
.cal-dh b{font-size:22px;font-weight:500;color:var(--strong);width:40px;height:40px;display:grid;place-items:center;border-radius:50%}
.cal-dh.today span{color:var(--accent-hi)}
.cal-dh.today b{background:var(--accent);color:var(--on-accent);box-shadow:var(--glow-sm)}
.cal-body{position:relative}
.cal-hours{position:relative}
.cal-hr{position:relative;border-top:1px solid transparent}
.cal-hr span{position:absolute;top:-8px;right:8px;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.cal-hr:first-child span{top:2px}
.cal-col{position:relative;border-left:1px solid var(--line);background-image:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px var(--hh))}
.cal-col.today{background-color:rgba(var(--accent-rgb),.04)}
.cev{position:absolute;overflow:hidden;border-radius:8px;padding:4px 7px;font-size:12px;line-height:1.3;color:var(--strong);background:rgba(var(--accent-rgb),.22);border-left:3px solid var(--accent);cursor:pointer;transition:filter .15s}
.cev:hover{filter:brightness(1.12)}
.cev b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:650;overflow-wrap:anywhere}
.cev span{display:block;color:var(--muted);font-size:11.5px}
.cev em{display:block;font-style:normal;font-size:11px;color:var(--accent-hi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cev.unk{background:rgba(var(--warn-rgb),.16);border-left-color:var(--warn);cursor:default}
.cev.unk em{color:var(--warn)}
.cev.past{opacity:.55}
.cal-now{position:absolute;left:0;right:0;height:2px;background:var(--bad);z-index:1}
.cal-now::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--bad)}
/* ---- Pagos ---- */
.monthnav{display:flex;align-items:center;gap:10px;margin:0 0 16px}
.monthnav h2{margin:0;font-size:20px;min-width:170px;text-align:center;text-transform:capitalize}
.paylist{display:flex;flex-direction:column;gap:8px}
.payrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.payrow .who{display:flex;align-items:center;gap:12px;min-width:0}
.payrow .who strong{display:block;color:var(--strong)}
.payrow .who .linkbtn{font-weight:500}
.paystatus{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.hwtools .iconbtn.sm,.paystatus .iconbtn.sm{width:30px;height:30px;font-size:17px;border-color:var(--line);background:var(--panel)}
.hwtools .iconbtn.sm svg{width:16px;height:16px}
.privtext p{margin:0 0 12px;font-size:14.5px;line-height:1.55}.privtext b{color:var(--strong)}
.prof-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 14px}
.prof-bar .btn svg{width:17px;height:17px}
.set-cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.set-col{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (max-width:900px){.set-cols{grid-template-columns:1fr}}
.settings .h2{display:flex;align-items:center;gap:9px}
.settings .h2 svg{width:20px;height:20px;color:var(--accent)}
.settings .push-box{margin:0;padding:0;border:0;background:none}
.settings .push-box > b:first-child{display:none}
.settings .h3{font-size:14.5px;margin:16px 0 8px;color:var(--strong)}
.plist{margin:0;padding-left:18px;display:grid;gap:7px;font-size:14px;color:var(--muted)}
.plist b{color:var(--text)}
.blist{display:grid;gap:8px}
.brow{display:flex;align-items:center;gap:10px}
.brow span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.mrow{display:flex;align-items:center;gap:10px}
.mrow .wholink{flex:1;min-width:0;justify-content:flex-start}
.mrow .wholink b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--strong)}
.mate-btns{display:flex;gap:6px;flex:none}
.mates-h{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);margin:14px 0 8px}
.panel.mates h2+.mates-h{margin-top:4px}
.mate-box{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:10px}
.install-how{padding:14px;border-radius:14px;background:var(--panel2);border:1px solid var(--line)}
@media (max-width:420px){.installbtn{padding:0 10px;font-size:13px}.installbtn .l-long{display:none}}
@media (min-width:421px){.installbtn .l-short{display:none}}
.mbrand{display:none;align-items:center;gap:10px;font-weight:700;color:var(--strong)}
.mbrand img{width:34px;height:34px;border-radius:10px;box-shadow:var(--glow)}
.only-m{display:none}

/* Barra inferior (móvil) */
.tabbar{display:none}



@media (max-width:1180px){ .shell{grid-template-columns:220px minmax(0,1fr);gap:22px} }
@media (max-width:760px){
  .shell{display:block;padding:0 16px}
  .sidebar{display:none}
  .main{padding:10px 0 96px}
  .top{margin-bottom:14px}
  .top h1.sec{display:none}
  .mbrand,.only-m{display:flex}
  .tabbar{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:color-mix(in srgb,var(--panel) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-top:1px solid var(--line);padding:5px 4px calc(5px + env(safe-area-inset-bottom));
  }
  .tabbar button{flex:1;min-width:0;font:inherit;cursor:pointer;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--faint);font-size:10.5px;font-weight:600;padding:6px 0;position:relative}
  .tabbar button span.l{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tabbar button svg{width:23px;height:23px}
  .tabbar button.on{color:var(--accent-hi)}
  .tabbar button.on svg{filter:drop-shadow(0 0 6px rgba(var(--neon-rgb),.8))}
  .tabbar .dotn{position:absolute;top:3px;left:calc(50% + 7px);min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:10px;line-height:16px;font-style:normal}
}

/* ---------- Botones ---------- */
.btn{
  font:inherit;font-weight:600;font-size:14px;cursor:pointer;
  color:var(--accent-hi);background:rgba(var(--accent-rgb),.10);
  border:1px solid rgba(var(--accent-rgb),.30);border-radius:11px;
  padding:9px 16px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px;
  transition:filter .15s,background .15s,border-color .15s,box-shadow .15s,transform .06s;
}
.btn:hover{background:rgba(var(--accent-rgb),.16);border-color:rgba(var(--accent-rgb),.5)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:default;box-shadow:none}
.btn[type=submit],.btn.primary{color:var(--on-accent);background:var(--accent);border-color:transparent;box-shadow:var(--glow)}
.btn[type=submit]:hover,.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:9px}
.btn.violet{color:var(--violet);background:rgba(var(--violet-rgb),.10);border-color:rgba(var(--violet-rgb),.32)}
.btn.violet:hover{background:rgba(var(--violet-rgb),.16);border-color:rgba(var(--violet-rgb),.5)}
.btn.danger{color:var(--bad);background:rgba(var(--bad-rgb),.08);border-color:rgba(var(--bad-rgb),.32);box-shadow:none}
label.check{display:flex;gap:10px;align-items:flex-start;margin:14px 0;cursor:pointer}
label.check input{margin-top:3px;width:auto;flex:none;accent-color:var(--accent)}
.btn.danger:hover{background:rgba(var(--bad-rgb),.14);border-color:rgba(var(--bad-rgb),.55)}
.btn.ghost{color:var(--muted);background:transparent;border-color:var(--line);box-shadow:none}
.btn.ghost:hover{color:var(--strong);border-color:var(--line-strong);background:var(--hover)}

/* ---------- Campos ---------- */
input[type=text],input[type=email],input[type=password],input[type=date],input[type=number],select,textarea{
  width:100%;font:inherit;color:var(--strong);background:var(--field);
  border:1px solid var(--line);border-radius:11px;padding:10px 12px;outline:none;
  transition:border-color .15s,box-shadow .15s;
}
textarea{resize:vertical;min-height:78px;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.16)}
input:disabled{opacity:.65}
::placeholder{color:var(--faint)}
label.f{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-bottom:14px}
label.f>input,label.f>select,label.f>textarea{margin-top:6px}
.chk{display:inline-flex;align-items:center;gap:9px;cursor:pointer;color:var(--text)}
input[type=checkbox]{
  appearance:none;-webkit-appearance:none;width:20px;height:20px;flex:none;margin:0;cursor:pointer;
  border:1.5px solid var(--line-strong);border-radius:6px;background:var(--field);position:relative;transition:background .15s,border-color .15s;
}
input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent);box-shadow:var(--glow-sm)}
input[type=checkbox]:checked::after{content:"";position:absolute;left:5.5px;top:2px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
input[type=radio]{
  appearance:none;-webkit-appearance:none;width:20px;height:20px;flex:none;margin:0;cursor:pointer;border-radius:50%;
  border:1.5px solid var(--line-strong);background:var(--field);position:relative;
}
input[type=radio]:checked{border-color:var(--accent);box-shadow:var(--glow-sm)}
input[type=radio]:checked::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent)}

/* ---------- Inicio, avisos, perfil ---------- */
.page-title{font-size:26px;letter-spacing:-.02em;margin:0 0 18px}
.sub{color:var(--faint);font-size:13px}
.chip.new{color:var(--on-accent);border-color:transparent;background:var(--accent);box-shadow:var(--glow-sm)}
.dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start}
.dcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.dhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.dhead h2{font-size:15.5px}
.dcard .row{background:var(--panel2);box-shadow:none}
.empty.small{padding:22px 12px;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow)}
.stat b{font-size:28px;color:var(--strong);line-height:1.1;letter-spacing:-.02em}
.stat span{color:var(--muted);font-size:13px}
.stat[data-action]{cursor:pointer;transition:border-color .15s,transform .1s}
.stat[data-action]:hover{border-color:var(--line-strong);transform:translateY(-1px)}
.stat.warn{border-color:rgba(var(--warn-rgb),.45)}.stat.warn b{color:var(--warn)}
.stat.bad{border-color:rgba(var(--bad-rgb),.45)}.stat.bad b{color:var(--bad)}
.grid.one{grid-template-columns:1fr}
.card.post.isnew{border-color:rgba(var(--accent-rgb),.45);background:linear-gradient(180deg,rgba(var(--accent-rgb),.08),transparent 70%),var(--panel)}
.postbody{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:10px 0 4px;font-size:15px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start}
.rename{display:flex;gap:8px;margin:2px 0 4px}
.rename input{flex:1}
.radios{display:flex;gap:18px;flex-wrap:wrap;margin-top:8px;color:var(--text)}
.pickbox{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px 14px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;margin:-2px 0 14px}
.pickbox[hidden]{display:none}
.pickbox.hwcopy-list{grid-template-columns:1fr}
.pickbox.am-items{grid-template-columns:1fr;max-height:min(300px,40vh);overflow:auto;gap:6px}
.am-items .chk{display:flex;align-items:center;gap:8px}
.am-items .chk[hidden]{display:none}
.am-items .chk .cover{flex:none}
.am-items .chk .sub{margin-left:auto;white-space:nowrap}
.hwcopy-due{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;margin:6px 0 14px}
.hwcopy-due input[type=date]{width:auto;margin-left:6px}
.checks{display:flex;flex-direction:column;gap:9px;margin:6px 0 4px}
.chk.off{opacity:.45;cursor:default}
.chk.off input{cursor:default}

/* ---------- Social: avatares, feed, reacciones, comentarios ---------- */
.postbody a{overflow-wrap:anywhere}
.card.post .postbody{background:none;border:0;border-radius:0;padding:0;margin:8px 0 2px;color:var(--text);font-size:15px;line-height:1.6}
.card.post .post-foot{margin:12px 0 0}
.card.post .post-reads{margin-top:10px}
.card.post .post-reads summary{list-style:none;cursor:pointer;display:flex}
.card.post .post-reads summary::-webkit-details-marker{display:none}
.card.post .post-reads[open] summary{margin-bottom:8px}
.card.post .post-tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.card.post.flash{box-shadow:0 0 0 2px rgba(var(--accent-rgb),.7),var(--glow);transition:box-shadow .3s}
.av{border-radius:50%;object-fit:cover;flex:none;display:inline-flex;align-items:center;justify-content:center;background:var(--panel2)}
.av.ini{font-weight:700;color:#fff;background:linear-gradient(135deg,hsl(var(--h) 70% 58%),hsl(calc(var(--h) + 40) 75% 48%))}
.av.teach{box-shadow:0 0 0 2px var(--panel),0 0 0 3.5px var(--accent),0 0 12px rgba(var(--accent-rgb),.45)}
.composer{display:flex;gap:12px;align-items:flex-start;margin-bottom:16px}
.composer-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.composer-main textarea{min-height:64px}
.composer .actions{justify-content:flex-end}
.feed{display:flex;flex-direction:column;gap:14px;scroll-margin-top:16px}
.foryou{display:flex;flex-direction:column;gap:2px;background:linear-gradient(180deg,rgba(var(--accent-rgb),.08),transparent 80%),var(--panel);border:1px solid var(--line-strong);border-radius:16px;padding:8px;margin-bottom:14px;box-shadow:var(--shadow)}
.fy-row{display:flex;align-items:center;gap:12px;padding:8px;border-radius:11px;cursor:pointer;transition:background .15s}
.fy-row:hover{background:var(--hover)}
.fy-row .ic{width:36px;height:36px;border-radius:10px;background:rgba(var(--accent-rgb),.13);color:var(--accent-hi);display:grid;place-items:center;flex:none}
.fy-row .ic svg{width:18px;height:18px}
.fy-row .t{flex:1;min-width:0}
.fy-row b{display:block;color:var(--strong);font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.newposts-wrap{position:sticky;top:12px;z-index:20;display:flex;justify-content:center;height:0;overflow:visible}
.newposts{font:inherit;font-size:14px;font-weight:600;cursor:pointer;border:0;border-radius:999px;padding:9px 18px;color:var(--on-accent);background:var(--accent);box-shadow:var(--glow),0 8px 24px rgba(0,0,0,.25);animation:tin .25s ease-out;transform:translateY(-6px)}
.newposts:hover{filter:brightness(1.08)}
.fpost{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.fpost.by-teacher{border-color:var(--line-strong)}
.fhead{display:flex;align-items:center;gap:12px}
.fhead b{color:var(--strong)}
.edited{font-style:italic;cursor:help}
.tbadge{font-size:11px;font-weight:700;letter-spacing:.02em;color:var(--accent-hi);background:rgba(var(--accent-rgb),.12);border:1px solid rgba(var(--accent-rgb),.3);padding:0 8px;border-radius:999px;margin-left:6px;vertical-align:1px;white-space:nowrap}
.fbody{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--text)}
.fbody a{overflow-wrap:anywhere}
.rt-list{margin:4px 0;padding-left:1.5em;white-space:normal}
.rt-list li{white-space:pre-wrap;margin:2px 0;padding-left:2px}
.rt-list li::marker{color:var(--accent)}
ol.rt-list li::marker{font-weight:600}
.linkcard{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:10px 12px;text-decoration:none;color:var(--text);transition:border-color .15s,background .15s}
.linkcard:hover{border-color:var(--line-strong);background:var(--hover)}
.linkcard .lart{width:44px;height:44px;border-radius:10px;flex:none;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--accent),var(--neon))}
.linkcard .lart.sp{background:linear-gradient(135deg,#1ed760,#0b7a35)}
.linkcard .lart.yt{background:linear-gradient(135deg,#ff4e45,#c4120c)}
.linkcard .lart svg{width:22px;height:22px}
.linkcard .lt{flex:1;min-width:0}
.linkcard .lk{display:block;font-weight:700;font-size:14px;color:var(--strong)}
.linkcard .lu{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--faint);font-size:12.5px}
.linkcard .go{color:var(--faint)}
.linkcard.media{padding:8px 12px 8px 8px;margin:8px 0;max-width:520px}
.linkcard.media .lk{font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:3px}
.linkcard.media .tsub{font-size:12.5px}
.linkcard .lsvc{font-weight:700;font-size:12px}
.linkcard .lsvc.sp{color:#1db954}.linkcard .lsvc.yt{color:#ff4e45}
.cmt-main .linkcard.media{margin:6px 0 2px}
.factions{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--line)}
.linkbtn.mute{color:var(--faint);font-size:13px}
.rx{display:flex;flex-direction:column;gap:6px}
.rx-list{display:flex;gap:6px;flex-wrap:wrap}
.rxb{font:inherit;font-size:14px;cursor:pointer;color:var(--text);background:transparent;border:1px solid var(--line);border-radius:999px;padding:3px 11px;display:inline-flex;gap:6px;align-items:center;transition:border-color .15s,background .15s}
.rxb:hover{border-color:var(--line-strong);background:var(--hover)}
.rxb.mine{border-color:rgba(var(--accent-rgb),.6);background:rgba(var(--accent-rgb),.13);color:var(--strong)}
.rxb.main{font-size:15px;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.rxb.main:not(.mine) .rxe{filter:grayscale(.35);opacity:.85}
.rx-pick{position:fixed;z-index:60;display:flex;gap:2px;background:var(--panel);border:1px solid var(--line-strong);border-radius:999px;padding:5px 6px;width:max-content;box-shadow:var(--shadow);animation:rxIn .14s ease-out}
.rx-pick[hidden]{display:none}
.fpost,.rx,.rxb{-webkit-tap-highlight-color:transparent}
.rx-pick .rxb{font-size:24px;padding:4px 7px;border-color:transparent;border-radius:50%;transition:transform .12s,background .12s}
.rx-pick .rxb.mine{background:rgba(var(--accent-rgb),.16)}
/* Resaltado: ratón encima (PC) o dedo encima al arrastrar (.hot, móvil) */
.rx-pick .rxb.hot,.rx-pick .rxb:focus-visible{background:var(--hover);transform:scale(1.25) translateY(-3px)}
@media (hover:hover){ .rx-pick .rxb:hover{background:var(--hover);transform:scale(1.25) translateY(-3px)} }
@keyframes rxIn{from{opacity:0;transform:translateY(6px) scale(.92)}to{opacity:1;transform:none}}
.cm{display:flex;flex-direction:column}
.cmt{display:flex;gap:10px;padding:8px 0}
.cmt-main{flex:1;min-width:0}
.cmt-bubble{background:var(--panel2);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:8px 12px;display:inline-block;max-width:100%}
.cmt-head{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.cmt-head b{color:var(--strong);font-size:13.5px}
.cmt-body{white-space:pre-wrap;overflow-wrap:anywhere;margin:1px 0 0;font-size:14.5px}
/* Menciones (@persona, #sección, #escucha) y la lista que sale al escribirlas */
.mention{color:var(--accent-hi);background:rgba(var(--accent-rgb),.13);border-radius:6px;padding:0 4px;font-weight:600;cursor:pointer;white-space:nowrap}
.mention:hover,.mention:focus-visible{background:rgba(var(--accent-rgb),.24);text-decoration:underline;outline:none}
.mention.off{color:var(--muted);background:none;cursor:default;font-weight:500}
.mention.off:hover{text-decoration:none}
.mbox{position:fixed;z-index:80;background:var(--panel);border:1px solid var(--line-strong);border-radius:12px;box-shadow:var(--shadow);padding:4px;max-height:280px;overflow-y:auto}
.mopt{display:flex;align-items:center;gap:10px;width:100%;font:inherit;color:var(--text);background:none;border:0;border-radius:9px;padding:6px 8px;text-align:left;cursor:pointer}
.mopt.on,.mopt:hover{background:rgba(var(--accent-rgb),.14)}
.mopt .t{min-width:0;display:flex;flex-direction:column}
.mopt b{font-weight:600;color:var(--strong);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mopt small{color:var(--muted);font-size:12px}
.mopt .ic{width:28px;height:28px;border-radius:8px;background:rgba(var(--accent-rgb),.12);color:var(--accent-hi);display:grid;place-items:center;flex:none}
.mopt .ic svg{width:16px;height:16px}
/* Emojis: botón dentro de cada cuadro de texto (lo pone emojiDecorate) y selector #emojiBox */
.emo-wrap{position:relative;display:block}
label.f>.emo-wrap{margin-top:6px}
.dm-compose>.emo-wrap,.cm-new>.emo-wrap{flex:1;min-width:0}
.emo-wrap>input,.emo-wrap>textarea{padding-right:42px}
.emo-wrap>textarea{display:block}
.emo-btn{position:absolute;right:6px;bottom:6px;width:30px;height:30px;padding:0;border:0;border-radius:8px;background:none;color:var(--faint);display:grid;place-items:center;cursor:pointer;transition:color .15s,background .15s}
.emo-wrap>input+.emo-btn{bottom:auto;top:50%;transform:translateY(-50%)}
.emo-btn:hover,.emo-btn.on{color:var(--accent-hi);background:rgba(var(--accent-rgb),.12)}
.emo-btn svg{width:20px;height:20px}
.ebox{-webkit-tap-highlight-color:transparent;position:fixed;z-index:85;width:min(336px,calc(100vw - 16px));background:var(--panel);border:1px solid var(--line-strong);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.ebox-tabs{display:flex;gap:2px;padding:4px;border-bottom:1px solid var(--line)}
.ebox-tabs button{flex:1;padding:6px 0;border:0;border-radius:8px;background:none;font-size:18px;line-height:1.2;cursor:pointer;opacity:.55;filter:grayscale(.6);transition:opacity .15s}
.ebox-tabs button:hover{opacity:.9}
.ebox-tabs button.on{opacity:1;filter:none;background:rgba(var(--accent-rgb),.14)}
.ebox-scroll{position:relative;height:250px;overflow-y:auto;overscroll-behavior:contain}
.ebox-sec:last-child{min-height:100%} /* así la última categoría también puede subir arriba del todo */
.ebox-h{position:sticky;top:0;z-index:1;background:var(--panel);font-size:12px;font-weight:600;color:var(--muted);padding:8px 12px 4px}
.ebox-grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:2px;padding:0 6px 6px}
.ebox-grid button{aspect-ratio:1;min-width:0;overflow:hidden;padding:0;border:0;border-radius:8px;background:none;font-size:22px;line-height:1;cursor:pointer;font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif}
.ebox-grid button:hover{background:rgba(var(--accent-rgb),.14)}
.ebox-empty{grid-column:1/-1;color:var(--muted);font-size:13px;padding:4px 6px 8px}
.cmt-foot{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:6px;padding-left:4px}
.cm-new{display:flex;gap:8px;align-items:flex-end;margin-top:10px}
.cm-new textarea{min-height:44px}
/* Vista previa de comentarios en las tarjetas del Inicio */
.cm-peek{display:flex;flex-direction:column;gap:8px;margin-top:-2px}
.peek-more{align-self:flex-start;font-size:13.5px;font-weight:600;color:var(--muted)}
.peek-more:hover{color:var(--accent-hi)}
.peek-cmt{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.peek-bubble{position:relative;background:var(--panel2);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:6px 12px 7px;min-width:0;max-width:100%;transition:border-color .15s,background .15s}
.peek-cmt:hover .peek-bubble{border-color:var(--line-strong);background:rgba(var(--accent-rgb),.06)}
.peek-bubble .cmt-head b{font-size:13px}
.peek-body{font-size:14px;overflow-wrap:anywhere;white-space:pre-wrap;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;line-clamp:3;overflow:hidden}
.peek-body .rt-list{margin:0;white-space:normal}
.peek-rx{position:absolute;right:-6px;bottom:-10px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:0 6px;font-size:12px;line-height:20px;color:var(--muted);box-shadow:var(--shadow)}
.peek-rx b{font-weight:600}
.peek-cmt:has(.peek-rx){margin-bottom:6px}
.peek-new{display:flex;gap:8px;align-items:center;cursor:text}
.peek-input{flex:1;background:var(--field);border:1px solid var(--line);border-radius:999px;padding:7px 14px;color:var(--faint);font-size:14px;transition:border-color .15s}
.peek-new:hover .peek-input{border-color:rgba(var(--accent-rgb),.5)}
.cmt.flash .cmt-bubble{animation:cmtFlash 1.6s ease}
@keyframes cmtFlash{0%,40%{border-color:var(--accent);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.25)}100%{box-shadow:none}}
@media (prefers-reduced-motion:reduce){.cmt.flash .cmt-bubble{animation:none;border-color:var(--accent)}}
.avrow{display:flex;gap:18px;align-items:center;margin-bottom:12px}
.rowav{display:flex;gap:10px;align-items:center;min-width:0}
.sub.clip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:44ch}
.dcard.wide{grid-column:1/-1}
.dcard.mod{border-color:rgba(var(--warn-rgb),.45)}
.row.rep{align-items:flex-start}
@media (max-width:520px){ .sub.clip{max-width:26ch} .cm-new{flex-direction:column;align-items:stretch} }

/* ---------- Pestañas / filtros ---------- */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 18px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px;width:max-content;max-width:100%}
.tab{font:inherit;font-size:14px;font-weight:600;cursor:pointer;color:var(--muted);background:transparent;border:0;border-radius:999px;padding:6px 14px;transition:background .15s,color .15s}
.tab:hover{color:var(--strong)}
.tab.on{color:var(--on-accent);background:var(--accent);box-shadow:var(--glow-sm)}
.tab .n{opacity:.75;margin-left:6px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}

/* ---------- Tarjetas ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
  padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:10px;
  transition:border-color .15s;-webkit-tap-highlight-color:transparent;
}
/* Solo con ratón: en el móvil la tarjeta no se ilumina al tocarla. Sin
   transform, porque haría que el selector de reacciones se descoloque. */
@media (hover:hover){ .card:hover{border-color:var(--line-strong)} }
.card.done{opacity:.8}
.card h3{font-size:16.5px}
.card .brief{margin:0;color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card-top,.card-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.card-foot{margin-top:auto;padding-top:4px}
.badge{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--violet);background:rgba(var(--violet-rgb),.12);border-radius:6px;padding:2px 8px}
.chip{font-size:12.5px;font-weight:500;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 10px;white-space:nowrap}
.chip.ok{color:var(--ok);border-color:rgba(var(--ok-rgb),.38);background:rgba(var(--ok-rgb),.08)}
.chip.warn{color:var(--warn);border-color:rgba(var(--warn-rgb),.4);background:rgba(var(--warn-rgb),.08)}
.chip.bad{color:var(--bad);border-color:rgba(var(--bad-rgb),.4);background:rgba(var(--bad-rgb),.08)}
.chip.acc{color:var(--accent-hi);border-color:rgba(var(--accent-rgb),.38);background:rgba(var(--accent-rgb),.10)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.empty{text-align:center;color:var(--muted);padding:44px 16px;border:1.5px dashed var(--line-strong);border-radius:16px;background:color-mix(in srgb,var(--panel) 50%,transparent)}

/* ---------- Paneles genéricos ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.row strong{color:var(--strong)}
.row.click{cursor:pointer;transition:border-color .15s,background .15s}
.row.click:hover{border-color:var(--line-strong);background:var(--hover)}
.row .sub{color:var(--faint);font-size:13px}
.h2{font-size:16px;margin:22px 0 10px;display:flex;align-items:center;gap:8px}

/* ---------- Modal ---------- */
.backdrop{position:fixed;inset:0;background:var(--overlay);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:flex-start;justify-content:center;padding:28px 14px;overflow-y:auto;z-index:50}
.modal{width:100%;max-width:760px;background:var(--panel);border:1px solid var(--line-strong);border-radius:18px;padding:22px;box-shadow:0 24px 70px rgba(0,0,0,.35),var(--glow-sm);animation:min .18s ease-out}
.modal.narrow{max-width:420px}
@keyframes min{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.modal-head h2{font-size:20px;margin-top:6px}
.x{font:inherit;font-size:20px;line-height:1;cursor:pointer;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:10px;width:36px;height:36px;flex:none}
.x:hover{color:var(--strong);border-color:var(--line-strong);background:var(--hover)}
.callout{border:1px solid rgba(var(--accent-rgb),.25);background:rgba(var(--accent-rgb),.07);border-radius:12px;padding:11px 14px;margin:10px 0;font-size:14px;white-space:pre-wrap}
.callout b{display:block;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-hi);margin-bottom:3px}
.qblock{margin:14px 0}
.qblock .q{font-weight:600;color:var(--strong);margin-bottom:6px;font-size:14.5px}
.ans{white-space:pre-wrap;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px}
.ans.none{color:var(--faint);font-style:italic}
.ans-line{display:flex;align-items:flex-start;gap:6px}
.ans-line .ans{flex:1;min-width:0}
.ans-rxbtn{flex:none;width:32px;height:32px;margin-top:4px;border-radius:50%;border:0;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center;opacity:.55;transition:opacity .15s,background .15s}
.ans-rxbtn svg{width:20px;height:20px}
.ans-rxbtn:hover,.ans-rxbtn:focus-visible{opacity:1;background:rgba(var(--accent-rgb),.12);color:var(--accent)}
.ans-rx{display:block}
.ans-rx .msg-rx{margin-top:-9px;margin-inline:12px}
.ans-rx .msg-rx.static{cursor:default}
.qblock+.ans-rx .msg-rx{margin-top:-2px}
.ans-read{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0 4px;padding-top:12px;border-top:1px solid var(--line)}
.ans-read:empty{display:none}
.ans-read .chip svg,.ans-read .btn svg,.ans-seen svg{width:17px;height:11px;vertical-align:-1px}
.callout.ans-seen{white-space:normal;border-color:rgba(var(--ok-rgb),.35);background:rgba(var(--ok-rgb),.08);color:var(--text)}
.callout.ans-seen b{display:inline;font-size:inherit;letter-spacing:0;text-transform:none;color:var(--ok);margin:0}
.savebar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:6px 0 4px}
.save-state{font-size:13px;color:var(--faint)}
.save-state.ok{color:var(--ok)}.save-state.bad{color:var(--bad)}
.exports{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.exports-title{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-top:18px}

/* ---------- Escucha analítica: lista tipo "tracklist" ---------- */
.tracklist{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:6px}
.track-head,.track{display:grid;grid-template-columns:32px 48px minmax(0,1fr) 130px 150px 40px;align-items:center;gap:14px;padding:8px 12px}
.track-head{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);border-bottom:1px solid var(--line);margin-bottom:4px}
.track{border-radius:11px;cursor:pointer;transition:background .15s}
.track:hover{background:var(--hover)}
.track.done .tmain b{color:var(--muted)}
.tnum{text-align:center;color:var(--faint);font-variant-numeric:tabular-nums;font-size:14px}
.tdone{color:var(--ok);display:inline-grid}.tdone svg{width:18px;height:18px}
.tmain{min-width:0}
.tmain b{display:block;color:var(--strong);font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tsub{display:flex;align-items:center;gap:6px;color:var(--faint);font-size:13px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.kicon{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:5px;background:rgba(var(--accent-rgb),.14);color:var(--accent-hi);flex:none}
.kicon svg{width:12px;height:12px}
.durrow{display:grid;grid-template-columns:1fr 150px;gap:10px}
@media (max-width:480px){ .durrow{grid-template-columns:1fr} }
.tbrief{min-width:0;overflow:hidden;text-overflow:ellipsis}
.tdur{flex:none;font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted)}
.tdur::after{content:'·';margin-left:6px;color:var(--faint)}
.tans{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;white-space:nowrap}
.tans svg{width:15px;height:15px;vertical-align:-3px}
.meter{flex:1;max-width:70px;height:6px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--neon))}
.meter-n{font-variant-numeric:tabular-nums;font-size:12.5px}
.tdue{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tdue.bad{color:var(--bad);font-weight:600}.tdue.warn{color:var(--warn);font-weight:600}.tdue.ok{color:var(--ok)}
.cover{position:relative;display:grid;place-items:center;border-radius:8px;overflow:hidden;flex:none;color:#fff;
  background:linear-gradient(135deg,#1d4ed8,#3ff0ff)}
.cover.k-album{background:linear-gradient(135deg,#7c3aed,#2f86ff)}
.cover.k-song{background:linear-gradient(135deg,#0ea5e9,#22d3ee)}
.cover.k-playlist{background:linear-gradient(135deg,#2563eb,#14b8a6)}
.cover svg{width:46%;height:46%;opacity:.9}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.playbtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--accent);text-decoration:none;justify-self:end;transition:transform .12s,filter .15s;box-shadow:var(--glow-sm)}
.playbtn svg{width:16px;height:16px;margin-left:2px}
.playbtn.sp{background:#1ed760;color:#0b2a16;box-shadow:0 0 12px rgba(30,215,96,.35)}
.playbtn.yt{background:#ff2a2a;box-shadow:0 0 12px rgba(255,42,42,.3)}
.playbtn:hover{transform:scale(1.08);filter:brightness(1.05)}
.mhead-cover{display:flex;gap:14px;align-items:center;min-width:0}
.mhead-cover .badge{display:inline-flex;align-items:center;gap:6px}
@media (max-width:900px){ .track-head,.track{grid-template-columns:24px 48px minmax(0,1fr) 110px 40px} .track-head span:nth-child(5),.track .tdue{display:none} }
@media (max-width:560px){
  .track-head{display:none}
  .track,.tracklist.teacher .track{grid-template-columns:48px minmax(0,1fr) 36px;gap:12px;padding:8px}
  .track .tnum,.track .tans{display:none}
}
/* Escucha analítica: buscador, filtros, carpetas y géneros */
.catbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px}
.catbar input[type=search]{flex:1 1 260px;min-width:0;font:inherit;font-size:14px;color:var(--text);background:var(--field);border:1px solid var(--line);border-radius:999px;padding:8px 14px}
.catbar input[type=search]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.18)}
.catbar select{width:auto;flex:0 1 auto;max-width:210px;font-size:13.5px;padding:7px 10px;margin:0}
.catcount{margin:0 0 8px 4px}
.fold{margin:0 0 12px}
.fold>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:6px 6px 8px;font-weight:700;color:var(--strong);user-select:none}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:'▸';color:var(--faint);transition:transform .15s;display:inline-block}
.fold[open]>summary::before{transform:rotate(90deg)}
.fold-name{display:inline-flex;align-items:center;gap:8px}
.fold-name svg{width:17px;height:17px;color:var(--accent-hi)}
.fold>summary .n{font-size:12.5px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 9px}
.tart{flex:none;color:var(--muted);font-size:12.5px;max-width:200px;overflow:hidden;text-overflow:ellipsis}
.tsub .tart:has(+ *)::after{content:'·';margin-left:6px;color:var(--faint)}
.gchip,.fchip{flex:none;font-size:11.5px;font-weight:600;color:var(--accent-hi);background:rgba(var(--accent-rgb),.10);border:1px solid rgba(var(--accent-rgb),.28);border-radius:999px;padding:0 8px;line-height:18px}
.fchip{display:inline-flex;align-items:center;gap:4px;color:var(--muted);background:var(--panel2);border-color:var(--line)}
.fchip svg{width:12px;height:12px}
.imeta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:6px}
.tstat-m{display:none;margin-top:4px}
.tstat-m .btn{padding:3px 10px}
@media (max-width:560px){ .tstat-m{display:block} .catbar select{flex:1 1 140px;max-width:none} }
.libedit{display:grid;gap:6px;margin:0 0 14px}
.librow{display:grid;grid-template-columns:minmax(0,1fr) 32px auto auto auto;gap:6px;align-items:center}
.librow.g{grid-template-columns:minmax(0,1fr) 32px auto}
.librow.child{padding-left:26px;position:relative}
.librow.child::before{content:'└';position:absolute;left:8px;color:var(--faint)}
.librow input{margin:0}
.librow>.sub{text-align:center}
.libadd{display:flex;gap:8px;flex-wrap:wrap}
.libadd input{flex:1 1 200px;margin:0}.libadd select{flex:0 1 200px;margin:0}
.gpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px 16px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;margin:6px 0 14px;max-height:min(320px,42vh);overflow:auto}
.gpick-grp{display:grid;gap:4px;align-content:start}
.gpick-grp .chk{font-size:13.5px}
.gpick-main{font-weight:700;color:var(--strong)}

/* ---------- Nombres y fotos pulsables, ficha pública ---------- */
.wholink{cursor:pointer;display:inline-flex;align-items:center;gap:8px;border-radius:999px}
.wholink:hover b{text-decoration:underline;text-underline-offset:3px}
.wholink:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pf-head{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;margin:-10px 0 14px}
.pf-head h2{font-size:21px}
.pf-bio{margin:2px 0 0;color:var(--text);white-space:pre-wrap;overflow-wrap:anywhere}
.pf-field{border-top:1px solid var(--line);padding:11px 2px}
.pf-label{display:block;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-bottom:2px}
.pf-text{white-space:pre-wrap;overflow-wrap:anywhere}
.agebox{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.agebox input[type=date]{max-width:200px}

/* ---------- Campanita y contadores ---------- */
.bell{position:relative}
.dotn.static{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:10.5px;font-weight:700;line-height:18px;font-style:normal;text-align:center;box-shadow:var(--glow-sm)}
.avbtn{padding:0;overflow:hidden;border-radius:50%}
.avbtn .av{width:100%!important;height:100%!important}
.nlist{display:flex;flex-direction:column;gap:2px;margin:0 -8px}
.nrow{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:12px;cursor:pointer;transition:background .15s}
.nrow:hover{background:var(--hover)}
.nrow.unread{background:rgba(var(--accent-rgb),.07)}
.nrow .ic{width:38px;height:38px;border-radius:50%;background:rgba(var(--accent-rgb),.13);color:var(--accent-hi);display:grid;place-items:center;flex:none}
.nrow .ic svg{width:18px;height:18px}
.nrow .t{flex:1;min-width:0;font-size:14px}
.nrow b{color:var(--strong)}
.push-box{display:flex;flex-direction:column;gap:6px}
.modal .push-box{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.push-box>b{color:var(--strong)}
.udot{width:9px;height:9px;border-radius:50%;background:var(--neon);box-shadow:0 0 8px var(--neon);flex:none}

/* ---------- Mensajes privados ---------- */
.dm{display:grid;grid-template-columns:300px minmax(0,1fr);gap:14px;height:calc(100vh - 110px);min-height:440px}
.dm-list,.dm-pane{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.dm-list{overflow-y:auto}
.dm-list-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 14px 10px;position:sticky;top:0;background:var(--panel);z-index:1}
.dm-list-head b{color:var(--strong)}
.dm-conv{display:flex;align-items:center;gap:11px;padding:10px 14px;cursor:pointer;transition:background .15s;position:relative}
.dm-conv:hover{background:var(--hover)}
.dm-conv.on{background:rgba(var(--accent-rgb),.12)}
.dm-conv .t{flex:1;min-width:0}
.dm-conv b{display:block;color:var(--strong);font-size:14.5px}
.dm-conv .sub{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dm-meta{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.dm-meta .dotn.static{position:static}
.dm-empty{margin:auto;color:var(--faint);padding:20px;text-align:center}
.dm-thread-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.dm-thread-head b{color:var(--strong)}
.dm-back{display:none;width:34px;height:34px;font-size:18px}
.dm-thread{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:8px}
.msg-row{display:flex}
.msg-row.mine{justify-content:flex-end}
.msg{max-width:min(78%,520px);background:var(--panel2);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:8px 12px}
.msg-row.mine .msg{background:var(--accent);border-color:transparent;color:#fff;border-radius:16px 16px 4px 16px;box-shadow:var(--glow-sm)}
.msg-row.mine .msg a{color:#fff;text-decoration:underline}
.msg-row.mine .rt-list li::marker{color:inherit}
.msg-body{white-space:pre-wrap;overflow-wrap:anywhere}
.msg .linkcard{margin-top:8px;background:rgba(0,0,0,.12)}
.msg-row.mine .linkcard .lk,.msg-row.mine .linkcard .lu,.msg-row.mine .linkcard .go,.msg-row.mine .linkcard .tsub,.msg-row.mine .linkcard .tdur{color:#fff}
.msg .linkcard.media{margin:8px 0 0}
.msg .linkcard,.msg .linkcard *,.msg-row.mine .msg a.linkcard{text-decoration:none}
.msg-row.mine .linkcard .lsvc,.msg-row.mine .linkcard .kicon{color:#fff}
.msg-row.mine .linkcard .kicon{background:rgba(255,255,255,.18)}
.msg-foot{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:3px;font-size:11.5px;opacity:.75}
.msg-row.mine .msg-foot .linkbtn{color:#fff}
.msg-foot .linkbtn{font-size:11.5px}
.seen{display:inline-flex;color:var(--neon)}
.msg-row.mine .msg-foot .seen{color:#fff}
/* Reacciones a mensajes privados (estilo WhatsApp) */
.msg-wrap{position:relative;display:flex;flex-direction:column;align-items:flex-start;max-width:min(78%,520px)}
.msg-row.mine .msg-wrap{align-items:flex-end}
.msg-wrap .msg{max-width:100%}
.msg-line{display:flex;align-items:center;gap:6px;max-width:100%}
.msg-row.mine .msg-line{flex-direction:row-reverse}
.msg-rxbtn{flex:none;width:30px;height:30px;border-radius:50%;border:0;background:transparent;color:var(--muted);opacity:0;cursor:pointer;display:grid;place-items:center;transition:opacity .15s}
.msg-rxbtn svg{width:20px;height:20px}
.msg-row:hover .msg-rxbtn,.msg-rxbtn:focus-visible{opacity:.65}
.msg-rxbtn:hover{opacity:1;background:rgba(var(--accent-rgb),.12)}
@media (hover:none){.msg-rxbtn{display:none}.msg{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}}
.msg-rx{margin-top:-8px;margin-inline:10px;position:relative;z-index:1;display:inline-flex;align-items:center;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:1px 7px;font-size:14px;line-height:20px;cursor:pointer;color:var(--text)}
.msg-rx span{font-size:11.5px;color:var(--muted);margin-left:2px}
.msg.held{filter:brightness(.92)}
.dmrx{position:fixed;z-index:60;display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 6px;box-shadow:0 8px 24px rgba(0,0,0,.35);animation:rxIn .14s ease-out}
.dmrx button{border:0;background:transparent;font-size:24px;width:40px;height:40px;border-radius:50%;cursor:pointer;display:grid;place-items:center;transition:transform .12s}
.dmrx button:hover{transform:scale(1.2);background:rgba(var(--accent-rgb),.12)}
.dmrx button.mine{background:rgba(var(--accent-rgb),.22)}
.msg{position:relative}
.msg-more{position:absolute;top:3px;right:4px;width:26px;height:22px;border:0;border-radius:8px;background:var(--panel2);color:var(--muted);cursor:pointer;display:grid;place-items:center;opacity:0;transition:opacity .15s;box-shadow:-6px 0 8px var(--panel2)}
.msg-more svg{width:16px;height:16px}
.msg-row.mine .msg-more{background:var(--accent);color:#fff;box-shadow:-6px 0 8px var(--accent)}
.msg:hover .msg-more,.msg-more:focus-visible,.msg-more.on{opacity:1}
@media (hover:none){.msg-more{display:none}}
.dmmenu{position:fixed;z-index:60;min-width:170px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px;box-shadow:0 8px 24px rgba(0,0,0,.35);animation:rxIn .14s ease-out}
.dmmenu button,.dmmenu .off{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;color:var(--text);font:inherit;font-size:14px;text-align:left;padding:9px 12px;border-radius:8px;cursor:pointer}
.dmmenu button:hover{background:rgba(var(--accent-rgb),.12)}
.dmmenu .danger{color:var(--bad)}
.dmmenu .off{color:var(--muted);cursor:default}
.dmrx .more{font-size:20px;color:var(--muted);background:var(--panel2)}
.dm-compose{display:flex;gap:8px;align-items:flex-end;padding:12px;border-top:1px solid var(--line)}
.dm-compose textarea{min-height:44px;max-height:140px;resize:none}
.dm-cant{padding:14px;border-top:1px solid var(--line);color:var(--muted);font-size:14px;text-align:center}
@media (max-width:760px){
  .dm{display:block;height:auto;min-height:0}
  .dm-list{max-height:none}
  .dm.open .dm-list{display:none}
  .dm:not(.open) .dm-pane{display:none}
  .dm-pane{height:calc(100vh - 170px);min-height:380px}
  .dm-back{display:inline-grid}
}

/* ---------- Encuadre de la foto de perfil ---------- */
.crop{display:flex;flex-direction:column;align-items:center;gap:14px}
.crop-stage{position:relative;width:260px;height:260px;max-width:100%;border-radius:16px;overflow:hidden;background:var(--panel2);touch-action:none;cursor:grab;user-select:none}
.crop-stage:active{cursor:grabbing}
.crop-stage canvas{display:block;width:100%;height:100%}
.crop-stage::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:50%;box-shadow:0 0 0 999px rgba(0,0,0,.55);outline:2px solid rgba(255,255,255,.85);outline-offset:-2px}
.crop-zoom{display:flex;align-items:center;gap:10px;width:260px;max-width:100%;color:var(--muted)}
.crop-zoom svg{width:18px;height:18px;flex:none}

/* ---------- Asignaciones (profesor) ---------- */
.arow{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel2)}
.arow+.arow{margin-top:10px}
.arow-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.arow-who{display:flex;align-items:center;gap:10px;min-width:0}
.sdm-head{display:flex;align-items:center;gap:16px;min-width:0}
.av-zoom{padding:0;border:0;background:none;border-radius:50%;cursor:zoom-in;line-height:0;flex:none;transition:transform .15s,filter .15s}
.av-zoom:hover{filter:brightness(1.08);transform:scale(1.03)}
.av-zoom:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
/* Visor de foto: fondo oscuro en los dos temas (como cualquier visor de fotos) */
.lightbox{position:fixed;inset:0;z-index:88;background:rgba(2,6,16,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;cursor:zoom-out;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.lightbox img{width:min(88vw,76vh,640px);aspect-ratio:1;height:auto;object-fit:cover;border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.6);background:#0b1530}
.lightbox .lb-name{color:#fff;font-weight:700;font-size:16px;text-align:center}
.lightbox .x{position:absolute;top:14px;right:14px;color:#fff;border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.08)}
.sdm-head h2{overflow-wrap:anywhere}
.sdm-item{flex:1 1 260px}
.sdm-open{cursor:pointer;border-radius:10px}
.sdm-open:hover b{color:var(--accent)}
.sdm-item .tmain{flex:1}
.sdm-item .playbtn{margin-left:4px}
.grid2{display:grid;grid-template-columns:170px 1fr;gap:10px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
details{margin-top:10px}
summary{cursor:pointer;color:var(--accent-hi);font-size:14px;font-weight:600;user-select:none}
.frow{display:grid;grid-template-columns:minmax(120px,1.1fr) 150px 1.4fr;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.frow:last-of-type{border-bottom:0}
@media (max-width:640px){ .grid2{grid-template-columns:1fr} .frow{grid-template-columns:1fr} }

/* ---------- Pantallas de acceso ---------- */
.auth{max-width:420px;margin:8vh auto 0;padding:0 16px}
.auth-brand{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:22px;text-align:center}
.auth-brand img{width:76px;height:76px;border-radius:20px;box-shadow:var(--glow)}
.auth-brand b{font-size:22px;color:var(--strong);letter-spacing:-.01em}
.auth-brand small{color:var(--faint);font-size:13.5px}
.auth .panel{padding:24px}
.auth h1{font-size:21px;margin-bottom:4px}
.auth p.lead{color:var(--muted);margin:0 0 18px;font-size:14px}
.auth form .btn{width:100%;padding:11px}
.msg{font-size:13.5px;border-radius:10px;padding:10px 12px;margin:0 0 12px;border:1px solid var(--line)}
.msg.bad{color:var(--bad);border-color:rgba(var(--bad-rgb),.4);background:rgba(var(--bad-rgb),.07)}
.msg.ok{color:var(--ok);border-color:rgba(var(--ok-rgb),.4);background:rgba(var(--ok-rgb),.07)}
.msg.info{color:var(--accent-hi);border-color:rgba(var(--accent-rgb),.35);background:rgba(var(--accent-rgb),.07)}
.linkbtn{font:inherit;font-size:13.5px;font-weight:600;color:var(--accent-hi);background:none;border:0;padding:0;cursor:pointer;text-decoration:none}
.linkbtn:hover{text-decoration:underline;text-underline-offset:3px}
.stack{display:flex;flex-direction:column;gap:10px}
.center{text-align:center}
code{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:13px}

/* ---------- Toast ---------- */
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
@media (max-width:760px){ #toast{bottom:84px} }
.toast{background:var(--panel);border:1px solid var(--line-strong);color:var(--strong);border-radius:12px;padding:10px 16px;font-size:14px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.3),var(--glow-sm);animation:tin .2s ease-out}
.toast.bad{border-color:rgba(var(--bad-rgb),.55)}
.toast.ok{border-color:rgba(var(--ok-rgb),.55)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.loading{color:var(--muted);text-align:center;padding:60px 0}
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>

<script>
/* =====================================================================
   CONFIGURACIÓN — las claves de Supabase viven en el archivo config.js
   (al lado de este index.html). Así puedes actualizar index.html las
   veces que quieras sin volver a pegar tus claves.
   ===================================================================== */
const CFG = window.APP_CONFIG || {};
// Se queda solo con "https://xxxx.supabase.co": si pegaste la URL con /rest/v1/ o una barra final, no importa.
function cleanUrl(u) { try { return new URL(String(u || '').trim()).origin; } catch { return ''; } }
const SUPABASE_URL = cleanUrl(CFG.SUPABASE_URL);
const SUPABASE_KEY = String(CFG.SUPABASE_KEY || '').trim();

/* Nombre visible de la app (cabecera, pantallas de acceso, imagen PNG exportada). */
const APP_NAME = 'Yurimh Music Academy';
const APP_SHORT = 'Yurimh'; // donde no cabe el nombre completo: barra superior del móvil e icono instalado
/* Nombre del módulo actual (aparece en el menú superior). */
const MODULE_LISTENING = 'Escucha analítica';

/* ===================================================================== */
const QUESTIONS = [
  { k: 'highlights',       q: '¿Qué destacas del álbum/playlist/canción?' },
  { k: 'likes',         q: '¿Qué te gusta?' },
  { k: 'dislikes',       q: '¿Qué no te gusta?' },
  { k: 'learned',     q: '¿Qué has aprendido?' },
  { k: 'would_use', q: '¿Qué aprovecharías para alguno de tus grupos o tu música?' },
  { k: 'would_never_use',         q: '¿Qué jamás usarías en uno de tus grupos o música?' }

function errEs(e) {
  if (!e) return 'error desconocido';
  const msg = String(e.message || e);

  for (const [re, out] of ERR_TEXTS) { const m = msg.match(re); if (m) return typeof out === 'function' ? out(m) : out; }

// Errores de Auth que mandan email (registro, recuperar contraseña). Si se ha llenado el cupo
// de emails de Supabase, pregunta a la base de datos cuánto falta (email_wait_seconds) y da la hora exacta.
async function errEsAuth(e) {
  const limited = e && (e.code === 'over_email_send_rate_limit' || /email rate limit/i.test(String(e.message || '')));
  if (!limited) return errEs(e);
  let secs = null;
  try { const r = await sb.rpc('email_wait_seconds'); if (!r.error && typeof r.data === 'number') secs = r.data; } catch (_) {}
  const head = 'Se han enviado demasiados emails en poco tiempo.';
  if (secs === null) return errEs(e);
  if (secs <= 0) return `${head} Vuelve a intentarlo en unos minutos.`;
  const at = new Date(Date.now() + secs * 1000), mins = Math.ceil(secs / 60);
  const hhmm = at.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
  return `${head} Podrás intentarlo de nuevo a partir de las ${hhmm} (dentro de ${mins === 1 ? '1 minuto' : mins + ' minutos'}).`;
}

/* ---- Menciones, como en Discord: @persona, #sección o #escucha ----
   En la base de datos se guardan como códigos: <@id_persona>, <#seccion> o <#l:id_escucha>.
   Así, si alguien cambia de nombre o de apodo, sus menciones antiguas salen con el nombre nuevo.
   Al escribir se ve el nombre normal ("@Lucía"); mentionEncode() lo convierte al guardar. */
const ID_PAT = '[0-9a-z_-]{2,36}'; // en producción son uuid; en las pruebas, ids cortos ('s1')

function mentionItem(id) {

  const a = S.assigns.find(x => x.item_id === id); return a && a.item ? a.item.title : null;
}
// Qué se ve en lugar de cada código: { text, go }. Sin go, se pinta como texto normal (no enlaza).
function mentionView(u, l, s) {
  if (u) { const d = S.dir[u]; return d ? { text: '@' + d.public_name, go: `data-action="open-profile" data-id="${u}"` } : { text: '@usuario' }; }
  if (l) { const t = mentionItem(l); return t ? { text: '#' + t, go: `data-action="mention-item" data-id="${l}"` } : { text: '#escucha' }; }
  const sec = sections().find(x => x.id === s);
  return sec ? { text: '#' + sec.label, go: `data-action="mention-go" data-s="${s}"` } : { text: '#' + (SECTION_LABEL[s] || s) };

// Texto de usuario → HTML seguro, con enlaces y menciones pulsables (sustituye a linkify en Inicio, Avisos y comentarios)
function richText(text) {
  text = String(text ?? ''); let out = '', last = 0;
  text.replace(MENTION_RE, (m, u, l, s, off) => {
    const v = mentionView(u, l, s), label = esc(v.text.slice(1)); // publicado sin @ ni # (decisión de Yuri); el resaltado ya indica que es mención
    out += linkify(text.slice(last, off)) + (v.go ? `<span class="mention" role="button" tabindex="0" ${v.go}>${label}</span>` : `<span class="mention off">${label}</span>`);
    last = off + m.length; return m;

}
/* Listas: las líneas que empiezan por "- ", "* " o "• " se ven como viñetas, y las que empiezan por "1. " o "1) ", numeradas.
   Trabaja sobre el HTML ya escapado (ninguna etiqueta generada contiene saltos de línea, así que partir por \n es seguro).
   Los contenedores usan white-space:pre-wrap, por eso no se dejan \n dentro de la lista ni pegados a ella. */
const LIST_UL = /^\s*[-*•–]\s+(.*)$/, LIST_OL = /^\s*(\d{1,4})[.)]\s+(.*)$/;
function listify(html) {
  const lines = html.split('\n'), out = [];
  let text = [], list = null; // list: { tag, start, items }
  const flushText = () => { if (text.length) out.push({ html: text.join('\n') }); text = []; };
  const flushList = () => {
    if (!list) return;
    const start = list.tag === 'ol' && list.start !== 1 ? ` start="${list.start}"` : '';
    out.push({ html: `<${list.tag} class="rt-list"${start}>${list.items.map(i => `<li>${i}</li>`).join('')}</${list.tag}>`, block: true });
    list = null;
  };
  for (const line of lines) {
    const ul = line.match(LIST_UL), ol = !ul && line.match(LIST_OL);
    const tag = ul ? 'ul' : ol ? 'ol' : null;
    if (!tag) { flushList(); text.push(line); continue; }
    if (list && list.tag !== tag) flushList();
    if (!list) { flushText(); list = { tag, start: ol ? parseInt(ol[1], 10) : 1, items: [] }; }
    list.items.push(ul ? ul[1] : ol[2]);
  }
  flushList(); flushText();
  // Entre dos trozos de texto va un \n; junto a una lista no hace falta (ya es un bloque)
  return out.map((p, i) => (i && !p.block && !out[i - 1].block ? '\n' : '') + p.html).join('');
}

/* ---- Escribir menciones: al teclear @ o # sale una lista para elegir (flechas + Enter, o pulsar) ---- */
const MENTION_INPUTS = '#feedForm textarea, #postForm textarea, .cm-new textarea';
const fold = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

  const ids = new Set(myMates());
  Object.values(S.dir).forEach(d => { if (d.role === 'teacher') ids.add(d.id); });
  const m = ta && ta.id && ta.id.match(/^cmInput-(feed|listening)-(.+)$/);

    if (kind === 'feed') { const p = S.fposts.find(x => x.id === pid); if (p) ids.add(p.author_id); }

    .sort((a, b) => String(a.public_name).localeCompare(String(b.public_name), 'es'))
    .map(d => ({ label: d.public_name, token: `<@${d.id}>`, pic: avatarHtml(d.id, 28), sub: d.role === 'teacher' ? 'Profesor' : (isTeacher() || mateState(d.id) !== 'mates' ? '' : 'Compañero') }));

  const m = pos === ta.selectionEnd && ta.value.slice(0, pos).match(/(^|[\s(¿¡"'])([@#])([^\s@#<>]{0,30})$/);
  if (!m) return mentionClose();

function mentionPlace() { // debajo del cuadro de texto; encima si abajo no cabe (p. ej. con el teclado del móvil)

function mentionClose() { mx = null; const b = $('#mentionBox'); if (b) b.remove(); }
function mentionPick(i) {
  const { ta, start, kind, list } = mx, c = list[i], end = ta.selectionStart;

const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
// Antes de guardar: "@Lucía" → <@id>. Vale lo elegido de la lista y también lo escrito a mano
// si coincide exacto con un nombre (sin distinguir mayúsculas) y ese nombre no está repetido.
function mentionEncode(ta) {
  const text = ta.value.trim(), map = new Map(), dup = new Set();
  (ta._mentions || []).forEach(k => map.set(k.text.toLowerCase(), k.token));
  const picked = new Set(map.keys());
  ['@', '#'].forEach(kind => mentionCandidates(kind, ta).forEach(c => {
    const k = (kind + c.label).toLowerCase(); if (picked.has(k)) return;
    if (map.has(k) && map.get(k) !== c.token) dup.add(k); else map.set(k, c.token);
  }));
  dup.forEach(k => map.delete(k));
  const keys = [...map.keys()].filter(k => k.length > 1).sort((a, b) => b.length - a.length);
  if (!keys.length) return text;
  const re = new RegExp(`(^|[^\\p{L}\\p{N}_])(${keys.map(reEsc).join('|')})(?![\\p{L}\\p{N}_])`, 'giu');

document.addEventListener('input', e => { if (e.target.matches && e.target.matches(MENTION_INPUTS)) mentionCheck(e.target); });

/* ---- Emojis: cada cuadro de texto lleva un botón 🙂 que abre un selector (sin librerías ni internet) ----

function rxBar(type, id) {
  const rows = S.reactions.filter(r => r.target_type === type && r.target_id === id);
  const data = REACTIONS.map(r => {
    const who = rows.filter(x => x.emoji === r.k);
    return { ...r, n: who.length, mine: who.some(x => x.user_id === S.user.id), names: who.map(x => whoName(x.user_id)).join(', ') };
  });

  // mantener pulsado en el móvil se abre el selector con los 6 (rxHoverInit).
  const [like, ...rest] = data;
  const tip = like.n ? like.names : 'Me gusta · mantén para más reacciones';
  return `<div class="rx" data-rx="${type}:${id}">
    <div class="rx-list"><button class="rxb main ${like.mine ? 'mine' : ''}" data-action="rx-toggle" data-t="${type}" data-i="${id}" data-e="like" title="${esc(tip)}" aria-label="Me gusta" aria-haspopup="true"><span class="rxe">${like.e}</span>${like.n ? `<span>${like.n}</span>` : ''}</button>${rest.filter(x => x.n).map(x => `<button class="rxb ${x.mine ? 'mine' : ''}" data-action="rx-toggle" data-t="${type}" data-i="${id}" data-e="${x.k}" title="${esc(x.names)}">${x.e}<span>${x.n}</span></button>`).join('')}</div>
    <div class="rx-pick" role="menu" hidden>${data.map(x => `<button class="rxb ${x.mine ? 'mine' : ''}" role="menuitem" data-action="rx-toggle" data-t="${type}" data-i="${id}" data-e="${x.k}" aria-label="${x.k}">${x.e}</button>`).join('')}</div>
  </div>`;

/* ---- Selector de reacciones estilo Facebook ----
   Ordenador: pasar el ratón por el 👍🏼 (o por el selector) lo abre; salir lo cierra.
   Móvil: mantener pulsado el 👍🏼. Un toque normal da o quita el "me gusta". */
let rxOpenEl = null, rxShowT = 0, rxHideT = 0, rxPress = null, rxLong = false, rxLongEnd = 0, rxScrollY = 0;
function rxShow(main) {
  const bar = main.closest('.rx'), pk = bar && bar.querySelector('.rx-pick');
  if (!pk) return;
  if (rxOpenEl && rxOpenEl !== pk) rxOpenEl.hidden = true;
  pk.hidden = false; rxOpenEl = pk; rxScrollY = scrollY;
  // Si algún contenedor tiene transform/filter, "fixed" se mide desde él y no
  // desde la ventana: se coloca en 0,0, se mira dónde cae y se compensa.
  pk.style.animation = 'none'; pk.style.left = '0px'; pk.style.top = '0px';
  const o = pk.getBoundingClientRect();
  pk.style.animation = '';

  const left = Math.max(8, Math.min(r.left, innerWidth - w - 8));
  const top = r.top - h - 6 >= 8 ? r.top - h - 6 : r.bottom + 6;

    const main = e.target.closest('.rxb.main'), pk = e.target.closest('.rx-pick');
    if (main || (pk && pk === rxOpenEl)) clearTimeout(rxHideT);
    if (main && !(rxOpenEl && main.closest('.rx').contains(rxOpenEl))) {
      clearTimeout(rxShowT); rxShowT = setTimeout(() => rxShow(main), 450);
    }
  });

    if (!e.target.closest('.rxb.main, .rx-pick')) return;
    const to = e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('.rxb.main, .rx-pick');

    clearTimeout(rxShowT); clearTimeout(rxHideT);
    rxHideT = setTimeout(rxHide, 350);

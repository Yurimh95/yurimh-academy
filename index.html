      <p><b>Quién ve qué.</b> Los demás alumnos solo te ven cuando participas (publicas, comentas o reaccionas), si os habéis agregado como compañeros o si os habéis escrito. Entonces ven tu nombre o apodo, tu foto, tu "Sobre ti" y lo que publicas. No hay lista de alumnos ni buscador: te encuentran a través de lo que publicas. Si no participas, solo el profesor sabe que estás. Solo el profesor ve tu email, tu fecha de nacimiento, tus respuestas, tus deberes y tus pagos. Los mensajes privados solo los leéis quienes participáis; el profesor solo ve un mensaje si alguien lo denuncia.</p>
      <p><b>Dónde se guardan.</b> En Supabase, con servidores en la Unión Europea, protegidos con contraseña y con reglas que impiden que nadie lea lo que no le corresponde. La web se sirve desde GitHub Pages. La app no usa cookies de publicidad ni rastreadores; tu navegador solo guarda tu sesión y si prefieres el tema claro u oscuro.</p>
      <p><b>Cuánto tiempo.</b> Mientras tengas cuenta. Si dejas las clases o lo pides, se borra tu cuenta y, con ella, tus datos.</p>
      <p><b>Tus derechos.</b> Puedes pedir en cualquier momento ver, corregir o borrar tus datos, o retirar tu permiso. Pídelo al profesor por Mensajes. Si crees que algo no se ha hecho bien, puedes reclamar a la Agencia Española de Protección de Datos (aepd.es).</p>
      <p><b>Menores.</b> Si tienes menos de 14 años, necesitas el permiso de tu madre, padre o tutor para usar la app. Sin fecha de nacimiento, la app te trata como menor: solo puedes escribir en privado al profesor, salvo que tu familia lo autorice.</p>
    </div>`);
  $('.modal').classList.add('narrow');
}
async function downloadBackup(btn) { // solo profesor: todo lo que él puede leer, en un archivo
  btn.disabled = true; const old = btn.innerHTML; btn.textContent = 'Preparando la copia…';
  try {
    const tables = {
      profiles: 'id, display_name, nickname, email, role, approved, created_at, birth_date, family_dm_ok, bio, instrument, level, favorites, gear, app_installed_at',
      listening_items: '*', listening_assignments: '*', listening_comments: '*',
      board_posts: '*', board_recipients: '*', board_reads: '*',
      feed_posts: '*', feed_comments: '*', reactions: '*', moderation_reports: '*',
      homework_tasks: '*', payments_plans: '*', payments_records: '*', lessons: '*', lessons_students: '*'
    };
    const out = { app: APP_NAME, created_at: new Date().toISOString(), note: 'Copia de seguridad. No incluye mensajes privados entre alumnos (no los puede leer el profesor) ni contraseñas (las guarda Supabase cifradas).', tables: {} };
    for (const [t, cols] of Object.entries(tables)) {
      const rows = []; let from = 0;
      for (;;) { // de 1000 en 1000
        const { data, error } = await sb.from(t).select(cols).range(from, from + 999);
        if (error) throw new Error(t + ': ' + error.message);
        rows.push(...data); if (data.length < 1000) break; from += 1000;
      }
      out.tables[t] = rows;
    }
    const blob = new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `yurimh-music-academy-copia-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    const n = Object.values(out.tables).reduce((s, r) => s + r.length, 0);
    toast(`Copia descargada (${n} registros). Guárdala en un sitio seguro: contiene datos personales.`, 'ok');
  } catch (e) { toast('No se pudo hacer la copia: ' + (e.message || e), 'bad'); }
  btn.disabled = false; btn.innerHTML = old;
}

/* ================================= PAGOS ============================== *
   Solo el profesor. payments_plans = el trato de cada alumno; payments_records = cada pago apuntado.
   Cada mes empieza sin pagos marcados ("se desmarca al acabar el mes") y los anteriores quedan de historial. */
const PAY_MODE = { monthly: 'Mensual', per_class: 'Por clase', free: 'Gratis' };
const MONTHS = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const monthStart = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-01`;
const monthLabel = p => { const [y, m] = p.split('-').map(Number); return `${MONTHS[m - 1]} ${y}`; };
const shiftMonth = (p, n) => { const [y, m] = p.split('-').map(Number); return monthStart(new Date(y, m - 1 + n, 1)); };
const money = v => v == null || v === '' ? '' : Number(v).toLocaleString('es-ES', { minimumFractionDigits: Number(v) % 1 ? 2 : 0, maximumFractionDigits: 2 }) + ' €';
const planOf = id => S.payPlans.find(p => p.student_id === id) || null;
function paymentsView() {
  const per = S.payMonth || (S.payMonth = monthStart());
  const isNow = per === monthStart(), future = per > monthStart();
  const ok = S.students.filter(s => s.approved);
  const recs = S.payRecords.filter(r => r.period === per);
  const total = recs.reduce((t, r) => t + Number(r.amount || 0), 0);
  let pendN = 0;
  const rows = ok.map(s => {
    const pl = planOf(s.id), mine = recs.filter(r => r.student_id === s.id);
    const planTxt = !pl ? '<span class="sub">Sin trato</span>' : `${PAY_MODE[pl.mode]}${pl.mode !== 'free' && pl.amount != null ? ' · ' + money(pl.amount) : ''}`;
    let status = '';
    if (!pl) status = `<button class="btn sm" data-action="pay-plan" data-id="${s.id}">Configurar trato</button>`;
    else if (pl.mode === 'free') status = '<span class="chip">Gratis</span>';
    else if (pl.mode === 'monthly') {
      const r = mine.find(x => x.kind === 'monthly');
      if (r) status = `<span class="chip ok">✓ Pagado${r.amount != null ? ' · ' + money(r.amount) : ''} · ${fmtDate(r.paid_on)}</span><button class="iconbtn sm" data-action="pay-undo" data-id="${r.id}" title="Desmarcar" aria-label="Desmarcar el pago">×</button>`;
      else if (isNow && calSynced() && !hadClassThisMonth(s.id)) status = `<span class="chip">Aún sin clase este mes</span><button class="btn sm" data-action="pay-mark" data-id="${s.id}">Marcar pagado</button>`;
      else { pendN++; status = `${!isNow && !future ? '<span class="chip warn">No pagado</span>' : isNow && calSynced() ? '<span class="chip warn">Ya tuvo clase: toca cobrar</span>' : ''}<button class="btn primary sm" data-action="pay-mark" data-id="${s.id}">Marcar pagado</button>`; }
    } else { // por clase
      const n = mine.filter(x => x.kind === 'class').length, sum = mine.reduce((t, x) => t + Number(x.amount || 0), 0);
      status = `<span class="chip ${n ? 'ok' : ''}">${n} clase${n === 1 ? '' : 's'} pagada${n === 1 ? '' : 's'}${n ? ' · ' + money(sum) : ''}</span>
        ${n ? `<button class="iconbtn sm" data-action="pay-class-undo" data-id="${s.id}" title="Quitar la última" aria-label="Quitar la última clase pagada">−</button>` : ''}
        <button class="btn primary sm" data-action="pay-class" data-id="${s.id}">+ Clase pagada</button>`;
    }
    return `<div class="payrow"><div class="who">${avatarHtml(s.id, 34)}<div><strong>${esc(s.display_name)}</strong>
        <button class="linkbtn mute" data-action="pay-plan" data-id="${s.id}" title="Cambiar el trato">${planTxt} ✎</button></div></div>
      <div class="paystatus">${status}</div></div>`;
  }).join('');
  return `<div class="monthnav"><button class="iconbtn" data-action="pay-month" data-n="-1" aria-label="Mes anterior">‹</button>
      <h2>${monthLabel(per)}</h2><button class="iconbtn" data-action="pay-month" data-n="1" aria-label="Mes siguiente">›</button>
      ${isNow ? '' : '<button class="btn sm ghost" data-action="pay-month" data-n="0">Mes actual</button>'}</div>
    <div class="stats"><div class="stat"><b>${money(total) || '0 €'}</b><span>Cobrado en ${MONTHS[Number(per.slice(5, 7)) - 1]}</span></div>
      <div class="stat ${pendN && !isNow && !future ? 'warn' : ''}"><b>${pendN}</b><span>${isNow ? (calSynced() ? 'Toca cobrar (ya tuvieron clase)' : 'Mensuales por pagar') : future ? 'Mensuales' : 'Sin pagar ese mes'}</span></div>
      <div class="stat"><b>${ok.filter(s => (planOf(s.id) || {}).mode === 'free').length}</b><span>Con clases gratis</span></div></div>
    ${ok.length ? `<div class="paylist">${rows}</div>` : '<div class="empty">Aún no tienes alumnos aprobados.</div>'}
    <p class="sub" style="margin-top:14px">🔒 Solo lo ves tú. Cada mes empieza sin pagos marcados; los meses anteriores quedan guardados (usa las flechas).</p>`;
}
function planModal(id) {

async function payInsert(studentId, kind) {
  const pl = planOf(studentId), per = S.payMonth || monthStart();
  const today = monthStart() === per ? new Date().toISOString().slice(0, 10) : per; // en meses pasados, se apunta con fecha del día 1
  const row = { student_id: studentId, period: per, kind, amount: pl && pl.amount != null ? pl.amount : null, paid_on: today };
  const { data, error } = await sb.from('payments_records').insert(row).select();
  if (error) return toast('No se pudo apuntar: ' + error.message, 'bad');
  S.payRecords.push(data[0]); render();
}

     (una sola vez: profiles.install_prompted_at).

   · Cuando abre la app instalada en el móvil, se marca profiles.app_installed_at: desaparece el botón en todos
     sus dispositivos, y se le invita una vez a activar las notificaciones. */
let installPrompt = null; // Android/Chrome/Edge: el navegador nos deja mostrar su ventana de instalar

      <li>Se abre desde su icono, a pantalla completa</li>
      <li>Te llegan al móvil los avisos, mensajes y escuchas nuevas</li>
      <li>Gratis, sin Play Store y sin ocupar casi espacio</li></ul></div>
    <div class="install-how" id="installHow">${installHowHtml()}</div>
    <div class="actions" style="margin-top:14px"><button class="btn ghost" data-action="close">Ahora no</button>
      <span class="sub" style="align-self:center">Siempre tendrás el botón <b>Instalar app</b> arriba.</span></div>`);
  $('.modal').style.maxWidth = '580px'; // un poco más ancha que las estrechas: el QR cabe al lado del texto
  renderQr();
}
// QR del enlace a la web (solo en ordenador). La librería se carga al abrir la ventana, no antes.
let qrLib = null;
async function renderQr() {
  const box = $('#qrBox');
  if (!box || CFG.NO_EXTERNAL) return;
  try {
    qrLib = qrLib || new Promise((ok, no) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js'; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
    await qrLib;
    const q = window.qrcode(0, 'M'); q.addData(appLink()); q.make();
    if ($('#qrBox')) $('#qrBox').innerHTML = q.createSvgTag({ cellSize: 4, margin: 0, scalable: true, alt: 'Código QR de la web' });
  } catch (e) { qrLib = null; console.warn('QR:', e); }
}
async function markInstall(fields) { // guarda en el perfil propio; si falla (p. ej. sin la columna aún), no pasa nada
  const { data, error } = await sb.from('profiles').update(fields).eq('id', S.user.id).select('id');
  if (error || !data || !data.length) { console.warn('Instalar:', error && error.message); return false; }
  Object.assign(S.profile, fields); return true;
}
function appWelcomeModal() {
  openModal(`<div class="app-welcome"><div class="modal-head"><h2>¡Ya tienes la app! 🎸</h2><button class="x" data-action="close" aria-label="Cerrar">×</button></div>
    <p style="margin:0 0 8px">Último paso: <b>activa las notificaciones</b> para enterarte de los avisos, mensajes y escuchas nuevas aunque tengas la app cerrada.</p>
    <p class="sub" style="margin:0 0 14px">Tu móvil te pedirá permiso: pulsa <b>Permitir</b>. Puedes cambiarlo cuando quieras en Ajustes.</p>
    <div class="actions"><button class="btn primary" data-action="push-welcome">${ic('bell')} Activar notificaciones</button><button class="btn ghost" data-action="close">Ahora no</button></div></div>`);
  $('.modal').classList.add('narrow');
}
async function installCheck(quiet) {
  const p = S.profile; if (!p) return;
  const now = new Date().toISOString();
  if (isStandalone() && isMobile()) { // está usando la app instalada en el móvil
    if (p.app_installed_at) return;
    if (!(await markInstall({ app_installed_at: now }))) return;
    softRender();
    if (!quiet && S.push === 'off' && !$('#modalRoot').firstChild) appWelcomeModal();
    return;
  }
  if (quiet || isStandalone() || p.app_installed_at || p.install_prompted_at || $('#modalRoot').firstChild) return;
  if (await markInstall({ install_prompted_at: now })) installModal();
}
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(e => console.warn('Service worker:', e));
  // El service worker nos pide abrir una notificación (tocaron el aviso con la app ya abierta)
  navigator.serviceWorker.addEventListener('message', e => {
    if (e.data && e.data.type === 'open-notification') openNotifFromUrl(e.data.url);
  });
}

/* ------------------------- Notificaciones push (móvil) -------------------------
   S.push: 'unsupported' (este navegador no puede) · 'install' (iPhone: primero hay que instalar la app)
           'denied' (el usuario las bloqueó) · 'off' · 'on' */
S.push = 'unsupported';
let lastPushError = ''; // último fallo al activar (se muestra en Ajustes para poder copiarlo)
const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window && location.protocol === 'https:';
function b64urlToBytes(s) { const p = '='.repeat((4 - s.length % 4) % 4), b = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(b, c => c.charCodeAt(0)); }
async function pushInit() { // al entrar: averigua el estado y, si ya estaban activadas, refresca la suscripción
  if (!pushSupported() || !CFG.VAPID_PUBLIC_KEY) { S.push = isIOS() && !isStandalone() ? 'install' : 'unsupported'; return; }
  if (Notification.permission === 'denied') { S.push = 'denied'; return; }
  const reg = await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.getSubscription();
  if (sub && Notification.permission === 'granted') { S.push = 'on'; await savePushSub(sub); } else S.push = 'off';
}
async function savePushSub(sub) {
  const j = sub.toJSON();
  const { error } = await sb.rpc('save_push_subscription', { p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth });
  if (error) console.warn('No se pudo guardar el dispositivo:', error.message);
  return !error;
}
async function pushEnable() {
  if (!pushSupported()) return toast(isIOS() ? 'En iPhone, primero instala la app (Compartir → Añadir a pantalla de inicio) y ábrela desde su icono' : 'Este navegador no admite notificaciones', 'bad');
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') { S.push = perm === 'denied' ? 'denied' : 'off'; softRender(); return toast('No se han activado: hace falta que des permiso', 'bad'); }
  let step = 'service worker';
  try {
    const reg = await Promise.race([navigator.serviceWorker.ready, new Promise((_, no) => setTimeout(() => no(new Error('el service worker no arranca')), 8000))]);
    step = 'suscripción del navegador';
    let sub = await reg.pushManager.getSubscription();
    if (sub && sub.options && sub.options.applicationServerKey) { // si se creó con otra llave, se rehace
      const same = new Uint8Array(sub.options.applicationServerKey).join() === b64urlToBytes(CFG.VAPID_PUBLIC_KEY).join();
      if (!same) { await sub.unsubscribe(); sub = null; }
    }
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64urlToBytes(CFG.VAPID_PUBLIC_KEY) });
    step = 'guardar en la base de datos';
    if (!(await savePushSub(sub))) throw new Error('la base de datos no lo aceptó');
    S.push = 'on'; toast('¡Notificaciones activadas en este dispositivo!', 'ok');
  } catch (e) {
    console.warn(e);
    // Mostramos el motivo exacto: así se puede saber qué falla en cada móvil
    const why = `${e && e.name && e.name !== 'Error' ? e.name + ': ' : ''}${(e && e.message) || e}`;
    toast(`No se pudieron activar (${step}): ${why}`, 'bad');
    lastPushError = `${step} · ${why} · ${navigator.userAgent}`;
  }
  if ($('#modalRoot').firstChild && $('.nlist, .modal .push-box')) notifsModal(); else { uiStale = false; render(); }
}
async function pushDisable() {
  try {
    const reg = await navigator.serviceWorker.ready, sub = await reg.pushManager.getSubscription();
    if (sub) { await sb.from('push_subscriptions').delete().eq('endpoint', sub.endpoint); await sub.unsubscribe(); }
  } catch (e) { console.warn(e); }
  S.push = 'off'; toast('Notificaciones desactivadas en este dispositivo', 'ok');
  if ($('#modalRoot').firstChild) notifsModal(); else softRender();
}
function pushSettingHtml() {
  const st = S.push;
  const body = st === 'on' ? `<p class="sub" style="margin:0 0 10px">✅ Activadas en este dispositivo. Te llegarán aunque la app esté cerrada.</p><button class="btn ghost sm" data-action="push-off">Desactivar en este dispositivo</button>`
    : st === 'off' ? `<p class="sub" style="margin:0 0 10px">Recibe avisos en el móvil o el ordenador aunque la app esté cerrada: avisos nuevos, mensajes, comentarios…</p><button class="btn primary sm" data-action="push-on">Activar notificaciones</button>`
    : st === 'denied' ? '<p class="sub" style="margin:0">Las has bloqueado en este navegador. Para activarlas, permite las notificaciones de esta web en los ajustes del navegador o del móvil y vuelve a entrar.</p>'
    : st === 'install' ? '<p class="sub" style="margin:0">En iPhone, primero instala la app: en Safari pulsa <b>Compartir</b> → <b>"Añadir a pantalla de inicio"</b>, ábrela desde su icono y activa aquí las notificaciones.</p>'
    : '<p class="sub" style="margin:0">Este navegador no permite notificaciones. Prueba con Chrome (Android/ordenador) o instala la app en el iPhone.</p>';
  const err = lastPushError && st !== 'on' ? `<p class="sub" style="margin:6px 0 0;color:var(--bad);overflow-wrap:anywhere">Último error: ${esc(lastPushError)}</p>` : '';
  return `<div class="push-box"><b>📲 Notificaciones en el móvil</b>${body}${err}</div>`;
}
// Abrir la notificación que trae la dirección (?n=…): llegamos tocando un aviso del móvil
async function openNotifFromUrl(url) {
  let id = null; try { id = new URL(url, location.href).searchParams.get('n'); } catch { }
  if (!id || !S.profile) return;
  let n = S.notifs.find(x => x.id === id);
  if (!n) { const { data } = await sb.from('notifications').select('*').eq('id', id).maybeSingle(); if (data) { n = data; addUnique(S.notifs, data, 'notifications'); } }
  if (n) openNotif(n);
}

/* -------------------------------- Arranque -------------------------- */
(async function boot() {
  if (!configured) return viewSetup();
  sb.auth.onAuthStateChange((event, session) => {
    // setTimeout: evita llamar a supabase dentro del propio callback (puede bloquearse)
    setTimeout(() => {
      if (event === 'PASSWORD_RECOVERY') { recovering = true; viewRecovery(); }
      else if (event === 'SIGNED_OUT') { rtStop(); S.feedQueue = []; S.user = null; S.profile = null; S.items = []; S.assigns = []; S.students = []; S.posts = []; S.recipients = []; S.reads = []; S.fposts = []; S.fcomments = []; S.lcomments = []; S.reactions = []; S.reports = []; S.dir = {}; S.dms = []; S.blocks = []; S.dmContacts = []; S.dmCan = {}; S.dmWith = null; S.notifs = []; S.homework = []; S.payPlans = []; S.payRecords = []; S.payMonth = null; S.lessons = []; S.lessonNames = []; S.lessonSync = null; S.agendaWeek = null; S.section = 'feed'; viewAuth(); }
      else if (event === 'SIGNED_IN' && !recovering && (!S.user || S.user.id !== (session && session.user.id))) route();
    }, 0);
  });
  if (recovering) return viewRecovery();
  await route();
})();
</script>

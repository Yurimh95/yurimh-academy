<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Yurimh Academy</title>
<style>
:root{
  --bg:#0b0d12;
  --panel:#12151c;
  --panel2:#171b25;
  --line:#262c3a;
  --text:#d5d9e2;
  --strong:#eceff6;
  --muted:#8990a3;
  --accent:#62d8ee;
  --accent-rgb:98,216,238;
  --violet:#a78bfa;
  --violet-rgb:167,139,250;
  --ok:#5fe3a1;
  --ok-rgb:95,227,161;
  --warn:#f2c55c;
  --warn-rgb:242,197,92;
  --bad:#ff6b81;
  --bad-rgb:255,107,129;
  --radius:12px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  min-height:100vh;
  background-image:radial-gradient(900px 420px at 50% -120px, rgba(var(--accent-rgb),.06), transparent 70%);
  background-repeat:no-repeat;
}
body.noscroll{overflow:hidden}
h1,h2,h3{color:var(--strong);margin:0;line-height:1.25}
a{color:var(--accent)}
.wrap{max-width:980px;margin:0 auto;padding:0 16px 60px}

/* ---------- Botones ---------- */
.btn{
  font:inherit;font-weight:600;font-size:14px;cursor:pointer;
  color:var(--accent);background:rgba(var(--accent-rgb),.06);
  border:1px solid rgba(var(--accent-rgb),.45);border-radius:9px;
  padding:9px 15px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;
  box-shadow:0 0 10px rgba(var(--accent-rgb),.14);
  transition:box-shadow .18s,background .18s,border-color .18s,transform .08s;
}
.btn:hover{background:rgba(var(--accent-rgb),.12);border-color:rgba(var(--accent-rgb),.7);box-shadow:0 0 16px rgba(var(--accent-rgb),.26)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:default;box-shadow:none}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.violet{color:var(--violet);background:rgba(var(--violet-rgb),.07);border-color:rgba(var(--violet-rgb),.45);box-shadow:0 0 10px rgba(var(--violet-rgb),.14)}
.btn.violet:hover{background:rgba(var(--violet-rgb),.13);border-color:rgba(var(--violet-rgb),.7);box-shadow:0 0 16px rgba(var(--violet-rgb),.26)}
.btn.danger{color:var(--bad);background:rgba(var(--bad-rgb),.06);border-color:rgba(var(--bad-rgb),.4);box-shadow:0 0 10px rgba(var(--bad-rgb),.12)}
.btn.danger:hover{background:rgba(var(--bad-rgb),.12);border-color:rgba(var(--bad-rgb),.65);box-shadow:0 0 16px rgba(var(--bad-rgb),.22)}
.btn.ghost{color:var(--muted);background:transparent;border-color:var(--line);box-shadow:none}
.btn.ghost:hover{color:var(--text);border-color:#3a4256;box-shadow:none;background:rgba(255,255,255,.03)}

/* ---------- Campos ---------- */
input[type=text],input[type=email],input[type=password],input[type=date],select,textarea{
  width:100%;font:inherit;color:var(--strong);background:#0e1117;
  border:1px solid var(--line);border-radius:9px;padding:9px 11px;outline:none;
  transition:border-color .18s,box-shadow .18s;color-scheme:dark;
}
textarea{resize:vertical;min-height:78px;line-height:1.45}
input:focus,select:focus,textarea:focus{
  border-color:rgba(var(--accent-rgb),.6);
  box-shadow:0 0 0 1px rgba(var(--accent-rgb),.25),0 0 14px rgba(var(--accent-rgb),.13);
}
::placeholder{color:#5b6377}
label.f{display:block;font-size:13px;color:var(--muted);margin-bottom:12px}
label.f>input,label.f>select,label.f>textarea{margin-top:5px}
.chk{display:inline-flex;align-items:center;gap:9px;cursor:pointer;color:var(--text)}
input[type=checkbox]{
  appearance:none;-webkit-appearance:none;width:20px;height:20px;flex:none;margin:0;cursor:pointer;
  border:1px solid rgba(var(--accent-rgb),.5);border-radius:6px;background:#0e1117;position:relative;
  box-shadow:0 0 8px rgba(var(--accent-rgb),.12);transition:box-shadow .18s,background .18s;
}
input[type=checkbox]:checked{background:rgba(var(--accent-rgb),.18);box-shadow:0 0 12px rgba(var(--accent-rgb),.3)}
input[type=checkbox]:checked::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid var(--accent);border-width:0 2px 2px 0;transform:rotate(45deg)}

/* ---------- Cabecera ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:18px 0 10px}
.brand{font-weight:700;color:var(--strong);font-size:17px;display:flex;align-items:center;gap:9px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px rgba(var(--accent-rgb),.7)}
.top-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.who{color:var(--muted);font-size:13px;margin-right:4px}

/* ---------- Menú superior por módulos ---------- */
.nav{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 18px;overflow-x:auto}
.nav button{
  font:inherit;font-size:14.5px;font-weight:600;cursor:pointer;color:var(--muted);background:none;border:0;
  border-bottom:2px solid transparent;padding:9px 14px;margin-bottom:-1px;white-space:nowrap;
  transition:color .18s,border-color .18s,box-shadow .18s;
}
.nav button:hover{color:var(--text)}
.nav button.on{color:var(--accent);border-bottom-color:var(--accent);box-shadow:0 9px 12px -10px rgba(var(--accent-rgb),.65)}
.nav{scrollbar-width:none}.nav::-webkit-scrollbar{display:none}
@media (max-width:520px){
  .nav{gap:0 4px;flex-wrap:wrap;overflow-x:visible}
  .nav button{padding:9px 9px;font-size:13.5px}
  .nbadge{margin-left:5px;padding:0 6px;font-size:11px}
}
.nbadge{margin-left:8px;font-size:11.5px;font-weight:600;color:var(--warn);border:1px solid rgba(var(--warn-rgb),.4);border-radius:999px;padding:0 8px}

/* ---------- Inicio, avisos, perfil ---------- */
.page-title{font-size:22px;margin:4px 0 16px}
.sub{color:var(--muted);font-size:13px}
.nbadge.acc{color:var(--accent);border-color:rgba(var(--accent-rgb),.45);background:rgba(var(--accent-rgb),.07)}
.chip.new{color:var(--accent);border-color:rgba(var(--accent-rgb),.55);background:rgba(var(--accent-rgb),.1);box-shadow:0 0 8px rgba(var(--accent-rgb),.25)}
.dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;align-items:start}
.dcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.dhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.dhead h2{font-size:15.5px}
.dcard .row{background:var(--panel2)}
.empty.small{padding:20px 12px;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stat b{font-size:26px;color:var(--strong);line-height:1.1}
.stat span{color:var(--muted);font-size:13px}
.stat[data-action]{cursor:pointer;transition:border-color .18s,box-shadow .18s}
.stat[data-action]:hover{border-color:rgba(var(--accent-rgb),.4);box-shadow:0 0 14px rgba(var(--accent-rgb),.1)}
.stat.warn{border-color:rgba(var(--warn-rgb),.4)}.stat.warn b{color:var(--warn)}
.stat.bad{border-color:rgba(var(--bad-rgb),.4)}.stat.bad b{color:var(--bad)}
.grid.one{grid-template-columns:1fr}
.card.post.isnew{border-color:rgba(var(--accent-rgb),.4);box-shadow:0 0 14px rgba(var(--accent-rgb),.1)}
.postbody{white-space:pre-wrap;overflow-wrap:anywhere;background:#0e1117;border:1px solid var(--line);border-radius:10px;padding:14px;margin:10px 0 4px;font-size:15px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start}
.rename{display:flex;gap:8px;margin:2px 0 4px}
.rename input{flex:1}
.radios{display:flex;gap:18px;flex-wrap:wrap;margin-top:7px;color:var(--text)}
.pickbox{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px 14px;background:#0e1117;border:1px solid var(--line);border-radius:10px;padding:12px;margin:-2px 0 14px}
.pickbox[hidden]{display:none}
.checks{display:flex;flex-direction:column;gap:8px;margin:6px 0 4px}
.chk.off{opacity:.45;cursor:default}
.chk.off input{cursor:default}
input[type=radio]{
  appearance:none;-webkit-appearance:none;width:20px;height:20px;flex:none;margin:0;cursor:pointer;border-radius:50%;
  border:1px solid rgba(var(--accent-rgb),.5);background:#0e1117;position:relative;box-shadow:0 0 8px rgba(var(--accent-rgb),.12);
}
input[type=radio]:checked{background:rgba(var(--accent-rgb),.18);box-shadow:0 0 12px rgba(var(--accent-rgb),.3)}
input[type=radio]:checked::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--accent)}
/* ---------- Social: avatares, feed, reacciones, comentarios ---------- */
.postbody a{overflow-wrap:anywhere}
.av{border-radius:50%;object-fit:cover;flex:none;display:inline-flex;align-items:center;justify-content:center;border:1px solid rgba(var(--accent-rgb),.3)}
.av.ini{font-weight:700;color:hsl(var(--h) 70% 78%);background:hsl(var(--h) 35% 18%);border-color:hsl(var(--h) 45% 35%)}
.top-r .av{margin-right:2px}
.composer{display:flex;gap:12px;align-items:flex-start;margin-bottom:16px}
.composer-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.feed{display:flex;flex-direction:column;gap:14px}
.fpost{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:15px;display:flex;flex-direction:column;gap:10px}
.fhead{display:flex;align-items:center;gap:10px}
.fbody{white-space:pre-wrap;overflow-wrap:anywhere}
.fbody a{overflow-wrap:anywhere}
.linkcard{display:flex;align-items:center;gap:10px;border:1px solid rgba(var(--violet-rgb),.35);background:rgba(var(--violet-rgb),.05);border-radius:10px;padding:9px 12px;text-decoration:none;color:var(--text);box-shadow:0 0 10px rgba(var(--violet-rgb),.08);transition:box-shadow .18s,border-color .18s}
.linkcard:hover{border-color:rgba(var(--violet-rgb),.6);box-shadow:0 0 14px rgba(var(--violet-rgb),.18)}
.linkcard .lk{font-weight:700;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--violet)}
.linkcard .lu{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:13px}
.factions{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.linkbtn.mute{color:var(--muted);font-size:13px}
.rx{display:flex;flex-direction:column;gap:6px}
.rx-list{display:flex;gap:6px;flex-wrap:wrap}
.rxb{font:inherit;font-size:14px;cursor:pointer;color:var(--text);background:transparent;border:1px solid var(--line);border-radius:999px;padding:2px 10px;display:inline-flex;gap:5px;align-items:center;transition:border-color .18s,box-shadow .18s,background .18s}
.rxb:hover{border-color:rgba(var(--accent-rgb),.45)}
.rxb.mine{border-color:rgba(var(--accent-rgb),.55);background:rgba(var(--accent-rgb),.1);box-shadow:0 0 8px rgba(var(--accent-rgb),.2)}
.rxb.add{color:var(--muted);font-size:13px}
.rx-pick{display:flex;gap:4px;flex-wrap:wrap;background:#0e1117;border:1px solid var(--line);border-radius:12px;padding:5px;width:max-content;max-width:100%}
.rx-pick[hidden]{display:none}
.rx-pick .rxb{font-size:20px;padding:3px 9px;border-color:transparent}
.rx-pick .rxb:hover{background:rgba(var(--accent-rgb),.1)}
.cm{display:flex;flex-direction:column}
.cmt{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.cmt-main{flex:1;min-width:0}
.cmt-head{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.cmt-body{white-space:pre-wrap;overflow-wrap:anywhere;margin:2px 0 6px;font-size:14.5px}
.cmt-foot{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.cm-new{display:flex;gap:8px;align-items:flex-end;margin-top:10px}
.cm-new textarea{min-height:44px}
.avrow{display:flex;gap:16px;align-items:center;margin-bottom:10px}
.rowav{display:flex;gap:10px;align-items:center;min-width:0}
.sub.clip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:44ch}
.dcard.wide{grid-column:1/-1}
.dcard.mod{border-color:rgba(var(--warn-rgb),.4);box-shadow:0 0 14px rgba(var(--warn-rgb),.08)}
.row.rep{align-items:flex-start}
@media (max-width:520px){ .sub.clip{max-width:26ch} .cm-new{flex-direction:column;align-items:stretch} }

/* ---------- Pestañas / filtros ---------- */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 18px}
.tab{
  font:inherit;font-size:14px;cursor:pointer;color:var(--muted);background:transparent;
  border:1px solid var(--line);border-radius:999px;padding:6px 14px;transition:all .18s;
}
.tab:hover{color:var(--text);border-color:#3a4256}
.tab.on{color:var(--accent);border-color:rgba(var(--accent-rgb),.5);background:rgba(var(--accent-rgb),.06);box-shadow:0 0 10px rgba(var(--accent-rgb),.13)}
.tab .n{opacity:.75;margin-left:4px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}

/* ---------- Tarjetas ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:15px;cursor:pointer;display:flex;flex-direction:column;gap:9px;
  transition:border-color .18s,box-shadow .18s,transform .12s;
}
.card:hover{border-color:rgba(var(--accent-rgb),.4);box-shadow:0 0 16px rgba(var(--accent-rgb),.11);transform:translateY(-1px)}
.card.done{opacity:.78}
.card h3{font-size:16.5px}
.card .brief{margin:0;color:var(--muted);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card-top,.card-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.card-foot{margin-top:auto;padding-top:4px}
.badge{
  font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--violet);
  border:1px solid rgba(var(--violet-rgb),.4);background:rgba(var(--violet-rgb),.07);border-radius:6px;padding:2px 8px;
}
.chip{font-size:12.5px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 10px;white-space:nowrap}
.chip.ok{color:var(--ok);border-color:rgba(var(--ok-rgb),.4);background:rgba(var(--ok-rgb),.06)}
.chip.warn{color:var(--warn);border-color:rgba(var(--warn-rgb),.4);background:rgba(var(--warn-rgb),.06)}
.chip.bad{color:var(--bad);border-color:rgba(var(--bad-rgb),.4);background:rgba(var(--bad-rgb),.06)}
.chip.acc{color:var(--accent);border-color:rgba(var(--accent-rgb),.4);background:rgba(var(--accent-rgb),.06)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.empty{
  text-align:center;color:var(--muted);padding:44px 16px;border:1px dashed var(--line);border-radius:var(--radius);
}

/* ---------- Paneles genéricos ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.list{display:flex;flex-direction:column;gap:10px}
.row{
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;
}
.row.click{cursor:pointer;transition:border-color .18s,box-shadow .18s}
.row.click:hover{border-color:rgba(var(--accent-rgb),.4);box-shadow:0 0 14px rgba(var(--accent-rgb),.1)}
.row .sub{color:var(--muted);font-size:13px}
.h2{font-size:16px;margin:22px 0 10px;display:flex;align-items:center;gap:8px}

/* ---------- Modal ---------- */
.backdrop{
  position:fixed;inset:0;background:rgba(4,5,8,.72);backdrop-filter:blur(3px);
  display:flex;align-items:flex-start;justify-content:center;padding:28px 14px;overflow-y:auto;z-index:50;
}
.modal{
  width:100%;max-width:760px;background:var(--panel);border:1px solid rgba(var(--accent-rgb),.28);
  border-radius:14px;padding:20px;box-shadow:0 0 28px rgba(var(--accent-rgb),.09),0 20px 60px rgba(0,0,0,.5);
}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.modal-head h2{font-size:20px;margin-top:6px}
.x{font:inherit;font-size:20px;line-height:1;cursor:pointer;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:8px;width:34px;height:34px;flex:none}
.x:hover{color:var(--text);border-color:#3a4256}
.callout{
  border:1px solid rgba(var(--violet-rgb),.3);background:rgba(var(--violet-rgb),.05);
  border-radius:10px;padding:10px 13px;margin:10px 0;font-size:14px;white-space:pre-wrap;
}
.callout b{display:block;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--violet);margin-bottom:3px}
.qblock{margin:14px 0}
.qblock .q{font-weight:600;color:var(--strong);margin-bottom:6px;font-size:14.5px}
.ans{white-space:pre-wrap;background:#0e1117;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:14px}
.ans.none{color:#5b6377;font-style:italic}
.savebar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:6px 0 4px}
.save-state{font-size:13px;color:var(--muted)}
.save-state.ok{color:var(--ok)}.save-state.bad{color:var(--bad)}
.exports{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.exports-title{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-top:16px}

/* ---------- Asignaciones (profesor) ---------- */
.arow{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--panel2)}
.arow+.arow{margin-top:10px}
.arow-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:170px 1fr;gap:10px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
details{margin-top:10px}
summary{cursor:pointer;color:var(--accent);font-size:14px;user-select:none}
.frow{display:grid;grid-template-columns:minmax(120px,1.1fr) 150px 1.4fr;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.frow:last-of-type{border-bottom:0}
@media (max-width:640px){
  .grid2{grid-template-columns:1fr}
  .frow{grid-template-columns:1fr}
}

/* ---------- Pantallas de acceso ---------- */
.auth{max-width:420px;margin:9vh auto 0}
.auth .panel{padding:22px;box-shadow:0 0 24px rgba(var(--accent-rgb),.07)}
.auth h1{font-size:22px;margin-bottom:4px}
.auth p.lead{color:var(--muted);margin:0 0 18px;font-size:14px}
.msg{font-size:13.5px;border-radius:9px;padding:9px 12px;margin:0 0 12px;border:1px solid var(--line)}
.msg.bad{color:var(--bad);border-color:rgba(var(--bad-rgb),.4);background:rgba(var(--bad-rgb),.06)}
.msg.ok{color:var(--ok);border-color:rgba(var(--ok-rgb),.4);background:rgba(var(--ok-rgb),.06)}
.msg.info{color:var(--accent);border-color:rgba(var(--accent-rgb),.35);background:rgba(var(--accent-rgb),.05)}
.linkbtn{font:inherit;font-size:13.5px;color:var(--accent);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.stack{display:flex;flex-direction:column;gap:10px}
.center{text-align:center}
code{background:#0e1117;border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:13px}

/* ---------- Toast ---------- */
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{
  background:#10141b;border:1px solid rgba(var(--accent-rgb),.4);color:var(--strong);border-radius:10px;
  padding:9px 15px;font-size:14px;box-shadow:0 0 16px rgba(var(--accent-rgb),.15),0 8px 24px rgba(0,0,0,.45);
  animation:tin .2s ease-out;
}
.toast.bad{border-color:rgba(var(--bad-rgb),.5);box-shadow:0 0 16px rgba(var(--bad-rgb),.15),0 8px 24px rgba(0,0,0,.45)}
.toast.ok{border-color:rgba(var(--ok-rgb),.5)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.loading{color:var(--muted);text-align:center;padding:60px 0}
</style>
</head>
<body>
<div id="app"><div class="loading">Cargando…</div></div>
<div id="modalRoot"></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
/* =====================================================================
   CONFIGURACIÓN — las claves de Supabase viven en el archivo config.js
   (al lado de este index.html). Así puedes actualizar index.html las
   veces que quieras sin volver a pegar tus claves.
   ===================================================================== */
const CFG = window.APP_CONFIG || {};
// Se queda solo con "https://xxxx.supabase.co": si pegaste la URL con /rest/v1/ o una barra final, no importa.
function cleanUrl(u) { try { return new URL(String(u || '').trim()).origin; } catch { return ''; } }
const SUPABASE_URL = cleanUrl(CFG.SUPABASE_URL);
const SUPABASE_KEY = String(CFG.SUPABASE_KEY || '').trim();

/* Nombre visible de la app (cabecera, pantallas de acceso, imagen PNG exportada). */
const APP_NAME = 'Yurimh Academy';
/* Nombre del módulo actual (aparece en el menú superior). */
const MODULE_LISTENING = 'Escucha analítica';

/* ===================================================================== */
const QUESTIONS = [
  { k: 'highlights',       q: '¿Qué destacas del álbum/playlist/canción?' },
  { k: 'likes',         q: '¿Qué te gusta?' },
  { k: 'dislikes',       q: '¿Qué no te gusta?' },
  { k: 'learned',     q: '¿Qué has aprendido?' },
  { k: 'would_use', q: '¿Qué aprovecharías para alguno de tus grupos o tu música?' },
  { k: 'would_never_use',         q: '¿Qué jamás usarías en uno de tus grupos o música?' }
];
const KIND = { album: 'Álbum', song: 'Canción', playlist: 'Playlist' };

const configured = /^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(SUPABASE_URL) && SUPABASE_KEY.length > 20 && !SUPABASE_URL.includes('TU-PROYECTO') && !SUPABASE_KEY.includes('TU-CLAVE');
document.title = APP_NAME;
const sb = configured ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

const S = {
  user: null, profile: null,
  items: [], assigns: [], students: [],
  posts: [], recipients: [], reads: [],
  fposts: [], fcomments: [], lcomments: [], reactions: [], reports: [], dir: {},
  section: 'home', filter: 'pend'
};
let recovering = location.hash.includes('type=recovery');
let modalOnClose = null;
let cur = null; // estado del modal de alumno abierto

/* ---------------------------- Utilidades ---------------------------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : '#';
const pad = n => String(n).padStart(2, '0');
function fmtDate(iso) { if (!iso) return ''; const [y, m, d] = iso.split('-'); return `${d}/${m}/${y}`; }
function daysDiff(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  const t = new Date();
  const a = new Date(y, m - 1, d);
  const b = new Date(t.getFullYear(), t.getMonth(), t.getDate());
  return Math.round((a - b) / 86400000);
}
function dueInfo(a) {
  if (!a.due_date) return { cls: '', text: 'Sin fecha límite' };
  const n = daysDiff(a.due_date);
  if (a.listened) return { cls: 'ok', text: 'Límite: ' + fmtDate(a.due_date) };
  if (n < 0) return { cls: 'bad', text: `Vencido (${fmtDate(a.due_date)})` };
  if (n === 0) return { cls: 'warn', text: 'Vence hoy' };
  if (n <= 2) return { cls: 'warn', text: `Vence en ${n} día${n > 1 ? 's' : ''} (${fmtDate(a.due_date)})` };
  return { cls: '', text: 'Límite: ' + fmtDate(a.due_date) };
}
const isOverdue = a => !a.listened && a.due_date && daysDiff(a.due_date) < 0;
const answeredCount = a => QUESTIONS.filter(q => ((a.answers || {})[q.k] || '').trim()).length;
const slug = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-zA-Z0-9]+/g, '-').replace(/^-+|-+$/g, '').toLowerCase().slice(0, 60) || 'respuestas';
const studentName = id => (S.students.find(s => s.id === id) || {}).display_name || 'Alumno';
const dueSort = (a, b) => {
  if (a.listened !== b.listened) return a.listened ? 1 : -1;
  if (a.due_date && b.due_date) return a.due_date.localeCompare(b.due_date);
  if (a.due_date) return -1;
  if (b.due_date) return 1;
  return (b.assigned_at || '').localeCompare(a.assigned_at || '');
};

const isTeacher = () => !!S.profile && S.profile.role === 'teacher';
const firstName = n => String(n || '').trim().split(/\s+/)[0] || '';
function fmtDateTime(iso) { const d = new Date(iso); return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`; }
function timeAgo(iso) {
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 60) return 'ahora mismo';
  const m = Math.floor(s / 60); if (m < 60) return `hace ${m} min`;
  const hh = Math.floor(m / 60); if (hh < 24) return `hace ${hh} h`;
  const d = Math.floor(hh / 24); if (d < 7) return `hace ${d} d`;
  return fmtDateTime(iso);
}
// Texto seguro con los enlaces clicables (primero se escapa TODO, después se enlazan las URL http/https).
function linkify(text) {
  return esc(text).replace(/(https?:\/\/[^\s<]+?)([.,;:!?)]*)(?=\s|$)/g,
    (m, url, tail) => `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>${tail}`);
}

/* ---- Tablón: utilidades de datos ---- */
const myReadSet = () => new Set(S.reads.filter(r => r.student_id === S.user.id).map(r => r.post_id));
const unreadCount = () => { const rs = myReadSet(); return S.posts.filter(p => !rs.has(p.id)).length; };
const postSort = (a, b) => (Number(b.pinned) - Number(a.pinned)) || b.created_at.localeCompare(a.created_at);
function postRecipients(p) { // (profesor) alumnos que deben recibirlo
  const ok = S.students.filter(s => s.approved);
  if (p.audience === 'all') return ok;
  const ids = new Set(S.recipients.filter(r => r.post_id === p.id).map(r => r.student_id));
  return ok.filter(s => ids.has(s.id));
}
function postReadInfo(p) { // (profesor) { rec: destinatarios, readIds, read: nº que lo han leído }
  const rec = postRecipients(p);
  const readIds = new Set(S.reads.filter(r => r.post_id === p.id).map(r => r.student_id));
  return { rec, readIds, read: rec.filter(s => readIds.has(s.id)).length };
}

/* ===================== IDENTIDAD, REACCIONES, COMENTARIOS ===================== */
// Las claves ('like', 'love'…) son lo que se guarda en la base de datos; el emoji es solo lo que se ve.
const REACTIONS = [
  { k: 'like', e: '👍🏼' }, { k: 'love', e: '❤️' }, { k: 'laugh', e: '😂' },
  { k: 'wow', e: '😮' }, { k: 'sad', e: '😢' }, { k: 'angry', e: '😡' }
];
const TARGET_TABLE = { feed_post: 'feed_posts', feed_comment: 'feed_comments', listening_comment: 'listening_comments' };
const TARGET_LABEL = { feed_post: 'Publicación del feed', feed_comment: 'Comentario del feed', listening_comment: 'Comentario de escucha' };
const CM = {
  feed: { table: 'feed_comments', key: 'post_id', type: 'feed_comment' },
  listening: { table: 'listening_comments', key: 'item_id', type: 'listening_comment' }
};
const cmList = kind => kind === 'feed' ? S.fcomments : S.lcomments;

const safeAvatar = a => typeof a === 'string' && a.length <= 40000 && /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(a);
// Nombre que se ve en lo social: apodo o nombre. El profesor ve además el nombre real.
function whoName(id) {
  const d = S.dir[id];
  const pub = d ? d.public_name : 'Alumno';
  if (isTeacher()) {
    const st = S.students.find(s => s.id === id);
    if (st && st.display_name !== pub) return `${pub} (${st.display_name})`;
  }
  return pub;
}
function avatarHtml(id, size = 32) {
  const d = S.dir[id] || {};
  const st = `width:${size}px;height:${size}px;font-size:${Math.round(size * 0.42)}px`;
  if (safeAvatar(d.avatar)) return `<img class="av" style="${st}" src="${esc(d.avatar)}" alt="">`;
  const hue = [...String(id)].reduce((a, c) => a + c.charCodeAt(0), 0) % 360;
  return `<span class="av ini" style="${st};--h:${hue}">${esc((d.public_name || '?').trim().charAt(0).toUpperCase())}</span>`;
}

/* ---- Reacciones: una barra reutilizable para cualquier contenido ---- */
function rxBar(type, id) {
  const rows = S.reactions.filter(r => r.target_type === type && r.target_id === id);
  const data = REACTIONS.map(r => {
    const who = rows.filter(x => x.emoji === r.k);
    return { ...r, n: who.length, mine: who.some(x => x.user_id === S.user.id), names: who.map(x => whoName(x.user_id)).join(', ') };
  });
  const any = data.some(x => x.n);
  return `<div class="rx" data-rx="${type}:${id}">
    <div class="rx-list">${data.filter(x => x.n).map(x => `<button class="rxb ${x.mine ? 'mine' : ''}" data-action="rx-toggle" data-t="${type}" data-i="${id}" data-e="${x.k}" title="${esc(x.names)}">${x.e}<span>${x.n}</span></button>`).join('')}
      <button class="rxb add" data-action="rx-open" title="Reaccionar" aria-label="Reaccionar">${any ? '+' : 'Reaccionar'}</button></div>
    <div class="rx-pick" hidden>${data.map(x => `<button class="rxb ${x.mine ? 'mine' : ''}" data-action="rx-toggle" data-t="${type}" data-i="${id}" data-e="${x.k}" aria-label="${x.k}">${x.e}</button>`).join('')}</div>
  </div>`;
}
function updateRx(type, id) { $$(`[data-rx="${type}:${id}"]`).forEach(n => { n.outerHTML = rxBar(type, id); }); }

/* ---- Comentarios: el mismo bloque sirve para el feed y para la escucha ---- */
function commentRow(kind, x) {
  const c = CM[kind], mine = x.author_id === S.user.id, t = isTeacher();
  const reported = S.reports.some(r => r.target_type === c.type && r.target_id === x.id && r.reporter_id === S.user.id);
  return `<div class="cmt">${avatarHtml(x.author_id, 30)}<div class="cmt-main">
    <div class="cmt-head"><b>${esc(whoName(x.author_id))}</b><span class="sub">${timeAgo(x.created_at)}</span></div>
    <div class="cmt-body">${linkify(x.body)}</div>
    <div class="cmt-foot">${rxBar(c.type, x.id)}
      ${(mine || t) ? `<button class="linkbtn mute" data-action="comment-delete" data-kind="${kind}" data-id="${x.id}">Eliminar</button>` : ''}
      ${(!mine && !t) ? (reported ? '<span class="sub">Denunciado</span>' : `<button class="linkbtn mute" data-action="report" data-type="${c.type}" data-id="${x.id}">Denunciar</button>`) : ''}
    </div></div></div>`;
}
function commentsInner(kind, pid) {
  const c = CM[kind];
  const list = cmList(kind).filter(x => x[c.key] === pid).sort((a, b) => a.created_at.localeCompare(b.created_at));
  return `${list.length ? list.map(x => commentRow(kind, x)).join('') : '<div class="sub" style="margin:6px 0 10px">Aún no hay comentarios.</div>'}
    <div class="cm-new"><textarea id="cmInput-${kind}-${pid}" maxlength="1000" rows="2" placeholder="Escribe un comentario…"></textarea>
    <button class="btn sm" data-action="comment-send" data-kind="${kind}" data-pid="${pid}">Comentar</button></div>`;
}
const commentsBlock = (kind, pid) => `<div class="cm" data-cm="${kind}:${pid}">${commentsInner(kind, pid)}</div>`;
function updateComments(kind, pid) {
  $$(`[data-cm="${kind}:${pid}"]`).forEach(n => {
    const ta = n.querySelector('textarea'), v = ta ? ta.value : '';
    n.innerHTML = commentsInner(kind, pid);
    const t2 = n.querySelector('textarea'); if (t2 && v) t2.value = v; // conserva lo que estabas escribiendo
  });
  if (kind === 'feed') $$(`[data-cmcount="${pid}"]`).forEach(n => { n.textContent = cmCountLabel(pid); });
}
function cmCountLabel(pid) { const n = S.fcomments.filter(c => c.post_id === pid).length; return n ? `${n} comentario${n === 1 ? '' : 's'}` : 'Comentar'; }

/* ---- Enlaces ---- */
function linkCard(url) {
  let host = url; try { host = new URL(url).hostname.replace(/^www\./, ''); } catch { }
  const label = /spotify\.com$/.test(host) ? 'Spotify' : /(^|\.)youtu(\.be|be\.com)$/.test(host) ? 'YouTube' : host;
  return `<a class="linkcard" href="${esc(safeUrl(url))}" target="_blank" rel="noopener noreferrer"><span class="lk">${esc(label)}</span><span class="lu">${esc(url)}</span><span>↗</span></a>`;
}

/* ---- Moderación (profesor) ---- */
function targetOf(type, id) { return ({ feed_post: S.fposts, feed_comment: S.fcomments, listening_comment: S.lcomments }[type] || []).find(y => y.id === id) || null; }
function reportRow(r) {
  const x = targetOf(r.target_type, r.target_id);
  return `<div class="row rep"><div style="min-width:0;flex:1">
      <div class="sub">${esc(TARGET_LABEL[r.target_type] || 'Contenido')} · denunciado por ${esc(whoName(r.reporter_id))} · ${timeAgo(r.created_at)}</div>
      ${x ? `<div style="overflow-wrap:anywhere"><strong>${esc(whoName(x.author_id))}</strong>: ${esc(x.body.slice(0, 200))}</div>` : '<div class="sub">Contenido no disponible</div>'}
      ${r.reason ? `<div class="sub">Motivo: ${esc(r.reason)}</div>` : ''}</div>
    <div class="actions" style="margin:0"><button class="btn sm danger" data-action="mod-delete" data-id="${r.id}">Borrar contenido</button><button class="btn sm ghost" data-action="mod-dismiss" data-id="${r.id}">Descartar</button></div></div>`;
}
function dropTargetLocal(type, id) { // limpia en memoria lo que la base de datos borra en cascada
  let ids = [id];
  if (type === 'feed_post') { const cs = S.fcomments.filter(c => c.post_id === id).map(c => c.id); S.fcomments = S.fcomments.filter(c => c.post_id !== id); S.fposts = S.fposts.filter(x => x.id !== id); ids = ids.concat(cs); S.reactions = S.reactions.filter(r => !(r.target_type === 'feed_comment' && cs.includes(r.target_id))); S.reports = S.reports.filter(r => !(r.target_type === 'feed_comment' && cs.includes(r.target_id))); }
  if (type === 'feed_comment') S.fcomments = S.fcomments.filter(x => x.id !== id);
  if (type === 'listening_comment') S.lcomments = S.lcomments.filter(x => x.id !== id);
  S.reactions = S.reactions.filter(r => !(r.target_type === type && r.target_id === id));
  S.reports = S.reports.filter(r => !(r.target_type === type && r.target_id === id));
}

function toast(msg, type = '') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  $('#toast').appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

/* ------------------------------ Modal ------------------------------- */
function openModal(html, onClose) {
  $('#modalRoot').innerHTML = `<div class="backdrop" data-action="backdrop"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  document.body.classList.add('noscroll');
  modalOnClose = onClose || null;
}
async function closeModal() {
  if (modalOnClose) { const f = modalOnClose; modalOnClose = null; await f(); }
  $('#modalRoot').innerHTML = '';
  document.body.classList.remove('noscroll');
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modalRoot').firstChild) closeModal(); });

/* ----------------------------- Pantallas de acceso ------------------ */
function viewSetup() {
  $('#app').innerHTML = `
  <div class="auth"><div class="panel">
    <h1>Falta configurar</h1>
    <p class="lead">Falta el archivo <code>config.js</code> junto a <code>index.html</code>, o tiene la URL o la clave sin rellenar. Los pasos están en <code>GUIA.md</code>.</p>
  </div></div>`;
}

function viewAuth(mode = 'login', msg = null) {
  const reg = mode === 'register';
  $('#app').innerHTML = `
  <div class="auth"><div class="panel">
    <h1>${esc(APP_NAME)}</h1>
    <p class="lead">${reg ? 'Crea tu cuenta de alumno. Tu profesor tendrá que aprobarla antes de que veas nada.' : 'Entra con tu cuenta.'}</p>
    ${msg ? `<div class="msg ${msg.type}">${esc(msg.text)}</div>` : ''}
    <form id="authForm" data-mode="${mode}" class="stack" autocomplete="on">
      ${reg ? `<label class="f">Nombre<input type="text" name="name" required maxlength="60" autocomplete="name" placeholder="Cómo quieres que te vea tu profesor"></label>` : ''}
      <label class="f">Email<input type="email" name="email" required autocomplete="email"></label>
      <label class="f">Contraseña${reg ? ' (mínimo 8 caracteres)' : ''}<input type="password" name="password" required minlength="${reg ? 8 : 1}" autocomplete="${reg ? 'new-password' : 'current-password'}"></label>
      <button class="btn" type="submit" id="authBtn">${reg ? 'Crear cuenta' : 'Entrar'}</button>
    </form>
    <p class="center" style="margin:16px 0 0">
      ${reg
        ? `<button class="linkbtn" data-action="auth-mode" data-mode="login">Ya tengo cuenta</button>`
        : `<button class="linkbtn" data-action="auth-mode" data-mode="register">Crear cuenta</button> &nbsp;·&nbsp; <button class="linkbtn" data-action="forgot">He olvidado mi contraseña</button>`}
    </p>
  </div></div>`;
}

function viewPending() {
  $('#app').innerHTML = `
  <div class="auth"><div class="panel center">
    <h1>Cuenta pendiente de aprobación</h1>
    <p class="lead" style="margin-top:8px">Hola, ${esc(S.profile.display_name)}. Tu profesor aún tiene que aprobar tu cuenta. Cuando lo haga, pulsa en comprobar.</p>
    <div class="actions" style="justify-content:center">
      <button class="btn" data-action="recheck">Comprobar de nuevo</button>
      <button class="btn ghost" data-action="logout">Salir</button>
    </div>
  </div></div>`;
}

function viewFatal(text) {
  $('#app').innerHTML = `
  <div class="auth"><div class="panel">
    <h1>Algo ha fallado</h1>
    <p class="lead">${esc(text)}</p>
    <div class="actions"><button class="btn" data-action="recheck">Reintentar</button><button class="btn ghost" data-action="logout">Salir</button></div>
  </div></div>`;
}

function viewRecovery() {
  $('#app').innerHTML = `
  <div class="auth"><div class="panel">
    <h1>Nueva contraseña</h1>
    <p class="lead">Elige una contraseña nueva para tu cuenta.</p>
    <div id="recMsg"></div>
    <form id="recForm" class="stack">
      <label class="f">Nueva contraseña (mínimo 8 caracteres)<input type="password" name="password" required minlength="8" autocomplete="new-password"></label>
      <button class="btn" type="submit">Guardar contraseña</button>
    </form>
  </div></div>`;
}

/* ----------------------------- Flujo / datos ------------------------ */
async function route() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { S.user = null; S.profile = null; return viewAuth(); }
  S.user = session.user;
  const { data: prof, error } = await sb.from('profiles').select('*').eq('id', S.user.id).maybeSingle();
  if (error) return viewFatal('No se pudo leer tu perfil: ' + error.message);
  if (!prof) return viewFatal('No existe tu perfil. ¿Se ejecutó el SQL de supabase.sql antes de crear la cuenta?');
  S.profile = prof;
  if (!prof.approved) return viewPending();
  $('#app').innerHTML = '<div class="loading">Cargando…</div>';
  const ok = await loadData();
  if (ok) render();
}

async function loadData() {
  try {
    const me = S.user.id;
    const common = [
      sb.from('feed_posts').select('*').order('created_at', { ascending: false }).limit(100),
      sb.from('feed_comments').select('*'),
      sb.from('listening_comments').select('*'),
      sb.from('reactions').select('*'),
      sb.rpc('get_directory')
    ];
    if (S.profile.role === 'teacher') {
      const [i, a, p, bp, br, bd, rp, fp, fc, lc, rx, dr] = await Promise.all([
        sb.from('listening_items').select('*').order('created_at', { ascending: false }),
        sb.from('listening_assignments').select('*'),
        sb.from('profiles').select('*').eq('role', 'student').order('display_name'),
        sb.from('board_posts').select('*'),
        sb.from('board_recipients').select('*'),
        sb.from('board_reads').select('*'),
        sb.from('moderation_reports').select('*'),
        ...common
      ]);
      const err = [i, a, p, bp, br, bd, rp, fp, fc, lc, rx, dr].map(x => x.error).find(Boolean);
      if (err) throw err;
      S.items = i.data; S.assigns = a.data; S.students = p.data;
      S.posts = bp.data; S.recipients = br.data; S.reads = bd.data; S.reports = rp.data;
      S.fposts = fp.data; S.fcomments = fc.data; S.lcomments = lc.data; S.reactions = rx.data;
      S.dir = {}; (dr.data || []).forEach(d => { S.dir[d.id] = d; });
    } else {
      const [a, bp, bd, rp, fp, fc, lc, rx, dr] = await Promise.all([
        sb.from('listening_assignments').select('*, item:listening_items(*)').eq('student_id', me),
        sb.from('board_posts').select('*'),
        sb.from('board_reads').select('*').eq('student_id', me),
        sb.from('moderation_reports').select('*').eq('reporter_id', me),
        ...common
      ]);
      const err = [a, bp, bd, rp, fp, fc, lc, rx, dr].map(x => x.error).find(Boolean);
      if (err) throw err;
      S.assigns = (a.data || []).filter(x => x.item);
      S.posts = bp.data; S.reads = bd.data; S.reports = rp.data;
      S.fposts = fp.data; S.fcomments = fc.data; S.lcomments = lc.data; S.reactions = rx.data;
      S.dir = {}; (dr.data || []).forEach(d => { S.dir[d.id] = d; });
    }
    return true;
  } catch (e) {
    const m = String(e.message || e);
    viewFatal(/board_|feed_|reactions|moderation_|get_directory|listening_comments|relation|schema cache|function/i.test(m)
      ? 'Falta ejecutar la última versión de supabase.sql en el SQL Editor de Supabase. (' + m + ')'
      : 'Error cargando los datos: ' + m);

  const { data } = await sb.rpc('get_directory');

function render() {
  if (!S.profile) return;
  const t = isTeacher();
  if (!['home', 'board', 'feed', 'listening', 'profile'].concat(t ? ['students'] : []).includes(S.section)) S.section = 'home';
  let body;
  switch (S.section) {
    case 'board': body = t ? boardTeacher() : boardStudent(); break;
    case 'feed': body = feedView(); break;
    case 'listening': body = t ? teacherCatalog() : studentListening(); break;
    case 'students': body = teacherStudents(); break;
    case 'profile': body = profileView(); break;
    default: body = t ? homeTeacher() : homeStudent();

async function saveProfileFields(fields, okMsg) {
  const { data, error } = await sb.from('profiles').update(fields).eq('id', S.user.id).select();

  return true;
}
async function processAvatar(file) {
  if (!file || !/^image\//.test(file.type)) return toast('Elige una imagen', 'bad');
  const url = URL.createObjectURL(file);
  const img = new Image();
  await new Promise(res => { img.onload = res; img.onerror = res; img.src = url; });
  URL.revokeObjectURL(url);
  if (!img.naturalWidth) return toast('No se pudo leer esa imagen. Prueba con JPG o PNG', 'bad');
  const N = 160, c = document.createElement('canvas'); c.width = c.height = N;
  const ctx = c.getContext('2d'), s = Math.min(img.naturalWidth, img.naturalHeight);
  ctx.fillStyle = '#12151c'; ctx.fillRect(0, 0, N, N);
  ctx.drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) / 2, s, s, 0, 0, N, N);
  let data = c.toDataURL('image/jpeg', 0.82);
  if (data.length > 38000) data = c.toDataURL('image/jpeg', 0.6);
  if (data.length > 40000) return toast('La imagen es demasiado pesada', 'bad');
  await saveProfileFields({ avatar: data }, 'Foto actualizada');
}

function setSaveState(text, cls = '') {
  const el = $('#saveState');
  if (!el) return;
  el.textContent = text;
  el.className = 'save-state ' + cls;
}
function markDirty() {
  if (!cur) return;
  cur.dirty = true;
  setSaveState('Sin guardar…');
  clearTimeout(cur.timer);
  cur.timer = setTimeout(saveNow, 900);
}
async function saveNow() {
  const c = cur;
  if (!c || !c.dirty || c.saving) return;
  const a = S.assigns.find(x => x.id === c.id);
  const chk = $('#chkListened');
  if (!a || !chk) return;
  clearTimeout(c.timer);
  const answers = {};
  QUESTIONS.forEach(q => { const t = $(`[data-q="${q.k}"]`); answers[q.k] = t ? t.value : ((a.answers || {})[q.k] || ''); });
  const listened = chk.checked;
  c.dirty = false; c.saving = true;
  setSaveState('Guardando…');
  const { data, error } = await sb.from('listening_assignments')
    .update({ listened, listened_at: listened ? (a.listened_at || new Date().toISOString()) : null, answers })
    .eq('id', a.id).select();
  c.saving = false;
  if (error || !data || !data.length) {
    c.dirty = true;
    setSaveState('Error al guardar', 'bad');
    toast('No se pudo guardar' + (error ? ': ' + error.message : ''), 'bad');
    return;
  }
  Object.assign(a, data[0]);
  setSaveState('Guardado ✓', 'ok');
  if (c.dirty) c.timer = setTimeout(saveNow, 300); // se escribió algo mientras guardaba
}

function currentExport() {

  return { name: S.profile.display_name, title: a.item.title, kind: a.item.kind, url: a.item.url, answers };
}
function buildText(d, wa) {
  const b = s => wa ? `*${s}*` : s;
  let t = `${b(d.title)} (${KIND[d.kind] || d.kind})\nAlumno: ${d.name}\n${d.url}\n`;
  QUESTIONS.forEach((q, i) => { t += `\n${b(`${i + 1}. ${q.q}`)}\n${(d.answers[q.k] || '').trim() || '—'}\n`; });
  return t.trim();
}
function download(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; }
  catch {
    const ta = document.createElement('textarea');
    ta.value = t; ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch { }
    ta.remove();
    return ok;
  }
}
function buildCanvas(d) {
  const W = 1080, P = 56, maxW = W - 2 * P;
  const F = 'system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
  const c = document.createElement('canvas');
  const ctx = c.getContext('2d');
  const blocks = [
    { t: (KIND[d.kind] || d.kind).toUpperCase(), f: `600 20px ${F}`, col: '#a78bfa', lh: 28, gap: 0 },
    { t: d.title, f: `700 40px ${F}`, col: '#eceff6', lh: 50, gap: 6 },
    { t: `Alumno: ${d.name}`, f: `400 22px ${F}`, col: '#8990a3', lh: 30, gap: 10 },
    { t: d.url, f: `400 19px ${F}`, col: '#8990a3', lh: 26, gap: 2 }
  ];
  QUESTIONS.forEach((q, i) => {
    blocks.push({ t: `${i + 1}. ${q.q}`, f: `600 24px ${F}`, col: '#62d8ee', lh: 32, gap: 32 });
    blocks.push({ t: (d.answers[q.k] || '').trim() || '—', f: `400 24px ${F}`, col: '#d5d9e2', lh: 34, gap: 8 });
  });
  const wrap = (text, font) => {
    ctx.font = font;
    const out = [];
    text.split('\n').forEach(par => {
      if (!par.trim()) { out.push(''); return; }
      let line = '';
      par.split(/\s+/).forEach(w => {
        while (ctx.measureText(w).width > maxW) { // palabra más ancha que la línea (p. ej. una URL)
          let i = w.length;
          while (i > 1 && ctx.measureText(w.slice(0, i)).width > maxW) i--;
          if (line) { out.push(line); line = ''; }
          out.push(w.slice(0, i)); w = w.slice(i);
        }
        const test = line ? line + ' ' + w : w;
        if (ctx.measureText(test).width > maxW && line) { out.push(line); line = w; } else line = test;
      });
      out.push(line);
    });
    return out;
  };
  let y = P + 6;
  blocks.forEach(b => { b.lines = wrap(b.t, b.f); y += b.gap + b.lines.length * b.lh; });
  const H = y + P + 30;
  c.width = W; c.height = H;
  ctx.fillStyle = '#0b0d12'; ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.shadowColor = 'rgba(98,216,238,.55)'; ctx.shadowBlur = 14;
  ctx.fillStyle = '#62d8ee'; ctx.fillRect(P, 28, 90, 3);
  ctx.restore();
  ctx.textBaseline = 'top';
  y = P + 6;
  blocks.forEach(b => {
    y += b.gap; ctx.font = b.f; ctx.fillStyle = b.col;
    b.lines.forEach(l => { ctx.fillText(l, P, y); y += b.lh; });
  });
  ctx.font = `400 16px ${F}`; ctx.fillStyle = '#4b5366';
  ctx.fillText(APP_NAME, P, H - P + 6);
  return c;
}
const canvasBlob = c => new Promise(res => c.toBlob(res, 'image/png'));
function canShareFiles() {
  try { return !!(navigator.canShare && navigator.canShare({ files: [new File([''], 'a.png', { type: 'image/png' })] })); }
  catch { return false; }
}

const exportActions = {
  async 'exp-copy'() {
    const ok = await copyText(buildText(currentExport(), true));
    toast(ok ? 'Texto copiado. Pégalo en WhatsApp' : 'No se pudo copiar', ok ? 'ok' : 'bad');
  },
  async 'exp-share'() {
    const d = currentExport();
    try { await navigator.share({ title: d.title, text: buildText(d, true) }); }
    catch (e) { if (e && e.name !== 'AbortError') toast('No se pudo compartir', 'bad'); }
  },
  'exp-txt'() {
    const d = currentExport();
    download(new Blob([buildText(d, false)], { type: 'text/plain;charset=utf-8' }), `${slug(d.title)}_${slug(d.name)}.txt`);
  },
  async 'exp-png'() {
    const d = currentExport();
    download(await canvasBlob(buildCanvas(d)), `${slug(d.title)}_${slug(d.name)}.png`);
  },
  async 'exp-sharepng'() {
    const d = currentExport();
    const blob = await canvasBlob(buildCanvas(d));
    const file = new File([blob], `${slug(d.title)}_${slug(d.name)}.png`, { type: 'image/png' });
    try { await navigator.share({ files: [file], title: d.title }); }
    catch (e) { if (e && e.name !== 'AbortError') toast('No se pudo compartir la imagen', 'bad'); }
  }
};

/* ======================= Acciones (click delegado) ================== */
const actions = {
  noop() { },
  backdrop(el, e) { if (e.target === el) closeModal(); },
  close() { closeModal(); },
  async logout() { await sb.auth.signOut(); },
  async recheck() { await route(); },
  async refresh() { if (await loadData()) { render(); toast('Datos actualizados', 'ok'); } },
  'auth-mode'(el) { viewAuth(el.dataset.mode); },
  async forgot() {
    const email = prompt('Escribe el email de tu cuenta y te enviaremos un enlace para crear una nueva contraseña:');
    if (!email) return;
    const { error } = await sb.auth.resetPasswordForEmail(email.trim(), { redirectTo: location.href.split('#')[0] });
    viewAuth('login', error ? { type: 'bad', text: error.message } : { type: 'ok', text: 'Si el email existe, te llegará un enlace para restablecer la contraseña.' });
  },
  filter(el) { S.filter = el.dataset.f; render(); },
  'open-assign'(el) { studentModal(el.dataset.id); },
  'save-now'() { if (cur) { cur.dirty = true; saveNow(); } },
  section(el) { S.section = el.dataset.s; render(); },
  'new-item'() { itemFormModal(null); },
  'open-item'(el) { itemModal(el.dataset.id); },
  'edit-item'(el) { itemFormModal(el.dataset.id); },
  async 'delete-item'(el) {
    const it = S.items.find(x => x.id === el.dataset.id);
    const n = S.assigns.filter(a => a.item_id === it.id).length;
    if (!confirm(`¿Eliminar "${it.title}"?${n ? `\n\nSe borrarán también las asignaciones y las respuestas de ${n} alumno${n > 1 ? 's' : ''}. No se puede deshacer.` : ''}`)) return;
    const { error } = await sb.from('listening_items').delete().eq('id', it.id);
    if (error) return toast('Error: ' + error.message, 'bad');
    await loadData(); await closeModal(); render(); toast('Elemento eliminado', 'ok');
  },
  async 'save-assign'(el) {
    const row = el.closest('.arow');
    const due = $('[data-f=due]', row).value || null;
    const note = $('[data-f=note]', row).value.trim() || null;
    const { data, error } = await sb.from('listening_assignments').update({ due_date: due, note }).eq('id', el.dataset.id).select();
    if (error || !data.length) return toast('No se pudo guardar' + (error ? ': ' + error.message : ''), 'bad');
    const a = S.assigns.find(x => x.id === el.dataset.id);
    Object.assign(a, data[0]);
    const open = $('details', row) && $('details', row).open;
    itemModal(a.item_id);
    if (open) { const r = $(`.arow[data-aid="${a.id}"] details`); if (r) r.open = true; }
    toast('Cambios guardados', 'ok');
  },
  async 'del-assign'(el) {
    const a = S.assigns.find(x => x.id === el.dataset.id);
    if (!confirm(`¿Quitar este elemento a ${studentName(a.student_id)}?\nSe borrarán también sus respuestas.`)) return;
    const { error } = await sb.from('listening_assignments').delete().eq('id', a.id);
    if (error) return toast('Error: ' + error.message, 'bad');
    S.assigns = S.assigns.filter(x => x.id !== a.id);
    itemModal(a.item_id);
    toast('Asignación eliminada', 'ok');
  },
  async 'assign-selected'(el) {
    const rows = $$('.frow', $('#assignBox')).filter(r => $('[data-f=pick]', r).checked);
    if (!rows.length) return toast('Marca al menos un alumno');
    const payload = rows.map(r => ({
      item_id: el.dataset.id,
      student_id: $('[data-f=pick]', r).value,
      due_date: $('[data-f=due]', r).value || null,
      note: $('[data-f=note]', r).value.trim() || null
    }));
    const { error } = await sb.from('listening_assignments').insert(payload);
    if (error) return toast('Error: ' + error.message, 'bad');
    await loadData();
    itemModal(el.dataset.id);
    toast(`Asignado a ${payload.length} alumno${payload.length > 1 ? 's' : ''}`, 'ok');
  },
  async approve(el) { await setApproved(el.dataset.id, true); },
  async revoke(el) {
    const s = S.students.find(x => x.id === el.dataset.id);
    if (!confirm(`¿Revocar el acceso de ${s.display_name}? No verá nada hasta que lo vuelvas a aprobar.`)) return;
    await setApproved(s.id, false);
  },
  'open-student'(el) { studentDetailModal(el.dataset.id); },
  async 'rename-student'(el) {
    const name = $('#renameInput').value.trim();
    if (!name) return toast('Escribe un nombre', 'bad');
    const { data, error } = await sb.from('profiles').update({ display_name: name }).eq('id', el.dataset.id).select();
    if (error || !data.length) return toast('No se pudo cambiar' + (error ? ': ' + error.message : ''), 'bad');
    S.students.find(s => s.id === el.dataset.id).display_name = data[0].display_name;
    await loadDirectory();
    studentDetailModal(el.dataset.id);
    toast('Nombre actualizado', 'ok');
  },
  'home-open-assign'(el) { S.section = 'listening'; render(); studentModal(el.dataset.id); },
  'home-open-item'(el) { S.section = 'listening'; render(); itemModal(el.dataset.id); },
  'home-open-post'(el) { S.section = 'board'; render(); postModal(el.dataset.id); },
  'open-post'(el) { postModal(el.dataset.id); },
  'home-open-fpost'(el) { S.section = 'feed'; render(); feedPostModal(el.dataset.id); },
  'open-fpost'(el) { feedPostModal(el.dataset.id); },
  'rx-open'(el) { const pk = el.closest('.rx').querySelector('.rx-pick'); pk.hidden = !pk.hidden; },
  async 'rx-toggle'(el) {
    const { t, i, e } = el.dataset, me = S.user.id;
    const has = S.reactions.find(r => r.target_type === t && r.target_id === i && r.user_id === me && r.emoji === e);
    if (has) {
      const { error } = await sb.from('reactions').delete().eq('target_type', t).eq('target_id', i).eq('user_id', me).eq('emoji', e);
      if (error) return toast('No se pudo quitar: ' + error.message, 'bad');
      S.reactions = S.reactions.filter(r => r !== has);
    } else {
      const row = { target_type: t, target_id: i, user_id: me, emoji: e };
      const { error } = await sb.from('reactions').insert(row);
      if (error) return toast('No se pudo reaccionar: ' + error.message, 'bad');
      S.reactions.push({ ...row, created_at: new Date().toISOString() });
    }
    updateRx(t, i);
  },
  async 'comment-send'(el) {
    const { kind, pid } = el.dataset, c = CM[kind];
    const ta = $(`#cmInput-${kind}-${pid}`), body = ta.value.trim();
    if (!body) return toast('Escribe algo primero', 'bad');
    el.disabled = true;
    const { data, error } = await sb.from(c.table).insert({ [c.key]: pid, author_id: S.user.id, body }).select().single();
    el.disabled = false;
    if (error) return toast('No se pudo comentar: ' + error.message, 'bad');
    cmList(kind).push(data);
    ta.value = '';
    updateComments(kind, pid);
  },
  async 'comment-delete'(el) {
    const { kind, id } = el.dataset, c = CM[kind];
    const x = cmList(kind).find(y => y.id === id);
    if (!x || !confirm('¿Eliminar este comentario?')) return;
    const { error } = await sb.from(c.table).delete().eq('id', id);
    if (error) return toast('Error: ' + error.message, 'bad');
    dropTargetLocal(c.type, id);
    updateComments(kind, x[c.key]);
  },
  async report(el) {
    const { type, id } = el.dataset;
    const reason = prompt('¿Quieres añadir un motivo? (opcional)\nTu profesor recibirá la denuncia y la revisará.');
    if (reason === null) return;
    const row = { reporter_id: S.user.id, target_type: type, target_id: id, reason: reason.trim().slice(0, 300) || null };
    const { error } = await sb.from('moderation_reports').insert(row);
    if (error) return toast('No se pudo enviar: ' + error.message, 'bad');
    S.reports.push({ ...row, resolved: false, created_at: new Date().toISOString() });
    el.outerHTML = '<span class="sub">Denunciado</span>';
    toast('Denuncia enviada. Gracias', 'ok');
  },
  async 'feed-delete'(el) {
    const p = S.fposts.find(x => x.id === el.dataset.id);
    if (!p || !confirm('¿Eliminar esta publicación? Se borrarán también sus comentarios.')) return;
    const { error } = await sb.from('feed_posts').delete().eq('id', p.id);
    if (error) return toast('Error: ' + error.message, 'bad');
    dropTargetLocal('feed_post', p.id);
    render(); toast('Publicación eliminada', 'ok');
  },
  async 'mod-delete'(el) {
    const r = S.reports.find(x => x.id === el.dataset.id);
    if (!r || !confirm('¿Borrar este contenido para todos? No se puede deshacer.')) return;
    const { error } = await sb.from(TARGET_TABLE[r.target_type]).delete().eq('id', r.target_id);
    if (error) return toast('Error: ' + error.message, 'bad');
    dropTargetLocal(r.target_type, r.target_id);
    render(); toast('Contenido eliminado', 'ok');
  },
  async 'mod-dismiss'(el) {
    const r = S.reports.find(x => x.id === el.dataset.id);
    const { data, error } = await sb.from('moderation_reports').update({ resolved: true }).eq('id', el.dataset.id).select();
    if (error || !data.length) return toast('No se pudo descartar' + (error ? ': ' + error.message : ''), 'bad');
    r.resolved = true;
    render(); toast('Denuncia descartada', 'ok');
  },
  async 'avatar-remove'() { await saveProfileFields({ avatar: null }, 'Foto eliminada'); },
  'new-post'() { postFormModal(null); },
  'edit-post'(el) { postFormModal(el.dataset.id); },
  async 'toggle-pin'(el) {
    const p = S.posts.find(x => x.id === el.dataset.id);
    const { data, error } = await sb.from('board_posts').update({ pinned: !p.pinned }).eq('id', p.id).select();
    if (error || !data.length) return toast('No se pudo cambiar' + (error ? ': ' + error.message : ''), 'bad');
    Object.assign(p, data[0]);
    postModal(p.id);
  },
  async 'delete-post'(el) {
    const p = S.posts.find(x => x.id === el.dataset.id);
    if (!confirm(`¿Eliminar el aviso "${p.title}"?\nDesaparecerá para todos. No se puede deshacer.`)) return;
    const { error } = await sb.from('board_posts').delete().eq('id', p.id);
    if (error) return toast('Error: ' + error.message, 'bad');
    await loadData(); await closeModal(); toast('Aviso eliminado', 'ok');
  },
  ...exportActions
};

async function setApproved(id, value) {
  const { data, error } = await sb.from('profiles').update({ approved: value }).eq('id', id).select();
  if (error || !data.length) return toast('Error al actualizar' + (error ? ': ' + error.message : ''), 'bad');
  S.students.find(s => s.id === id).approved = value;
  render();
  toast(value ? 'Alumno aprobado' : 'Acceso revocado', 'ok');
}

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const fn = actions[el.dataset.action];
  if (!fn) return;
  try { await fn(el, e); } catch (err) { console.error(err); toast('Error inesperado: ' + (err.message || err), 'bad'); }
});

/* Autoguardado del modal de alumno */
document.addEventListener('input', e => { if (cur && e.target.matches('[data-q]')) markDirty(); });
document.addEventListener('change', e => {
  if (cur && e.target.id === 'chkListened') { markDirty(); clearTimeout(cur.timer); saveNow(); }
  if (e.target.id === 'avatarFile') { const f0 = e.target.files[0]; e.target.value = ''; processAvatar(f0); }
  if (e.target.name === 'audience') { const b = $('#pickBox'); if (b) b.hidden = e.target.value !== 'selected'; }
});

/* ------------------------------ Formularios ------------------------- */
document.addEventListener('submit', async e => {
  const f = e.target;
  if (f.id === 'authForm') {
    e.preventDefault();
    const mode = f.dataset.mode, btn = $('#authBtn');
    const email = f.email.value.trim(), password = f.password.value;
    btn.disabled = true;
    if (mode === 'login') {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) viewAuth('login', { type: 'bad', text: error.message === 'Invalid login credentials' ? 'Email o contraseña incorrectos.' : error.message });
      // si todo va bien, onAuthStateChange(SIGNED_IN) hace el resto
    } else {
      const name = f.name.value.trim();
      const { data, error } = await sb.auth.signUp({ email, password, options: { data: { display_name: name } } });
      if (error) viewAuth('register', { type: 'bad', text: error.message });
      else if (!data.session) viewAuth('login', { type: 'ok', text: 'Cuenta creada. Revisa tu email para confirmarla y después entra.' });
    }
  } else if (f.id === 'recForm') {
    e.preventDefault();
    const { error } = await sb.auth.updateUser({ password: f.password.value });
    if (error) { $('#recMsg').innerHTML = `<div class="msg bad">${esc(error.message)}</div>`; return; }
    recovering = false;
    history.replaceState(null, '', location.pathname + location.search);
    await route();
    toast('Contraseña actualizada', 'ok');
  } else if (f.id === 'postForm') {
    e.preventDefault();
    const el = f.elements;
    const audience = el['audience'].value;
    const ids = $$('input[name=pick]:checked', f).map(x => x.value);
    if (audience === 'selected' && !ids.length) return toast('Elige al menos un alumno', 'bad');
    const row = { title: el['title'].value.trim(), body: el['body'].value.trim(), audience, pinned: el['pinned'].checked };
    if (!row.title || !row.body) return toast('Escribe un título y un mensaje', 'bad');
    const btn = $('button[type=submit]', f); btn.disabled = true;
    let id = f.dataset.id, error;
    if (id) ({ error } = await sb.from('board_posts').update(row).eq('id', id));
    else {
      const r = await sb.from('board_posts').insert({ ...row, author_id: S.user.id }).select().single();
      error = r.error; if (!error) id = r.data.id;
    }
    if (!error) ({ error } = await sb.from('board_recipients').delete().eq('post_id', id));
    if (!error && audience === 'selected') ({ error } = await sb.from('board_recipients').insert(ids.map(sid => ({ post_id: id, student_id: sid }))));
    btn.disabled = false;
    if (error) return toast('Error: ' + error.message, 'bad');
    const wasEdit = !!f.dataset.id;
    await loadData(); await closeModal(); render();
    toast(wasEdit ? 'Aviso actualizado' : 'Aviso publicado', 'ok');
  } else if (f.id === 'feedForm') {
    e.preventDefault();
    const body = f.elements['body'].value.trim();
    let link = f.elements['link'].value.trim();
    if (!body) return toast('Escribe algo para publicar', 'bad');
    if (link && !/^https?:\/\//i.test(link)) link = 'https://' + link;
    if (link) { try { new URL(link); } catch { return toast('Ese enlace no parece válido', 'bad'); } }
    const btn = $('button[type=submit]', f); btn.disabled = true;
    const { data, error } = await sb.from('feed_posts').insert({ author_id: S.user.id, body, link_url: link || null }).select().single();
    btn.disabled = false;
    if (error) return toast('No se pudo publicar: ' + error.message, 'bad');
    S.fposts.unshift(data); render(); toast('Publicado', 'ok');
  } else if (f.id === 'nameForm') {
    e.preventDefault();
    const name = f.elements['display_name'].value.trim();
    const nick = f.elements['nickname'].value.trim();
    if (!name) return toast('Escribe un nombre', 'bad');
    await saveProfileFields({ display_name: name, nickname: nick || null }, 'Datos actualizados');
  } else if (f.id === 'passForm') {
    e.preventDefault();
    const p1 = f.elements['password'].value, p2 = f.elements['password2'].value;
    if (p1.length < 8) return toast('Mínimo 8 caracteres', 'bad');
    if (p1 !== p2) return toast('Las contraseñas no coinciden', 'bad');
    const { error } = await sb.auth.updateUser({ password: p1 });
    if (error) return toast('Error: ' + error.message, 'bad');
    f.reset(); toast('Contraseña cambiada', 'ok');
  } else if (f.id === 'itemForm') {
    e.preventDefault();
    const url = f.url.value.trim();
    if (!/^https?:\/\//i.test(url)) return toast('El enlace debe empezar por http:// o https://', 'bad');
    const row = { title: f.title.value.trim(), url, kind: f.kind.value, brief: f.brief.value.trim() || null };
    const id = f.dataset.id;
    const { error } = id ? await sb.from('listening_items').update(row).eq('id', id) : await sb.from('listening_items').insert(row);
    if (error) return toast('Error: ' + error.message, 'bad');
    await loadData();
    await closeModal();
    render();
    toast(id ? 'Elemento actualizado' : 'Elemento creado', 'ok');
  }
});

/* -------------------------------- Arranque -------------------------- */
(async function boot() {
  if (!configured) return viewSetup();
  sb.auth.onAuthStateChange((event, session) => {
    // setTimeout: evita llamar a supabase dentro del propio callback (puede bloquearse)
    setTimeout(() => {
      if (event === 'PASSWORD_RECOVERY') { recovering = true; viewRecovery(); }
      else if (event === 'SIGNED_OUT') { S.user = null; S.profile = null; S.items = []; S.assigns = []; S.students = []; S.posts = []; S.recipients = []; S.reads = []; S.fposts = []; S.fcomments = []; S.lcomments = []; S.reactions = []; S.reports = []; S.dir = {}; S.section = 'home'; viewAuth(); }
      else if (event === 'SIGNED_IN' && !recovering && (!S.user || S.user.id !== (session && session.user.id))) route();
    }, 0);
  });
  if (recovering) return viewRecovery();
  await route();
})();
</script>

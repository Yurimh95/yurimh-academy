/* ================================ AGENDA ============================== *
   Las clases se apuntan solo en Google Calendar. La Edge Function calendar-sync las copia en `lessons`
   cada 15 minutos (y con "Sincronizar ahora"). El alumno ve su próxima clase y recibe un aviso 8 h antes. */
const WEEKDAYS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
const hhmm = iso => { const d = new Date(iso); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const dayLabel = iso => { const d = new Date(iso); return `${WEEKDAYS[d.getDay()]} ${d.getDate()} de ${MONTHS[d.getMonth()]}`; };
function relDay(iso) { // hoy / mañana / jueves 27 de noviembre
  const d = new Date(iso), t = new Date(), a = new Date(d.getFullYear(), d.getMonth(), d.getDate()), b = new Date(t.getFullYear(), t.getMonth(), t.getDate());
  const n = Math.round((a - b) / 86400000);
  return n === 0 ? 'hoy' : n === 1 ? 'mañana' : dayLabel(iso);
}
const calSynced = () => !!(S.lessonSync && S.lessonSync.last_ok_at);
const nextLesson = id => S.lessons.filter(l => l.student_id === id && new Date(l.ends_at || l.starts_at) > new Date()).sort((a, b) => a.starts_at.localeCompare(b.starts_at))[0] || null;
// ¿Ha tenido ya alguna clase este mes? (para Pagos: se cobra tras la primera clase del mes)
const hadClassThisMonth = id => { const now = new Date(); return S.lessons.some(l => { const d = new Date(l.starts_at); return l.student_id === id && d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth() && d <= now; }); }; // en hora local, no UTC
function nextLessonHtml() { // alumno
  const l = nextLesson(S.user.id); if (!l) return '';
  return `<div class="fy-row lesson-row"><span class="ic">${ic('calendar')}</span><div class="t"><b>Tu próxima clase: ${esc(relDay(l.starts_at))}</b><span class="sub">a las ${hhmm(l.starts_at)}${l.ends_at ? ' – ' + hhmm(l.ends_at) : ''}</span></div></div>`;
}
const weekStart = (d = new Date()) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
function agendaView() {
  const ws = S.agendaWeek ? new Date(S.agendaWeek) : weekStart(); const we = new Date(ws); we.setDate(ws.getDate() + 7);
  const thisWeek = ws.getTime() === weekStart().getTime();
  const st = S.lessonSync;
  const list = S.lessons.filter(l => { const d = new Date(l.starts_at); return d >= ws && d < we; }).sort((a, b) => a.starts_at.localeCompare(b.starts_at));
  const days = []; for (let i = 0; i < 7; i++) { const d = new Date(ws); d.setDate(ws.getDate() + i); days.push(d); }
  const head = `<div class="sec-head"><div class="sub">${!st || !st.last_run_at ? 'Aún no se ha sincronizado con Google Calendar.'
      : st.last_error ? `<span style="color:var(--bad)">⚠ ${esc(st.last_error)}</span>`
      : `Sincronizado con Google Calendar ${timeAgo(st.last_ok_at)} · se actualiza solo cada 15 min`}</div>
      <button class="btn sm" data-action="cal-sync">${ic('calendar')} Sincronizar ahora</button></div>`;
  if (!calSynced()) return head + `<div class="panel"><h2 class="h2" style="margin-top:0">Conecta tu calendario de clases</h2>
    <ol class="isteps">
      <li>En el ordenador, abre <b>Google Calendar</b> → ⚙ <b>Configuración</b> → en la izquierda, tu calendario de clases.</li>
      <li>Baja hasta <b>"Dirección secreta en formato iCal"</b> y cópiala. Es privada: no la compartas con nadie.</li>
      <li>En <b>Supabase</b> → <b>Edge Functions</b> → <b>Secrets</b> → <b>Add new secret</b>: nombre <code>CALENDAR_ICS_URL</code>, valor la dirección copiada → <b>Save</b>.</li>
      <li>Vuelve aquí y pulsa <b>Sincronizar ahora</b>.</li></ol>
    <p class="sub" style="margin:12px 0 0">Cada evento debe llevar el nombre del alumno (por ejemplo "Clase Luis"). Si en el calendario lo llamas distinto, ponlo en su ficha: "Nombre en Google Calendar".</p></div>`;
  const unk = list.filter(l => !l.student_id).length;
  return head + `<div class="monthnav"><button class="iconbtn" data-action="agenda-week" data-n="-1" aria-label="Semana anterior">‹</button>
      <h2>${ws.getDate()} ${MONTHS[ws.getMonth()].slice(0, 3)} – ${new Date(we - 86400000).getDate()} ${MONTHS[new Date(we - 86400000).getMonth()].slice(0, 3)}</h2>
      <button class="iconbtn" data-action="agenda-week" data-n="1" aria-label="Semana siguiente">›</button>
      ${thisWeek ? '' : '<button class="btn sm ghost" data-action="agenda-week" data-n="0">Esta semana</button>'}</div>
    ${unk ? `<div class="callout">Hay ${unk} clase${unk > 1 ? 's' : ''} que no sé de qué alumno ${unk > 1 ? 'son' : 'es'}. El título del evento debe llevar su nombre, o pon en su ficha cómo lo llamas en el calendario.</div>` : ''}
    ${agendaGrid(days, list)}
    ${list.length ? '' : '<p class="sub" style="margin-top:10px">No hay clases esta semana.</p>'}`;
}
// Semana en rejilla, como Google Calendar: días en columnas, horas en filas, cada clase un bloque de su duración
const WD3 = ['DOM', 'LUN', 'MAR', 'MIÉ', 'JUE', 'VIE', 'SÁB'];
function agendaGrid(days, list) {
  const H = 48; // píxeles por hora
  let h0 = 9, h1 = 23;
  list.forEach(l => { const s = new Date(l.starts_at), e = new Date(l.ends_at || s.getTime() + 3600000); h0 = Math.min(h0, s.getHours()); h1 = Math.max(h1, e.getHours() + (e.getMinutes() ? 1 : 0) + (e.toDateString() !== s.toDateString() ? 24 : 0)); });
  h1 = Math.min(h1, 24);
  const hours = []; for (let h = h0; h < h1; h++) hours.push(h);
  const now = new Date(), today = now.toDateString(), per = monthStart();
  const block = (l, col, cols) => {
    const s = new Date(l.starts_at), e = new Date(l.ends_at || s.getTime() + 3600000);
    const top = ((s.getHours() - h0) * 60 + s.getMinutes()) / 60 * H;
    const height = Math.max(24, (Math.min(e, new Date(s.getFullYear(), s.getMonth(), s.getDate(), h1)) - s) / 3600000 * H - 3);
    const st = l.student_id && S.students.find(x => x.id === l.student_id);
    const pend = st ? S.homework.filter(h => h.student_id === st.id && !h.done_at).length : 0;
    const pl = st ? planOf(st.id) : null, paid = st && S.payRecords.some(r => r.student_id === st.id && r.period === per && r.kind === 'monthly');
    const extra = st ? [pend ? `📝 ${pend}` : '', pl && pl.mode === 'monthly' ? (paid ? 'Pagado' : 'Mes sin cobrar') : ''].filter(Boolean).join(' · ') : 'Sin alumno en la app';
    const w = 100 / cols;
    return `<div class="cev ${st ? '' : 'unk'} ${e < now ? 'past' : ''}" style="top:${top}px;height:${height}px;left:calc(${col * w}% + 2px);width:calc(${w}% - 4px)"
      ${st ? `data-action="open-student" data-id="${st.id}"` : ''} title="${esc(l.title)} · ${hhmm(l.starts_at)}–${hhmm(e.toISOString())}">
      <b>${esc(st ? st.display_name : l.title)}</b><span>${hhmm(l.starts_at)} – ${hhmm(e.toISOString())}</span>${extra ? `<em>${esc(extra)}</em>` : ''}</div>`;
  };
  const dayCol = d => {
    const ls = list.filter(l => new Date(l.starts_at).toDateString() === d.toDateString()).sort((a, b) => a.starts_at.localeCompare(b.starts_at));
    // Clases que se solapan: se reparten el ancho
    const placed = []; let group = [], groupEnd = 0;
    const flush = () => { const cols = Math.max(...group.map(g => g.col)) + 1; group.forEach(g => placed.push(block(g.l, g.col, cols))); group = []; };
    ls.forEach(l => {
      const s = +new Date(l.starts_at), e = +new Date(l.ends_at || s + 3600000);
      if (group.length && s >= groupEnd) flush();
      const used = group.filter(g => g.end > s).map(g => g.col); let col = 0; while (used.includes(col)) col++;
      group.push({ l, col, end: e }); groupEnd = Math.max(groupEnd, e);
    });
    if (group.length) flush();
    const isToday = d.toDateString() === today;
    const nowTop = ((now.getHours() - h0) * 60 + now.getMinutes()) / 60 * H;
    return `<div class="cal-col ${isToday ? 'today' : ''}">${placed.join('')}${isToday && now.getHours() >= h0 && now.getHours() < h1 ? `<i class="cal-now" style="top:${nowTop}px"></i>` : ''}</div>`;
  };
  setTimeout(() => { const cal = $('.cal'), t = $('.cal .cal-dh.today'); if (cal && t && cal.scrollWidth > cal.clientWidth) cal.scrollLeft = t.offsetLeft - 56; }, 0);
  return `<div class="cal" style="--hh:${H}px"><div class="cal-in">
    <div class="cal-head"><div class="cal-tz">${esc(Intl.DateTimeFormat().resolvedOptions().timeZone === 'Europe/Madrid' ? 'Madrid' : '')}</div>
      ${days.map(d => `<div class="cal-dh ${d.toDateString() === today ? 'today' : ''}"><span>${WD3[d.getDay()]}</span><b>${d.getDate()}</b></div>`).join('')}</div>
    <div class="cal-body" style="height:${hours.length * H}px">
      <div class="cal-hours">${hours.map(h => `<div class="cal-hr" style="height:${H}px"><span>${pad(h)}:00</span></div>`).join('')}</div>
      ${days.map(dayCol).join('')}
    </div></div></div>`;
}
async function loadLessons() {
  const from = new Date(); from.setDate(1); from.setDate(from.getDate() - 7);
  const to = new Date(); to.setDate(to.getDate() + 60);
  if (isTeacher()) {
    const [l, ls, sy] = await Promise.all([
      sb.from('lessons').select('*').gte('starts_at', from.toISOString()).lte('starts_at', to.toISOString()).order('starts_at').limit(2000),
      sb.from('lessons_students').select('*'),
      sb.from('lessons_sync').select('*').eq('id', 1).maybeSingle()
    ]);
    const err = [l, ls, sy].map(x => x.error).find(Boolean); if (err) throw err;
    S.lessons = l.data || []; S.lessonNames = ls.data || []; S.lessonSync = sy.data || null;
  } else {
    const { data, error } = await sb.from('lessons').select('*').eq('student_id', S.user.id).gte('starts_at', new Date(Date.now() - 3 * 3600000).toISOString()).order('starts_at').limit(10);
    if (error) throw error;
    S.lessons = data || [];
  }
}

/* ---- Bloquear (y, si quieres, denunciar a la vez, como en WhatsApp) ----
   Con "denunciar" marcado se denuncian sus últimos mensajes recibidos (hasta 5) para que el
   profesor tenga contexto; si no te ha escrito, se denuncia a la persona. */
const BLOCK_REPORT_MAX = 5;
function blockModal(id) {
  const msgs = S.dms.filter(m => m.sender_id === id && m.recipient_id === S.user.id);
  openModal(`<div class="modal-head"><h2>¿Bloquear a ${esc(whoName(id))}?</h2><button class="x" data-action="close" aria-label="Cerrar">×</button></div>
    <form id="blockForm" data-id="${id}">
      <p style="margin-top:0">No podréis escribiros en privado y, si erais compañeros, dejaréis de serlo. Esta persona no recibe ningún aviso.</p>
      <label class="check"><input type="checkbox" name="report"> <span><b>Denunciar también a tu profesor</b><br><span class="sub">${msgs.length ? `Le llegarán ${msgs.length > 1 ? `sus últimos ${Math.min(msgs.length, BLOCK_REPORT_MAX)} mensajes` : 'su mensaje'} para que pueda ver qué ha pasado.` : 'Tu profesor sabrá que esta persona te ha molestado.'} Si no lo marcas, nadie se entera del bloqueo.</span></span></label>
      <label class="f" data-block-reason hidden>Motivo (opcional)<textarea name="reason" rows="2" maxlength="300" placeholder="Cuéntale a tu profesor qué ha pasado"></textarea></label>
      <div class="actions"><button type="button" class="btn ghost" data-action="close">Cancelar</button><button type="submit" class="btn danger">Bloquear</button></div>
    </form>`);
  $('.modal').classList.add('narrow');
  const f = $('#blockForm');
  f.elements['report'].addEventListener('change', e => {
    f.querySelector('[data-block-reason]').hidden = !e.target.checked;
    f.querySelector('[type=submit]').textContent = e.target.checked ? 'Bloquear y denunciar' : 'Bloquear';
  });
}
async function blockSubmit(f) {
  const id = f.dataset.id, doReport = f.elements['report'].checked, reason = (f.elements['reason'].value || '').trim().slice(0, 300) || null;
  const btn = f.querySelector('[type=submit]'); btn.disabled = true;
  // Primero la denuncia: después de bloquear ya no se podría denunciar a la persona (deja de verse)
  if (doReport) {
    const already = new Set(S.reports.filter(r => r.reporter_id === S.user.id).map(r => r.target_type + ':' + r.target_id));
    const msgs = S.dms.filter(m => m.sender_id === id && m.recipient_id === S.user.id)
      .sort((a, b) => b.created_at.localeCompare(a.created_at)).slice(0, BLOCK_REPORT_MAX);
    let rows = msgs.map(m => ({ target_type: 'dm_message', target_id: m.id }));
    if (!rows.length) rows = [{ target_type: 'profile', target_id: id }];
    rows = rows.filter(r => !already.has(r.target_type + ':' + r.target_id))
      .map(r => ({ ...r, reporter_id: S.user.id, reason: reason || 'Al bloquear a esta persona' }));
    if (rows.length) {
      const { error } = await sb.from('moderation_reports').insert(rows);
      if (error) { btn.disabled = false; return toast('No se pudo enviar la denuncia: ' + errEs(error), 'bad'); }
      rows.forEach(r => S.reports.push({ ...r, resolved: false, created_at: new Date().toISOString() }));
    }
  }
  const { error } = await sb.from('user_blocks').insert({ blocker_id: S.user.id, blocked_id: id });
  if (error) { btn.disabled = false; return toast('No se pudo bloquear: ' + errEs(error), 'bad'); }
  S.blocks.push({ blocker_id: S.user.id, blocked_id: id }); S.dmCan[id] = false;
  const mr = mateRow(id); if (mr) S.mates = S.mates.filter(x => x !== mr); // la base de datos la borra sola
  await closeModal();
  render(); toast(doReport ? 'Bloqueado y denunciado. Tu profesor lo revisará' : 'Bloqueado', 'ok');
}

function privacyModal() {
  openModal(`<div class="modal-head"><h2>Tus datos en ${esc(APP_NAME)}</h2><button class="x" data-action="close" aria-label="Cerrar">×</button></div>

      <p><b>Menores.</b> Si tienes menos de 14 años, necesitas el permiso de tu madre, padre o tutor para usar la app. Sin fecha de nacimiento, la app te trata como menor: solo puedes escribir en privado al profesor, salvo que tu familia lo autorice.</p>
    </div>`);

async function downloadBackup(btn) { // solo profesor: todo lo que él puede leer, en un archivo
  btn.disabled = true; const old = btn.innerHTML; btn.textContent = 'Preparando la copia…';
  try {
    const tables = {
      profiles: 'id, display_name, nickname, email, role, approved, archived_at, created_at, birth_date, family_dm_ok, bio, instrument, level, favorites, gear, app_installed_at',
      listening_items: '*', listening_folders: '*', listening_genres: '*', listening_item_genres: '*', listening_assignments: '*', listening_comments: '*', listening_answer_reactions: '*',
      board_posts: '*', board_recipients: '*', board_reads: '*',
      feed_posts: '*', feed_comments: '*', reactions: '*', moderation_reports: '*',
      homework_tasks: '*', payments_plans: '*', payments_records: '*', lessons: '*', lessons_students: '*',
      goals_stages: '*', goals_items: '*', goals_done: '*'
    };
    const out = { app: APP_NAME, created_at: new Date().toISOString(), note: 'Copia de seguridad. No incluye mensajes privados entre alumnos (no los puede leer el profesor) ni contraseñas (las guarda Supabase cifradas).', tables: {} };
    for (const [t, cols] of Object.entries(tables)) {
      const rows = []; let from = 0;
      for (;;) { // de 1000 en 1000
        const { data, error } = await sb.from(t).select(cols).range(from, from + 999);
        if (error) throw new Error(t + ': ' + errEs(error));
        rows.push(...data); if (data.length < 1000) break; from += 1000;
      }
      out.tables[t] = rows;
    }
    const blob = new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `yurimh-music-academy-copia-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    const n = Object.values(out.tables).reduce((s, r) => s + r.length, 0);
    toast(`Copia descargada (${n} registros). Guárdala en un sitio seguro: contiene datos personales.`, 'ok');
  } catch (e) { toast('No se pudo hacer la copia: ' + errEs(e), 'bad'); }
  btn.disabled = false; btn.innerHTML = old;
}

/* ================================= PAGOS ============================== *
   Solo el profesor. payments_plans = el trato de cada alumno; payments_records = cada pago apuntado.
   Cada mes empieza sin pagos marcados ("se desmarca al acabar el mes") y los anteriores quedan de historial. */
const PAY_MODE = { monthly: 'Mensual', per_class: 'Por clase', free: 'Gratis' };
const MONTHS = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const monthStart = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-01`;
const monthLabel = p => { const [y, m] = p.split('-').map(Number); return `${MONTHS[m - 1]} ${y}`; };
const shiftMonth = (p, n) => { const [y, m] = p.split('-').map(Number); return monthStart(new Date(y, m - 1 + n, 1)); };
const money = v => v == null || v === '' ? '' : Number(v).toLocaleString('es-ES', { minimumFractionDigits: Number(v) % 1 ? 2 : 0, maximumFractionDigits: 2 }) + ' €';
const planOf = id => S.payPlans.find(p => p.student_id === id) || null;
function paymentsView() {
  const per = S.payMonth || (S.payMonth = monthStart());
  const isNow = per === monthStart(), future = per > monthStart();
  const ok = S.students.filter(s => s.approved);
  const recs = S.payRecords.filter(r => r.period === per);
  const total = recs.reduce((t, r) => t + Number(r.amount || 0), 0);
  let pendN = 0;
  const rows = ok.map(s => {
    const pl = planOf(s.id), mine = recs.filter(r => r.student_id === s.id);
    const planTxt = !pl ? '<span class="sub">Sin trato</span>' : `${PAY_MODE[pl.mode]}${pl.mode !== 'free' && pl.amount != null ? ' · ' + money(pl.amount) : ''}`;
    let status = '';
    if (!pl) status = `<button class="btn sm" data-action="pay-plan" data-id="${s.id}">Configurar trato</button>`;
    else if (pl.mode === 'free') status = '<span class="chip">Gratis</span>';
    else if (pl.mode === 'monthly') {
      const r = mine.find(x => x.kind === 'monthly');
      if (r) status = `<span class="chip ok">✓ Pagado${r.amount != null ? ' · ' + money(r.amount) : ''} · ${fmtDate(r.paid_on)}</span><button class="iconbtn sm" data-action="pay-undo" data-id="${r.id}" title="Desmarcar" aria-label="Desmarcar el pago">×</button>`;
      else if (isNow && calSynced() && !hadClassThisMonth(s.id)) status = `<span class="chip">Aún sin clase este mes</span><button class="btn sm" data-action="pay-mark" data-id="${s.id}">Marcar pagado</button>`;
      else { pendN++; status = `${!isNow && !future ? '<span class="chip warn">No pagado</span>' : isNow && calSynced() ? '<span class="chip warn">Ya tuvo clase: toca cobrar</span>' : ''}<button class="btn primary sm" data-action="pay-mark" data-id="${s.id}">Marcar pagado</button>`; }
    } else { // por clase
      const n = mine.filter(x => x.kind === 'class').length, sum = mine.reduce((t, x) => t + Number(x.amount || 0), 0);
      status = `<span class="chip ${n ? 'ok' : ''}">${n} clase${n === 1 ? '' : 's'} pagada${n === 1 ? '' : 's'}${n ? ' · ' + money(sum) : ''}</span>
        ${n ? `<button class="iconbtn sm" data-action="pay-class-undo" data-id="${s.id}" title="Quitar la última" aria-label="Quitar la última clase pagada">−</button>` : ''}
        <button class="btn primary sm" data-action="pay-class" data-id="${s.id}">+ Clase pagada</button>`;
    }
    return `<div class="payrow"><div class="who">${avatarHtml(s.id, 34)}<div><strong>${esc(s.display_name)}</strong>
        <button class="linkbtn mute" data-action="pay-plan" data-id="${s.id}" title="Cambiar el trato">${planTxt} ✎</button></div></div>
      <div class="paystatus">${status}</div></div>`;
  }).join('');
  return `<div class="monthnav"><button class="iconbtn" data-action="pay-month" data-n="-1" aria-label="Mes anterior">‹</button>
      <h2>${monthLabel(per)}</h2><button class="iconbtn" data-action="pay-month" data-n="1" aria-label="Mes siguiente">›</button>
      ${isNow ? '' : '<button class="btn sm ghost" data-action="pay-month" data-n="0">Mes actual</button>'}</div>
    <div class="stats"><div class="stat"><b>${money(total) || '0 €'}</b><span>Cobrado en ${MONTHS[Number(per.slice(5, 7)) - 1]}</span></div>
      <div class="stat ${pendN && !isNow && !future ? 'warn' : ''}"><b>${pendN}</b><span>${isNow ? (calSynced() ? 'Toca cobrar (ya tuvieron clase)' : 'Mensuales por pagar') : future ? 'Mensuales' : 'Sin pagar ese mes'}</span></div>
      <div class="stat"><b>${ok.filter(s => (planOf(s.id) || {}).mode === 'free').length}</b><span>Con clases gratis</span></div></div>
    ${ok.length ? `<div class="paylist">${rows}</div>` : '<div class="empty">Aún no tienes alumnos aprobados.</div>'}
    <p class="sub" style="margin-top:14px">🔒 Solo lo ves tú. Cada mes empieza sin pagos marcados; los meses anteriores quedan guardados (usa las flechas).</p>`;
}

async function payInsert(studentId, kind) {
  const pl = planOf(studentId), per = S.payMonth || monthStart();
  const today = monthStart() === per ? new Date().toISOString().slice(0, 10) : per; // en meses pasados, se apunta con fecha del día 1
  const row = { student_id: studentId, period: per, kind, amount: pl && pl.amount != null ? pl.amount : null, paid_on: today };
  const { data, error } = await sb.from('payments_records').insert(row).select();
  if (error) return toast('No se pudo apuntar: ' + errEs(error), 'bad');
  S.payRecords.push(data[0]); render();
}

/* ============================ OBJETIVOS ============================
   goals_stages (etapas de la lista general), goals_items (student_id null = general;
   con student_id = personal de ese alumno) y goals_done (logros; solo los marca el profesor).
   Privado: el alumno ve su progreso en su Perfil ("Solo tú y tu profesor"); el profesor
   los marca desde la ficha del alumno. Al conseguir uno, el alumno ve una celebración
   (goalsCelebrate) la próxima vez que abre la app, o al momento si la tiene abierta. */
const MODULE_GOALS = 'Objetivos';
async function loadGoals() {
  const [st, it, dn] = await Promise.all([
    sb.from('goals_stages').select('*').order('stage'),
    sb.from('goals_items').select('*').order('sort'),
    sb.from('goals_done').select('*')
  ]);
  const e = [st, it, dn].map(x => x.error).find(Boolean);
  if (e) throw e;
  S.goalStages = st.data || []; S.goalItems = it.data || []; S.goalDone = dn.data || [];
}
const goalSort = (a, b) => (a.stage || 0) - (b.stage || 0) || (a.sort || 0) - (b.sort || 0) || (a.created_at || '').localeCompare(b.created_at || '');
const goalsFor = sid => S.goalItems.filter(g => !g.student_id || g.student_id === sid).sort(goalSort);
const goalDoneRow = (gid, sid) => S.goalDone.find(d => d.goal_id === gid && d.student_id === sid);
const stageTitle = n => (S.goalStages.find(s => s.stage === n) || {}).title || '';
const stageNums = () => [...new Set(S.goalItems.filter(g => !g.student_id).map(g => g.stage).concat(S.goalStages.map(s => s.stage)))].sort((a, b) => a - b);
function goalGroups(sid, teacher) { // personales primero; luego las etapas en orden
  const list = goalsFor(sid), groups = [];
  const pers = list.filter(g => g.student_id);
  if (pers.length || teacher) groups.push({ key: 'p', num: '★', title: teacher ? 'Personales de este alumno' : 'Solo para ti', items: pers });
  stageNums().forEach(n => { const items = list.filter(g => !g.student_id && g.stage === n); if (items.length) groups.push({ key: 's' + n, num: n, title: stageTitle(n) || `Etapa ${n}`, items }); });
  groups.forEach(g => { g.done = g.items.filter(x => goalDoneRow(x.id, sid)).length; });
  return groups;
}
function goalStats(sid) {
  const l = goalsFor(sid), n = l.filter(g => goalDoneRow(g.id, sid)).length;
  const cur = goalGroups(sid).find(g => g.key !== 'p' && g.done < g.items.length);
  return { n, total: l.length, pct: l.length ? Math.round(n * 100 / l.length) : 0, cur };
}
function goalBar(sid) {
  const st = goalStats(sid);
  return `<div class="gprog"><div class="gbar" role="progressbar" aria-valuenow="${st.pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${st.pct}%"></i></div>
    <b>${st.n}/${st.total}</b><span class="sub">${st.pct}%</span></div>
    <p class="sub gcur">${st.total && st.n === st.total ? '🏆 ¡Todos conseguidos!' : st.cur ? `Etapa actual: <b>${esc(st.cur.num)} · ${esc(st.cur.title)}</b>` : ''}</p>`;
}
function goalRow(g, sid, teacher) {
  const d = goalDoneRow(g.id, sid);
  const mark = teacher
    ? `<button class="hwcheck" data-action="goal-toggle" data-id="${g.id}" data-sid="${sid}" aria-pressed="${!!d}" title="${d ? 'Desmarcar' : 'Marcar como conseguido'}" aria-label="${d ? 'Desmarcar' : 'Marcar como conseguido'}">${ic('check')}</button>`
    : `<span class="hwcheck" aria-pressed="${!!d}" aria-label="${d ? 'Conseguido' : 'Pendiente'}">${ic('check')}</span>`;
  return `<div class="hw goal ${d ? 'done' : ''}">${mark}
    <div class="hwbody"><div class="hwtitle">${esc(g.title)}</div>
      ${g.details ? `<div class="hwdet">${esc(g.details)}</div>` : ''}
      ${d ? `<div class="hwmeta"><span class="chip ok">Conseguido el ${fmtDateTime(d.done_at)}</span></div>` : ''}</div>
    ${teacher && g.student_id ? `<div class="hwtools"><button class="iconbtn sm" data-action="goal-edit" data-id="${g.id}" title="Editar" aria-label="Editar">${ic('edit')}</button>
      <button class="iconbtn sm" data-action="goal-delete" data-id="${g.id}" title="Borrar" aria-label="Borrar">×</button></div>` : ''}
  </div>`;
}
function goalGroupsHtml(sid, teacher, openKeys) {
  const groups = goalGroups(sid, teacher), st = goalStats(sid);
  return groups.map(gr => {
    const full = gr.items.length && gr.done === gr.items.length;
    const open = openKeys ? openKeys.includes(gr.key) : (gr.key === 'p' || (st.cur && st.cur.key === gr.key));
    return `<details class="gstage ${full ? 'full' : ''}" data-g="${gr.key}" ${open ? 'open' : ''}>
      <summary><span class="gnum">${full ? ic('check') : esc(gr.num)}</span><span class="gst">${esc(gr.title)}</span><span class="gcount">${gr.done}/${gr.items.length}</span></summary>
      <div class="hwlist">${gr.items.map(g => goalRow(g, sid, teacher)).join('') || '<p class="sub" style="margin:0">Aún no tiene objetivos personales.</p>'}
        ${teacher && gr.key === 'p' ? `<div><button class="btn sm" data-action="goal-new" data-sid="${sid}">+ Objetivo personal</button></div>` : ''}</div>
    </details>`;
  }).join('');
}

// Profesor: resumen en la ficha del alumno
function goalsFichaHtml(sid) {
  return `<div class="dhead" style="margin:18px 0 8px"><h2 class="h2" style="margin:0">🎯 ${esc(MODULE_GOALS)}</h2>
      <div class="chips"><button class="btn sm primary" data-action="goals-open" data-id="${sid}">Marcar objetivos</button></div></div>
    <div class="agebox">${S.goalItems.length || goalsFor(sid).length ? goalBar(sid) : '<p class="sub" style="margin:0">Aún no hay objetivos. Crea la lista general con "Editar lista general".</p>'}</div>`;
}
let goalReturn = null; // { sid } o { catalog: true }: adónde volver al guardar o cancelar un objetivo
function goalsModal(sid, keepState) {
  const s = S.students.find(x => x.id === sid); if (!s) return;
  const prev = keepState && $('.modal [data-goals]') ? { y: $('.modal').scrollTop, open: $$('.modal details.gstage[open]').map(d => d.dataset.g) } : null;
  openModal(`<div class="modal-head"><h2>🎯 Objetivos de ${esc(whoName(sid))}</h2><button class="x" data-action="close" aria-label="Cerrar">×</button></div>
    <p style="margin:0 0 10px"><button class="linkbtn" data-action="open-student" data-id="${sid}">← Volver a la ficha</button></p>
    <div data-goals="${sid}">${goalBar(sid)}
      <p class="sub" style="margin:4px 0 10px">Pulsa el círculo de un objetivo cuando lo consiga: le llegará un aviso y lo celebrará al abrir la app.</p>
      <div class="gstages">${goalGroupsHtml(sid, true, prev ? prev.open : null)}</div>
      <p style="margin:14px 0 0"><button class="btn sm" data-action="goals-catalog" data-sid="${sid}">${ic('edit')} Editar lista general</button></p></div>`);
  if (prev) $('.modal').scrollTop = prev.y;
}
// Lista general: etapas y objetivos comunes a todos
function goalsCatalogModal(backSid) {
  const prev = $('.modal [data-gcat]') ? { y: $('.modal').scrollTop } : null;
  const nums = stageNums();
  openModal(`<div class="modal-head"><h2>Lista general de objetivos</h2><button class="x" data-action="close" aria-label="Cerrar">×</button></div>
    ${backSid ? `<p style="margin:0 0 10px"><button class="linkbtn" data-action="goals-open" data-id="${backSid}">← Volver a los objetivos de ${esc(whoName(backSid))}</button></p>` : ''}
    <div data-gcat="${backSid || ''}"><p class="sub" style="margin:0 0 12px">La ven todos tus alumnos, cada uno con sus logros. Cambiar el título de una etapa se guarda al salir del campo.</p>
    ${nums.map(n => { const items = S.goalItems.filter(g => !g.student_id && g.stage === n).sort(goalSort); return `
      <section class="gcat"><div class="gcat-head"><span class="gnum">${n}</span>
        <input type="text" class="gstage-title" data-stage="${n}" maxlength="80" value="${esc(stageTitle(n))}" placeholder="Título de la etapa ${n}" aria-label="Título de la etapa ${n}" data-no-emoji></div>
        <div class="hwlist">${items.map(g => `<div class="hw goal"><div class="hwbody"><div class="hwtitle">${esc(g.title)}</div>${g.details ? `<div class="hwdet">${esc(g.details)}</div>` : ''}</div>
          <div class="hwtools"><button class="iconbtn sm" data-action="goal-edit" data-id="${g.id}" title="Editar" aria-label="Editar">${ic('edit')}</button>
          <button class="iconbtn sm" data-action="goal-delete" data-id="${g.id}" title="Borrar" aria-label="Borrar">×</button></div></div>`).join('')}
          <div><button class="btn sm" data-action="goal-new" data-stage="${n}">+ Añadir a esta etapa</button></div></div></section>`; }).join('')}
    <p style="margin:16px 0 0"><button class="btn primary" data-action="goal-new" data-stage="${(nums[nums.length - 1] || 0) + 1}">+ Nueva etapa</button></p></div>`);
  $('.modal').classList.add('wide');
  if (prev) $('.modal').scrollTop = prev.y;
}
function goalFormModal(id, opts = {}) {
  const g = id ? S.goalItems.find(x => x.id === id) : null;
  const personal = g ? !!g.student_id : !!opts.sid, sid = g ? g.student_id : opts.sid;
  const stage = g ? g.stage : opts.stage, nums = stageNums();
  if (stage && !nums.includes(stage)) nums.push(stage);
  openModal(`<div class="modal-head"><h2>${g ? 'Editar objetivo' : personal ? 'Nuevo objetivo personal' : 'Nuevo objetivo'}</h2><button class="x" data-action="close" aria-label="Cerrar">×</button></div>
    <form id="goalForm" data-id="${g ? g.id : ''}" data-sid="${personal ? sid : ''}">
      ${personal ? `<p class="sub" style="margin:0 0 12px">Solo para <b>${esc(studentName(sid))}</b></p>`
        : `<label class="f" style="max-width:320px">Etapa<select name="stage">${nums.map(n => `<option value="${n}" ${n === stage ? 'selected' : ''}>${n}${stageTitle(n) ? ' · ' + esc(stageTitle(n)) : ' (nueva)'}</option>`).join('')}</select></label>`}
      <label class="f">Objetivo<input type="text" name="title" required maxlength="200" value="${esc(g ? g.title : '')}" placeholder="Ej.: Tocar con cejilla en la 5ª cuerda" data-no-emoji></label>
      <label class="f">Detalles (opcional)<textarea name="details" maxlength="500" rows="3" placeholder="Qué incluye o cómo se comprueba">${esc(g ? g.details || '' : '')}</textarea></label>
      <div class="actions"><button class="btn" type="submit">${g ? 'Guardar cambios' : 'Añadir'}</button><button class="btn ghost" type="button" data-action="goal-back">Cancelar</button></div>
    </form>`);
  $('.modal').classList.add('narrow');
}
function goalBack() {
  const r = goalReturn; goalReturn = null;
  if (r && r.catalog) return goalsCatalogModal(r.sid);
  if (r && r.sid) return goalsModal(r.sid);
  closeModal();
}
const goalContext = el => { // desde dónde se pulsó: catálogo general o los objetivos de un alumno
  const cat = el.closest('[data-gcat]'); if (cat) return { catalog: true, sid: cat.dataset.gcat || null };
  const gs = el.closest('[data-goals]'); return gs ? { sid: gs.dataset.goals } : null;
};
function goalsRefresh(ctx) {
  const bd = $('.backdrop'), y = bd ? bd.scrollTop : 0; // lo que hace scroll es el fondo, no la ventana
  render(); if (ctx && ctx.catalog) goalsCatalogModal(ctx.sid); else if (ctx && ctx.sid) goalsModal(ctx.sid, true);
  const nb = $('.backdrop'); if (nb) nb.scrollTop = y;
}

// Celebración del alumno: logros que aún no ha visto
let goalCelebrating = false;
function goalsCelebrate() {
  if (isTeacher() || goalCelebrating || !S.user) return;
  const fresh = S.goalDone.filter(d => d.student_id === S.user.id && !d.seen_at);
  if (!fresh.length) return;
  if ($('#modalRoot').firstChild) { S.goalPending = true; return; } // espera a que se cierre la ventana abierta
  S.goalPending = false; goalCelebrating = true;
  const titles = fresh.map(d => (S.goalItems.find(g => g.id === d.goal_id) || {}).title).filter(Boolean);
  openModal(`<div class="celebrate"><div class="trophy">🏆</div>
      <h2>${titles.length > 1 ? `¡${titles.length} objetivos conseguidos!` : '¡Objetivo conseguido!'}</h2>
      <ul class="gwins">${titles.map(t => `<li>${ic('check')} ${esc(t)}</li>`).join('')}</ul>
      ${goalBar(S.user.id)}
      <div class="actions" style="justify-content:center"><button class="btn primary" data-action="close">¡A por el siguiente! 🤘</button></div></div>`, async () => {
    goalCelebrating = false;
    const ids = fresh.map(d => d.id), now = new Date().toISOString();
    fresh.forEach(d => { d.seen_at = now; });
    await sb.from('goals_done').update({ seen_at: now }).in('id', ids);
  });
  $('.modal').classList.add('narrow');
  confetti();
}
function confetti() {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const box = document.createElement('div'); box.className = 'confetti'; box.setAttribute('aria-hidden', 'true');
  box.innerHTML = Array.from({ length: 90 }, (_, i) => `<i class="c${i % 5}" style="left:${Math.random() * 100}%;animation-delay:${(Math.random() * .7).toFixed(2)}s;animation-duration:${(2.2 + Math.random() * 1.6).toFixed(2)}s;transform:rotate(${Math.round(Math.random() * 360)}deg)"></i>`).join('');
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 4500);
}

const goalActions = {
  'goals-open'(el) { goalsModal(el.dataset.id); },
  'goals-catalog'(el) { goalsCatalogModal(el.dataset.sid || null); },
  'goal-new'(el) { goalReturn = goalContext(el); goalFormModal(null, { sid: el.dataset.sid || null, stage: el.dataset.stage ? +el.dataset.stage : null }); },
  'goal-edit'(el) { goalReturn = goalContext(el); goalFormModal(el.dataset.id); },
  'goal-back'() { goalBack(); },
  async 'goal-toggle'(el) {
    const gid = el.dataset.id, sid = el.dataset.sid, d = goalDoneRow(gid, sid), ctx = goalContext(el);
    el.disabled = true;
    if (d) {
      const { error } = await sb.from('goals_done').delete().eq('id', d.id);
      if (error) { el.disabled = false; return toast('Error: ' + error.message, 'bad'); }
      S.goalDone = S.goalDone.filter(x => x.id !== d.id);
    } else {
      const { data, error } = await sb.from('goals_done').insert({ goal_id: gid, student_id: sid }).select();
      if (error) { el.disabled = false; return toast('Error: ' + error.message, 'bad'); }
      (data || []).forEach(r => addUnique(S.goalDone, r, 'goals_done'));
      toast(`🏆 ¡Conseguido! Se lo notificamos a ${whoName(sid)}`, 'ok');
    }
    goalsRefresh(ctx);
  },
  async 'goal-delete'(el) {
    const g = S.goalItems.find(x => x.id === el.dataset.id); if (!g) return;
    const n = S.goalDone.filter(d => d.goal_id === g.id).length;
    if (!confirm(`¿Borrar el objetivo "${g.title}"?${n ? `\n\nLo tienen conseguido ${n} alumno${n > 1 ? 's' : ''}: también desaparecerá de sus logros.` : ''}`)) return;
    const ctx = goalContext(el);
    const { error } = await sb.from('goals_items').delete().eq('id', g.id);
    if (error) return toast('Error: ' + error.message, 'bad');
    S.goalItems = S.goalItems.filter(x => x.id !== g.id); S.goalDone = S.goalDone.filter(d => d.goal_id !== g.id);
    toast('Objetivo borrado', 'ok');
    goalsRefresh(ctx);
  }
};
Object.assign(actions, goalActions);

// Título de etapa: se guarda al salir del campo
document.addEventListener('change', async e => {
  const inp = e.target.closest && e.target.closest('.gstage-title'); if (!inp) return;
  const stage = +inp.dataset.stage, title = inp.value.trim() || null;
  const { data, error } = await sb.from('goals_stages').upsert({ stage, title }).select();
  if (error) return toast('No se pudo guardar: ' + error.message, 'bad');
  S.goalStages = S.goalStages.filter(s => s.stage !== stage).concat(data || []);
  toast('Etapa guardada', 'ok');
});
document.addEventListener('submit', async e => {
  const f = e.target; if (f.id !== 'goalForm') return;
  e.preventDefault();
  const title = f.title.value.trim(), details = f.details.value.trim() || null;
  if (!title) return;
  const id = f.dataset.id, sid = f.dataset.sid || null;
  const btn = f.querySelector('[type=submit]'); btn.disabled = true;
  let res;
  if (id) {
    const patch = { title, details }; if (f.stage) patch.stage = +f.stage.value;
    res = await sb.from('goals_items').update(patch).eq('id', id).select();
  } else {
    const stage = sid ? null : +f.stage.value;
    const same = S.goalItems.filter(g => sid ? g.student_id === sid : (!g.student_id && g.stage === stage));
    const sort = same.reduce((m, g) => Math.max(m, g.sort || 0), 0) + 10;
    if (!sid && !S.goalStages.some(s => s.stage === stage)) { // etapa nueva: se crea sin título (se pone en la lista)
      const st = await sb.from('goals_stages').upsert({ stage, title: null }).select();
      if (!st.error) S.goalStages = S.goalStages.concat(st.data || []);
    }
    res = await sb.from('goals_items').insert({ student_id: sid, stage, title, details, sort }).select();
  }
  if (res.error || !(res.data || []).length) { btn.disabled = false; return toast('No se pudo guardar' + (res.error ? ': ' + res.error.message : ''), 'bad'); }
  res.data.forEach(r => { const i = S.goalItems.findIndex(x => x.id === r.id); if (i >= 0) S.goalItems[i] = r; else S.goalItems.push(r); });
  toast(id ? 'Objetivo guardado' : 'Objetivo añadido', 'ok');
  render(); goalBack();
});

document.addEventListener('submit', async e => {
  const f = e.target;
  if (f.id === 'hwForm') {
    e.preventDefault();
    const title = f.title.value.trim(), details = f.details.value.trim() || null, due_date = f.due_date.value || null;
    if (!title) return toast('Escribe qué tiene que practicar', 'bad');
    if (f.dataset.id) {
      const { data, error } = await sb.from('homework_tasks').update({ title, details, due_date }).eq('id', f.dataset.id).select();
      if (error || !data || !data.length) return toast('No se pudo guardar' + (error ? ': ' + errEs(error) : ''), 'bad');
      Object.assign(S.homework.find(x => x.id === f.dataset.id), data[0]);
      const back = hwReturn; hwReturn = null;
      if (back) { render(); studentDetailModal(back); } else { await closeModal(); render(); }
      return toast('Deberes actualizados', 'ok');
    }
    const ids = $$('#hwForm input[name=pick]:checked').map(x => x.value);
    if (!ids.length) return toast('Elige al menos un alumno', 'bad');
    const { data, error } = await sb.from('homework_tasks').insert(ids.map(student_id => ({ student_id, title, details, due_date, created_by: S.user.id }))).select();
    if (error) return toast('No se pudo guardar: ' + errEs(error), 'bad');
    (data || []).forEach(r => addUnique(S.homework, r, 'homework_tasks'));
    const back = hwReturn; hwReturn = null;
    if (back) { render(); studentDetailModal(back); } else { await closeModal(); render(); }
    toast(ids.length > 1 ? `Deberes puestos a ${ids.length} alumnos. Les llegará un aviso.` : 'Deberes puestos. Le llegará un aviso.', 'ok');
  } else if (f.id === 'assignManyForm') {
    e.preventDefault();
    const items = $$('#assignManyForm input[name=item]:checked').map(x => x.value);
    const ids = $$('#assignManyForm input[name=pick]:checked').map(x => x.value);
    if (!items.length) return toast('Marca al menos una escucha', 'bad');
    if (!ids.length) return toast('Marca al menos un alumno', 'bad');
    const due_date = f.due_date.value || null, note = f.note.value.trim() || null;
    const has = new Set(S.assigns.map(a => a.item_id + '|' + a.student_id));
    const rows = []; let skipped = 0;
    ids.forEach(student_id => items.forEach(item_id => {
      if (has.has(item_id + '|' + student_id)) { skipped++; return; }
      rows.push({ item_id, student_id, due_date, note });
    }));
    if (!rows.length) return toast('Esos alumnos ya tienen todas esas escuchas', 'warn');
    const btn = f.querySelector('button[type=submit]'); btn.disabled = true;
    const { error } = await sb.from('listening_assignments').insert(rows); // un solo insert = un solo aviso por alumno
    btn.disabled = false;
    if (error) return toast('No se pudo asignar: ' + errEs(error), 'bad');
    await loadData();
    await closeModal(); render();
    const who = new Set(rows.map(r => r.student_id)).size;
    toast(`${rows.length} asignaci${rows.length > 1 ? 'ones hechas' : 'ón hecha'} a ${who} alumno${who > 1 ? 's' : ''}.${skipped ? ` ${skipped} ya ${skipped > 1 ? 'estaban asignadas' : 'estaba asignada'}.` : ''}`, 'ok');
  } else if (f.id === 'hwCopyForm') {
    e.preventDefault();
    const tasks = $$('#hwCopyForm input[name=task]:checked').map(x => S.homework.find(h => h.id === x.value)).filter(Boolean);
    const ids = $$('#hwCopyForm input[name=pick]:checked').map(x => x.value);
    if (!tasks.length) return toast('Elige al menos una tarea', 'bad');
    if (!ids.length) return toast('Elige al menos un alumno', 'bad');
    const mode = (f.querySelector('input[name=due]:checked') || {}).value || 'same';
    if (mode === 'new' && !f.due_date.value) return toast('Elige la nueva fecha', 'bad');
    const due = h => mode === 'same' ? h.due_date || null : mode === 'new' ? f.due_date.value : null;
    let skipped = 0; const rows = [];
    ids.forEach(student_id => {
      const has = new Set(S.homework.filter(h => h.student_id === student_id && !h.done_at).map(h => hwKey(h.title)));
      tasks.forEach(h => {
        if (has.has(hwKey(h.title))) { skipped++; return; }
        has.add(hwKey(h.title));
        rows.push({ student_id, title: h.title, details: h.details || null, due_date: due(h), created_by: S.user.id });
      });
    });
    if (!rows.length) return toast('Esos alumnos ya tienen esas tareas pendientes', 'warn');
    const { data, error } = await sb.from('homework_tasks').insert(rows).select();
    if (error) return toast('No se pudo copiar: ' + errEs(error), 'bad');
    (data || []).forEach(r => addUnique(S.homework, r, 'homework_tasks'));
    const back = hwReturn; hwReturn = null;
    if (back) { render(); studentDetailModal(back); } else { await closeModal(); render(); }
    toast(`${rows.length} tarea${rows.length > 1 ? 's copiadas' : ' copiada'}. Les llegará un aviso.${skipped ? ` ${skipped} no se ha${skipped > 1 ? 'n' : ''} copiado porque ya la tenían pendiente.` : ''}`, 'ok');
  } else if (f.id === 'planForm') {
    e.preventDefault();
    const id = f.dataset.id, mode = (f.querySelector('input[name=mode]:checked') || {}).value || 'monthly';
    const raw = f.amount.value.trim(), amount = raw === '' || mode === 'free' ? null : Math.round(Number(raw.replace(',', '.')) * 100) / 100;
    if (amount != null && !(amount >= 0 && amount < 100000)) return toast('El precio no es válido', 'bad');
    const row = { mode, amount, note: f.note.value.trim() || null, updated_at: new Date().toISOString() };
    const ex = planOf(id);
    const { data, error } = ex ? await sb.from('payments_plans').update(row).eq('student_id', id).select()
      : await sb.from('payments_plans').insert({ student_id: id, ...row }).select();
    if (error || !data || !data.length) return toast('No se pudo guardar' + (error ? ': ' + errEs(error) : ''), 'bad');
    S.payPlans = S.payPlans.filter(p => p.student_id !== id).concat(data[0]);
    await closeModal(); render(); toast('Trato guardado', 'ok');
  }
});

/* ------------------------- Instalar como app (PWA) ------------------------- */
/* Cómo funciona la invitación a instalar:
   · La primera vez que alguien entra (móvil u ordenador) sale una ventana de bienvenida que invita a instalarla
     (una sola vez: profiles.install_prompted_at).
   · Mientras no tenga la app del móvil, arriba hay un botón neón "Instalar app" que abre esa misma ventana.
   · Cuando abre la app instalada en el móvil, se marca profiles.app_installed_at: desaparece el botón en todos
     sus dispositivos, y se le invita una vez a activar las notificaciones. */
let installPrompt = null; // Android/Chrome/Edge: el navegador nos deja mostrar su ventana de instalar
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); installPrompt = e;
  if ($('#installHow')) $('#installHow').innerHTML = installHowHtml();
  else if (S.section === 'settings' && !uiBusy()) softRender();
});
window.addEventListener('appinstalled', () => {
  installPrompt = null;
  toast('¡App instalada! Ábrela desde su icono en tu pantalla de inicio', 'ok');
  if (S.profile && isMobile()) markInstall({ app_installed_at: new Date().toISOString() }).then(() => softRender());
});
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isMobile = () => isIOS() || /android|mobile/i.test(navigator.userAgent);
const hasMobileApp = () => !!(S.profile && S.profile.app_installed_at);
const appLink = () => location.origin + location.pathname;

function installBtnHtml() {
  if (isStandalone() || hasMobileApp()) return '';
  return `<button class="installbtn" data-action="install-open" title="Instala la app en tu móvil">${ic('phone')}<span class="l-long">Instalar app</span><span class="l-short">Instalar</span></button>`;
}
function installPanelHtml() { // en Ajustes, por si alguien la desinstaló o quiere ponerla en otro móvil
  if (isStandalone()) return '';
  return `<div class="panel"><h2 class="h2" style="margin-top:0">Tenla en el móvil como una app</h2>
    <p class="sub" style="margin:0 0 12px">Se abre a pantalla completa desde su icono y te llegan los avisos al móvil.</p>
    <button class="btn primary" data-action="install-open">${ic('phone')} Cómo instalarla</button></div>`;
}
const stepsHtml = list => `<ol class="isteps">${list.map(s => `<li>${s}</li>`).join('')}</ol>`;
function installHowHtml() {
  if (installPrompt) return `<button class="btn primary" style="width:100%;justify-content:center" data-action="install-app">${ic('phone')} Instalar ahora</button>
    <p class="sub" style="margin:8px 0 0;text-align:center">Se añade a tu pantalla de inicio, como cualquier app.</p>`;
  if (isIOS()) return stepsHtml(['Abre esta web en <b>Safari</b>.', 'Pulsa <b>Compartir</b> (el cuadrado con la flecha hacia arriba, abajo en la pantalla).', 'Elige <b>"Añadir a pantalla de inicio"</b> y pulsa <b>Añadir</b>.', 'Abre la app desde su icono nuevo.']);
  if (isMobile()) return stepsHtml(['Pulsa el menú <b>⋮</b> del navegador (arriba a la derecha).', 'Elige <b>"Instalar aplicación"</b> o <b>"Añadir a pantalla de inicio"</b>.', 'Confirma con <b>Instalar</b> y ábrela desde su icono nuevo.']);
  // Ordenador: la app es para el móvil, así que damos un QR para abrir la web allí
  return `<div class="qrwrap"><div class="qr" id="qrBox">${esc(appLink().replace(/^https?:\/\//, ''))}</div>
    <div style="flex:1;min-width:180px"><p style="margin:0 0 8px"><b>Escanea este código con la cámara del móvil</b> para abrir la web allí.</p>
    <p class="sub" style="margin:0 0 8px">O escribe en el navegador del móvil:<br><b style="color:var(--text);overflow-wrap:anywhere">${esc(appLink().replace(/^https?:\/\//, ''))}</b></p>
    <p class="sub" style="margin:0">Entra con tu cuenta y te dirá cómo instalarla en un par de toques.</p></div></div>`;
}
function installModal() {
  openModal(`<div class="modal-head"><h2>Llévate ${esc(APP_NAME)} en el móvil</h2><button class="x" data-action="close" aria-label="Cerrar">×</button></div>
    <div class="install-hero"><img src="icon-192.png" alt=""><ul class="perks">
      <li>Se abre desde su icono, a pantalla completa</li>
      <li>Te llegan al móvil los avisos, mensajes y escuchas nuevas</li>
      <li>Gratis, sin Play Store y sin ocupar casi espacio</li></ul></div>
    <div class="install-how" id="installHow">${installHowHtml()}</div>
    <div class="actions" style="margin-top:14px"><button class="btn ghost" data-action="close">Ahora no</button>

/* ------------------------- Notificaciones push (móvil) -------------------------
   S.push: 'unsupported' (este navegador no puede) · 'install' (iPhone: primero hay que instalar la app)
           'denied' (el usuario las bloqueó) · 'off' · 'on' */
S.push = 'unsupported';
let lastPushError = ''; // último fallo al activar (se muestra en Ajustes para poder copiarlo)
const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window && location.protocol === 'https:';
function b64urlToBytes(s) { const p = '='.repeat((4 - s.length % 4) % 4), b = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(b, c => c.charCodeAt(0)); }
async function pushInit() { // al entrar: averigua el estado y, si ya estaban activadas, refresca la suscripción
  if (!pushSupported() || !CFG.VAPID_PUBLIC_KEY) { S.push = isIOS() && !isStandalone() ? 'install' : 'unsupported'; return; }
  if (Notification.permission === 'denied') { S.push = 'denied'; return; }
  const reg = await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.getSubscription();
  if (sub && Notification.permission === 'granted') { S.push = 'on'; await savePushSub(sub); } else S.push = 'off';
}
async function savePushSub(sub) {
  const j = sub.toJSON();
  const { error } = await sb.rpc('save_push_subscription', { p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth });
  if (error) console.warn('No se pudo guardar el dispositivo:', error.message);
  return !error;
}
async function pushEnable() {
  if (!pushSupported()) return toast(isIOS() ? 'En iPhone, primero instala la app (Compartir → Añadir a pantalla de inicio) y ábrela desde su icono' : 'Este navegador no admite notificaciones', 'bad');
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') { S.push = perm === 'denied' ? 'denied' : 'off'; softRender(); return toast('No se han activado: hace falta que des permiso', 'bad'); }
  let step = 'service worker';
  try {
    const reg = await Promise.race([navigator.serviceWorker.ready, new Promise((_, no) => setTimeout(() => no(new Error('el service worker no arranca')), 8000))]);
    step = 'suscripción del navegador';
    let sub = await reg.pushManager.getSubscription();
    if (sub && sub.options && sub.options.applicationServerKey) { // si se creó con otra llave, se rehace
      const same = new Uint8Array(sub.options.applicationServerKey).join() === b64urlToBytes(CFG.VAPID_PUBLIC_KEY).join();
      if (!same) { await sub.unsubscribe(); sub = null; }
    }
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64urlToBytes(CFG.VAPID_PUBLIC_KEY) });
    step = 'guardar en la base de datos';
    if (!(await savePushSub(sub))) throw new Error('la base de datos no lo aceptó');
    S.push = 'on'; toast('¡Notificaciones activadas en este dispositivo!', 'ok');
  } catch (e) {
    console.warn(e);
    // Mostramos el motivo exacto: así se puede saber qué falla en cada móvil
    const why = `${e && e.name && e.name !== 'Error' ? e.name + ': ' : ''}${(e && e.message) || e}`;
    toast(`No se pudieron activar (${step}): ${why}`, 'bad');
    lastPushError = `${step} · ${why} · ${navigator.userAgent}`;
  }
  if ($('#modalRoot').firstChild && $('.nlist, .modal .push-box')) notifsModal(); else { uiStale = false; render(); }
}
async function pushDisable() {
  try {
    const reg = await navigator.serviceWorker.ready, sub = await reg.pushManager.getSubscription();
    if (sub) { await sb.from('push_subscriptions').delete().eq('endpoint', sub.endpoint); await sub.unsubscribe(); }
  } catch (e) { console.warn(e); }
  S.push = 'off'; toast('Notificaciones desactivadas en este dispositivo', 'ok');
  if ($('#modalRoot').firstChild) notifsModal(); else softRender();
}
function pushSettingHtml() {
  const st = S.push;
  const body = st === 'on' ? `<p class="sub" style="margin:0 0 10px">✅ Activadas en este dispositivo. Te llegarán aunque la app esté cerrada.</p><button class="btn ghost sm" data-action="push-off">Desactivar en este dispositivo</button>`
    : st === 'off' ? `<p class="sub" style="margin:0 0 10px">Recibe avisos en el móvil o el ordenador aunque la app esté cerrada: avisos nuevos, mensajes, comentarios…</p><button class="btn primary sm" data-action="push-on">Activar notificaciones</button>`
    : st === 'denied' ? '<p class="sub" style="margin:0">Las has bloqueado en este navegador. Para activarlas, permite las notificaciones de esta web en los ajustes del navegador o del móvil y vuelve a entrar.</p>'
    : st === 'install' ? '<p class="sub" style="margin:0">En iPhone, primero instala la app: en Safari pulsa <b>Compartir</b> → <b>"Añadir a pantalla de inicio"</b>, ábrela desde su icono y activa aquí las notificaciones.</p>'
    : '<p class="sub" style="margin:0">Este navegador no permite notificaciones. Prueba con Chrome (Android/ordenador) o instala la app en el iPhone.</p>';
  const err = lastPushError && st !== 'on' ? `<p class="sub" style="margin:6px 0 0;color:var(--bad);overflow-wrap:anywhere">Último error: ${esc(lastPushError)}</p>` : '';
  return `<div class="push-box"><b>📲 Notificaciones en el móvil</b>${body}${err}</div>`;
}
// Abrir la notificación que trae la dirección (?n=…): llegamos tocando un aviso del móvil
async function openNotifFromUrl(url) {
  let id = null; try { id = new URL(url, location.href).searchParams.get('n'); } catch { }

  if (n) openNotif(n);
}


/* ============================ VISTA DE ALUMNO ============================
   Para el profesor: ver la app tal como la ve un alumno, para revisar el diseño.
   Es un alumno ficticio («Alumno de prueba») con datos inventados en el navegador; nada va a la base de datos:
   - previewGuard envuelve el cliente de Supabase y, mientras S.preview exista, devuelve un error
     'preview' en cualquier insert/update/upsert/delete, RPC (salvo get_profile/get_avatar_large),
     Edge Function, cambio de contraseña o cierre de sesión. Las lecturas sí pasan.
   - El tiempo real y las recargas se ignoran (rtHandle, rtResync, loadDirectory) y al salir se recarga todo.
   - Lo público (Inicio, avisos para todos, catálogo de escuchas, lista general de objetivos) es real;
     lo privado del alumno (sus escuchas, respuestas, deberes, mensajes, clase…) es inventado. */
const PREVIEW_ID = '00000000-0000-4000-8000-0000000a1a1a';
const PREVIEW_ERR = { code: 'preview', message: 'Vista de alumno: es solo para mirar, no se guarda nada.' };
const PREVIEW_READ_RPC = new Set(['get_profile', 'get_avatar_large']);
function previewStub() { // imita una consulta de supabase-js (encadenable y con await) que siempre falla con PREVIEW_ERR
  const res = { data: null, error: PREVIEW_ERR, count: null, status: 403 };
  const p = new Proxy(function () { }, { get: (_, k) => k === 'then' ? (ok, no) => Promise.resolve(res).then(ok, no) : () => p, apply: () => p });
  return p;
}
function previewGuard(c) {
  const bind = (o, k) => { const v = o[k]; return typeof v === 'function' ? v.bind(o) : v; };
  const WRITE = new Set(['insert', 'update', 'upsert', 'delete']);
  return new Proxy(c, {
    get(t, k) {
      if (!S.preview) return bind(t, k);
      if (k === 'from') return name => new Proxy(t.from(name), { get: (q, m) => WRITE.has(m) ? () => previewStub() : bind(q, m) });
      if (k === 'rpc') return (fn, args) => {
        if (!PREVIEW_READ_RPC.has(fn)) return previewStub();
        if (args && args.p_id === PREVIEW_ID) return Promise.resolve({ data: fn === 'get_profile' ? [previewPublicProfile()] : null, error: null });
        return t.rpc(fn, args);
      };
      if (k === 'functions') return { invoke: () => Promise.resolve({ data: null, error: PREVIEW_ERR }) };
      if (k === 'auth') return new Proxy(t.auth, { get: (a, m) => ['signOut', 'updateUser', 'signUp', 'resetPasswordForEmail'].includes(m) ? () => Promise.resolve({ data: {}, error: PREVIEW_ERR }) : bind(a, m) });
      return bind(t, k);
    }
  });
}
const previewPublicProfile = () => { const p = S.profile; return { id: PREVIEW_ID, public_name: p.display_name, avatar: null, role: 'student', bio: p.bio, instrument: p.instrument, level: p.level, favorites: p.favorites, gear: p.gear }; };
function previewBar() {
  return `<div class="pvbar" role="status"><div class="t">${ic('eye')}<div><b>Vista de alumno</b> <span class="sub">· alumno ficticio con datos de ejemplo. Puedes pulsar lo que quieras: no se guarda nada.</span></div></div>
    <button class="btn sm primary" data-action="preview-off">Salir</button></div>`;
}

/* -------------------------------- Arranque -------------------------- */
(async function boot() {
  if (!configured) return viewSetup();
  sb.auth.onAuthStateChange((event, session) => {
    // setTimeout: evita llamar a supabase dentro del propio callback (puede bloquearse)
    setTimeout(() => {
      if (event === 'PASSWORD_RECOVERY') { recovering = true; viewRecovery(); }
      else if (event === 'SIGNED_OUT') { rtStop(); S.feedQueue = []; S.user = null; S.profile = null; S.items = []; S.assigns = []; S.students = []; S.posts = []; S.recipients = []; S.reads = []; S.fposts = []; S.fcomments = []; S.lcomments = []; S.reactions = []; S.reports = []; S.dir = {}; S.dms = []; S.dmRx = []; S.ansRx = []; S.blocks = []; S.dmContacts = []; S.dmCan = {}; S.dmWith = null; S.notifs = []; S.homework = []; S.payPlans = []; S.payRecords = []; S.payMonth = null; S.goalStages = []; S.goalItems = []; S.goalDone = []; S.lessons = []; S.lessonNames = []; S.lessonSync = null; S.agendaWeek = null; S.section = 'feed'; if (S.closingAccount) { S.closingAccount = false; viewDeleted(); } else viewAuth(); }
      else if (event === 'SIGNED_IN' && !recovering && (!S.user || S.user.id !== (session && session.user.id))) route();
    }, 0);
  });
  if (recovering) return viewRecovery();
  await route();
})();

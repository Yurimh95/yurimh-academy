/* ===================== TIEMPO REAL (Supabase Realtime) =====================
   La base de datos avisa al momento de cada cambio, respetando las mismas reglas RLS:
   nadie recibe en directo lo que no podría ver. Los borrados solo traen la clave. */
const RT_TABLES = ['feed_posts', 'feed_comments', 'listening_comments', 'reactions', 'board_posts', 'board_recipients',
  'board_reads', 'listening_items', 'listening_assignments', 'profiles', 'moderation_reports', 'dm_messages', 'notifications', 'homework_tasks', 'classmates'];
const RT_LIST = { board_posts: 'posts', board_recipients: 'recipients', board_reads: 'reads', listening_items: 'items', listening_assignments: 'assigns', moderation_reports: 'reports', homework_tasks: 'homework' };
const rowKey = (table, r) => table === 'reactions' ? [r.target_type, r.target_id, r.user_id, r.emoji].join('|')
  : (table === 'board_reads' || table === 'board_recipients') ? r.post_id + '|' + r.student_id : r.id;
function addUnique(list, row, table) { // añade sin duplicar (lo local y lo que llega en directo pueden cruzarse)
  const k = rowKey(table, row);
  if (list.some(x => rowKey(table, x) === k)) return false;
  list.push(row); return true;
}
function rtApply(list, table, ev, row, old) { // inserta/actualiza/borra en una lista y la devuelve
  if (ev === 'DELETE') { const k = rowKey(table, old); return list.filter(x => rowKey(table, x) !== k); }
  const k = rowKey(table, row), i = list.findIndex(x => rowKey(table, x) === k);
  if (i >= 0) list[i] = { ...list[i], ...row }; else list.push(row);
  return list;
}
let rtChannel = null, rtWasLive = false, hiddenAt = 0;
function rtStart() {
  rtStop();
  rtChannel = sb.channel('app-changes');
  RT_TABLES.forEach(t => rtChannel.on('postgres_changes', { event: '*', schema: 'public', table: t },
    p => rtHandle(t, p).catch(e => console.warn('Tiempo real:', e))));
  rtChannel.subscribe(status => {
    // Si se corta (móvil en reposo, wifi…) y vuelve, recargamos por si nos perdimos algo
    if (status === 'SUBSCRIBED') { if (rtWasLive) rtResync(); rtWasLive = true; }
  });
}
function rtStop() { if (rtChannel) { sb.removeChannel(rtChannel); rtChannel = null; } rtWasLive = false; }
async function rtResync() { if (S.profile && S.profile.approved && await loadData(true)) softRender(); }
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  if (hiddenAt && Date.now() - hiddenAt > 60000) rtResync(); // vuelves a la pestaña tras más de 1 minuto
  hiddenAt = 0;
});

/* Repintar sin molestar: si estás escribiendo o tienes una ventana abierta, solo se actualizan
   los contadores del menú; el resto se repinta al cerrar la ventana. */
let uiStale = false;
function uiBusy() {
  if ($('#modalRoot').firstChild) return true;
  const a = document.activeElement;
  if (a && /^(TEXTAREA|INPUT|SELECT)$/.test(a.tagName) && a.closest('#app')) return true;
  return $$('#app textarea').some(x => x.value.trim()) || $$('#feedForm input[type=text]').some(x => x.value.trim());
}
function refreshChrome() {
  const secs = sections();
  $$('.bell').forEach(b => { b.outerHTML = bellHtml(); });
  if (!installBtnHtml()) $$('.installbtn').forEach(b => b.remove());
  const nav = $('.sidebar .nav'); if (nav) nav.outerHTML = navHtml(secs);
  const tb = $('.tabbar'); if (tb) tb.outerHTML = tabbar(secs);
  const rl = $('.rail'); if (rl) rl.innerHTML = railView();
}
function softRender() {
  if (!S.profile || !$('.shell')) return;
  if (uiBusy()) { uiStale = true; refreshChrome(); return; }
  uiStale = false;
  const y = window.scrollY; render(); window.scrollTo(0, y);
}

async function rtHandle(t, p) {
  if (!S.profile || !S.user) return;
  const ev = p.eventType, row = p.new || {}, old = p.old || {}, me = S.user.id, teacher = isTeacher();
  // Alguien que aún no está en el directorio (alumno recién aprobado…): lo recargamos para su nombre y foto
  if (ev !== 'DELETE' && row.author_id && !S.dir[row.author_id]) await loadDirectory();
  // Lo mismo con quien reacciona (su primera reacción le hace visible)
  if (ev !== 'DELETE' && t === 'reactions' && row.user_id && !S.dir[row.user_id]) await loadDirectory();

  if (t === 'classmates') { // solicitudes y compañeros: cambian también a quién puedo ver
    const had = S.mates.some(m => m.id === (row.id || old.id));
    if (ev === 'DELETE' && !had) return;
    S.mates = rtApply(S.mates, t, ev, row, old);
    await loadDirectory();
    return softRender();
  }

  if (t === 'feed_posts') {
    if (ev === 'INSERT') {
      if (S.fposts.some(x => x.id === row.id) || S.feedQueue.some(x => x.id === row.id)) return;
      if (row.author_id !== me && S.section === 'feed') { S.feedQueue.push(row); return updateNewPill(); }
      S.fposts.unshift(row); return softRender();
    }
    if (ev === 'DELETE') {
      S.feedQueue = S.feedQueue.filter(x => x.id !== old.id); updateNewPill();
      if (!S.fposts.some(x => x.id === old.id)) return;
      dropTargetLocal('feed_post', old.id);
      const el = $(`[data-fpost="${old.id}"]`); if (el) el.remove();
      if (S.section !== 'feed') softRender();
      return;
    }
    if (ev === 'UPDATE') { // alguien ha editado su publicación: se cambia en su sitio
      const q = S.feedQueue.find(x => x.id === row.id); if (q) Object.assign(q, row);
      const p = S.fposts.find(x => x.id === row.id); if (!p) return;
      Object.assign(p, row);
      const el = $(`[data-fpost="${row.id}"]`); if (el) el.outerHTML = feedCard(p);
      return;
    }
    return;
  }
  if (t === 'feed_comments' || t === 'listening_comments') {
    const kind = t === 'feed_comments' ? 'feed' : 'listening', c = CM[kind];
    if (ev === 'INSERT') { if (addUnique(cmList(kind), row, t)) updateComments(kind, row[c.key]); return; }
    if (ev === 'DELETE') {
      const x = cmList(kind).find(y => y.id === old.id); if (!x) return;
      dropTargetLocal(c.type, old.id); updateComments(kind, x[c.key]); return;
    }
    return;
  }
  if (t === 'reactions') {
    if (ev === 'INSERT') { if (addUnique(S.reactions, row, t)) updateRx(row.target_type, row.target_id); return; }
    if (ev === 'DELETE') {
      const k = rowKey(t, old), x = S.reactions.find(r => rowKey(t, r) === k); if (!x) return;
      S.reactions = S.reactions.filter(r => r !== x); updateRx(x.target_type, x.target_id); return;
    }
    return;
  }
  if (t === 'dm_messages') {
    if (ev === 'DELETE') {
      if (!S.dms.some(m => m.id === old.id)) return;
      S.dms = S.dms.filter(m => m.id !== old.id); updateThread(); refreshChrome(); return;
    }
    if (ev === 'UPDATE') { // "visto"
      const m = S.dms.find(x => x.id === row.id); if (!m) return;
      Object.assign(m, row); updateThread(); refreshChrome(); return;
    }
    if (!addUnique(S.dms, row, t)) return;
    const from = dmPartner(row);
    if (!S.dir[from]) await loadDirectory();
    const viewing = S.section === 'messages' && S.dmWith === from && !document.hidden;
    if (viewing) { updateThread(); if (row.recipient_id === me) await markDmRead(from); }
    if (S.section === 'messages' && !uiBusy()) { softRender(); scrollThread(); } else { refreshChrome(); updateDmList(); }
    return;
  }
  if (t === 'notifications') {
    if (ev === 'DELETE') S.notifs = S.notifs.filter(n => n.id !== old.id);
    else {
      const isNew = !S.notifs.some(n => n.id === row.id);
      S.notifs = rtApply(S.notifs, t, ev, row, old);
      const inOpenChat = row.kind === 'dm' && S.section === 'messages' && S.dmWith === row.actor_id && !document.hidden;
      if (ev === 'INSERT' && isNew && inOpenChat) await markNotifsRead([row.id]); // ya lo estás leyendo
      // Aviso discreto de lo nuevo (salvo un mensaje de la conversación que ya tienes abierta)
      if (ev === 'INSERT' && isNew && !inOpenChat) {
        if (row.actor_id && !S.dir[row.actor_id]) await loadDirectory();
        toast(notifText(row).replace(/<[^>]+>/g, ''));
      }
    }
    return refreshChrome();
  }
  if (t === 'profiles') {
    if (row.id === me || old.id === me) {
      if (ev === 'DELETE') return;
      const permsChanged = row.family_dm_ok !== undefined && row.family_dm_ok !== S.profile.family_dm_ok;
      S.profile = { ...S.profile, ...row };
      if (!S.profile.approved) { rtStop(); return route(); } // le han retirado el acceso
      if (permsChanged) await refreshDmContacts(); // el profe ha cambiado su permiso de mensajes
    }
    if (teacher) {
      const { avatar_src, avatar_crop, ...lite } = row; // la copia grande de la foto no hace falta en la lista
      if (ev === 'DELETE') S.students = S.students.filter(s => s.id !== old.id);
      else if (row.role === 'student') S.students = rtApply(S.students, t, ev, lite, old);
    }
    await loadDirectory(); // nombres, apodos y fotos
    return softRender();
  }
  if (!teacher) { // casos del alumno en los que el aviso en directo no trae todo lo necesario
    if (t === 'board_recipients') { // te han incluido en (o quitado de) un aviso dirigido
      if (ev === 'INSERT' && row.student_id === me) {
        const { data } = await sb.from('board_posts').select('*').eq('id', row.post_id).maybeSingle();
        if (data) S.posts = rtApply(S.posts, 'board_posts', 'INSERT', data);
      } else if (ev === 'DELETE' && old.student_id === me) {
        const { data } = await sb.from('board_posts').select('id').eq('id', old.post_id).maybeSingle();
        if (!data) S.posts = S.posts.filter(x => x.id !== old.post_id);
      } else return;
      return softRender();
    }
    if (t === 'listening_assignments') { // la escucha llega sin su elemento: lo pedimos
      if (ev === 'DELETE') { S.assigns = S.assigns.filter(a => a.id !== old.id); return softRender(); }
      if (row.student_id !== me) return;
      const ex = S.assigns.find(a => a.id === row.id);
      if (ex) Object.assign(ex, row);
      else {
        const { data } = await sb.from('listening_assignments').select('*, item:listening_items(*)').eq('id', row.id).maybeSingle();
        if (data && data.item) S.assigns.push(data);
      }
      return softRender();
    }
    if (t === 'listening_items') {
      if (ev === 'UPDATE') S.assigns.forEach(a => { if (a.item_id === row.id) a.item = { ...a.item, ...row }; });
      if (ev === 'DELETE') S.assigns = S.assigns.filter(a => a.item_id !== old.id);
      return softRender();
    }
    if (t === 'board_posts' && ev === 'DELETE') { S.posts = S.posts.filter(x => x.id !== old.id); return softRender(); }
  }
  if (t === 'moderation_reports' && teacher && ev === 'INSERT' && row.target_type === 'dm_message' && !S.dms.some(m => m.id === row.target_id)) {
    // denuncia de un mensaje privado: ahora el profesor puede leer ESE mensaje (y solo ese)
    const { data } = await sb.from('dm_messages').select('*').eq('id', row.target_id).maybeSingle();
    if (data) addUnique(S.dms, data, 'dm_messages');
  }
  const key = RT_LIST[t]; if (!key) return;
  S[key] = rtApply(S[key], t, ev, row, old);
  softRender();
}

/* ---- Botón "Atrás" (lateral del ratón, móvil o navegador) ----
   Cada sección y cada ventana abierta es una entrada del historial: "Atrás" cierra la ventana
   o vuelve a la sección anterior, sin salir de la app. */
// histSkip: "atrás" internos pendientes (al cerrar una ventana). Mientras haya alguno, lo nuevo espera.
let histSkip = 0, histModalPending = false, histRestoring = false;
const histState = () => ({ app: 1, s: S.section, dm: S.section === 'messages' ? (S.dmWith || null) : null });
function histSync() { // la llama render(): si cambió la sección, añade una entrada
  if (histRestoring || !S.profile || histSkip) return; // con un "atrás" pendiente, se sincroniza al terminar
  const st = history.state || {}, want = histState();
  if (st.modal) return;
  if (!st.app) { history.replaceState(want, ''); return; }
  if (st.s === want.s && (st.dm || null) === want.dm) return;
  history.pushState(want, '');
}
window.addEventListener('popstate', async e => {
  if (histSkip) { // es el "atrás" que hicimos nosotros al cerrar una ventana
    if (--histSkip === 0) {
      histSync(); // la sección a la que se fue mientras tanto
      if (histModalPending && $('#modalRoot').firstChild) history.pushState({ ...histState(), modal: 1 }, '');
      histModalPending = false;
    }
    return;
  }
  if ($('#modalRoot').firstChild) { await closeModal(true); return; }
  const st = e.state || {};
  if (!S.profile || !st.app) return;
  histRestoring = true;
  S.section = st.s || 'feed'; S.dmWith = st.dm || null;
  render(); window.scrollTo(0, 0);
  histRestoring = false;
});

/* ------------------------------ Modal ------------------------------- */
function openModal(html, onClose) {
  if (!$('#modalRoot').firstChild && S.profile) { // para que "Atrás" la cierre
    if (histSkip) histModalPending = true; else history.pushState({ ...histState(), modal: 1 }, '');
  }
  $('#modalRoot').innerHTML = `<div class="backdrop" data-action="backdrop"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  document.body.classList.add('noscroll');
  modalOnClose = onClose || null;
}
async function closeModal(fromHistory = false) {
  const wasOpen = !!$('#modalRoot').firstChild;
  if (modalOnClose) { const f = modalOnClose; modalOnClose = null; await f(); }
  $('#modalRoot').innerHTML = '';
  document.body.classList.remove('noscroll');
  // Cerrada con la ✕, Esc o al pulsar fuera: quitamos su entrada del historial
  if (wasOpen && !fromHistory && history.state && history.state.modal) { histSkip++; history.back(); }
  if (uiStale) softRender(); // aplica lo que llegó en directo mientras la ventana estaba abierta
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modalRoot').firstChild) closeModal(); });

async function route() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { S.user = null; S.profile = null; return viewAuth(); }
  S.user = session.user;
  const { data: prof, error } = await sb.from('profiles').select('*').eq('id', S.user.id).maybeSingle();
  if (error) return viewFatal('No se pudo leer tu perfil: ' + error.message);
  if (!prof) return viewFatal('No existe tu perfil. ¿Se ejecutó el SQL de supabase.sql antes de crear la cuenta?');
  S.profile = prof;
  if (!prof.approved) return viewPending();
  $('#app').innerHTML = '<div class="loading">Cargando…</div>';
  const ok = await loadData();
  if (ok) {
    render(); rtStart(); backfillThumbs();
    const fromNotif = new URLSearchParams(location.search).has('n');
    pushInit().catch(e => console.warn('Push:', e)).finally(() => installCheck(fromNotif).catch(e => console.warn('Instalar:', e)));
    if (fromNotif) { // llegamos desde un aviso del móvil
      const url = location.href;
      history.replaceState(history.state, '', location.pathname); // limpia ?n= de la barra
      openNotifFromUrl(url);
    }
  }
}

// quiet = true: resincronización en segundo plano (si falla, no muestra la pantalla de error)
async function loadData(quiet = false) {
  try {
    const me = S.user.id;
    const common = [
      sb.from('feed_posts').select('*').order('created_at', { ascending: false }).limit(100),
      sb.from('feed_comments').select('*'),
      sb.from('listening_comments').select('*'),
      sb.from('reactions').select('*'),
      sb.rpc('get_directory')
    ];
    // Mensajes privados, bloqueos propios, contactos y notificaciones (iguales para profe y alumno)
    const extra = await Promise.all([
      sb.from('dm_messages').select('*').order('created_at', { ascending: true }).limit(1000),
      sb.from('user_blocks').select('*'),
      sb.rpc('get_dm_contacts'),
      sb.from('notifications').select('*').order('created_at', { ascending: false }).limit(60),
      sb.from('classmates').select('*')
    ]);
    const exErr = extra.map(x => x.error).find(Boolean);
    if (exErr) throw exErr;
    S.dms = extra[0].data || []; S.blocks = extra[1].data || []; S.notifs = extra[3].data || []; S.mates = extra[4].data || [];
    S.dmContacts = (extra[2].data || []).map(x => typeof x === 'string' ? x : x.get_dm_contacts || x.id);
    S.dmCan = {}; S.dmContacts.forEach(id => { S.dmCan[id] = true; });
    if (S.profile.role === 'teacher') {
      const [i, a, p, bp, br, bd, rp, hw, pp, pr, fp, fc, lc, rx, dr] = await Promise.all([
        sb.from('listening_items').select('*').order('created_at', { ascending: false }),
        sb.from('listening_assignments').select('*'),
        // sin avatar_src (la copia grande de la foto): no hace falta y pesa. Al añadir campos al perfil, añádelos aquí.
        sb.from('profiles').select('id, display_name, nickname, avatar, email, role, approved, created_at, birth_date, family_dm_ok, app_installed_at').eq('role', 'student').order('display_name'),
        sb.from('board_posts').select('*'),
        sb.from('board_recipients').select('*'),
        sb.from('board_reads').select('*'),
        sb.from('moderation_reports').select('*'),
        sb.from('homework_tasks').select('*').order('created_at', { ascending: false }).limit(2000),
        sb.from('payments_plans').select('*'),
        sb.from('payments_records').select('*').order('period', { ascending: false }).limit(3000),
        ...common
      ]);
      const err = [i, a, p, bp, br, bd, rp, hw, pp, pr, fp, fc, lc, rx, dr].map(x => x.error).find(Boolean);
      if (err) throw err;
      S.items = i.data; S.assigns = a.data; S.students = p.data;
      S.posts = bp.data; S.recipients = br.data; S.reads = bd.data; S.reports = rp.data;
      S.homework = hw.data || []; S.payPlans = pp.data || []; S.payRecords = pr.data || [];
      S.fposts = fp.data; S.fcomments = fc.data; S.lcomments = lc.data; S.reactions = rx.data;
      S.dir = {}; (dr.data || []).forEach(d => { S.dir[d.id] = d; });
    } else {
      const [a, bp, bd, rp, hw, fp, fc, lc, rx, dr] = await Promise.all([
        sb.from('listening_assignments').select('*, item:listening_items(*)').eq('student_id', me),
        sb.from('board_posts').select('*'),
        sb.from('board_reads').select('*').eq('student_id', me),
        sb.from('moderation_reports').select('*').eq('reporter_id', me),
        sb.from('homework_tasks').select('*').eq('student_id', me).order('created_at', { ascending: false }).limit(500),
        ...common
      ]);
      const err = [a, bp, bd, rp, hw, fp, fc, lc, rx, dr].map(x => x.error).find(Boolean);
      if (err) throw err;
      S.assigns = (a.data || []).filter(x => x.item);
      S.posts = bp.data; S.reads = bd.data; S.reports = rp.data; S.homework = hw.data || [];
      S.fposts = fp.data; S.fcomments = fc.data; S.lcomments = lc.data; S.reactions = rx.data;
      S.dir = {}; (dr.data || []).forEach(d => { S.dir[d.id] = d; });
    }
    // La Agenda no debe tumbar la app si su parte de la base de datos aún no existe o falla
    try { await loadLessons(); } catch (e) { console.warn('Agenda:', e.message || e); S.lessons = []; }
    return true;
  } catch (e) {
    const m = String(e.message || e);
    if (quiet) { console.warn('Resincronización fallida:', m); return false; }
    viewFatal(/board_|feed_|reactions|moderation_|get_directory|listening_comments|dm_|notifications|user_blocks|classmates|homework_|payments_|lessons|relation|schema cache|function/i.test(m)
      ? 'Falta ejecutar la última versión de supabase.sql en el SQL Editor de Supabase. (' + m + ')'
      : 'Error cargando los datos: ' + m);
    return false;
  }
}

function render() {
  if (!S.profile) return;
  const t = isTeacher();
  // 'feed' es el Inicio (lo primero que se ve). 'mod' es la Moderación, solo del profesor.
  if (!['feed', 'messages', 'board', 'listening', 'homework', 'profile', 'settings'].concat(t ? ['students', 'payments', 'agenda', 'mod'] : []).includes(S.section)) S.section = 'feed';
  let body;
  switch (S.section) {
    case 'messages': body = messagesView(); break;
    case 'board': body = t ? boardTeacher() : boardStudent(); break;
    case 'listening': body = t ? teacherCatalog() : studentListening(); break;
    case 'students': body = teacherStudents(); break;
    case 'profile': body = profileView(); break;
    case 'settings': body = settingsView(); break;
    case 'homework': body = t ? homeworkTeacher() : homeworkStudent(); break;
    case 'payments': body = paymentsView(); break;
    case 'agenda': body = agendaView(); break;
    case 'mod': body = homeTeacher(); break;

  const rail = ['mod', 'messages', 'profile', 'settings', 'payments', 'agenda'].includes(S.section) ? '' : railView(); // en Moderación ya está todo; en Mensajes, Perfil y Ajustes, más sitio

}

  const dmu = unreadDms();

// Primer enlace de un texto (con o sin https://), normalizado; null si no hay o no es válido
function firstLink(text) {
  const m = String(text).match(/https?:\/\/[^\s<]+|\b(?:www\.|open\.spotify\.com\/|spotify\.link\/|youtu\.be\/|(?:m\.|music\.)?youtube\.com\/)[^\s<]*/i);
  if (!m) return null;
  let u = m[0].replace(/[.,;:!?)\]]+$/, '');
  if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
  try { return u.length <= 500 ? new URL(u).href : null; } catch { return null; }
}

// Alumno: un aviso cuenta como leído cuando ha estado en pantalla.
// La etiqueta "Nuevo" se mantiene mientras siga en Avisos (postSeenNow) y se quita al volver.
let postSeenObs = null;
const postSeenNow = new Set();
function watchPostReads() {
  if (postSeenObs) { postSeenObs.disconnect(); postSeenObs = null; }
  if (S.section !== 'board') postSeenNow.clear();
  if (S.section !== 'board' || isTeacher() || !('IntersectionObserver' in window)) return;
  const cards = $$('.card.post.isnew[data-post]');
  if (!cards.length) return;
  postSeenObs = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      postSeenObs.unobserve(e.target);
      postSeenNow.add(e.target.dataset.post);
      markRead(e.target.dataset.post).then(refreshChrome);
    });
  }, { threshold: 0.6 });
  cards.forEach(c => postSeenObs.observe(c));
}

/* ---- Foto de perfil: encuadre (arrastrar para mover, deslizador o rueda para ampliar) ---- */
/* Se guardan dos cosas: la foto final de 160×160 (la que ve el grupo, columna avatar) y, solo para
   ti y el profesor, una copia reducida de la original (avatar_src) con la posición del encuadre
   (avatar_crop), para poder reencuadrar sin volver a subirla. */
let crop = null; // { img, src, zoom, cx, cy } · cx/cy = punto de la imagen que queda en el centro del círculo
const CROP_VIEW = 260; // tamaño en pantalla del recuadro de encuadre
const SRC_MAX = 640;   // lado máximo de la copia de la original
const loadImg = src => new Promise(res => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; });
async function processAvatar(file) {
  if (!file || !/^image\//.test(file.type)) return toast('Elige una imagen', 'bad');
  const url = URL.createObjectURL(file);
  const raw = await loadImg(url);
  URL.revokeObjectURL(url);
  if (!raw || !raw.naturalWidth) return toast('No se pudo leer esa imagen. Prueba con JPG o PNG', 'bad');
  // copia reducida de la original (se guarda para poder reencuadrar más tarde)
  const k = Math.min(1, SRC_MAX / Math.max(raw.naturalWidth, raw.naturalHeight));
  const c = document.createElement('canvas');
  c.width = Math.round(raw.naturalWidth * k); c.height = Math.round(raw.naturalHeight * k);
  const cx = c.getContext('2d'); cx.fillStyle = '#0b1530'; cx.fillRect(0, 0, c.width, c.height);
  cx.imageSmoothingQuality = 'high'; cx.drawImage(raw, 0, 0, c.width, c.height);
  let src = c.toDataURL('image/jpeg', 0.82);
  if (src.length > 115000) src = c.toDataURL('image/jpeg', 0.62);
  if (src.length > 120000) src = null; // demasiado pesada: se podrá encuadrar ahora, pero no reencuadrar luego
  openCrop(src ? await loadImg(src) : raw, src, null);
}
async function editAvatar() {
  const p = S.profile;
  const img = p.avatar_src ? await loadImg(p.avatar_src) : null;
  if (!img) return toast('No hay foto original guardada. Vuelve a elegirla', 'bad');
  openCrop(img, p.avatar_src, p.avatar_crop);
}
function openCrop(img, src, saved) {
  const w = img.naturalWidth, h = img.naturalHeight;
  crop = { img, src, zoom: 1, cx: w / 2, cy: h / 2 };
  if (saved && typeof saved === 'object') {
    crop.zoom = Math.min(4, Math.max(1, +saved.zoom || 1));
    crop.cx = (+saved.x || 0.5) * w; crop.cy = (+saved.y || 0.5) * h;
    cropClamp();
  }
  openModal(`
    <div class="modal-head"><h2>Encuadra tu foto</h2><button class="x" data-action="close" aria-label="Cerrar">×</button></div>
    <div class="crop">
      <div class="crop-stage" id="cropStage"><canvas id="cropCanvas" width="${CROP_VIEW * 2}" height="${CROP_VIEW * 2}"></canvas></div>
      <label class="crop-zoom">${ic('zoom-out')}<input type="range" id="cropZoom" min="1" max="4" step="0.01" value="${crop.zoom}" aria-label="Ampliar">${ic('zoom-in')}</label>
      <p class="sub center" style="margin:0">Arrastra la foto para moverla y usa el deslizador para ampliarla. Lo que quede dentro del círculo es lo que verá el grupo.</p>
      <div class="actions" style="justify-content:center"><button class="btn primary" data-action="avatar-save">Guardar foto</button><button class="btn ghost" data-action="close">Cancelar</button></div>
    </div>`, async () => { crop = null; });
  $('.modal').classList.add('narrow');
  cropBind();
  cropDraw();
}
// Escala base: la imagen cubre justo el círculo (lado corto = recuadro). zoom multiplica esa escala.
const cropScale = (view) => (view / Math.min(crop.img.naturalWidth, crop.img.naturalHeight)) * crop.zoom;
function cropClamp() { // que nunca quede hueco vacío dentro del recuadro
  const half = (CROP_VIEW / 2) / cropScale(CROP_VIEW);
  const w = crop.img.naturalWidth, h = crop.img.naturalHeight;
  crop.cx = Math.min(Math.max(crop.cx, half), w - half);
  crop.cy = Math.min(Math.max(crop.cy, half), h - half);
}
function cropPaint(ctx, view, bg) {
  const s = cropScale(view);
  ctx.fillStyle = bg; ctx.fillRect(0, 0, view, view);
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(crop.img, view / 2 - crop.cx * s, view / 2 - crop.cy * s, crop.img.naturalWidth * s, crop.img.naturalHeight * s);
}
function cropDraw() {
  const c = $('#cropCanvas'); if (!c || !crop) return;
  const ctx = c.getContext('2d');
  ctx.setTransform(2, 0, 0, 2, 0, 0); // canvas a doble resolución para que se vea nítido
  cropPaint(ctx, CROP_VIEW, '#000');
}
function cropBind() {
  const st = $('#cropStage'), zr = $('#cropZoom');
  let drag = null;
  const ratio = () => CROP_VIEW / st.getBoundingClientRect().width; // por si el recuadro se encoge en móvil
  st.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY }; st.setPointerCapture(e.pointerId); });
  st.addEventListener('pointermove', e => {
    if (!drag || !crop) return;
    const s = cropScale(CROP_VIEW), r = ratio();
    crop.cx -= (e.clientX - drag.x) * r / s; crop.cy -= (e.clientY - drag.y) * r / s;
    drag = { x: e.clientX, y: e.clientY };
    cropClamp(); cropDraw();
  });
  const end = () => { drag = null; };
  st.addEventListener('pointerup', end); st.addEventListener('pointercancel', end);
  zr.addEventListener('input', () => { if (!crop) return; crop.zoom = +zr.value; cropClamp(); cropDraw(); });
  st.addEventListener('wheel', e => {
    if (!crop) return; e.preventDefault();
    crop.zoom = Math.min(4, Math.max(1, crop.zoom * (e.deltaY < 0 ? 1.08 : 1 / 1.08)));
    zr.value = crop.zoom; cropClamp(); cropDraw();
  }, { passive: false });
}
async function cropSave() {
  if (!crop) return;
  const N = 160, c = document.createElement('canvas'); c.width = c.height = N;
  cropPaint(c.getContext('2d'), N, '#0b1530');
  let data = c.toDataURL('image/jpeg', 0.85);
  if (data.length > 38000) data = c.toDataURL('image/jpeg', 0.6);
  if (data.length > 40000) return toast('La imagen es demasiado pesada', 'bad');
  const w = crop.img.naturalWidth, h = crop.img.naturalHeight;
  const fields = { avatar: data, avatar_src: crop.src || null,
    avatar_crop: crop.src ? { x: +(crop.cx / w).toFixed(4), y: +(crop.cy / h).toFixed(4), zoom: +crop.zoom.toFixed(3) } : null };
  await closeModal();
  await saveProfileFields(fields, 'Foto actualizada');
}

/* ============================== ALUMNO ============================== */
/* ---- Portadas: Spotify (oEmbed público, sin claves) y YouTube (miniatura por id de vídeo) ---- */
const THUMB_OK = /^https:\/\/(i\.scdn\.co|image-cdn-[a-z0-9-]+\.spotifycdn\.com|mosaic\.scdn\.co|i\.ytimg\.com)\//;
const safeThumb = u => typeof u === 'string' && u.length <= 300 && THUMB_OK.test(u) ? u : null;
function ytId(url) {
  const m = String(url).match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/))([A-Za-z0-9_-]{11})/);
  return m ? m[1] : null;
}
const linkService = url => /spotify\.com/i.test(url) ? 'sp' : /youtu\.?be/i.test(url) ? 'yt' : '';
// Título y portada de un enlace de Spotify o YouTube (oEmbed público, sin claves). { title, thumb } o nulos.
const metaCache = {};
async function fetchMeta(url) {
  if (typeof window.__META_STUB === 'function') return window.__META_STUB(url); // pruebas: respuesta simulada
  if (CFG.NO_EXTERNAL) return { title: null, thumb: null }; // pruebas: sin llamadas a internet
  if (metaCache[url]) return metaCache[url];
  const yt = /youtu\.?be/i.test(url), sp = /open\.spotify\.com\//i.test(url);
  if (!yt && !sp) return { title: null, thumb: null };
  const api = sp ? 'https://open.spotify.com/oembed?url=' + encodeURIComponent(url.split('?')[0])
    : 'https://www.youtube.com/oembed?format=json&url=' + encodeURIComponent(url);
  let title = null, thumb = null;
  try {
    const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 5000);
    const r = await fetch(api, { signal: ctl.signal });
    clearTimeout(tm);
    if (r.ok) { const j = await r.json(); title = (j.title || '').trim().slice(0, 200) || null; thumb = safeThumb(j.thumbnail_url); }
  } catch { /* sin conexión o enlace privado */ }
  if (!thumb && ytId(url)) thumb = `https://i.ytimg.com/vi/${ytId(url)}/mqdefault.jpg`;
  return (metaCache[url] = { title, thumb });
}
const fetchThumb = async url => (await fetchMeta(url)).thumb;
// Tipo según la dirección: Spotify /album/ /track/ /playlist/ · YouTube con "list=" → playlist; otro vídeo → canción
function guessKind(url) {
  if (/spotify\.com\/(intl-[a-z]+\/)?album\//i.test(url)) return 'album';
  if (/spotify\.com\/(intl-[a-z]+\/)?track\//i.test(url)) return 'song';
  if (/spotify\.com\/(intl-[a-z]+\/)?playlist\//i.test(url) || /youtu.*[?&]list=/i.test(url)) return 'playlist';
  if (ytId(url)) return 'song';
  return null;
}
// Profesor: rellena en segundo plano las portadas que falten (elementos creados antes de esta función)
const durTried = new Set();
async function backfillThumbs() {
  if (!isTeacher() || CFG.NO_EXTERNAL) return;
  for (const it of S.items.filter(i => !i.thumb_url).slice(0, 30)) {
    const th = await fetchThumb(it.url);
    if (!th) continue;
    const { error } = await sb.from('listening_items').update({ thumb_url: th }).eq('id', it.id);
    if (!error) { it.thumb_url = th; S.assigns.forEach(a => { if (a.item && a.item.id === it.id) a.item.thumb_url = th; }); }
  }
  // Duraciones que falten (una vez por sesión: si un enlace no la da, no se insiste)
  for (const it of S.items.filter(i => !i.duration_sec && !durTried.has(i.id)).slice(0, 30)) {
    durTried.add(it.id);
    await new Promise(ok => setTimeout(ok, 600)); // de una en una y sin prisa: Spotify corta si le pides muchas seguidas
    const d = await fetchDuration(it.url);
    if (!d.duration_sec) continue;
    const row = { duration_sec: d.duration_sec, track_count: d.track_count, duration_partial: d.partial };
    const { error } = await sb.from('listening_items').update(row).eq('id', it.id);
    if (!error) { Object.assign(it, row); S.assigns.forEach(a => { if (a.item && a.item.id === it.id) Object.assign(a.item, row); }); }
  }
  if (S.section === 'listening') softRender();
}
// Miniatura con el icono del tipo debajo: si la imagen no carga, se queda el icono
function coverHtml(it, size = 48) {
  const th = safeThumb(it.thumb_url);
  return `<span class="cover k-${esc(it.kind)}" style="width:${size}px;height:${size}px">${ic(it.kind in KIND ? it.kind : 'song')}${th ? `<img src="${esc(th)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : ''}</span>`;
}
// Duración: canción "3:33"; álbum/playlist "12 temas · 42 min" o "1 h 12 min". "+" = solo se sumaron los primeros 100 temas
function fmtSecs(sec, exact) {
  sec = Math.round(sec);
  if (exact) { const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = String(sec % 60).padStart(2, '0');
    return h ? `${h}:${String(m).padStart(2, '0')}:${s}` : `${m}:${s}`; }
  const mins = Math.max(1, Math.round(sec / 60)), h = Math.floor(mins / 60), m = mins % 60;
  return h ? (m ? `${h} h ${m} min` : `${h} h`) : `${mins} min`;
}
function durText(it) {
  const sec = Number(it.duration_sec) || 0, n = Number(it.track_count) || 0;
  if (!sec && !n) return '';
  const part = !!it.duration_partial;
  const d = sec ? fmtSecs(sec, it.kind === 'song' && !n) + (part ? '+' : '') : '';
  const t = n && it.kind !== 'song' ? `${n}${part && n === 100 ? '+' : ''} tema${n === 1 ? '' : 's'}` : '';
  return [t, d].filter(Boolean).join(' · ');
}
const durHtml = it => { const t = durText(it); return t ? `<span class="tdur">${esc(t)}</span>` : ''; };
// "3:33", "1:12:05", "42", "42 min", "1 h 12 min" → segundos. Vacío → null. No válido → NaN
function parseDur(v) {
  v = String(v || '').trim().toLowerCase();
  if (!v) return null;
  if (/^\d+(:\d{1,2}){1,2}$/.test(v)) return v.split(':').reduce((s, p) => s * 60 + Number(p), 0) || NaN;
  if (/^\d+$/.test(v)) return Number(v) * 60 || NaN;
  const m = v.match(/^(?:(\d+)\s*h)?\s*(?:(\d+)\s*(?:m|min|mins|minutos?)?)?$/);
  return m && (m[1] || m[2]) ? ((Number(m[1]) || 0) * 3600 + (Number(m[2]) || 0) * 60) || NaN : NaN;
}
// Duración con la Edge Function "media-info" (Spotify/YouTube no la dan al navegador). { duration_sec, track_count, partial }
const durCache = {};
async function fetchDuration(url) {
  const none = { duration_sec: null, track_count: null, partial: false };
  if (typeof window.__DUR_STUB === 'function') return window.__DUR_STUB(url); // pruebas
  if (CFG.NO_EXTERNAL || !linkService(url)) return none;
  if (durCache[url]) return durCache[url];
  try {
    const { data, error } = await sb.functions.invoke('media-info', { body: { url } });
    if (error || !data) return none;
    const ok = x => Number.isInteger(x) && x > 0 ? x : null;
    return (durCache[url] = { duration_sec: ok(data.duration_sec), track_count: ok(data.track_count), partial: !!data.partial });
  } catch { return none; }
}

function setSaveState(text, cls = '') {
  const el = $('#saveState');
  if (!el) return;
  el.textContent = text;
  el.className = 'save-state ' + cls;
}
function markDirty() {
  if (!cur) return;
  cur.dirty = true;
  setSaveState('Sin guardar…');
  clearTimeout(cur.timer);
  cur.timer = setTimeout(saveNow, 900);
}
async function saveNow() {
  const c = cur;
  if (!c || !c.dirty || c.saving) return;
  const a = S.assigns.find(x => x.id === c.id);
  const chk = $('#chkListened');
  if (!a || !chk) return;
  clearTimeout(c.timer);
  const answers = {};
  QUESTIONS.forEach(q => { const t = $(`[data-q="${q.k}"]`); answers[q.k] = t ? t.value : ((a.answers || {})[q.k] || ''); });
  const listened = chk.checked;
  c.dirty = false; c.saving = true;
  setSaveState('Guardando…');
  const { data, error } = await sb.from('listening_assignments')
    .update({ listened, listened_at: listened ? (a.listened_at || new Date().toISOString()) : null, answers })
    .eq('id', a.id).select();
  c.saving = false;
  if (error || !data || !data.length) {
    c.dirty = true;
    setSaveState('Error al guardar', 'bad');
    toast('No se pudo guardar' + (error ? ': ' + error.message : ''), 'bad');
    return;
  }
  Object.assign(a, data[0]);
  setSaveState('Guardado ✓', 'ok');
  if (c.dirty) c.timer = setTimeout(saveNow, 300); // se escribió algo mientras guardaba
}

function buildText(d, wa) {
  const b = s => wa ? `*${s}*` : s;
  let t = `${b(d.title)} (${KIND[d.kind] || d.kind})\nAlumno: ${d.name}\n${d.url}\n`;
  QUESTIONS.forEach((q, i) => { t += `\n${b(`${i + 1}. ${q.q}`)}\n${(d.answers[q.k] || '').trim() || '—'}\n`; });
  return t.trim();
}
function download(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; }
  catch {
    const ta = document.createElement('textarea');
    ta.value = t; ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch { }
    ta.remove();
    return ok;
  }
}
function buildCanvas(d) {
  const W = 1080, P = 56, maxW = W - 2 * P;
  const F = 'system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
  const c = document.createElement('canvas');
  const ctx = c.getContext('2d');
  const blocks = [
    { t: (KIND[d.kind] || d.kind).toUpperCase(), f: `600 20px ${F}`, col: '#a78bfa', lh: 28, gap: 0 },
    { t: d.title, f: `700 40px ${F}`, col: '#eceff6', lh: 50, gap: 6 },
    { t: `Alumno: ${d.name}`, f: `400 22px ${F}`, col: '#8990a3', lh: 30, gap: 10 },
    { t: d.url, f: `400 19px ${F}`, col: '#8990a3', lh: 26, gap: 2 }
  ];
  QUESTIONS.forEach((q, i) => {
    blocks.push({ t: `${i + 1}. ${q.q}`, f: `600 24px ${F}`, col: '#62d8ee', lh: 32, gap: 32 });
    blocks.push({ t: (d.answers[q.k] || '').trim() || '—', f: `400 24px ${F}`, col: '#d5d9e2', lh: 34, gap: 8 });
  });
  const wrap = (text, font) => {
    ctx.font = font;
    const out = [];
    text.split('\n').forEach(par => {
      if (!par.trim()) { out.push(''); return; }
      let line = '';
      par.split(/\s+/).forEach(w => {
        while (ctx.measureText(w).width > maxW) { // palabra más ancha que la línea (p. ej. una URL)
          let i = w.length;
          while (i > 1 && ctx.measureText(w.slice(0, i)).width > maxW) i--;
          if (line) { out.push(line); line = ''; }
          out.push(w.slice(0, i)); w = w.slice(i);
        }
        const test = line ? line + ' ' + w : w;
        if (ctx.measureText(test).width > maxW && line) { out.push(line); line = w; } else line = test;
      });
      out.push(line);
    });
    return out;
  };
  let y = P + 6;
  blocks.forEach(b => { b.lines = wrap(b.t, b.f); y += b.gap + b.lines.length * b.lh; });
  const H = y + P + 30;
  c.width = W; c.height = H;
  ctx.fillStyle = '#0b0d12'; ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.shadowColor = 'rgba(98,216,238,.55)'; ctx.shadowBlur = 14;
  ctx.fillStyle = '#62d8ee'; ctx.fillRect(P, 28, 90, 3);
  ctx.restore();
  ctx.textBaseline = 'top';
  y = P + 6;
  blocks.forEach(b => {
    y += b.gap; ctx.font = b.f; ctx.fillStyle = b.col;
    b.lines.forEach(l => { ctx.fillText(l, P, y); y += b.lh; });
  });
  ctx.font = `400 16px ${F}`; ctx.fillStyle = '#4b5366';
  ctx.fillText(APP_NAME, P, H - P + 6);
  return c;
}
const canvasBlob = c => new Promise(res => c.toBlob(res, 'image/png'));
function canShareFiles() {
  try { return !!(navigator.canShare && navigator.canShare({ files: [new File([''], 'a.png', { type: 'image/png' })] })); }
  catch { return false; }
}

const exportActions = {
  async 'exp-copy'() {
    const ok = await copyText(buildText(currentExport(), true));
    toast(ok ? 'Texto copiado. Pégalo en WhatsApp' : 'No se pudo copiar', ok ? 'ok' : 'bad');
  },
  async 'exp-share'() {
    const d = currentExport();
    try { await navigator.share({ title: d.title, text: buildText(d, true) }); }
    catch (e) { if (e && e.name !== 'AbortError') toast('No se pudo compartir', 'bad'); }
  },
  'exp-txt'() {
    const d = currentExport();
    download(new Blob([buildText(d, false)], { type: 'text/plain;charset=utf-8' }), `${slug(d.title)}_${slug(d.name)}.txt`);
  },
  async 'exp-png'() {
    const d = currentExport();
    download(await canvasBlob(buildCanvas(d)), `${slug(d.title)}_${slug(d.name)}.png`);
  },
  async 'exp-sharepng'() {
    const d = currentExport();
    const blob = await canvasBlob(buildCanvas(d));
    const file = new File([blob], `${slug(d.title)}_${slug(d.name)}.png`, { type: 'image/png' });
    try { await navigator.share({ files: [file], title: d.title }); }
    catch (e) { if (e && e.name !== 'AbortError') toast('No se pudo compartir la imagen', 'bad'); }
  }
};

          <div class="chips"><span class="chip ${a.listened ? 'ok' : ''}">${a.listened ? '✔ Escuchado' : '○ Pendiente'}</span><span class="chip ${n === 6 ? 'acc' : ''}">${n}/6 respuestas</span><span class="chip ${d.cls}">${esc(d.text)}</span></div></div>
        ${a.note ? `<div class="callout" style="margin-top:0"><b>Tu nota para este alumno</b>${esc(a.note)}</div>` : ''}
        <details><summary>Ver respuestas</summary>${answersHtml(a)}</details>
      </div>`;
    }).join('') : `<div class="empty">Este alumno no tiene nada asignado.</div>`}`, async () => render());
}

/* ========================= PERFILES COMPLETOS ========================= */
const INSTRUMENTS = { electric: 'Guitarra eléctrica', acoustic: 'Guitarra acústica', classical: 'Guitarra clásica', bass: 'Bajo', other: 'Otro instrumento' };
const LEVELS = { beginner: 'Iniciación', intermediate: 'Intermedio', advanced: 'Avanzado' };
function ageOf(iso) { // edad en años a partir de 'AAAA-MM-DD'
  if (!iso) return null;
  const [y, m, d] = iso.split('-').map(Number), t = new Date();
  return t.getFullYear() - y - ((t.getMonth() + 1 < m || (t.getMonth() + 1 === m && t.getDate() < d)) ? 1 : 0);
}
const isMinorProfile = p => { const a = ageOf(p.birth_date); return a === null || a < 18; }; // sin fecha = menor
// Nombre y foto pulsables: abren la ficha pública de esa persona
const whoLink = (id, inner) => `<span class="wholink" data-action="open-profile" data-id="${id}" role="button" tabindex="0">${inner}</span>`;

/* ============================ COMPAÑEROS ============================
   S.mates: mis filas de classmates (solicitudes enviadas, recibidas y compañeros).
   Un alumno solo es visible para los demás si ha participado (publicación, comentario o
   reacción), si sois compañeros, si hay una solicitud entre vosotros o si os habéis escrito
   (lo decide get_directory en la base de datos). */
const mateRow = id => S.mates.find(m => (m.requester_id === S.user.id && m.addressee_id === id) || (m.addressee_id === S.user.id && m.requester_id === id));
function mateState(id) {
  const m = mateRow(id);
  if (!m) return 'none';
  if (m.status === 'accepted') return 'mates';
  return m.requester_id === S.user.id ? 'sent' : 'received';
}
const myMates = () => S.mates.filter(m => m.status === 'accepted').map(m => m.requester_id === S.user.id ? m.addressee_id : m.requester_id);
const mateRequestsIn = () => S.mates.filter(m => m.status === 'pending' && m.addressee_id === S.user.id);
const mateRequestsOut = () => S.mates.filter(m => m.status === 'pending' && m.requester_id === S.user.id);
function mateButtons(id) {
  switch (mateState(id)) {
    case 'mates': return `<span class="chip acc">Compañeros</span><button class="btn sm ghost" data-action="mate-remove" data-id="${id}">Quitar</button>`;
    case 'sent': return `<span class="sub">Solicitud enviada</span><button class="btn sm ghost" data-action="mate-cancel" data-id="${id}">Cancelar</button>`;
    case 'received': return `<button class="btn sm primary" data-action="mate-accept" data-id="${id}">Aceptar como compañero</button><button class="btn sm ghost" data-action="mate-reject" data-id="${id}">Rechazar</button>`;
    default: return `<button class="btn sm" data-action="mate-add" data-id="${id}">+ Agregar como compañero</button>`;
  }
}
// Tras cualquier cambio: botones de la ficha abierta, directorio (puede cambiar a quién veo) y repintado
async function mateChanged(id) {
  await markNotifsRead(S.notifs.filter(n => n.kind === 'classmate_request' && n.actor_id === id && !n.read_at).map(n => n.id));
  await loadDirectory();
  const box = $(`[data-mate-box="${id}"]`); if (box) box.innerHTML = mateButtons(id);
  // En Perfil hay textos rellenos (bio…) que softRender toma por "escribiendo": repintamos igual si no hay ventana abierta
  if (!$('#modalRoot').firstChild && S.section === 'profile') { const y = window.scrollY; render(); window.scrollTo(0, y); }
  else softRender();
}
// Rechazar, cancelar o quitar: las tres borran la fila (la otra persona no recibe ningún aviso)
async function mateDelete(id, ask) {
  const m = mateRow(id); if (!m) return;
  if (ask && !confirm(ask)) return;
  const { error } = await sb.from('classmates').delete().eq('id', m.id);
  if (error) return toast('No se pudo hacer: ' + error.message, 'bad');
  S.mates = S.mates.filter(x => x.id !== m.id);
  await mateChanged(id);
}
function matesPanel() {
  const inc = mateRequestsIn(), out = mateRequestsOut();
  const mates = myMates().sort((a, b) => whoName(a).localeCompare(whoName(b)));
  const row = (id, btns) => `<div class="mrow">${whoLink(id, `${avatarHtml(id, 34)}<b>${esc(whoName(id))}</b>`)}${btns}</div>`;
  return `<div class="panel mates">
      <h2 class="h2" style="margin-top:0">Compañeros</h2>
      ${inc.length ? `<div class="mates-h">Solicitudes recibidas</div><div class="blist">${inc.map(m => row(m.requester_id,
        `<div class="mate-btns"><button class="btn sm primary" data-action="mate-accept" data-id="${m.requester_id}">Aceptar</button><button class="btn sm ghost" data-action="mate-reject" data-id="${m.requester_id}">Rechazar</button></div>`)).join('')}</div>` : ''}
      ${mates.length ? `${inc.length || out.length ? '<div class="mates-h">Tus compañeros</div>' : ''}<div class="blist">${mates.map(id => row(id, '')).join('')}</div>`
        : inc.length ? '' : '<p class="sub" style="margin:0">Aún no tienes compañeros. Cuando alguien publique, comente o reaccione, pulsa en su nombre o en su foto y agrégalo. Así no lo perderás de vista aunque el grupo crezca.</p>'}
      ${out.length ? `<div class="mates-h">Solicitudes enviadas</div><div class="blist">${out.map(m => row(m.addressee_id,
        `<div class="mate-btns"><button class="btn sm ghost" data-action="mate-cancel" data-id="${m.addressee_id}">Cancelar</button></div>`)).join('')}</div>` : ''}
    </div>`;
}

/* ========================= MENSAJES PRIVADOS =========================
   S.dms: mensajes en los que participo (y, si soy profesor, los denunciados).
   S.dmWith: con quién tengo abierta la conversación. S.dmCan[id]: si puedo escribirle. */
const dmPartner = m => m.sender_id === S.user.id ? m.recipient_id : m.sender_id;
const myDms = () => S.dms.filter(m => m.sender_id === S.user.id || m.recipient_id === S.user.id);
const unreadDms = () => S.dms.filter(m => m.recipient_id === S.user.id && !m.read_at).length;
function dmConversations() { // [{ id, last, unread }] ordenadas por el último mensaje
  const by = {};
  myDms().forEach(m => {
    const id = dmPartner(m), c = by[id] || (by[id] = { id, last: m, unread: 0 });
    if (m.created_at > c.last.created_at) c.last = m;
    if (m.recipient_id === S.user.id && !m.read_at) c.unread++;
  });
  return Object.values(by).sort((a, b) => b.last.created_at.localeCompare(a.last.created_at));
}
const isBlocked = id => S.blocks.some(b => b.blocked_id === id);

function messagesView() {
  const w = S.dmWith;
  return `<div class="dm ${w ? 'open' : ''}">${dmListHtml()}<div class="dm-pane">${w ? threadView(w) : '<div class="dm-empty">Elige una conversación o empieza una nueva.</div>'}</div></div>`;
}
const updateDmList = () => { const l = $('.dm-list'); if (l) l.outerHTML = dmListHtml(); };
function dmListHtml() {
  const convs = dmConversations(), w = S.dmWith;
  return `<div class="dm-list ${w ? 'has-open' : ''}">
    <div class="dm-list-head"><b>Conversaciones</b><button class="btn sm primary" data-action="dm-new">+ Nuevo</button></div>
    ${convs.length ? convs.map(c => `<div class="dm-conv ${c.id === w ? 'on' : ''}" data-action="dm-open" data-id="${c.id}">
        ${avatarHtml(c.id, 42)}<div class="t"><b>${esc(whoName(c.id))}</b><span class="sub">${c.last.sender_id === S.user.id ? 'Tú: ' : ''}${esc(c.last.body.slice(0, 60))}</span></div>
        <div class="dm-meta"><span class="sub">${timeAgo(c.last.created_at)}</span>${c.unread ? `<i class="dotn static">${c.unread}</i>` : ''}</div></div>`).join('')
      : '<div class="sub" style="padding:14px">Aún no tienes conversaciones. Pulsa "+ Nuevo" para escribir a alguien.</div>'}
  </div>`;
}
function threadInner(id) {
  const msgs = myDms().filter(m => dmPartner(m) === id).sort((a, b) => a.created_at.localeCompare(b.created_at));
  const lastMine = [...msgs].reverse().find(m => m.sender_id === S.user.id);
  if (!msgs.length) return '<div class="sub center" style="margin:auto">Aún no os habéis escrito. ¡Saluda! 👋</div>';
  return msgs.map(m => {
    const mine = m.sender_id === S.user.id, url = (m.body.match(/https?:\/\/[^\s<]+/) || [])[0];
    const reported = S.reports.some(r => r.target_type === 'dm_message' && r.target_id === m.id && r.reporter_id === S.user.id);
    return `<div class="msg-row ${mine ? 'mine' : ''}"><div class="msg">
        <div class="msg-body">${listify(linkify(m.body))}</div>${url ? linkCard(url.replace(/[.,;:!?)]+$/, '')) : ''}
        <div class="msg-foot"><span>${timeAgo(m.created_at)}</span>
          ${mine && m === lastMine && m.read_at ? '<span class="seen">· Visto</span>' : ''}
          ${mine ? `<button class="linkbtn mute" data-action="dm-delete" data-id="${m.id}">Borrar</button>`
            : isTeacherId(m.sender_id) || isTeacher() ? '' // los mensajes del profe no se denuncian; el profe no denuncia (borra o bloquea el acceso)
            : (reported ? '<span>· Denunciado</span>' : `<button class="linkbtn mute" data-action="report" data-type="dm_message" data-id="${m.id}">Denunciar</button>`)}
        </div></div></div>`;
  }).join('');
}
function threadView(id) {
  const can = S.dmCan[id], teacherOther = isTeacherId(id);
  return `<div class="dm-thread-head">
      <button class="iconbtn dm-back" data-action="dm-close" aria-label="Volver">←</button>
      ${whoLink(id, `${avatarHtml(id, 38)}<b>${esc(whoName(id))}</b>${teacherTag(id)}`)}
      ${!isTeacher() && !teacherOther ? `<button class="btn sm ghost" data-action="${isBlocked(id) ? 'unblock' : 'block'}" data-id="${id}" style="margin-left:auto">${isBlocked(id) ? 'Desbloquear' : 'Bloquear'}</button>` : ''}
    </div>
    <div class="dm-thread" id="dmThread">${threadInner(id)}</div>
    ${can === false ? `<div class="dm-cant">${isBlocked(id) ? 'Has bloqueado a esta persona. Desbloquéala para escribirle.' : 'No podéis escribiros en privado. Si crees que es un error, habla con tu profesor.'}</div>`
      : `<form id="dmForm" class="dm-compose" data-to="${id}"><textarea name="body" rows="1" maxlength="2000" placeholder="Escribe un mensaje…" required></textarea><button class="btn primary" type="submit">Enviar</button></form>`}`;
}
function updateThread() { // repinta solo los mensajes (no toca lo que estás escribiendo)
  const t = $('#dmThread'); if (!t || !S.dmWith) return;
  const atBottom = t.scrollHeight - t.scrollTop - t.clientHeight < 80;
  t.innerHTML = threadInner(S.dmWith);
  if (atBottom) t.scrollTop = t.scrollHeight;
}
const scrollThread = () => { const t = $('#dmThread'); if (t) t.scrollTop = t.scrollHeight; };
async function markDmRead(id) {
  const ids = S.dms.filter(m => m.sender_id === id && m.recipient_id === S.user.id && !m.read_at).map(m => m.id);
  if (!ids.length) return;
  const now = new Date().toISOString();
  S.dms.forEach(m => { if (ids.includes(m.id)) m.read_at = now; });
  await sb.from('dm_messages').update({ read_at: now }).eq('recipient_id', S.user.id).eq('sender_id', id).is('read_at', null);
}
async function openDm(id) {
  S.dmWith = id; S.section = 'messages';
  if (S.dmCan[id] === undefined) {
    const { data } = await sb.rpc('can_dm', { a: S.user.id, b: id });
    S.dmCan[id] = !!data;
  }
  await closeModal();
  render(); scrollThread();
  await markDmRead(id);
  await markNotifsRead(S.notifs.filter(n => n.kind === 'dm' && n.actor_id === id && !n.read_at).map(n => n.id)); // sus avisos de mensaje
  refreshChrome(); updateDmList();
  const ta = $('#dmForm textarea'); if (ta && matchMedia('(min-width:761px)').matches) ta.focus();
}
async function refreshDmContacts() {
  const { data } = await sb.rpc('get_dm_contacts');
  S.dmContacts = (data || []).map(x => typeof x === 'string' ? x : x.get_dm_contacts || x.id);
  S.dmCan = {}; S.dmContacts.forEach(id => { S.dmCan[id] = true; });
}
async function newDmModal() {
  await refreshDmContacts();
  // El alumno solo ve aquí al profesor y a sus compañeros: no es un buscador de gente.
  // A cualquier otro se le escribe desde su perfil (pulsando su nombre en lo que publica).
  const mates = new Set(myMates());
  const people = S.dmContacts.filter(id => S.dir[id] && (isTeacher() || isTeacherId(id) || mates.has(id)))
    .sort((a, b) => whoName(a).localeCompare(whoName(b)));
  openModal(`<div class="modal-head"><h2>Nuevo mensaje</h2><button class="x" data-action="close" aria-label="Cerrar">×</button></div>
    ${people.length ? `<div class="list">${people.map(id => `<div class="row click" data-action="dm-open" data-id="${id}"><div class="rowav">${avatarHtml(id, 36)}<strong>${esc(whoName(id))}</strong>${teacherTag(id)}</div></div>`).join('')}</div>`
      : '<div class="empty small">Ahora mismo no puedes escribir en privado a nadie más.</div>'}
    ${isTeacher() ? '' : '<p class="sub" style="margin:14px 0 0">Aquí salen tu profesor y tus compañeros. Para escribir a otra persona, pulsa su nombre o su foto en algo que haya publicado o comentado.</p>'}
    ${!isTeacher() && !S.profile.family_dm_ok && isMinorProfile(S.profile) ? '<p class="sub" style="margin:14px 0 0">Como eres menor, solo puedes escribir a tu profesor. Si tu familia lo autoriza, él puede activarte los mensajes con compañeros.</p>' : ''}`);
  $('.modal').classList.add('narrow');
}

const RX_EMOJI = Object.fromEntries(REACTIONS.map(r => [r.k, r.e]));

/* ======================= Acciones (click delegado) ================== */
const actions = {
  noop() { },
  backdrop(el, e) { if (e.target === el) closeModal(); },
  close() { closeModal(); },
  async logout() { await sb.auth.signOut(); },
  async recheck() { await route(); },
  'show-new'() { // muestra las publicaciones que han llegado en directo
    S.feedQueue.forEach(p => { if (!S.fposts.some(x => x.id === p.id)) S.fposts.unshift(p); });
    S.feedQueue = []; render();
    const f = $('.feed'); if (f) f.scrollIntoView({ behavior: 'smooth', block: 'start' });
  },
  'auth-mode'(el) { viewAuth(el.dataset.mode); },
  async forgot() {
    const email = prompt('Escribe el email de tu cuenta y te enviaremos un enlace para crear una nueva contraseña:');

}

document.addEventListener('submit', async e => {
  const f = e.target;
  if (f.id === 'authForm') {
    e.preventDefault();
    const mode = f.dataset.mode, btn = $('#authBtn');
    const email = f.email.value.trim(), password = f.password.value;
    btn.disabled = true;
    if (mode === 'login') {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) viewAuth('login', { type: 'bad', text: error.message === 'Invalid login credentials' ? 'Email o contraseña incorrectos.' : error.message });
      // si todo va bien, onAuthStateChange(SIGNED_IN) hace el resto
    } else {
      const name = f.name.value.trim();
      // emailRedirectTo: sin él, Supabase vuelve al dominio sin la ruta /yurimh-music-academy/ (404 de GitHub)
      const birth = f.birth.value; // AAAA-MM-DD; la base de datos la valida al crear el perfil
      const { data, error } = await sb.auth.signUp({ email, password, options: { data: { display_name: name, birth_date: birth }, emailRedirectTo: location.href.split('#')[0] } });
      if (error) viewAuth('register', { type: 'bad', text: error.message });
      else if (!data.session) viewAuth('login', { type: 'ok', text: 'Cuenta creada. Revisa tu email para confirmarla y después entra.' });
    }
  } else if (f.id === 'recForm') {
    e.preventDefault();
    const { error } = await sb.auth.updateUser({ password: f.password.value });
    if (error) { $('#recMsg').innerHTML = `<div class="msg bad">${esc(error.message)}</div>`; return; }
    recovering = false;
    history.replaceState(null, '', location.pathname + location.search);
    await route();
    toast('Contraseña actualizada', 'ok');
  } else if (f.id === 'postForm') {
    e.preventDefault();
    const el = f.elements;
    const audience = el['audience'].value;
    const ids = $$('input[name=pick]:checked', f).map(x => x.value);
    if (audience === 'selected' && !ids.length) return toast('Elige al menos un alumno', 'bad');
    const row = { title: el['title'].value.trim(), body: mentionEncode(el['body']), audience, pinned: el['pinned'].checked };
    if (!row.title || !row.body) return toast('Escribe un título y un mensaje', 'bad');
    if (row.body.length > 5000) return toast('El mensaje es demasiado largo', 'bad');
    const btn = $('button[type=submit]', f); btn.disabled = true;
    let id = f.dataset.id, error;
    if (id) ({ error } = await sb.from('board_posts').update(row).eq('id', id));
    else {
      const r = await sb.from('board_posts').insert({ ...row, author_id: S.user.id }).select().single();
      error = r.error; if (!error) id = r.data.id;
    }
    if (!error) ({ error } = await sb.from('board_recipients').delete().eq('post_id', id));
    if (!error && audience === 'selected') ({ error } = await sb.from('board_recipients').insert(ids.map(sid => ({ post_id: id, student_id: sid }))));
    btn.disabled = false;
    if (error) return toast('Error: ' + error.message, 'bad');
    const wasEdit = !!f.dataset.id;
    await loadData(); await closeModal(); render();
    toast(wasEdit ? 'Aviso actualizado' : 'Aviso publicado', 'ok');
  } else if (f.id === 'feedForm') {
    e.preventDefault();
    const body = mentionEncode(f.elements['body']);
    if (!body) return toast('Escribe algo para publicar', 'bad');
    if (body.length > 2000) return toast('El texto es demasiado largo', 'bad');
    const link = firstLink(body); // el primer enlace del texto se muestra como tarjeta (Spotify, YouTube…)
    const btn = $('button[type=submit]', f); btn.disabled = true;
    const { data, error } = await sb.from('feed_posts').insert({ author_id: S.user.id, body, link_url: link || null }).select().single();
    btn.disabled = false;
    if (error) return toast('No se pudo publicar: ' + error.message, 'bad');
    if (!S.fposts.some(x => x.id === data.id)) S.fposts.unshift(data);
    render(); toast('Publicado', 'ok');
  } else if (f.id === 'feedEditForm') {
    e.preventDefault();
    const p = S.fposts.find(x => x.id === f.dataset.id);
    if (!p) return closeModal();
    const body = mentionEncode(f.elements['body']);
    if (!body) return toast('Escribe algo o elimina la publicación', 'bad');
    if (body.length > 2000) return toast('El texto es demasiado largo', 'bad');
    if (body === p.body) return closeModal(); // sin cambios: no sale "editado"
    const btn = $('button[type=submit]', f); btn.disabled = true;
    const { data, error } = await sb.from('feed_posts').update({ body, link_url: firstLink(body) || null }).eq('id', p.id).select();
    btn.disabled = false;
    if (error || !data || !data.length) return toast('No se pudo guardar' + (error ? ': ' + error.message : ''), 'bad');
    Object.assign(p, data[0]);
    await closeModal(); render(); toast('Publicación actualizada', 'ok');
  } else if (f.id === 'aboutForm') {
    e.preventDefault();
    const v = k => f.elements[k].value.trim() || null;
    await saveProfileFields({ bio: v('bio'), instrument: v('instrument'), level: v('level'), favorites: v('favorites'), gear: v('gear') }, 'Perfil guardado');
  } else if (f.id === 'dmForm') {
    e.preventDefault();
    const ta = f.elements['body'], body = ta.value.trim(), to = f.dataset.to;
    if (!body) return;
    const btn = f.querySelector('button'); btn.disabled = true;
    const { data, error } = await sb.from('dm_messages').insert({ sender_id: S.user.id, recipient_id: to, body }).select().single();
    btn.disabled = false;
    if (error) { if (/row-level security/i.test(error.message)) { S.dmCan[to] = false; render(); return toast('Ya no podéis escribiros en privado', 'bad'); } return toast('No se pudo enviar: ' + error.message, 'bad'); }
    addUnique(S.dms, data, 'dm_messages');
    ta.value = ''; ta.style.height = '';
    updateThread(); scrollThread(); updateDmList(); ta.focus();
  } else if (f.id === 'nameForm') {
    e.preventDefault();
    const name = f.elements['display_name'].value.trim();
    const nick = f.elements['nickname'].value.trim();

    await saveProfileFields({ display_name: name, nickname: nick || null }, 'Datos actualizados');
  } else if (f.id === 'passForm') {
    e.preventDefault();
    const p1 = f.elements['password'].value, p2 = f.elements['password2'].value;
    if (p1.length < 8) return toast('Mínimo 8 caracteres', 'bad');
    if (p1 !== p2) return toast('Las contraseñas no coinciden', 'bad');

  } else if (f.id === 'itemForm') {
    e.preventDefault();

    try { new URL(url); } catch { return toast('Ese enlace no parece válido', 'bad'); }
    const id = f.dataset.id;
    const prev = id ? S.items.find(x => x.id === id) : null;
    const btn = $('button[type=submit]', f); btn.disabled = true; btn.textContent = 'Guardando…';
    const meta = (!prev || prev.url !== url || !prev.thumb_url || !f.title.value.trim()) ? await fetchMeta(url) : { title: null, thumb: prev.thumb_url };
    btn.disabled = false; btn.textContent = 'Guardar';
    const title = f.title.value.trim() || meta.title; // vacío → el título de Spotify/YouTube
    if (!title) return toast('No he podido sacar el título de ese enlace. Escríbelo tú', 'bad');
    const row = { title, url, kind: f.kind.value, brief: f.brief.value.trim() || null };
    if (!prev || prev.url !== url || !prev.thumb_url) row.thumb_url = meta.thumb; // portada de Spotify/YouTube
    // Duración: lo escrito a mano manda; si está vacío, se saca de Spotify/YouTube
    const dur = parseDur(f.duration.value), tracks = f.tracks.value.trim() ? Math.round(Number(f.tracks.value)) : null;
    if (Number.isNaN(dur) || dur > 1000000) return toast('No entiendo esa duración. Escríbela como 3:33, 42 min o 1 h 12 min', 'bad');
    if (tracks !== null && !(tracks >= 1 && tracks <= 100000)) return toast('El número de temas no es válido', 'bad');
    const manual = prev && dur === prev.duration_sec && tracks === prev.track_count ? null : { dur, tracks };
    if (manual && (dur || tracks)) Object.assign(row, { duration_sec: dur, track_count: tracks, duration_partial: false });
    else if (!manual && prev && prev.url === url && prev.duration_sec) { /* sin cambios */ }
    else {
      btn.disabled = true; btn.textContent = 'Buscando duración…';
      const d = await fetchDuration(url);
      btn.disabled = false; btn.textContent = 'Guardar';
      Object.assign(row, { duration_sec: d.duration_sec, track_count: d.track_count, duration_partial: d.partial });
    }
    const { error } = id ? await sb.from('listening_items').update(row).eq('id', id) : await sb.from('listening_items').insert(row);
    if (error) return toast('Error: ' + error.message, 'bad');
    await loadData();
    await closeModal();
    render();
    toast(id ? 'Elemento actualizado' : 'Elemento creado', 'ok');
  }
});

/* ================================ AGENDA ============================== *
   Las clases se apuntan solo en Google Calendar. La Edge Function calendar-sync las copia en `lessons`
   cada 15 minutos (y con "Sincronizar ahora"). El alumno ve su próxima clase y recibe un aviso 8 h antes. */
const WEEKDAYS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
const hhmm = iso => { const d = new Date(iso); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const dayLabel = iso => { const d = new Date(iso); return `${WEEKDAYS[d.getDay()]} ${d.getDate()} de ${MONTHS[d.getMonth()]}`; };
function relDay(iso) { // hoy / mañana / jueves 27 de noviembre
  const d = new Date(iso), t = new Date(), a = new Date(d.getFullYear(), d.getMonth(), d.getDate()), b = new Date(t.getFullYear(), t.getMonth(), t.getDate());
  const n = Math.round((a - b) / 86400000);
  return n === 0 ? 'hoy' : n === 1 ? 'mañana' : dayLabel(iso);
}
const calSynced = () => !!(S.lessonSync && S.lessonSync.last_ok_at);
const nextLesson = id => S.lessons.filter(l => l.student_id === id && new Date(l.ends_at || l.starts_at) > new Date()).sort((a, b) => a.starts_at.localeCompare(b.starts_at))[0] || null;
// ¿Ha tenido ya alguna clase este mes? (para Pagos: se cobra tras la primera clase del mes)
const hadClassThisMonth = id => { const now = new Date(); return S.lessons.some(l => { const d = new Date(l.starts_at); return l.student_id === id && d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth() && d <= now; }); }; // en hora local, no UTC
function nextLessonHtml() { // alumno
  const l = nextLesson(S.user.id); if (!l) return '';
  return `<div class="fy-row lesson-row"><span class="ic">${ic('calendar')}</span><div class="t"><b>Tu próxima clase: ${esc(relDay(l.starts_at))}</b><span class="sub">a las ${hhmm(l.starts_at)}${l.ends_at ? ' – ' + hhmm(l.ends_at) : ''}</span></div></div>`;
}
const weekStart = (d = new Date()) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
function agendaView() {
  const ws = S.agendaWeek ? new Date(S.agendaWeek) : weekStart(); const we = new Date(ws); we.setDate(ws.getDate() + 7);
  const thisWeek = ws.getTime() === weekStart().getTime();
  const st = S.lessonSync;
  const list = S.lessons.filter(l => { const d = new Date(l.starts_at); return d >= ws && d < we; }).sort((a, b) => a.starts_at.localeCompare(b.starts_at));
  const days = []; for (let i = 0; i < 7; i++) { const d = new Date(ws); d.setDate(ws.getDate() + i); days.push(d); }
  const head = `<div class="sec-head"><div class="sub">${!st || !st.last_run_at ? 'Aún no se ha sincronizado con Google Calendar.'
      : st.last_error ? `<span style="color:var(--bad)">⚠ ${esc(st.last_error)}</span>`
      : `Sincronizado con Google Calendar ${timeAgo(st.last_ok_at)} · se actualiza solo cada 15 min`}</div>
      <button class="btn sm" data-action="cal-sync">${ic('calendar')} Sincronizar ahora</button></div>`;
  if (!calSynced()) return head + `<div class="panel"><h2 class="h2" style="margin-top:0">Conecta tu calendario de clases</h2>
    <ol class="isteps">
      <li>En el ordenador, abre <b>Google Calendar</b> → ⚙ <b>Configuración</b> → en la izquierda, tu calendario de clases.</li>
      <li>Baja hasta <b>"Dirección secreta en formato iCal"</b> y cópiala. Es privada: no la compartas con nadie.</li>
      <li>En <b>Supabase</b> → <b>Edge Functions</b> → <b>Secrets</b> → <b>Add new secret</b>: nombre <code>CALENDAR_ICS_URL</code>, valor la dirección copiada → <b>Save</b>.</li>
      <li>Vuelve aquí y pulsa <b>Sincronizar ahora</b>.</li></ol>
    <p class="sub" style="margin:12px 0 0">Cada evento debe llevar el nombre del alumno (por ejemplo "Clase Luis"). Si en el calendario lo llamas distinto, ponlo en su ficha: "Nombre en Google Calendar".</p></div>`;
  const unk = list.filter(l => !l.student_id).length;
  return head + `<div class="monthnav"><button class="iconbtn" data-action="agenda-week" data-n="-1" aria-label="Semana anterior">‹</button>
      <h2>${ws.getDate()} ${MONTHS[ws.getMonth()].slice(0, 3)} – ${new Date(we - 86400000).getDate()} ${MONTHS[new Date(we - 86400000).getMonth()].slice(0, 3)}</h2>
      <button class="iconbtn" data-action="agenda-week" data-n="1" aria-label="Semana siguiente">›</button>
      ${thisWeek ? '' : '<button class="btn sm ghost" data-action="agenda-week" data-n="0">Esta semana</button>'}</div>
    ${unk ? `<div class="callout">Hay ${unk} clase${unk > 1 ? 's' : ''} que no sé de qué alumno ${unk > 1 ? 'son' : 'es'}. El título del evento debe llevar su nombre, o pon en su ficha cómo lo llamas en el calendario.</div>` : ''}
    ${agendaGrid(days, list)}
    ${list.length ? '' : '<p class="sub" style="margin-top:10px">No hay clases esta semana.</p>'}`;

// Semana en rejilla, como Google Calendar: días en columnas, horas en filas, cada clase un bloque de su duración
const WD3 = ['DOM', 'LUN', 'MAR', 'MIÉ', 'JUE', 'VIE', 'SÁB'];
function agendaGrid(days, list) {
  const H = 48; // píxeles por hora
  let h0 = 9, h1 = 23;
  list.forEach(l => { const s = new Date(l.starts_at), e = new Date(l.ends_at || s.getTime() + 3600000); h0 = Math.min(h0, s.getHours()); h1 = Math.max(h1, e.getHours() + (e.getMinutes() ? 1 : 0) + (e.toDateString() !== s.toDateString() ? 24 : 0)); });
  h1 = Math.min(h1, 24);
  const hours = []; for (let h = h0; h < h1; h++) hours.push(h);
  const now = new Date(), today = now.toDateString(), per = monthStart();
  const block = (l, col, cols) => {
    const s = new Date(l.starts_at), e = new Date(l.ends_at || s.getTime() + 3600000);
    const top = ((s.getHours() - h0) * 60 + s.getMinutes()) / 60 * H;
    const height = Math.max(24, (Math.min(e, new Date(s.getFullYear(), s.getMonth(), s.getDate(), h1)) - s) / 3600000 * H - 3);
    const st = l.student_id && S.students.find(x => x.id === l.student_id);
    const pend = st ? S.homework.filter(h => h.student_id === st.id && !h.done_at).length : 0;
    const pl = st ? planOf(st.id) : null, paid = st && S.payRecords.some(r => r.student_id === st.id && r.period === per && r.kind === 'monthly');
    const extra = st ? [pend ? `📝 ${pend}` : '', pl && pl.mode === 'monthly' ? (paid ? 'Pagado' : 'Mes sin cobrar') : ''].filter(Boolean).join(' · ') : 'Sin alumno en la app';
    const w = 100 / cols;
    return `<div class="cev ${st ? '' : 'unk'} ${e < now ? 'past' : ''}" style="top:${top}px;height:${height}px;left:calc(${col * w}% + 2px);width:calc(${w}% - 4px)"
      ${st ? `data-action="open-student" data-id="${st.id}"` : ''} title="${esc(l.title)} · ${hhmm(l.starts_at)}–${hhmm(e.toISOString())}">
      <b>${esc(st ? st.display_name : l.title)}</b><span>${hhmm(l.starts_at)} – ${hhmm(e.toISOString())}</span>${extra ? `<em>${esc(extra)}</em>` : ''}</div>`;
  };
  const dayCol = d => {
    const ls = list.filter(l => new Date(l.starts_at).toDateString() === d.toDateString()).sort((a, b) => a.starts_at.localeCompare(b.starts_at));
    // Clases que se solapan: se reparten el ancho
    const placed = []; let group = [], groupEnd = 0;
    const flush = () => { const cols = Math.max(...group.map(g => g.col)) + 1; group.forEach(g => placed.push(block(g.l, g.col, cols))); group = []; };
    ls.forEach(l => {
      const s = +new Date(l.starts_at), e = +new Date(l.ends_at || s + 3600000);
      if (group.length && s >= groupEnd) flush();
      const used = group.filter(g => g.end > s).map(g => g.col); let col = 0; while (used.includes(col)) col++;
      group.push({ l, col, end: e }); groupEnd = Math.max(groupEnd, e);
    });
    if (group.length) flush();
    const isToday = d.toDateString() === today;
    const nowTop = ((now.getHours() - h0) * 60 + now.getMinutes()) / 60 * H;
    return `<div class="cal-col ${isToday ? 'today' : ''}">${placed.join('')}${isToday && now.getHours() >= h0 && now.getHours() < h1 ? `<i class="cal-now" style="top:${nowTop}px"></i>` : ''}</div>`;
  };
  setTimeout(() => { const cal = $('.cal'), t = $('.cal .cal-dh.today'); if (cal && t && cal.scrollWidth > cal.clientWidth) cal.scrollLeft = t.offsetLeft - 56; }, 0);
  return `<div class="cal" style="--hh:${H}px"><div class="cal-in">
    <div class="cal-head"><div class="cal-tz">${esc(Intl.DateTimeFormat().resolvedOptions().timeZone === 'Europe/Madrid' ? 'Madrid' : '')}</div>
      ${days.map(d => `<div class="cal-dh ${d.toDateString() === today ? 'today' : ''}"><span>${WD3[d.getDay()]}</span><b>${d.getDate()}</b></div>`).join('')}</div>
    <div class="cal-body" style="height:${hours.length * H}px">
      <div class="cal-hours">${hours.map(h => `<div class="cal-hr" style="height:${H}px"><span>${pad(h)}:00</span></div>`).join('')}</div>
      ${days.map(dayCol).join('')}
    </div></div></div>`;
}
async function loadLessons() {
  const from = new Date(); from.setDate(1); from.setDate(from.getDate() - 7);
  const to = new Date(); to.setDate(to.getDate() + 60);
  if (isTeacher()) {
    const [l, ls, sy] = await Promise.all([
      sb.from('lessons').select('*').gte('starts_at', from.toISOString()).lte('starts_at', to.toISOString()).order('starts_at').limit(2000),
      sb.from('lessons_students').select('*'),
      sb.from('lessons_sync').select('*').eq('id', 1).maybeSingle()
    ]);
    const err = [l, ls, sy].map(x => x.error).find(Boolean); if (err) throw err;
    S.lessons = l.data || []; S.lessonNames = ls.data || []; S.lessonSync = sy.data || null;
  } else {
    const { data, error } = await sb.from('lessons').select('*').eq('student_id', S.user.id).gte('starts_at', new Date(Date.now() - 3 * 3600000).toISOString()).order('starts_at').limit(10);
    if (error) throw error;
    S.lessons = data || [];
  }
}

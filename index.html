function currentExport() {
  const a = S.assigns.find(x => x.id === cur.id);
  const answers = {};
  QUESTIONS.forEach(q => { const t = $(`[data-q="${q.k}"]`); answers[q.k] = t ? t.value : ''; });
  return { name: S.profile.display_name, title: a.item.title, kind: a.item.kind, url: a.item.url, answers };
}
function buildText(d, wa) {
  const b = s => wa ? `*${s}*` : s;
  let t = `${b(d.title)} (${KIND[d.kind] || d.kind})\nAlumno: ${d.name}\n${d.url}\n`;
  QUESTIONS.forEach((q, i) => { t += `\n${b(`${i + 1}. ${q.q}`)}\n${(d.answers[q.k] || '').trim() || '—'}\n`; });
  return t.trim();
}
function download(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; }
  catch {
    const ta = document.createElement('textarea');
    ta.value = t; ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch { }
    ta.remove();
    return ok;
  }
}
function buildCanvas(d) {
  const W = 1080, P = 56, maxW = W - 2 * P;
  const F = 'system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
  const c = document.createElement('canvas');
  const ctx = c.getContext('2d');
  const blocks = [
    { t: (KIND[d.kind] || d.kind).toUpperCase(), f: `600 20px ${F}`, col: '#a78bfa', lh: 28, gap: 0 },
    { t: d.title, f: `700 40px ${F}`, col: '#eceff6', lh: 50, gap: 6 },
    { t: `Alumno: ${d.name}`, f: `400 22px ${F}`, col: '#8990a3', lh: 30, gap: 10 },
    { t: d.url, f: `400 19px ${F}`, col: '#8990a3', lh: 26, gap: 2 }
  ];
  QUESTIONS.forEach((q, i) => {
    blocks.push({ t: `${i + 1}. ${q.q}`, f: `600 24px ${F}`, col: '#62d8ee', lh: 32, gap: 32 });
    blocks.push({ t: (d.answers[q.k] || '').trim() || '—', f: `400 24px ${F}`, col: '#d5d9e2', lh: 34, gap: 8 });
  });
  const wrap = (text, font) => {
    ctx.font = font;
    const out = [];
    text.split('\n').forEach(par => {
      if (!par.trim()) { out.push(''); return; }
      let line = '';
      par.split(/\s+/).forEach(w => {
        while (ctx.measureText(w).width > maxW) { // palabra más ancha que la línea (p. ej. una URL)
          let i = w.length;
          while (i > 1 && ctx.measureText(w.slice(0, i)).width > maxW) i--;
          if (line) { out.push(line); line = ''; }
          out.push(w.slice(0, i)); w = w.slice(i);
        }
        const test = line ? line + ' ' + w : w;
        if (ctx.measureText(test).width > maxW && line) { out.push(line); line = w; } else line = test;
      });
      out.push(line);
    });
    return out;
  };
  let y = P + 6;
  blocks.forEach(b => { b.lines = wrap(b.t, b.f); y += b.gap + b.lines.length * b.lh; });
  const H = y + P + 30;
  c.width = W; c.height = H;
  ctx.fillStyle = '#0b0d12'; ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.shadowColor = 'rgba(98,216,238,.55)'; ctx.shadowBlur = 14;
  ctx.fillStyle = '#62d8ee'; ctx.fillRect(P, 28, 90, 3);
  ctx.restore();
  ctx.textBaseline = 'top';
  y = P + 6;
  blocks.forEach(b => {
    y += b.gap; ctx.font = b.f; ctx.fillStyle = b.col;
    b.lines.forEach(l => { ctx.fillText(l, P, y); y += b.lh; });
  });
  ctx.font = `400 16px ${F}`; ctx.fillStyle = '#4b5366';
  ctx.fillText(APP_NAME, P, H - P + 6);
  return c;
}
const canvasBlob = c => new Promise(res => c.toBlob(res, 'image/png'));
function canShareFiles() {
  try { return !!(navigator.canShare && navigator.canShare({ files: [new File([''], 'a.png', { type: 'image/png' })] })); }
  catch { return false; }
}

const exportActions = {
  async 'exp-copy'() {
    const ok = await copyText(buildText(currentExport(), true));
    toast(ok ? 'Texto copiado. Pégalo en WhatsApp' : 'No se pudo copiar', ok ? 'ok' : 'bad');
  },
  async 'exp-share'() {
    const d = currentExport();
    try { await navigator.share({ title: d.title, text: buildText(d, true) }); }
    catch (e) { if (e && e.name !== 'AbortError') toast('No se pudo compartir', 'bad'); }
  },
  'exp-txt'() {
    const d = currentExport();
    download(new Blob([buildText(d, false)], { type: 'text/plain;charset=utf-8' }), `${slug(d.title)}_${slug(d.name)}.txt`);
  },
  async 'exp-png'() {
    const d = currentExport();
    download(await canvasBlob(buildCanvas(d)), `${slug(d.title)}_${slug(d.name)}.png`);
  },
  async 'exp-sharepng'() {
    const d = currentExport();
    const blob = await canvasBlob(buildCanvas(d));
    const file = new File([blob], `${slug(d.title)}_${slug(d.name)}.png`, { type: 'image/png' });
    try { await navigator.share({ files: [file], title: d.title }); }
    catch (e) { if (e && e.name !== 'AbortError') toast('No se pudo compartir la imagen', 'bad'); }
  }
};

/* ============================= PROFESOR ============================= */
/* ---- Biblioteca de Escucha analítica: carpetas (colecciones), géneros y artista ----
   S.folders: listening_folders (una carpeta por escucha, o ninguna). S.genres: listening_genres en dos niveles
   (género → subgénero, lista cerrada que solo cambia el profesor). S.itemGenres: listening_item_genres (varios por escucha).
   Filtrar por un género incluye sus subgéneros. Los alumnos ven las carpetas y géneros de sus escuchas. */
const NO_FOLDER = '__none'; // "Sin carpeta" en los filtros
const folderSort = (a, b) => (a.position - b.position) || a.name.localeCompare(b.name, 'es');
const genreSort = (a, b) => (a.position - b.position) || a.name.localeCompare(b.name, 'es');
const foldersSorted = () => S.folders.slice().sort(folderSort);
const folderName = id => (S.folders.find(f => f.id === id) || {}).name || '';
function genreTree() { // [{ g, subs: [...] }] en orden
  return S.genres.filter(g => !g.parent_id).sort(genreSort)
    .map(g => ({ g, subs: S.genres.filter(x => x.parent_id === g.id).sort(genreSort) }));
}
function genresOf(itemId) { // en el orden de la lista: géneros antes que sus subgéneros
  const mine = new Set(S.itemGenres.filter(x => x.item_id === itemId).map(x => x.genre_id));
  const out = [];
  genreTree().forEach(({ g, subs }) => { if (mine.has(g.id)) out.push(g); subs.forEach(s => { if (mine.has(s.id)) out.push(s); }); });
  return out;
}
function itemHasGenre(itemId, gid) {
  const ids = new Set([gid, ...S.genres.filter(g => g.parent_id === gid).map(g => g.id)]);
  return S.itemGenres.some(x => x.item_id === itemId && ids.has(x.genre_id));
}
// Lo que se busca: título, artista, carpeta y géneros (sin tildes)
const itemHay = it => amNorm([it.title, it.artist, folderName(it.folder_id), ...genresOf(it.id).map(g => g.name)].join(' · '));
const genreChips = itemId => genresOf(itemId).map(g => `<span class="gchip">${esc(g.name)}</span>`).join('');
const artistHtml = it => it.artist ? `<span class="tart">${esc(it.artist)}</span>` : '';
// Opciones del desplegable de géneros (subgéneros sangrados)
const genreOptions = sel => genreTree().map(({ g, subs }) => `<option value="${g.id}" ${sel === g.id ? 'selected' : ''}>${esc(g.name)}</option>`
  + subs.map(s => `<option value="${s.id}" ${sel === s.id ? 'selected' : ''}>   ${esc(s.name)}</option>`).join('')).join('');
const folderOptions = (sel, none = 'Sin carpeta') => foldersSorted().map(f => `<option value="${f.id}" ${sel === f.id ? 'selected' : ''}>${esc(f.name)}</option>`).join('')
  + (none ? `<option value="${NO_FOLDER}" ${sel === NO_FOLDER ? 'selected' : ''}>${esc(none)}</option>` : '');

/* Catálogo del profesor: buscador + filtros (carpeta, género, tipo, alumno y su estado), agrupado por carpetas.
   S.cat guarda los filtros; al escribir o cambiar un filtro solo se repinta la lista (#catList), no el buscador. */
const CAT_STATUS_STUDENT = { '': 'Todas las suyas', pend: 'Pendientes', done: 'Escuchadas', over: 'Vencidas', none: 'Aún no la tiene' };
const CAT_STATUS_ALL = { '': 'Cualquier estado', unassigned: 'Sin asignar a nadie' };
function catState() { return S.cat || (S.cat = { q: '', folder: '', genre: '', kind: '', student: '', status: '' }); }
const catAssign = (itemId, sid) => S.assigns.find(a => a.item_id === itemId && a.student_id === sid);
function catFiltered() {
  const c = catState(), q = amNorm(c.q.trim());
  return S.items.filter(it => {
    if (q && !itemHay(it).includes(q)) return false;
    if (c.folder && (c.folder === NO_FOLDER ? !!folderName(it.folder_id) : it.folder_id !== c.folder)) return false;
    if (c.genre && !itemHasGenre(it.id, c.genre)) return false;
    if (c.kind && it.kind !== c.kind) return false;
    if (c.student) {
      const a = catAssign(it.id, c.student);
      if (c.status === 'none') return !a;
      if (!a) return false;
      if (c.status === 'pend') return !a.listened;
      if (c.status === 'done') return a.listened;
      if (c.status === 'over') return isOverdue(a);
      return true;
    }
    if (c.status === 'unassigned') return !S.assigns.some(a => a.item_id === it.id);
    return true;
  });
}
const catActive = () => { const c = catState(); return !!(c.q.trim() || c.folder || c.genre || c.kind || c.student || c.status); };
function catFiltersHtml() {
  const c = catState(), studs = S.students.filter(s => s.approved);
  const statuses = c.student ? CAT_STATUS_STUDENT : CAT_STATUS_ALL;
  const sel = (k, v, cur) => `<option value="${k}" ${cur === k ? 'selected' : ''}>${esc(v)}</option>`;
  return `<div class="catbar" id="catFilters">
    <input type="search" id="catQ" data-no-emoji autocomplete="off" placeholder="Buscar por título, artista, género o carpeta…" aria-label="Buscar en el catálogo" value="${esc(c.q)}">
    <select data-cat="folder" aria-label="Carpeta"><option value="">Todas las carpetas</option>${folderOptions(c.folder)}</select>
    <select data-cat="genre" aria-label="Género"><option value="">Todos los géneros</option>${genreOptions(c.genre)}</select>
    <select data-cat="kind" aria-label="Tipo"><option value="">Todos los tipos</option>${Object.entries(KIND).map(([k, v]) => sel(k, v, c.kind)).join('')}</select>
    <select data-cat="student" aria-label="Alumno"><option value="">Todos los alumnos</option>${studs.map(s => sel(s.id, s.display_name, c.student)).join('')}</select>
    <select data-cat="status" aria-label="Estado">${Object.entries(statuses).map(([k, v]) => sel(k, v, c.status)).join('')}</select>
    ${catActive() ? `<button type="button" class="linkbtn" data-action="cat-clear">Quitar filtros</button>` : ''}
  </div>`;
}
function catRow(it, i) {
  const sid = catState().student;
  const as = S.assigns.filter(a => a.item_id === it.id);
  let ans, due;
  if (sid) { // estado de ESE alumno
    const a = catAssign(it.id, sid), d = a && dueInfo(a);
    ans = a ? `<span class="chip ${a.listened ? 'ok' : isOverdue(a) ? 'bad' : ''}">${a.listened ? '✔ Escuchada' : isOverdue(a) ? 'Vencida' : '○ Pendiente'}</span>`
      : `<button type="button" class="btn sm" data-action="cat-assign" data-id="${it.id}" title="Asignársela a ${esc(studentName(sid))}">+ Asignar</button>`;
    due = a ? (a.due_date ? `<span class="${d.cls}">${esc(fmtDate(a.due_date))}</span>` : `${answeredCount(a)}/6 respuestas`) : '<span class="sub">No la tiene</span>';
  } else {
    const li = as.filter(a => a.listened).length, ov = as.filter(isOverdue).length, n = as.filter(a => answeredCount(a) > 0).length;
    ans = `<span title="${as.length} asignado${as.length === 1 ? '' : 's'} · ${li} escuchado${li === 1 ? '' : 's'} · ${n} con respuestas">${ic('students')} ${as.length} · ${ic('check')} ${li}</span>`;
    due = ov ? `<span class="chip bad">${ov} vencido${ov > 1 ? 's' : ''}</span>` : n ? `<span class="chip acc">${n} con respuestas</span>` : '—';
  }
  return `<article class="track" data-action="open-item" data-id="${it.id}">
    <span class="tnum">${i + 1}</span>
    ${coverHtml(it)}
    <div class="tmain"><b>${esc(it.title)}</b><span class="tsub">${watchTag(it)}${kindIcon(it.kind)}${durHtml(it)}${artistHtml(it)}${genreChips(it.id)}</span>${sid ? `<span class="tstat-m">${ans}</span>` : ''}</div>
    <span class="tans">${ans}</span>
    <span class="tdue">${due}</span>
    ${playBtn(it.url, it)}
  </article>`;
}
function catalogList() {
  if (!S.items.length) return `<div class="empty">El catálogo está vacío. Crea tu primer elemento.</div>`;
  const list = catFiltered().sort(itemSort), c = catState(), act = catActive();
  if (!list.length) return `<div class="empty">No hay escuchas con esos filtros.</div>`;
  const groups = [...foldersSorted().map(f => ({ id: f.id, name: f.name, items: list.filter(it => it.folder_id === f.id) })),
    { id: NO_FOLDER, name: S.folders.length ? 'Sin carpeta' : 'Todas', items: list.filter(it => !folderName(it.folder_id)) }]
    .filter(g => g.items.length);
  const closed = S.catClosed || (S.catClosed = new Set());
  const head = `<div class="track-head"><span>#</span><span></span><span>Título</span><span>${c.student ? esc(studentName(c.student)) : 'Alumnos'}</span><span>${c.student ? 'Fecha' : 'Estado'}</span><span></span></div>`;
  return `<div class="sub catcount">${list.length === S.items.length ? `${list.length} escuchas` : `${list.length} de ${S.items.length} escuchas`}</div>`
    + groups.map(g => `<details class="fold" data-fold="${g.id}" ${act || !closed.has(g.id) ? 'open' : ''}>
      <summary><span class="fold-name">${ic('folder')}${esc(g.name)}</span><span class="n">${g.items.length}</span></summary>
      <div class="tracklist teacher">${head}${g.items.map((it, i) => catRow(it, i)).join('')}</div></details>`).join('');
}
function catRefresh() { // repinta la lista y los filtros (el estado depende de si hay alumno elegido) sin perder el cursor del buscador
  const l = $('#catList'); if (!l) return;
  l.innerHTML = catalogList();
  const f = $('#catFilters'); if (!f) return;
  const q = $('#catQ'), had = document.activeElement === q, pos = q ? q.selectionStart : 0;
  f.outerHTML = catFiltersHtml();
  if (had) { const n = $('#catQ'); n.focus(); try { n.setSelectionRange(pos, pos); } catch { } }
}
function teacherCatalog() {
  return `<div class="toolbar"><span class="sub" style="color:var(--muted)">Pulsa una fila para ver respuestas y asignar alumnos.</span>
      <div class="chips">
      <button class="btn" data-action="folders-edit">${ic('folder')} Carpetas</button>
      <button class="btn" data-action="genres-edit">${ic('tag')} Géneros</button>
      ${S.items.length ? `<button class="btn" data-action="assign-many">${ic('students')} Asignar varias</button>` : ''}
      <button class="btn primary" data-action="new-item">+ Nuevo elemento</button></div></div>
    ${S.items.length ? catFiltersHtml() : ''}
    <div id="catList">${catalogList()}</div>`;
}

// Selector de géneros del formulario de una escucha: casillas agrupadas por género
function genrePicker(itemId) {
  const mine = new Set(itemId ? S.itemGenres.filter(x => x.item_id === itemId).map(x => x.genre_id) : []);
  const box = g => `<label class="chk"><input type="checkbox" name="genre" value="${g.id}" ${mine.has(g.id) ? 'checked' : ''}> ${esc(g.name)}</label>`;
  const tree = genreTree();
  return tree.length ? `<div class="gpick">${tree.map(({ g, subs }) => `<div class="gpick-grp">${box(g).replace('class="chk"', 'class="chk gpick-main"')}${subs.map(box).join('')}</div>`).join('')}</div>`
    : `<div class="sub" style="margin:4px 0 14px">Aún no hay géneros. Créalos con el botón "Géneros" del catálogo.</div>`;
}

/* ---- Alumnos (profesor), v2 (2026-11-28, Yuri: "tarjetas largas que enseñan muy poca info").
   PC: lista a la izquierda + resumen del elegido a la derecha, o tabla (interruptor S.stuView, guardado como el tema).
   Móvil: filas cortas con iconos. Pulsar un alumno abre su ficha completa como PANTALLA (no ventana): S.stuPage,
   con su entrada en el historial (stu en histState), así el Atrás vuelve a la lista. ---- */
const STU_DAYS = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
function stuDay(iso) { // Hoy 18:00 / Mañana 17:00 / Jue 27 19:30 / 4 dic. 18:00
  const d = new Date(iso), t = new Date();
  const n = Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - new Date(t.getFullYear(), t.getMonth(), t.getDate())) / 864e5);
  const w = STU_DAYS[d.getDay()];
  return (n === 0 ? 'Hoy' : n === 1 ? 'Mañana' : n < 7 ? w[0].toUpperCase() + w.slice(1) + ' ' + d.getDate() : `${d.getDate()} ${MONTHS[d.getMonth()].slice(0, 3)}.`) + ' ' + hhmm(iso);
}
const stuMobile = () => matchMedia('(max-width:760px)').matches;
function stuInfo(id) {
  const as = S.assigns.filter(a => a.student_id === id), hw = S.homework.filter(h => h.student_id === id && !h.done_at);
  const pl = planOf(id), pack = !!(pl && pl.mode === 'monthly' && calSynced()), ps = pack ? packState(id) : null;
  const lOver = as.filter(isOverdue).length, hOver = hw.filter(hwOverdue).length;
  return { as, lPend: as.filter(a => !a.listened).length, lOver, hwN: hw.length, hOver, nl: nextLesson(id), pl, pack, ps,
    unread: as.filter(ansUnread).length, st: streakOf(id), rk: rankOf(pointsOf(id)),
    alert: lOver || hOver ? 'bad' : pack && ps && ps.dueNow ? 'warn' : '' };
}
function stuPay(i) {
  const p = i.pl;
  if (!p) return { t: 'Sin trato', c: 'mut' };
  if (p.mode === 'free') return { t: 'Gratis', c: 'mut' };
  if (p.mode === 'per_class') return { t: p.amount != null ? `${money(p.amount)} / clase` : 'Por clase', c: '' };
  if (!i.pack) return { t: 'Bono' + (p.amount != null ? ' · ' + money(p.amount) : ''), c: '' };
  if (!i.ps) return { t: 'Sin pagos apuntados', c: 'warn' };

  }
  const { data, error } = await sb.functions.invoke('delete-account', { body: { user_id: s.id } });

async function blockAdd(kind, pattern) { // inserta y devuelve la fila; si ya estaba, la busca
  const { data, error } = await sb.from('blocked_emails').insert({ kind, pattern }).select();
  if (!error) { S.blocked = [data[0], ...(S.blocked || []).filter(b => b.id !== data[0].id)]; return { row: data[0] }; }

async function ansReact(aid, qk, emoji) {
  const mine = ansRxOf(aid, qk).find(r => r.user_id === S.user.id), prev = S.ansRx.slice();
  emojiRemember(emoji);
  if (mine && mine.emoji === emoji) { // la misma: se quita
    S.ansRx = S.ansRx.filter(r => r !== mine); updateAnsRx(aid, qk);
    const { error } = await sb.from('listening_answer_reactions').delete().eq('assignment_id', aid).eq('question', qk).eq('user_id', S.user.id);
    if (error) { S.ansRx = prev; updateAnsRx(aid, qk); toast(errEs(error), 'bad'); }
    return;
  }
  const row = { assignment_id: aid, question: qk, user_id: S.user.id, emoji, created_at: new Date().toISOString() };
  S.ansRx = [...S.ansRx.filter(r => r !== mine), row]; updateAnsRx(aid, qk);
  const { error } = await sb.from('listening_answer_reactions').upsert({ assignment_id: aid, question: qk, user_id: S.user.id, emoji }, { onConflict: 'assignment_id,question,user_id' });

function itemUrlChanged(input) {
  const f = input.form, url = input.value.trim();
  const k = guessKind(url); if (k) f.kind.value = k;
  f.duration.value = ''; f.tracks.value = ''; // eran del enlace anterior: se vuelven a calcular al guardar
  clearTimeout(itemUrlTimer);
  itemUrlTimer = setTimeout(async () => {
    const full = /^https?:\/\//i.test(url) ? url : 'https://' + url;
    const { title } = url ? await fetchMeta(full) : { title: null };
    if (f.isConnected && input.value.trim() === url) f.title.placeholder = title ? `Se usará: ${title}` : 'Se rellenará solo';
  }, 450);
}

function amCount() {
  const n = $$('#assignManyForm input[name=item]:checked').length, el = $('[data-am-count]');
  if (el) el.textContent = n ? `(${n} marcada${n > 1 ? 's' : ''})` : '';
}
// Qué escuchas se ven: buscador + alumnos marcados. Las marcadas nunca se esconden.
function amRefresh() {
  const box = $('#assignManyForm .am-items'); if (!box) return;
  const q = amNorm(($('#amFilter') || {}).value?.trim() || ''), showAll = $('#amShowAll')?.checked;
  const ids = $$('#assignManyForm input[name=pick]:checked').map(x => x.value);
  const has = new Set(S.assigns.map(a => a.item_id + '|' + a.student_id));
  let shown = 0, owned = 0;
  $$('.chk', box).forEach(l => {
    const id = l.dataset.amId, n = ids.filter(s => has.has(id + '|' + s)).length, all = ids.length > 0 && n === ids.length;
    const tag = l.querySelector('[data-am-has]');
    tag.textContent = !n ? '' : ids.length === 1 ? 'Ya la tiene' : all ? 'Ya la tienen todos' : `La tiene${n > 1 ? 'n' : ''} ${n} de ${ids.length}`;
    if (all) owned++;
    l.hidden = !l.querySelector('input').checked && ((!!q && !l.dataset.amHay.includes(q)) || (all && !showAll));
    if (!l.hidden) shown++;
  });
  // Cabeceras de carpeta: solo si tienen algo visible debajo
  $$('[data-am-fold]', box).forEach(h => {
    let el = h.nextElementSibling, any = false;
    while (el && el.matches('.chk')) { if (!el.hidden) any = true; el = el.nextElementSibling; }
    h.hidden = !any;
  });
  const empty = box.querySelector('[data-am-empty]');
  empty.hidden = shown > 0;
  empty.textContent = q ? 'Ninguna escucha coincide con la búsqueda.' : ids.length === 1 ? 'Ya tiene todas las escuchas del catálogo.' : 'Ya las tienen todas.';
  const sa = $('#amShowAll')?.closest('label'); if (sa) sa.hidden = !owned; // la casilla solo aparece si hay algo escondido por eso
  amCount();
}

}

const INSTRUMENTS = { electric: 'Guitarra eléctrica', acoustic: 'Guitarra acústica', classical: 'Guitarra clásica', bass: 'Bajo', other: 'Otro instrumento' };
const LEVELS = { beginner: 'Iniciación', intermediate: 'Intermedio', advanced: 'Avanzado' };
function ageOf(iso) { // edad en años a partir de 'AAAA-MM-DD'
  if (!iso) return null;
  const [y, m, d] = iso.split('-').map(Number), t = new Date();
  return t.getFullYear() - y - ((t.getMonth() + 1 < m || (t.getMonth() + 1 === m && t.getDate() < d)) ? 1 : 0);
}
const isMinorProfile = p => { const a = ageOf(p.birth_date); return a === null || a < 18; }; // sin fecha = menor
// Nombre y foto pulsables: abren la ficha pública de esa persona

/* ============================ COMPAÑEROS ============================
   S.mates: mis filas de classmates (solicitudes enviadas, recibidas y compañeros).
   Un alumno solo es visible para los demás si ha participado (publicación, comentario o
   reacción), si sois compañeros, si hay una solicitud entre vosotros o si os habéis escrito
   (lo decide get_directory en la base de datos). */
const mateRow = id => S.mates.find(m => (m.requester_id === S.user.id && m.addressee_id === id) || (m.addressee_id === S.user.id && m.requester_id === id));
function mateState(id) {
  const m = mateRow(id);
  if (!m) return 'none';
  if (m.status === 'accepted') return 'mates';
  return m.requester_id === S.user.id ? 'sent' : 'received';
}
const myMates = () => S.mates.filter(m => m.status === 'accepted').map(m => m.requester_id === S.user.id ? m.addressee_id : m.requester_id);
const mateRequestsIn = () => S.mates.filter(m => m.status === 'pending' && m.addressee_id === S.user.id);
const mateRequestsOut = () => S.mates.filter(m => m.status === 'pending' && m.requester_id === S.user.id);
function mateButtons(id) {
  switch (mateState(id)) {
    case 'mates': return `<span class="chip acc">Compañeros</span><button class="btn sm ghost" data-action="mate-remove" data-id="${id}">Quitar</button>`;
    case 'sent': return `<span class="sub">Solicitud enviada</span><button class="btn sm ghost" data-action="mate-cancel" data-id="${id}">Cancelar</button>`;
    case 'received': return `<button class="btn sm primary" data-action="mate-accept" data-id="${id}">Aceptar como compañero</button><button class="btn sm ghost" data-action="mate-reject" data-id="${id}">Rechazar</button>`;
    default: return `<button class="btn sm" data-action="mate-add" data-id="${id}">+ Agregar como compañero</button>`;
  }
}
// Tras cualquier cambio: botones de la ficha abierta, directorio (puede cambiar a quién veo) y repintado
async function mateChanged(id) {
  await markNotifsRead(S.notifs.filter(n => n.kind === 'classmate_request' && n.actor_id === id && !n.read_at).map(n => n.id));
  await loadDirectory();
  const box = $(`[data-mate-box="${id}"]`); if (box) box.innerHTML = mateButtons(id);
  // En Perfil hay textos rellenos (bio…) que softRender toma por "escribiendo": repintamos igual si no hay ventana abierta
  if (!$('#modalRoot').firstChild && S.section === 'profile') { const y = window.scrollY; render(); window.scrollTo(0, y); }
  else softRender();
}
// Rechazar, cancelar o quitar: las tres borran la fila (la otra persona no recibe ningún aviso)
async function mateDelete(id, ask) {
  const m = mateRow(id); if (!m) return;
  if (ask && !confirm(ask)) return;
  const { error } = await sb.from('classmates').delete().eq('id', m.id);
  if (error) return toast('No se pudo hacer: ' + errEs(error), 'bad');
  S.mates = S.mates.filter(x => x.id !== m.id);
  await mateChanged(id);
}
function matesPanel() {

      ${mates.length ? `${inc.length || out.length ? '<div class="mates-h">Tus compañeros</div>' : ''}<div class="blist">${mates.map(id => row(id, '')).join('')}</div>`

      ${out.length ? `<div class="mates-h">Solicitudes enviadas</div><div class="blist">${out.map(m => row(m.addressee_id,
        `<div class="mate-btns"><button class="btn sm ghost" data-action="mate-cancel" data-id="${m.addressee_id}">Cancelar</button></div>`)).join('')}</div>` : ''}

}

/* ========================= MENSAJES PRIVADOS =========================
   S.dms: mensajes en los que participo (y, si soy profesor, los denunciados).
   S.dmWith: con quién tengo abierta la conversación. S.dmCan[id]: si puedo escribirle. */
const dmPartner = m => m.sender_id === S.user.id ? m.recipient_id : m.sender_id;
const myDms = () => S.dms.filter(m => m.sender_id === S.user.id || m.recipient_id === S.user.id);
const unreadDms = () => S.dms.filter(m => m.recipient_id === S.user.id && !m.read_at).length;
function dmConversations() { // [{ id, last, unread }] ordenadas por el último mensaje
  const by = {};
  myDms().forEach(m => {
    const id = dmPartner(m), c = by[id] || (by[id] = { id, last: m, unread: 0 });
    if (m.created_at > c.last.created_at) c.last = m;
    if (m.recipient_id === S.user.id && !m.read_at) c.unread++;
  });
  return Object.values(by).sort((a, b) => b.last.created_at.localeCompare(a.last.created_at));
}
const isBlocked = id => S.blocks.some(b => b.blocked_id === id);

function messagesView() {
  const w = S.dmWith;
  return `<div class="dm ${w ? 'open' : ''}">${dmListHtml()}<div class="dm-pane">${w ? threadView(w) : '<div class="dm-empty">Elige una conversación o empieza una nueva.</div>'}</div></div>`;
}
const updateDmList = () => { const l = $('.dm-list'); if (l) l.outerHTML = dmListHtml(); };
function dmListHtml() {
  const convs = dmConversations(), w = S.dmWith;
  return `<div class="dm-list ${w ? 'has-open' : ''}">
    <div class="dm-list-head"><b>Conversaciones</b><button class="btn sm primary" data-action="dm-new">+ Nuevo</button></div>
    ${convs.length ? convs.map(c => `<div class="dm-conv ${c.id === w ? 'on' : ''}" data-action="dm-open" data-id="${c.id}">
        ${avatarHtml(c.id, 42)}<div class="t"><b>${esc(whoName(c.id))}</b><span class="sub">${c.last.sender_id === S.user.id ? `${c.last.read_at ? `<span class="seen" title="Visto" aria-label="Visto">${SEEN_ICON}</span>` : ''}Tú: ` : ''}${esc((c.last.body || (phList(c.last).length ? '📷 Foto' : '')).slice(0, 60))}</span></div>
        <div class="dm-meta"><span class="sub" title="${esc(new Date(c.last.created_at).toLocaleString('es-ES', { dateStyle: 'long', timeStyle: 'short' }))}">${convTime(c.last.created_at)}</span>${c.unread ? `<i class="dotn static">${c.unread}</i>` : ''}</div></div>`).join('')
      : '<div class="sub" style="padding:14px">Aún no tienes conversaciones. Pulsa "+ Nuevo" para escribir a alguien.</div>'}
  </div>`;
}
function msgTime(iso) { // hora exacta del mensaje, "22:56"
  return new Date(iso).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
}
function convTime(iso) { // lista de chats, como WhatsApp: "22:56", "ayer", "lunes" o "18/11/26"
  const d = new Date(iso), day = x => new Date(x.getFullYear(), x.getMonth(), x.getDate());
  const diff = Math.round((day(new Date()) - day(d)) / 864e5);
  if (diff <= 0) return msgTime(iso);
  if (diff === 1) return 'ayer';
  if (diff < 7) return d.toLocaleDateString('es-ES', { weekday: 'long' });
  return d.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: '2-digit' });
}
function threadInner(id) {
  const msgs = myDms().filter(m => dmPartner(m) === id).sort((a, b) => a.created_at.localeCompare(b.created_at));
  if (!msgs.length) return '<div class="sub center" style="margin:auto">Aún no os habéis escrito. ¡Saluda! 👋</div>';
  return msgs.map(m => {
    const mine = m.sender_id === S.user.id, url = firstLink(m.body);
    const can = S.dmCan[id] !== false;
    return `<div class="msg-row ${mine ? 'mine' : ''}"><div class="msg-wrap"><div class="msg-line"><div class="msg" data-dmid="${m.id}">
        ${m.story_id ? storyReplyHtml(m) : ''}${phOf('dm_message', m, 'dm')}${m.body ? `<div class="msg-body">${rtFormat(linkify(m.body))}</div>` : ''}${url ? linkCard(url) : ''}
        <div class="msg-foot"><span title="${esc(new Date(m.created_at).toLocaleString('es-ES', { dateStyle: 'long', timeStyle: 'short' }))}">${msgTime(m.created_at)}</span>
          ${mine && m.read_at ? `<span class="seen" title="Visto" aria-label="Visto">${SEEN_ICON}</span>` : ''}
        </div>${dmMenuItems(m) ? `<button type="button" class="msg-more" data-dmmenu-open="${m.id}" title="Opciones" aria-label="Opciones del mensaje" aria-haspopup="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>` : ''}</div>${can ? `<button type="button" class="msg-rxbtn" data-dmrx-open="${m.id}" title="Reaccionar" aria-label="Reaccionar">${EMOJI_ICON}</button>` : ''}</div>${dmRxChip(m.id)}</div></div>`;
  }).join('');
}
/* ---- Reacciones a mensajes privados (como WhatsApp) ----
   Una por persona y mensaje, cualquier emoji. S.dmRx = filas de dm_reactions.
   PC: botón 😊 transparente al lado del mensaje al pasar el ratón. Móvil: mantener pulsado el mensaje.
   Se abre la burbuja con los 6 rápidos y "+" para el selector completo de emojis. */
const SEEN_ICON = '<svg viewBox="0 0 18 12" width="17" height="11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 6.5l3.2 3.2L11 2.5"/><path d="M7.2 9.2l.5.5L15.5 2.5"/></svg>';
function dmRxChip(mid) {
  const rows = S.dmRx.filter(r => r.message_id === mid);
  if (!rows.length) return '';
  const uniq = [...new Set(rows.map(r => r.emoji))];
  const names = rows.map(r => `${r.user_id === S.user.id ? 'Tú' : whoName(r.user_id)} ${r.emoji}`).join(' · ');
  const mine = rows.some(r => r.user_id === S.user.id);
  return `<button type="button" class="msg-rx" data-dmrx-chip="${mid}" title="${esc(names + (mine ? ' — pulsa para quitar la tuya' : ''))}">${uniq.map(esc).join('')}${rows.length > 1 ? `<span>${rows.length}</span>` : ''}</button>`;
}
// Opciones de un mensaje (flechita en el PC; en el móvil salen al mantener pulsado, debajo de los emojis)
function dmMenuItems(m) {
  if (m.sender_id === S.user.id) return `<button type="button" class="danger" data-action="dm-delete" data-id="${m.id}">🗑️ Borrar mensaje</button>`;
  if (isTeacherId(m.sender_id) || isTeacher()) return ''; // los mensajes del profe no se denuncian; el profe no denuncia (borra o bloquea el acceso)
  const reported = S.reports.some(r => r.target_type === 'dm_message' && r.target_id === m.id && r.reporter_id === S.user.id);
  return reported ? '<div class="off">🚩 Denunciado</div>' : `<button type="button" data-action="report" data-type="dm_message" data-id="${m.id}">🚩 Denunciar</button>`;
}
function dmMenuShow(m, anchor, below) {
  const html = dmMenuItems(m); if (!html) return;
  const box = document.createElement('div'); box.id = 'dmMenu'; box.className = 'dmmenu'; box.setAttribute('role', 'menu');
  box.innerHTML = html; document.body.appendChild(box);
  const r = anchor.getBoundingClientRect(), w = box.offsetWidth, h = box.offsetHeight, mine = m.sender_id === S.user.id;
  box.style.left = Math.max(8, Math.min(mine ? r.right - w : r.left, innerWidth - w - 8)) + 'px';
  box.style.top = (r.bottom + 6 + h <= innerHeight - 8 || !below ? Math.min(r.bottom + 6, innerHeight - h - 8) : Math.max(8, r.top - h - 6)) + 'px';
}
function dmMenuOpen(mid, btn) {
  const m = S.dms.find(x => x.id === mid); if (!m) return;
  dmRxClose(true); emojiClose(true);
  dmRxFor = mid; btn.classList.add('on');
  dmMenuShow(m, btn, true);
  popPush();
}
// "Atrás" cierra la burbuja, el menú o el selector de emojis en vez de salir de la conversación
let popHist = false;
function popPush() { if (!popHist) { popHist = true; history.pushState({ ...(history.state || {}), modal: 1, pop: 1 }, ''); } }
function popDone(fromHistory) {
  if (!popHist) return; popHist = false;
  if (!fromHistory && history.state && history.state.pop) { histSkip++; history.back(); }
}
let dmRxFor = null; // id del mensaje con la burbuja o el menú abiertos
function dmRxClose(keepHist = false, fromHistory = false) {
  const was = !!dmRxFor;
  dmRxFor = null;
  ['#dmRxBox', '#dmMenu'].forEach(sel => { const b = $(sel); if (b) b.remove(); });
  $$('.msg.held').forEach(x => x.classList.remove('held')); $$('.msg-more.on').forEach(x => x.classList.remove('on'));
  if (was && !keepHist) popDone(fromHistory);
}
function dmRxOpen(mid, anchor, withMenu = false) {
  dmRxClose(true); emojiClose(true);
  const m = S.dms.find(x => x.id === mid); if (!m || S.dmCan[dmPartner(m)] === false) return;
  dmRxFor = mid;
  const mine = (S.dmRx.find(r => r.message_id === mid && r.user_id === S.user.id) || {}).emoji;
  const box = document.createElement('div'); box.id = 'dmRxBox'; box.className = 'dmrx'; box.setAttribute('role', 'menu');
  box.innerHTML = REACTIONS.map(r => `<button type="button" role="menuitem" data-dmrx-pick="${esc(r.e)}" class="${mine === r.e ? 'mine' : ''}" aria-label="${esc(r.e)}">${r.e}</button>`).join('')
    + `<button type="button" class="more" data-dmrx-more title="Más emojis" aria-label="Más emojis">+</button>`;
  document.body.appendChild(box);
  const r = anchor.getBoundingClientRect(), w = box.offsetWidth, h = box.offsetHeight;
  box.style.left = Math.max(8, Math.min(r.left + r.width / 2 - w / 2, innerWidth - w - 8)) + 'px';
  box.style.top = (r.top - h - 8 >= 8 ? r.top - h - 8 : Math.min(r.bottom + 8, innerHeight - h - 8)) + 'px';
  if (withMenu) dmMenuShow(m, anchor, false);
  popPush();
}
async function dmReact(mid, emoji) {
  const mine = S.dmRx.find(r => r.message_id === mid && r.user_id === S.user.id);
  const prev = S.dmRx.slice();
  emojiRemember(emoji);
  if (mine && mine.emoji === emoji) { // la misma: se quita
    S.dmRx = S.dmRx.filter(r => r !== mine); updateThread();
    const { error } = await sb.from('dm_reactions').delete().eq('message_id', mid).eq('user_id', S.user.id);
    if (error) { S.dmRx = prev; updateThread(); toast(errEs(error), 'bad'); }
    return;
  }
  const row = { message_id: mid, user_id: S.user.id, emoji, created_at: new Date().toISOString() };
  S.dmRx = [...S.dmRx.filter(r => r !== mine), row]; updateThread();
  const { error } = await sb.from('dm_reactions').upsert({ message_id: mid, user_id: S.user.id, emoji }, { onConflict: 'message_id,user_id' });
  if (error) { S.dmRx = prev; updateThread(); toast(errEs(error), 'bad'); }
}
document.addEventListener('click', e => {
  if (!e.target.closest) return;
  const ao = e.target.closest('[data-arx-open]'); // reacciones a respuestas de Escucha analítica
  if (ao) { e.stopPropagation(); e.preventDefault(); return dmRxFor === 'arx|' + ao.dataset.arxOpen + '|' + ao.dataset.q ? dmRxClose() : arxOpen(ao.dataset.arxOpen, ao.dataset.q, ao); }
  const ap = e.target.closest('[data-arx-pick]');
  if (ap && String(dmRxFor).startsWith('arx|')) { const [, aid, qk] = dmRxFor.split('|'); dmRxClose(); return ansReact(aid, qk, ap.dataset.arxPick); }
  const am = e.target.closest('[data-arx-more]');
  if (am && String(dmRxFor).startsWith('arx|')) {
    e.stopPropagation();
    const [, aid, qk] = dmRxFor.split('|'), anchor = $(`[data-arx-open="${aid}"][data-q="${qk}"]`) || am;
    dmRxClose(true);
    setTimeout(() => { ex = { btn: anchor, onPick: em => ansReact(aid, qk, em) }; emojiDraw(); }, 0);
    return;
  }
  const open = e.target.closest('[data-dmrx-open]');
  if (open) { e.stopPropagation(); return dmRxFor === open.dataset.dmrxOpen ? dmRxClose() : dmRxOpen(open.dataset.dmrxOpen, open.closest('.msg-line').querySelector('.msg')); }
  const mo = e.target.closest('[data-dmmenu-open]');
  if (mo) { e.stopPropagation(); return dmRxFor === mo.dataset.dmmenuOpen && $('#dmMenu') ? dmRxClose() : dmMenuOpen(mo.dataset.dmmenuOpen, mo); }
  if (e.target.closest('#dmMenu')) { setTimeout(() => dmRxClose(), 0); return; } // la acción (borrar/denunciar) va por data-action
  const pick = e.target.closest('[data-dmrx-pick]');
  if (pick && dmRxFor) { const id = dmRxFor; dmRxClose(); return dmReact(id, pick.dataset.dmrxPick); }
  const more = e.target.closest('[data-dmrx-more]');
  if (more && dmRxFor) { // selector completo: el mismo de los cuadros de texto, pero eligiendo reacción
    e.stopPropagation();
    const id = dmRxFor, anchor = $(`.msg[data-dmid="${id}"]`) || more;
    dmRxClose(true); // la entrada del historial sigue: ahora es del selector
    setTimeout(() => { ex = { btn: anchor, onPick: em => dmReact(id, em) }; emojiDraw(); }, 0);
    return;
  }
  const chip = e.target.closest('[data-dmrx-chip]');
  if (chip) {
    const mid = chip.dataset.dmrxChip, mine = S.dmRx.find(r => r.message_id === mid && r.user_id === S.user.id);
    if (mine) return dmReact(mid, mine.emoji); // quitar la mía
    const m = $(`.msg[data-dmid="${mid}"]`); if (m) return dmRxOpen(mid, m);
  }
  if (dmRxFor && !e.target.closest('#dmRxBox, #dmMenu')) dmRxClose();
}, true);
// Móvil: mantener pulsado el mensaje
let dmPress = null, dmLongEnd = 0;
document.addEventListener('touchstart', e => {
  const t = e.target.closest ? e.target : e.target.parentElement;
  if (dmRxFor && !(t && t.closest('#dmRxBox, #dmMenu'))) dmRxClose();
  const msg = t && t.closest('.msg[data-dmid]');
  if (!msg || e.touches.length > 1 || t.closest('a, button')) return;
  const p = e.touches[0];
  dmPress = { x: p.clientX, y: p.clientY, t: setTimeout(() => {
    dmPress = null; dmLongEnd = Date.now();
    msg.classList.add('held');
    if (navigator.vibrate) try { navigator.vibrate(15); } catch (_) {}
    dmRxOpen(msg.dataset.dmid, msg, true);
    if (dmRxFor) msg.classList.add('held');
  }, 450) };
}, { passive: true });
document.addEventListener('touchmove', e => {
  const p = e.touches[0];
  if (dmPress && p && Math.hypot(p.clientX - dmPress.x, p.clientY - dmPress.y) > 10) { clearTimeout(dmPress.t); dmPress = null; }
}, { passive: true });
document.addEventListener('touchend', e => {
  if (dmPress) { clearTimeout(dmPress.t); dmPress = null; }
  if (Date.now() - dmLongEnd < 600 && e.cancelable) e.preventDefault(); // que no cuente como clic
}, { passive: false });

function notifIcon(kind) { return { board_post: 'board', assignment: 'listening', dm: 'chat', comment: 'chat', reaction: 'heart', signup: 'students', account_deleted: 'students', goal: 'check', streak: 'listening', rank: 'listening', report: 'flag', homework: 'homework', mention_feed: 'chat', mention_board: 'board', mention_listening: 'listening', listening_feedback: 'listening', lesson: 'calendar', classmate_request: 'students', classmate_accept: 'students', story_reaction: 'heart', mention_story: 'chat', reply_feed: 'chat', reply_listening: 'listening' }[kind] || 'bell'; }
// Desplegable bajo la campanita, como en Facebook (Yuri, 2026-11-28; antes era una ventana en el centro).
// Va suelto en <body> (#notifBox) para que repintar la barra de arriba no lo cierre ni pierda el desplazamiento.
// Se cierra con la campanita, tocando fuera, Esc o Atrás (entrada `pop: 1` en el historial).
// Como Facebook (Yuri, 2026-11-28): filtro Todas / No leídas arriba y, en Todas, tres grupos:
// Nuevas (sin leer, de cuando sean), Hoy (ya leídas, de las últimas 24 h) y Anteriores (leídas, más antiguas).
let notifFilter = 'all'; // 'all' | 'unread'; se queda como estaba al volver a abrir (solo en memoria)
function notifRowHtml(n) {
  return `<div class="nrow ${n.read_at ? '' : 'unread'}" data-action="notif-open" data-id="${n.id}">
    ${n.actor_id && S.dir[n.actor_id] ? avatarHtml(n.actor_id, 38) : `<span class="ic">${ic(notifIcon(n.kind))}</span>`}
    <div class="t"><div>${notifText(n)}</div><span class="sub">${timeAgo(n.created_at)}</span></div>${n.read_at ? '' : '<i class="udot"></i>'}</div>`;
}
function notifGroups(list) {
  const since = Date.now() - 864e5; // "Hoy" = últimas 24 h, aunque sean de ayer (Yuri)
  const g = { new: [], today: [], old: [] };
  list.forEach(n => g[!n.read_at ? 'new' : new Date(n.created_at).getTime() >= since ? 'today' : 'old'].push(n));
  return [['new', 'Nuevas'], ['today', 'Hoy'], ['old', 'Anteriores']].filter(([k]) => g[k].length).map(([k, label]) => ({ k, label, items: g[k] }));
}
function notifsInner() {
  const all = bellNotifs().sort((a, b) => b.created_at.localeCompare(a.created_at)).slice(0, 50);
  const unread = all.filter(n => !n.read_at);
  const tab = (k, label) => `<button type="button" class="nb-tab${notifFilter === k ? ' on' : ''}" data-action="notif-filter" data-f="${k}" aria-pressed="${notifFilter === k}">${label}</button>`;
  let body;
  if (notifFilter === 'unread') body = unread.length ? `<div class="nlist">${unread.map(notifRowHtml).join('')}</div>` : '<div class="empty small">No tienes notificaciones sin leer.</div>';
  else body = all.length ? notifGroups(all).map(g => `<div class="nb-group" data-ngroup="${g.k}"><h3 class="nb-gt">${g.label}</h3><div class="nlist">${g.items.map(notifRowHtml).join('')}</div></div>`).join('')
    : '<div class="empty small">No tienes notificaciones.</div>';
  return `<div class="nb-head"><h2>Notificaciones</h2>${unread.length ? '<button class="linkbtn" data-action="notif-all-read">Marcar todas como leídas</button>' : ''}</div>
    <div class="nb-tabs" role="group" aria-label="Filtrar">${tab('all', 'Todas')}${tab('unread', 'No leídas')}</div>
    ${pushPromptHtml()}
    <div class="nb-scroll">${body}</div>`;
}
function notifsPlace() {

    // Duración: lo escrito a mano manda; si está vacío, se saca de Spotify/YouTube
    const dur = parseDur(f.duration.value), tracks = f.tracks.value.trim() ? Math.round(Number(f.tracks.value)) : null;
    if (Number.isNaN(dur) || dur > 1000000) return toast('No entiendo esa duración. Escríbela como 3:33, 42 min o 1 h 12 min', 'bad');
    if (tracks !== null && !(tracks >= 1 && tracks <= 100000)) return toast('El número de temas no es válido', 'bad');
    let durInfo = null; // si se pide la duración a Spotify, de paso trae el artista
    const manual = prev && dur === prev.duration_sec && tracks === prev.track_count ? null : { dur, tracks };
    if (manual && (dur || tracks)) Object.assign(row, { duration_sec: dur, track_count: tracks, duration_partial: false });
    else if (!manual && prev && prev.url === url && prev.duration_sec) { /* sin cambios */ }
    else {
      btn.disabled = true; btn.textContent = 'Buscando duración…';
      const d = durInfo = await fetchDuration(url);
      btn.disabled = false; btn.textContent = 'Guardar';
      Object.assign(row, { duration_sec: d.duration_sec, track_count: d.track_count, duration_partial: d.partial });
    }
    // Artista: lo escrito manda. Vacío → se busca solo con un enlace nuevo (las escuchas antiguas las rellena backfillThumbs).
    // Vaciarlo a mano en una escucha que ya lo tenía lo deja vacío ("" = sin artista).
    const artistIn = f.artist.value.trim();

    else if (!prev || prev.url !== url) {

      row.artist = (durInfo && linkService(url) === 'sp' ? durInfo.artist : await fetchArtist(url)) ?? null;
      btn.disabled = false; btn.textContent = 'Guardar';
    } else if (prev.artist) row.artist = '';

    if (res.error) return toast('Error: ' + errEs(res.error), 'bad');
    const itemId = id || (res.data && res.data[0] && res.data[0].id);
    if (itemId) { // géneros: se quitan los desmarcados y se añaden los nuevos
      const had = S.itemGenres.filter(x => x.item_id === itemId).map(x => x.genre_id);
      const off = had.filter(g => !genreIds.includes(g)), add = genreIds.filter(g => !had.includes(g));
      const e1 = off.length ? (await sb.from('listening_item_genres').delete().eq('item_id', itemId).in('genre_id', off)).error : null;
      const e2 = add.length ? (await sb.from('listening_item_genres').insert(add.map(genre_id => ({ item_id: itemId, genre_id })))).error : null;
      if (e1 || e2) toast('La escucha se guardó, pero no los géneros: ' + errEs(e1 || e2), 'bad');
    }
    await loadData();
    if (id && itemReturn) { render(); itemModal(id); } // vino de la ficha del alumno: vuelve a la escucha
    else { await closeModal(); render(); }
    toast(id ? 'Elemento actualizado' : 'Elemento creado', 'ok');
  }
});

/* ================================ AGENDA ============================== *
   Las clases se apuntan solo en Google Calendar. La Edge Function calendar-sync las copia en `lessons`
   cada 15 minutos (y con "Sincronizar ahora"). El alumno ve su próxima clase y recibe un aviso 8 h antes. */
const WEEKDAYS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
const hhmm = iso => { const d = new Date(iso); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const dayLabel = iso => { const d = new Date(iso); return `${WEEKDAYS[d.getDay()]} ${d.getDate()} de ${MONTHS[d.getMonth()]}`; };
function relDay(iso) { // hoy / mañana / jueves 27 de noviembre
  const d = new Date(iso), t = new Date(), a = new Date(d.getFullYear(), d.getMonth(), d.getDate()), b = new Date(t.getFullYear(), t.getMonth(), t.getDate());
  const n = Math.round((a - b) / 86400000);
  return n === 0 ? 'hoy' : n === 1 ? 'mañana' : dayLabel(iso);
}
const calSynced = () => !!(S.lessonSync && S.lessonSync.last_ok_at);
const nextLesson = id => S.lessons.filter(l => l.student_id === id && new Date(l.ends_at || l.starts_at) > new Date()).sort((a, b) => a.starts_at.localeCompare(b.starts_at))[0] || null;
// ¿Ha tenido ya alguna clase este mes? (para Pagos: se cobra tras la primera clase del mes)
/* Bonos de clases (2026-11-27): el pago "mensual" cubre N clases (trato: classes_per_payment; se copia
   en el pago como `classes`). Se paga al acabar la primera clase (paid_on = día de esa clase) y vuelve
   a tocar el día de la clase N+1. Las clases salen de Google Calendar (S.lessons), en hora local. */
const PACK_DEF = 4;
const packN = (r, pl) => (r && r.classes) || (pl && pl.classes_per_payment) || PACK_DEF;
const lastPack = (id, upTo) => S.payRecords.filter(r => r.student_id === id && r.kind === 'monthly' && (!upTo || r.paid_on <= upTo))
  .sort((a, b) => b.paid_on.localeCompare(a.paid_on) || (b.created_at || '').localeCompare(a.created_at || ''))[0] || null;
const lessonsFrom = (id, key) => S.lessons.filter(l => l.student_id === id && dayKey(new Date(l.starts_at)) >= key).sort((a, b) => a.starts_at.localeCompare(b.starts_at));
const shortDay = key => { const [y, m, d] = key.split('-').map(Number); return `${d} ${MONTHS[m - 1].slice(0, 3)}.`; };
function packState(id) { // null = sin pagos apuntados
  const r = lastPack(id); if (!r) return null;
  const n = packN(r, planOf(id)), ls = lessonsFrom(id, r.paid_on), today = dayKey(new Date());
  const used = Math.min(n, ls.filter(l => new Date(l.starts_at) <= new Date()).length);
  const due = ls[n] ? dayKey(new Date(ls[n].starts_at)) : null;
  return { r, n, used, due, dueNow: !!due && due <= today };
}
function lessonPayTag(id, l) { // Agenda: qué clase del bono es esta o si toca cobrar en ella
  const key = dayKey(new Date(l.starts_at)), r = lastPack(id, key);
  if (!r) return 'Sin pago apuntado';
  const n = packN(r, planOf(id)), i = lessonsFrom(id, r.paid_on).findIndex(x => x.id === l.id);
  return i >= 0 && i < n ? `Clase ${i + 1}/${n}` : '💶 Toca cobrar';
}
function packSuggestDay(id) { // fecha propuesta al apuntar: la clase en la que tocaba cobrar, si ya pasó; si no, hoy
  const ps = packState(id), today = dayKey(new Date());
  if (ps && ps.dueNow) return ps.due;
  if (!ps) { const past = S.lessons.filter(l => l.student_id === id && new Date(l.starts_at) <= new Date()).sort((a, b) => b.starts_at.localeCompare(a.starts_at))[0];
    if (past && dayKey(new Date(past.starts_at)).slice(0, 7) === today.slice(0, 7)) return dayKey(new Date(past.starts_at)); }
  return today;
}
function nextLessonHtml() { // alumno
  const l = nextLesson(S.user.id); if (!l) return '';
  return `<div class="fy-row lesson-row"><span class="ic">${ic('calendar')}</span><div class="t"><b>Tu próxima clase: ${esc(relDay(l.starts_at))}</b><span class="sub">a las ${hhmm(l.starts_at)}${l.ends_at ? ' – ' + hhmm(l.ends_at) : ''}</span></div></div>`;
}
const weekStart = (d = new Date()) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
function agendaView() {

// Fechas límite de la semana (deberes y escuchas sin hacer), en una fila encima de la rejilla, como los
// eventos de "todo el día" de Google Calendar. Iguales por título se agrupan ("Escala de La · 3 alumnos").
const dayKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
function agendaDues(key) {
  const ok = new Set(S.students.filter(s => s.approved).map(s => s.id));

function agendaDueCell(d) {

function agendaDayModal(key) {

    ${!du.hw.length && !du.ls.length ? '<p class="sub">Ya no queda nada pendiente para ese día.</p>' : ''}`);

// Semana en rejilla, como Google Calendar: días en columnas, horas en filas, cada clase un bloque de su duración
const WD3 = ['DOM', 'LUN', 'MAR', 'MIÉ', 'JUE', 'VIE', 'SÁB'];
function agendaGrid(days, list) {
  const H = 48; // píxeles por hora
  let h0 = 9, h1 = 23;
  list.forEach(l => { const s = new Date(l.starts_at), e = new Date(l.ends_at || s.getTime() + 3600000); h0 = Math.min(h0, s.getHours()); h1 = Math.max(h1, e.getHours() + (e.getMinutes() ? 1 : 0) + (e.toDateString() !== s.toDateString() ? 24 : 0)); });
  h1 = Math.min(h1, 24);
  const hours = []; for (let h = h0; h < h1; h++) hours.push(h);
  const now = new Date(), today = now.toDateString(), per = monthStart();
  const block = (l, col, cols) => {
    const s = new Date(l.starts_at), e = new Date(l.ends_at || s.getTime() + 3600000);
    const top = ((s.getHours() - h0) * 60 + s.getMinutes()) / 60 * H;
    const height = Math.max(24, (Math.min(e, new Date(s.getFullYear(), s.getMonth(), s.getDate(), h1)) - s) / 3600000 * H - 3);
    const st = l.student_id && S.students.find(x => x.id === l.student_id);
    const pend = st ? S.homework.filter(h => h.student_id === st.id && !h.done_at).length : 0;
    const pl = st ? planOf(st.id) : null;
    const extra = st ? [pend ? `📝 ${pend}` : '', pl && pl.mode === 'monthly' ? lessonPayTag(st.id, l) : ''].filter(Boolean).join(' · ') : 'Sin alumno en la app';
    const w = 100 / cols;
    return `<div class="cev ${st ? '' : 'unk'} ${e < now ? 'past' : ''}" style="top:${top}px;height:${height}px;left:calc(${col * w}% + 2px);width:calc(${w}% - 4px)"
      ${st ? `data-action="open-student" data-id="${st.id}"` : ''} title="${esc(l.title)} · ${hhmm(l.starts_at)}–${hhmm(e.toISOString())}">
      <b>${esc(st ? st.display_name : l.title)}</b><span>${hhmm(l.starts_at)} – ${hhmm(e.toISOString())}</span>${extra ? `<em>${esc(extra)}</em>` : ''}</div>`;
  };
  const dayCol = d => {
    const ls = list.filter(l => new Date(l.starts_at).toDateString() === d.toDateString()).sort((a, b) => a.starts_at.localeCompare(b.starts_at));
    // Clases que se solapan: se reparten el ancho
    const placed = []; let group = [], groupEnd = 0;
    const flush = () => { const cols = Math.max(...group.map(g => g.col)) + 1; group.forEach(g => placed.push(block(g.l, g.col, cols))); group = []; };
    ls.forEach(l => {
      const s = +new Date(l.starts_at), e = +new Date(l.ends_at || s + 3600000);
      if (group.length && s >= groupEnd) flush();
      const used = group.filter(g => g.end > s).map(g => g.col); let col = 0; while (used.includes(col)) col++;
      group.push({ l, col, end: e }); groupEnd = Math.max(groupEnd, e);
    });
    if (group.length) flush();
    const isToday = d.toDateString() === today;
    const nowTop = ((now.getHours() - h0) * 60 + now.getMinutes()) / 60 * H;
    return `<div class="cal-col ${isToday ? 'today' : ''}">${placed.join('')}${isToday && now.getHours() >= h0 && now.getHours() < h1 ? `<i class="cal-now" style="top:${nowTop}px"></i>` : ''}</div>`;
  };
  setTimeout(() => { const cal = $('.cal'), t = $('.cal .cal-dh.today'); if (cal && t && cal.scrollWidth > cal.clientWidth) cal.scrollLeft = t.offsetLeft - 56; }, 0);
  return `<div class="cal" style="--hh:${H}px"><div class="cal-in">
    <div class="cal-head"><div class="cal-tz">${esc(Intl.DateTimeFormat().resolvedOptions().timeZone === 'Europe/Madrid' ? 'Madrid' : '')}</div>
      ${days.map(d => `<div class="cal-dh ${d.toDateString() === today ? 'today' : ''}"><span>${WD3[d.getDay()]}</span><b>${d.getDate()}</b></div>`).join('')}</div>
    ${days.some(d => { const du = agendaDues(dayKey(d)); return du.hw.length || du.ls.length; }) ? `<div class="cal-dues"><div class="cal-tz">Fecha<br>límite</div>${days.map(agendaDueCell).join('')}</div>` : ''}
    <div class="cal-body" style="height:${hours.length * H}px">
      <div class="cal-hours">${hours.map(h => `<div class="cal-hr" style="height:${H}px"><span>${pad(h)}:00</span></div>`).join('')}</div>
      ${days.map(dayCol).join('')}
    </div></div></div>`;
}
async function loadLessons() {
  const from = new Date(); from.setDate(from.getDate() - 150); // de sobra para contar las clases de los bonos de Pagos
  const to = new Date(); to.setDate(to.getDate() + 60);
  if (isTeacher()) {
    const [l, ls, sy] = await Promise.all([
      sb.from('lessons').select('*').gte('starts_at', from.toISOString()).lte('starts_at', to.toISOString()).order('starts_at').limit(2000),
      sb.from('lessons_students').select('*'),
      sb.from('lessons_sync').select('*').eq('id', 1).maybeSingle()
    ]);
    const err = [l, ls, sy].map(x => x.error).find(Boolean); if (err) throw err;
    S.lessons = l.data || []; S.lessonNames = ls.data || []; S.lessonSync = sy.data || null;
  } else {
    const { data, error } = await sb.from('lessons').select('*').eq('student_id', S.user.id).gte('starts_at', new Date(Date.now() - 3 * 3600000).toISOString()).order('starts_at').limit(10);
    if (error) throw error;
    S.lessons = data || [];
  }
}

/* ---- Bloquear (y, si quieres, denunciar a la vez, como en WhatsApp) ----
   Con "denunciar" marcado se denuncian sus últimos mensajes recibidos (hasta 5) para que el
   profesor tenga contexto; si no te ha escrito, se denuncia a la persona. */
const BLOCK_REPORT_MAX = 5;
function blockModal(id) {
  const msgs = S.dms.filter(m => m.sender_id === id && m.recipient_id === S.user.id);
  openModal(`<div class="modal-head"><h2>¿Bloquear a ${esc(whoName(id))}?</h2><button class="x" data-action="close" aria-label="Cerrar">×</button></div>
    <form id="blockForm" data-id="${id}">
      <p style="margin-top:0">No podréis escribiros en privado y, si erais compañeros, dejaréis de serlo. Esta persona no recibe ningún aviso.</p>
      <label class="check"><input type="checkbox" name="report"> <span><b>Denunciar también a tu profesor</b><br><span class="sub">${msgs.length ? `Le llegarán ${msgs.length > 1 ? `sus últimos ${Math.min(msgs.length, BLOCK_REPORT_MAX)} mensajes` : 'su mensaje'} para que pueda ver qué ha pasado.` : 'Tu profesor sabrá que esta persona te ha molestado.'} Si no lo marcas, nadie se entera del bloqueo.</span></span></label>
      <label class="f" data-block-reason hidden>Motivo (opcional)<textarea name="reason" rows="2" maxlength="300" placeholder="Cuéntale a tu profesor qué ha pasado"></textarea></label>
      <div class="actions"><button type="button" class="btn ghost" data-action="close">Cancelar</button><button type="submit" class="btn danger">Bloquear</button></div>
    </form>`);
  $('.modal').classList.add('narrow');
  const f = $('#blockForm');
  f.elements['report'].addEventListener('change', e => {
    f.querySelector('[data-block-reason]').hidden = !e.target.checked;
    f.querySelector('[type=submit]').textContent = e.target.checked ? 'Bloquear y denunciar' : 'Bloquear';
  });
}
async function blockSubmit(f) {
  const id = f.dataset.id, doReport = f.elements['report'].checked, reason = (f.elements['reason'].value || '').trim().slice(0, 300) || null;
  const btn = f.querySelector('[type=submit]'); btn.disabled = true;
  // Primero la denuncia: después de bloquear ya no se podría denunciar a la persona (deja de verse)
  if (doReport) {
    const already = new Set(S.reports.filter(r => r.reporter_id === S.user.id).map(r => r.target_type + ':' + r.target_id));
    const msgs = S.dms.filter(m => m.sender_id === id && m.recipient_id === S.user.id)
      .sort((a, b) => b.created_at.localeCompare(a.created_at)).slice(0, BLOCK_REPORT_MAX);
    let rows = msgs.map(m => ({ target_type: 'dm_message', target_id: m.id }));
    if (!rows.length) rows = [{ target_type: 'profile', target_id: id }];
    rows = rows.filter(r => !already.has(r.target_type + ':' + r.target_id))
      .map(r => ({ ...r, reporter_id: S.user.id, reason: reason || 'Al bloquear a esta persona' }));
    if (rows.length) {
      const { error } = await sb.from('moderation_reports').insert(rows);
      if (error) { btn.disabled = false; return toast('No se pudo enviar la denuncia: ' + errEs(error), 'bad'); }
      rows.forEach(r => S.reports.push({ ...r, resolved: false, created_at: new Date().toISOString() }));
    }
  }
  const { error } = await sb.from('user_blocks').insert({ blocker_id: S.user.id, blocked_id: id });
  if (error) { btn.disabled = false; return toast('No se pudo bloquear: ' + errEs(error), 'bad'); }
  S.blocks.push({ blocker_id: S.user.id, blocked_id: id }); S.dmCan[id] = false;
  const mr = mateRow(id); if (mr) S.mates = S.mates.filter(x => x !== mr); // la base de datos la borra sola
  await closeModal();
  render(); toast(doReport ? 'Bloqueado y denunciado. Tu profesor lo revisará' : 'Bloqueado', 'ok');
}

async function downloadBackup(btn) { // solo profesor: todo lo que él puede leer, en un archivo

/* ============================ OBJETIVOS ============================
   goals_stages (etapas de la lista general), goals_items (student_id null = general;
   con student_id = personal de ese alumno) y goals_done (logros; solo los marca el profesor).
   Privado: el alumno ve su progreso en su Perfil ("Solo tú y tu profesor"); el profesor
   los marca desde la ficha del alumno. Al conseguir uno, el alumno ve una celebración
   (goalsCelebrate) la próxima vez que abre la app, o al momento si la tiene abierta. */
const MODULE_GOALS = 'Objetivos';
async function loadGoals() {
  const [st, it, dn] = await Promise.all([
    sb.from('goals_stages').select('*').order('stage'),
    sb.from('goals_items').select('*').order('sort'),
    sb.from('goals_done').select('*')
  ]);
  const e = [st, it, dn].map(x => x.error).find(Boolean);
  if (e) throw e;
  S.goalStages = st.data || []; S.goalItems = it.data || []; S.goalDone = dn.data || [];
}
const goalSort = (a, b) => (a.stage || 0) - (b.stage || 0) || (a.sort || 0) - (b.sort || 0) || (a.created_at || '').localeCompare(b.created_at || '');
const goalsFor = sid => S.goalItems.filter(g => !g.student_id || g.student_id === sid).sort(goalSort);
const goalDoneRow = (gid, sid) => S.goalDone.find(d => d.goal_id === gid && d.student_id === sid);
const stageTitle = n => (S.goalStages.find(s => s.stage === n) || {}).title || '';
const stageNums = () => [...new Set(S.goalItems.filter(g => !g.student_id).map(g => g.stage).concat(S.goalStages.map(s => s.stage)))].sort((a, b) => a - b);
function goalGroups(sid, teacher) { // personales primero; luego las etapas en orden
  const list = goalsFor(sid), groups = [];
  const pers = list.filter(g => g.student_id);
  if (pers.length || teacher) groups.push({ key: 'p', num: '★', title: teacher ? 'Personales de este alumno' : 'Solo para ti', items: pers });
  stageNums().forEach(n => { const items = list.filter(g => !g.student_id && g.stage === n); if (items.length) groups.push({ key: 's' + n, num: n, title: stageTitle(n) || `Etapa ${n}`, items }); });
  groups.forEach(g => { g.done = g.items.filter(x => goalDoneRow(x.id, sid)).length; });
  return groups;
}
function goalStats(sid) {
  const l = goalsFor(sid), n = l.filter(g => goalDoneRow(g.id, sid)).length;
  const cur = goalGroups(sid).find(g => g.key !== 'p' && g.done < g.items.length);
  return { n, total: l.length, pct: l.length ? Math.round(n * 100 / l.length) : 0, cur };
}

function goalRow(g, sid, teacher) {

/* ============================ RANGO DE GUERRERO Y RACHA ============================
   Racha: días seguidos terminando escuchas (terminada = escuchada + las 6 respuestas; la fecha la pone la base de
   datos en completed_at, la primera vez, y no cambia). Hora local (Madrid):
   · un día con alguna escucha terminada suma 1;
   · un día que acaba con escuchas pendientes y ninguna terminada la rompe;
   · un día sin nada pendiente no la toca (si el profesor no manda escuchas, no se pierde);
   · una escucha cuenta como pendiente desde el día siguiente a asignarla; hoy nunca rompe.
   Es lo mismo que calcula listening_streak() en la base de datos. La racha actual es privada (alumno y profesor).
   Rango (2026-11-28): cada escucha terminada da puntos una sola vez (listening_assignments.points, los pone la base
   de datos): (20 + 1 por minuto) × mult × (½ si se termina tarde). mult (v2, Yuri) = ×2 si el alumno llevaba 14 días
   o más de racha el día que se le mandó. v4 (Yuri): FUERA el multiplicador (mult siempre 1); la racha da prestigio (v8: chispas e inscripción
   de la medalla; flameOf: 7/14/30 días = ámbar/azul/dorada), públicas con get_listening_badge. Tarde = después de su fecha límite o, sin fecha, más de 30 días después de mandarla. La suma da el
   rango: 7 rangos × 3 divisiones + Mito. v3 (Yuri): los umbrales son % de toda la música del catálogo
   (listening_catalog_points(), Σ 20 + minutos a ×1; en S.catalogPts) y Mito = 90 %. Al añadir música suben y se
   puede bajar de rango. RANK_PCT debe coincidir con listening_rank_step() del SQL. El profesor luce siempre Mito.
   Las medallas y el récord de racha son públicos (get_listening_rank). Al subir, celebración (profiles.rank_seen). */
const RANK_PCT = [0, 1, 2, 4, 6, 8, 11, 14, 17, 21, 25, 29, 34, 39, 44, 50, 56, 62, 69, 77, 85, 90];
// Umbrales en puntos con el catálogo de hoy. Sin catálogo (0), todo es Bronce III.
const catalogPts = () => S.catalogPts || (S.items || []).reduce((t, i) => t + 20 + Math.floor((i.duration_sec || 0) / 60), 0);
const rankSteps = () => { const c = catalogPts(); return RANK_PCT.map((v, i) => i && !c ? Infinity : Math.round(v / 100 * c)); };
const RANK_TIERS = ['Bronce', 'Plata', 'Oro', 'Platino', 'Diamante', 'Maestro', 'Leyenda', 'Mito'];
const RANK_DIV = ['III', 'II', 'I'];
const STREAK_MAX = 14;
const stepName = s => s >= 21 ? 'Mito' : `${RANK_TIERS[Math.floor(s / 3)]} ${RANK_DIV[s % 3]}`;
function rankOf(points) {
  points = points || 0; let step = 0;
  const ST = rankSteps();
  ST.forEach((v, i) => { if (points >= v) step = i; });
  const next = step < ST.length - 1 && ST[step + 1] !== Infinity ? ST[step + 1] : null, from = ST[step];
  return { step, tier: Math.min(Math.floor(step / 3), 7), name: stepName(step), points, next, from, pct: next ? (points - from) / (next - from) : 1 };
}
const pointsOf = sid => S.assigns.filter(a => a.student_id === sid).reduce((t, a) => t + (a.points || 0), 0);
const nfmt = n => Number(n || 0).toLocaleString('es-ES');
// Racha = prestigio (v8, Yuri 2026-11-28): la medalla brilla siempre con el color de su rango (CSS .emb.tN) y la racha
// añade CHISPAS que suben (7 días naranjas, 14 azules, 30 doradas; más cuanto más larga) y una inscripción heráldica
// debajo ("14 DÍAS"). Se descartaron dos fuegos y un aura. Los nombres de código siguen diciendo "flame" (get_listening_badge → flame 0-3).
const FLAME_DAYS = [7, 14, 30];
const FLAME_NAME = ['', 'naranjas', 'azules', 'doradas'];
const FLAME_RGB = ['', '255,150,50', '90,200,255', '255,215,110'];
const flameOf = days => days >= 30 ? 3 : days >= 14 ? 2 : days >= 7 ? 1 : 0;

const sparkRnd = k => { const x = Math.sin(k * 12.9898) * 43758.5453; return x - Math.floor(x); };

  if (!f) return '';
  const n = [0, 7, 11, 16][f];
  return `<span class="rk-sparks" aria-hidden="true">${Array.from({ length: n }, (_, k) => `<i style="left:${(20 + sparkRnd(k) * 60).toFixed(1)}%;--s:${(2 + sparkRnd(k + 50) * 2.5).toFixed(1)}px;--x:${(sparkRnd(k + 99) * 30 - 15).toFixed(0)}px;--t:${(1.8 + sparkRnd(k + 7) * 1.6).toFixed(2)}s;animation-delay:${(sparkRnd(k + 31) * 3).toFixed(2)}s"></i>`).join('')}</span>`;
}

// Yuri: la inscripción sale desde el primer día (gris); a los 7 días toma color y salen las chispas
const medalHtml = (tier, flame = 0, label = '') => emblemSvg(tier) + sparksHtml(flame) + (label ? `<span class="rk-tag${flame ? '' : ' dim'}">${esc(label)}</span>` : '');

const LATE_DAYS = 30;
// Terminada tarde (mitad de puntos): después de su fecha límite o, sin fecha, más de 30 días después de mandarla
function lateOf(a) {
  if (!a.completed_at) return false;
  const lim = a.due_date ? new Date(a.due_date + 'T23:59:59') : new Date(new Date(a.assigned_at).getTime() + LATE_DAYS * 86400000);
  return new Date(a.completed_at) > lim;
}

const localDay = iso => dayKey(new Date(iso));
const addDays = (key, n) => { const d = new Date(key + 'T12:00:00'); d.setDate(d.getDate() + n); return dayKey(d); };
function streakOf(sid) {
  const as = S.assigns.filter(a => a.student_id === sid && a.assigned_at);
  const today = dayKey(new Date());
  if (!as.length) return { cur: 0, best: 0, todayDone: false, atRisk: false };
  const doneDays = new Set(as.filter(a => a.completed_at).map(a => localDay(a.completed_at)));
  const rows = as.map(a => ({ from: localDay(a.assigned_at), done: a.completed_at ? localDay(a.completed_at) : null }));

    else if (d < today && rows.some(r => r.from < d && (!r.done || r.done >= d))) cur = 0;
  }
  return { cur, best, todayDone: act, atRisk: !act && rows.some(r => !r.done && r.from < today) };

  if (st.atRisk) return { cls: 'warn', text: st.cur ? 'Termina una escucha hoy para no perder la racha' : 'Termina una escucha hoy para empezar tu racha' };
  return { cls: '', text: 'Sin escuchas pendientes: tu racha está a salvo' };
}

// Celebración al subir de división o de rango (una vez por escalón; profiles.rank_seen)
let rankCelebrating = false;
function rankCelebrate() {
  if (isTeacher() || S.preview || rankCelebrating || goalCelebrating || !S.user || !S.profile) return;
  const rk = rankOf(pointsOf(S.user.id)); let seen = S.profile.rank_seen;
  // Si ha bajado (se ha añadido música), se apunta sin celebrar: al volver a subir lo celebra otra vez
  if (seen !== null && seen !== undefined && rk.step < seen) { S.profile.rank_seen = seen = rk.step; sb.from('profiles').update({ rank_seen: rk.step }).eq('id', S.user.id).then(() => {}, () => {}); }
  if (!rk.points || (seen !== null && seen !== undefined && rk.step <= seen)) return;
  if ($('#modalRoot').firstChild) { S.rankPending = true; return; }
  S.rankPending = false; rankCelebrating = true;
  const first = seen === null || seen === undefined, newTier = first || Math.min(Math.floor(seen / 3), 7) < rk.tier;
  // Se marca como vista al abrir (si desde aquí abre la lista de rangos, la ventana se sustituye sin "cerrarse")
  S.profile.rank_seen = rk.step;
  sb.from('profiles').update({ rank_seen: rk.step }).eq('id', S.user.id).then(() => {}, () => {});
  openModal(`<div class="celebrate rk-celebrate"><div class="rk-medal xl">${emblemSvg(rk.tier, 'pop')}</div>
      <h2>${first ? `Tu rango: ${esc(rk.name)}` : newTier ? `¡Has ascendido a ${esc(rk.name)}!` : `¡Subes a ${esc(rk.name)}!`}</h2>
      <p class="sub" style="margin:4px 0 14px">${nfmt(rk.points)} puntos${rk.next !== null ? ` · el siguiente, ${esc(stepName(rk.step + 1))}, a los ${nfmt(rk.next)}` : ''}</p>
      <div class="actions" style="justify-content:center"><button class="btn" data-action="rank-ladder">Ver todos los rangos</button><button class="btn primary" data-action="close">¡A por más! 🤘</button></div></div>`, async () => {
    rankCelebrating = false;

}

/* ------------------------- Instalar como app (PWA) ------------------------- */
/* Cómo funciona la invitación a instalar:
   · La primera vez que alguien entra (móvil u ordenador) sale una ventana de bienvenida que invita a instalarla
     (una sola vez: profiles.install_prompted_at).
   · Mientras no tenga la app del móvil, arriba hay un botón neón "Instalar app" que abre esa misma ventana.
   · Cuando abre la app instalada en el móvil, se marca profiles.app_installed_at: desaparece el botón en todos
     sus dispositivos, y se le invita una vez a activar las notificaciones. */
let installPrompt = null; // Android/Chrome/Edge: el navegador nos deja mostrar su ventana de instalar
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); installPrompt = e;
  if ($('#installHow')) $('#installHow').innerHTML = installHowHtml();
  else if (S.section === 'settings' && !uiBusy()) softRender();
});
// Ojo: aquí NO se marca app_installed_at. El navegador avisa de "instalada" aunque el icono no llegue a salir
// (Brave y otros solo crean un acceso directo, y algunos móviles lo bloquean). Solo cuenta como instalada
// cuando de verdad se abre desde el icono (installCheck, modo standalone).
window.addEventListener('appinstalled', () => {
  installPrompt = null;
  toast('¡Listo! Busca el icono en tu pantalla de inicio y ábrela desde ahí', 'ok');
});
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isMobile = () => isIOS() || /android|mobile/i.test(navigator.userAgent);
// Navegadores de Android que no crean una app completa (sin icono en el cajón de apps): mejor Chrome
const androidOtherBrowser = () => {
  if (isIOS() || !/android/i.test(navigator.userAgent)) return '';
  if (navigator.brave) return 'Brave';
  if (/firefox|fxios/i.test(navigator.userAgent)) return 'Firefox';
  if (/OPR\/|Opera/i.test(navigator.userAgent)) return 'Opera';
  if (/MiuiBrowser/i.test(navigator.userAgent)) return 'el navegador de Xiaomi';
  return '';
};

  const b = androidOtherBrowser(); if (!b) return '';
  return `<p class="sub" style="margin:0 0 10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px">⚠️ Estás en <b>${b}</b>. Desde aquí la app solo se añade como acceso directo en la pantalla de inicio (no sale en el cajón de apps) y algunos móviles no lo dejan. <b>Para que funcione bien, abre esta web en Chrome</b> e instálala desde allí.</p>`;
}
const hasMobileApp = () => !!(S.profile && S.profile.app_installed_at);
